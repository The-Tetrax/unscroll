<svg xmlns="http://www.w3.org/2000/svg" width="720" height="759" viewBox="0 0 720 759" role="img" aria-labelledby="teaching-77-6f-72-6b-2d-30-32-36-v-30-title" aria-describedby="teaching-77-6f-72-6b-2d-30-32-36-v-30-desc" font-family="Arial, sans-serif" data-format="flow" data-visual-id="work-026" data-visual-index="0"><title id="teaching-77-6f-72-6b-2d-30-32-36-v-30-title">A review request with an exception path</title><desc id="teaching-77-6f-72-6b-2d-30-32-36-v-30-desc">Before review, inspect behavior description, fixture evidence, and limits; missing evidence requires completion or a labeled design-only review.
1. Behavior described. Empty export preview has an explicit expected result.
2. Evidence available. Fixture and result can be inspected by the reviewer.
3. Limits named. Spreadsheet integration remains untested.
4. Missing evidence?. Author supplies it or requests design-only feedback, not approval.</desc><defs><marker id="teaching-77-6f-72-6b-2d-30-32-36-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-6f-72-6b-2d-30-32-36-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-6f-72-6b-2d-30-32-36-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="759" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="57" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Flow</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="628" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">A review request with an exception path</text><g data-edge-index="0" data-from="0" data-to="1"><path d="M 60 197 L 60 262" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teaching-77-6f-72-6b-2d-30-32-36-v-30-link)"/></g><g data-edge-index="1" data-from="1" data-to="2"><path d="M 60 321 L 60 386" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teaching-77-6f-72-6b-2d-30-32-36-v-30-link)"/></g><g data-edge-index="2" data-from="2" data-to="3"><path d="M 60 445 L 60 510" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="