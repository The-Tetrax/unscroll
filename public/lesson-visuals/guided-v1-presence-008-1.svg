<svg xmlns="http://www.w3.org/2000/svg" width="720" height="987" viewBox="0 0 720 987" role="img" aria-labelledby="teaching-70-72-65-73-65-6e-63-65-2d-30-30-38-v-30-title" aria-describedby="teaching-70-72-65-73-65-6e-63-65-2d-30-30-38-v-30-desc" font-family="Arial, sans-serif" data-format="dialogue" data-visual-id="presence-008" data-visual-index="0"><title id="teaching-70-72-65-73-65-6e-63-65-2d-30-30-38-v-30-title">Observation, then question</title><desc id="teaching-70-72-65-73-65-6e-63-65-2d-30-30-38-v-30-desc">Mira yields briefly, Sal describes the view, and Sal returns the turn to Mira.
1. Mira. Go ahead with what you saw; I have a question afterward.
2. Sal. The bright point was near the edge of the view.
3. Sal. What was your question?
4. Mira. Was it visible before we adjusted the telescope?</desc><defs><marker id="teaching-70-72-65-73-65-6e-63-65-2d-30-30-38-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-70-72-65-73-65-6e-63-65-2d-30-30-38-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-70-72-65-73-65-6e-63-65-2d-30-30-38-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="987" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="106" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Dialogue</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="425" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Observation, then question</text><circle cx="79" cy="168" r="22" fill="#231f20" stroke="#231f20" stroke-width="3"/><text x="71.5" y="175.96" font-size="24" font-weight="700" fill="#f7f4ed" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">1</text><text x="119" y="172.04" font-size="26" font-weight="700" fill="#231f20" textLength="57" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Mira</text><g data-turn-index="0" data-side="left"><path d="M 78 203 H 381 Q 403 203 403 225  L 403 314 Q 403 336 381 336 H 78 Q 56 336 56 314 L 56 315 L 38 322 L 56 295 L 56 225 Q 56 203 78 203 Z" fill="#f7f4ed" stroke="#231f20" strok