<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1086" viewBox="0 0 720 1086" role="img" aria-labelledby="teaching-6f-62-73-65-72-76-65-72-2d-30-32-33-v-30-title" aria-describedby="teaching-6f-62-73-65-72-76-65-72-2d-30-32-33-v-30-desc" font-family="Arial, sans-serif" data-format="flow" data-visual-id="observer-023" data-visual-index="0"><title id="teaching-6f-62-73-65-72-76-65-72-2d-30-32-33-v-30-title">Three replies to the display request</title><desc id="teaching-6f-62-73-65-72-76-65-72-2d-30-32-33-v-30-desc">A clear request branches into yes with agreed limits, unsure with a reply time, and no with a smaller display.
1. Describe the favor. Boards, travel, effort, and timing before any commitment.
2. Yes. Confirm the agreed task and limits; keep alternatives available.
3. Unsure. Agree on a reply time; prepare the smaller display meanwhile.
4. No. Use fewer boards or ask another willing helper.
1 to 2.
1 to 3.
1 to 4.</desc><defs><marker id="teaching-6f-62-73-65-72-76-65-72-2d-30-32-33-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6f-62-73-65-72-76-65-72-2d-30-32-33-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6f-62-73-65-72-76-65-72-2d-30-32-33-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="1086" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="57" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Flow</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="555" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Three replies to the display request</text><g data-edge-index="0" data-from="0" data-to="1"><path d="M 96 168 H 48 Q 38 168 38 178 V 313 Q 38 323 48 323 H 96" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teaching-6f-62-73-65-72-76-65-72-2d-30-32-33-v-30-link)"/></g><g data-edge-index="1" data-from="0" data-to="2"><path d="M 96 168 H 59 Q 49 168 49 178 V 468 Q 49 478 59 478 H 96" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teaching-6f-62-73-65-72-76-65-72-2d-30-32-33-v-30-link)"/></g><g data-edge-index="2" data-from="0" data-to="3"><path d="M 96 168 H 70 Q 60 168 60 