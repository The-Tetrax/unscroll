<svg xmlns="http://www.w3.org/2000/svg" width="720" height="750" viewBox="0 0 720 750" role="img" aria-labelledby="teaching-74-65-63-68-2d-30-31-36-v-30-title" aria-describedby="teaching-74-65-63-68-2d-30-31-36-v-30-desc" font-family="Arial, sans-serif" data-format="flow" data-visual-id="tech-016" data-visual-index="0"><title id="teaching-74-65-63-68-2d-30-31-36-v-30-title">Seven bytes, two reads, two records</title><desc id="teaching-74-65-63-68-2d-30-31-36-v-30-desc">Reads 3 R and U N 2 O K reconstruct RUN and OK.
1. Sender stream. 3 R U N 2 O K: 7 bytes
2. Read 1. 3 R: 2 bytes; retain incomplete RUN
3. Read 2. U N 2 O K: 5 bytes; complete both records
4. Parser output. RUN, then OK: 2 application records
1 to 2.
2 to 3: append.
3 to 4: frame.</desc><defs><marker id="teaching-74-65-63-68-2d-30-31-36-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-65-63-68-2d-30-31-36-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-65-63-68-2d-30-31-36-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="750" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="57" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Flow</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="573" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Seven bytes, two reads, two records</text><g data-edge-index="0" data-from="0" data-to="1"><path d="M 60 197 L 60 262" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teaching-74-65-63-68-2d-30-31-36-v-30-link)"/></g><g data-edge-index="1" data-from="1" data-to="2"><path d="M 60 321 L 60 397" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teaching-74-65-63-68-2d-30-31-36-v-30-link)"/></g><text x="117" y="381.88" font-size="22" font-weight="400" fill="#69635f" textLength="77" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">append</text><g data-edge-index="2" data-from="2" data-to="3"><path d="M