<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1314" viewBox="0 0 720 1314" role="img" aria-labelledby="teaching-6c-69-66-65-2d-30-33-37-v-30-title" aria-describedby="teaching-6c-69-66-65-2d-30-33-37-v-30-desc" font-family="Arial, sans-serif" data-format="spatial" data-visual-id="life-037" data-visual-index="0"><title id="teaching-6c-69-66-65-2d-30-33-37-v-30-title">A bag packed by next use</title><desc id="teaching-6c-69-66-65-2d-30-33-37-v-30-desc">A bag cutaway places a protected arrival pouch near the opening, clothing in the middle, and sleep items below.
1. Near the opening. Protected pouch: address and required booking details.
2. Middle compartment. Clothes needed after check-in.
3. Lower compartment. Sleep items not needed at reception.</desc><defs><marker id="teaching-6c-69-66-65-2d-30-33-37-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6c-69-66-65-2d-30-33-37-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6c-69-66-65-2d-30-33-37-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker><mask id="teaching-6c-69-66-65-2d-30-33-37-v-30-connections-mask" maskUnits="userSpaceOnUse" x="36" y="192" width="648" height="650" style="mask-type:luminance"><rect x="36" y="192" width="648" height="650" fill="#ffffff"/><rect x="315" y="323.8" width="90" height="90" fill="#000000"/><rect x="315" y="470" width="90" height="90" fill="#000000"/><rect x="315" y="616.2" width="90" height="90" fill="#000000"/><rect x="331" y="248.8" width="58" height="58" fill="#000000"/><rect x="422" y="486" width="58" height="58" fill="#000000"/><rect x="331" y="723.2" width="58" height="58" fill="#000000"/></mask></defs><rect width="720" height="1314" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="186" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Spatial diagram</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="409" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">A bag packed by next use</text><text x="35" y="167.88" font-size="22" fo