<svg xmlns="http://www.w3.org/2000/svg" width="720" height="655" viewBox="0 0 720 655" role="img" aria-labelledby="teaching-73-70-65-61-6b-65-72-2d-30-31-31-v-31-title" aria-describedby="teaching-73-70-65-61-6b-65-72-2d-30-31-31-v-31-desc" font-family="Arial, sans-serif" data-format="dialogue" data-visual-id="speaker-011" data-visual-index="1"><title id="teaching-73-70-65-61-6b-65-72-2d-30-31-31-v-31-title">After the words arrive</title><desc id="teaching-73-70-65-61-6b-65-72-2d-30-31-31-v-31-desc">A helper hears the words but asks which rectangle represents the doorway.
1. Helper. I heard each word. Which rectangle is the doorway?
