<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1089" viewBox="0 0 720 1089" role="img" aria-labelledby="teaching-63-69-6e-65-6d-61-2d-30-35-38-v-30-title" aria-describedby="teaching-63-69-6e-65-6d-61-2d-30-35-38-v-30-desc" font-family="Arial, sans-serif" data-format="dialogue" data-visual-id="cinema-058" data-visual-index="0"><title id="teaching-63-69-6e-65-6d-61-2d-30-35-38-v-30-title">Reading and stated reason stay separate</title><desc id="teaching-63-69-6e-65-6d-61-2d-30-35-38-v-30-desc">A viewer reads isolation; the maker gives a practical reason for framing the banner.
1. Viewer: observation. One person remains in the frame after the other leaves.
2. Viewer: interpretation. I read the remaining figure as isolated.
3. Maker: account. I placed the camera to keep loose fabric outside the shot.
4. Viewer: conclusion. My reading is possible, but it is not your stated reason.</desc><defs><marker id="teaching-63-69-6e-65-6d-61-2d-30-35-38-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-63-69-6e-65-6d-61-2d-30-35-38-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-63-69-6e-65-6d-61-2d-30-35-38-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="1089" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="106" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Dialogue</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="650" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Reading and stated reason stay separate</text><circle cx="79" cy="168" r="22" fill="#231f20" stroke="#231f20" stroke-width="3"/><text x="71.5" y="175.96" font-size="24" font-weight="700" fill="#f7f4ed" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">1</text><text x="119" y="172.04" font-size="26" font-weight="700" fill="#231f20" textLength="254" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Viewer: observation</text><g data-turn-index="0" data-side="left"><path d="M 78 203 H 368 Q 390 203 390 225  L 390 314 Q 390 336 368 336 H 78 Q 56 336 56 314 L 56 315 L 38 322 L 56 295 L 56 225 Q 56 203 78 203 Z" fi