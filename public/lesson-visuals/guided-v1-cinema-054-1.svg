<svg xmlns="http://www.w3.org/2000/svg" width="720" height="613" viewBox="0 0 720 613" role="img" aria-labelledby="teaching-63-69-6e-65-6d-61-2d-30-35-34-v-30-title" aria-describedby="teaching-63-69-6e-65-6d-61-2d-30-35-34-v-30-desc" font-family="Arial, sans-serif" data-format="timeline" data-visual-id="cinema-054" data-visual-index="0"><title id="teaching-63-69-6e-65-6d-61-2d-30-35-34-v-30-title">Observed fields for the counter passage</title><desc id="teaching-63-69-6e-65-6d-61-2d-30-35-34-v-30-desc">Wide setup, hand close-up, and return wide have unmeasured durations.
1. 1: two counters. Wide, fixed; room background; duration unmeasured.
2. 2: dark counter lifted. Hand close-up, fixed; contact sound; duration unmeasured.
