<svg xmlns="http://www.w3.org/2000/svg" width="720" height="704" viewBox="0 0 720 704" role="img" aria-labelledby="design-type-002-title" aria-describedby="design-type-002-desc" focusable="false">
<title id="design-type-002-title">Name the change to the basil</title>
<desc id="design-type-002-desc">The same basil sprig and unchanged BASIL RECIPES heading accompany four adjacent screen-color chips. Initial #2F8F57 becomes muted #687A6E, darker #17482C, or blue #2F578F in separate candidates. These selections do not isolate perceptual properties mathematically.</desc>
