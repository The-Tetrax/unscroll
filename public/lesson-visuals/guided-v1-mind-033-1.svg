<svg xmlns="http://www.w3.org/2000/svg" width="720" height="662" viewBox="0 0 720 662" role="img" aria-labelledby="teaching-6d-69-6e-64-2d-30-33-33-v-30-title" aria-describedby="teaching-6d-69-6e-64-2d-30-33-33-v-30-desc" font-family="Arial, sans-serif" data-format="comparison" data-visual-id="mind-033" data-visual-index="0"><title id="teaching-6d-69-6e-64-2d-30-33-33-v-30-title">Choose the claim type before checking</title><desc id="teaching-6d-69-6e-64-2d-30-33-33-v-30-desc">Four fictional statements report a Monday reply, infer disrespect, report the word busy, and infer avoidance.
1. Statement A. The reply arrived Monday.
2. Statement B. They do not respect my time.
3. Statement C. They wrote that they were busy.
