<svg xmlns="http://www.w3.org/2000/svg" width="720" height="976" viewBox="0 0 720 976" role="img" aria-labelledby="teaching-6d-6f-6e-65-79-2d-30-31-39-v-30-title" aria-describedby="teaching-6d-6f-6e-65-79-2d-30-31-39-v-30-desc" font-family="Arial, sans-serif" data-format="bars" data-visual-id="money-019" data-visual-index="0"><title id="teaching-6d-6f-6e-65-79-2d-30-31-39-v-30-title">The repair and the remaining reserve</title><desc id="teaching-6d-6f-6e-65-79-2d-30-31-39-v-30-desc">The reserve starts at 600, the repair uses 240, and 360 remains.
