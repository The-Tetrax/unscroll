<svg xmlns="http://www.w3.org/2000/svg" width="720" height="818" viewBox="0 0 720 818" role="img" aria-labelledby="teaching-6f-62-73-65-72-76-65-72-2d-30-31-34-v-30-title" aria-describedby="teaching-6f-62-73-65-72-76-65-72-2d-30-31-34-v-30-desc" font-family="Arial, sans-serif" data-format="bars" data-visual-id="observer-014" data-visual-index="0"><title id="teaching-6f-62-73-65-72-76-65-72-2d-30-31-34-v-30-title">Two breakdown delays are part of eight late deliveries</title><desc id="teaching-6f-62-73-65-72-76-65-72-2d-30-31-34-v-30-desc">Of twenty hypothetical deliveries, eight are late and two of those eight are late because of a breakdown.
1. All late deliveries. 8 / 20 = 40% Value: 8 deliveries out of 20.
