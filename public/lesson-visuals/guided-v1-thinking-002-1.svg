<svg xmlns="http://www.w3.org/2000/svg" width="720" height="799" viewBox="0 0 720 799" role="img" aria-labelledby="teaching-74-68-69-6e-6b-69-6e-67-2d-30-30-32-v-30-title" aria-describedby="teaching-74-68-69-6e-6b-69-6e-67-2d-30-30-32-v-30-desc" font-family="Arial, sans-serif" data-format="flow" data-visual-id="thinking-002" data-visual-index="0"><title id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-30-32-v-30-title">Exposure is a proposed common cause</title><desc id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-30-32-v-30-desc">Sun exposure points separately to extra watering and later wilting.
1. Earlier sun exposure. Makes the exposed planters dry faster.
2. Extra watering. The gardener responds to drying conditions.
3. Later wilting. Exposure can contribute through moisture loss.
1 to 2.
1 to 3.</desc><defs><marker id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-30-32-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-30-32-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-30-32-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="799" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="57" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Flow</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="624" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Exposure is a proposed common cause</text><g data-edge-index="0" data-from="0" data-to="1"><path d="M 96 168 H 48 Q 38 168 38 178 V 282 Q 38 292 48 292 H 96" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teaching-74-68-69-6e-6b-69-6e-67-2d-30-30-32-v-30-link)"/></g><g data-edge-index="1" data-from="0" data-to="2"><path d="M 96 168 H 59 Q 49 168 49 178 V 406 Q 49 416 59 416 H 96" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teaching-74-68-69-6e-6b-69-6e-67-2d-30-30-32-v-30-link)"/></g><g data-node-index="0"><circle cx="126" cy="168" r="22" fill="#231f20" stroke="#231f20