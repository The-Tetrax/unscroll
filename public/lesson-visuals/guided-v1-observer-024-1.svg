<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1069" viewBox="0 0 720 1069" role="img" aria-labelledby="teaching-6f-62-73-65-72-76-65-72-2d-30-32-34-v-30-title" aria-describedby="teaching-6f-62-73-65-72-76-65-72-2d-30-32-34-v-30-desc" font-family="Arial, sans-serif" data-format="matrix" data-visual-id="observer-024" data-visual-index="0"><title id="teaching-6f-62-73-65-72-76-65-72-2d-30-32-34-v-30-title">Two volunteers, two roles</title><desc id="teaching-6f-62-73-65-72-76-65-72-2d-30-32-34-v-30-desc">Four combinations cross each volunteer&apos;s choice of welcome desk or tool trays.
1. A welcome / B welcome. Welcome covered; trays unprepared.
2. A welcome / B trays. Both jobs covered, subject to agreement and ability.
3. A trays / B welcome. Both jobs covered, subject to agreement and ability.
