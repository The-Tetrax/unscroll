<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1509" viewBox="0 0 720 1509" role="img" aria-labelledby="teaching-6c-69-66-65-2d-30-30-39-v-30-title" aria-describedby="teaching-6c-69-66-65-2d-30-30-39-v-30-desc" font-family="Arial, sans-serif" data-format="spatial" data-visual-id="life-009" data-visual-index="0"><title id="teaching-6c-69-66-65-2d-30-30-39-v-30-title">A shelf that shows the trigger</title><desc id="teaching-6c-69-66-65-2d-30-30-39-v-30-desc">A working roll sits at the front, a spare at the rear, and a shared list is updated when the spare moves forward.
1. Working roll. Front of shelf: use this first.
2. Last spare pack. Rear position: moving it triggers the list.
3. Shared shopping list. Specification plus bought status.
2 to 1: Spare becomes working.
2 to 3: Add when moved.</desc><defs><marker id="teaching-6c-69-66-65-2d-30-30-39-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6c-69-66-65-2d-30-30-39-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6c-69-66-65-2d-30-30-39-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker><mask id="teaching-6c-69-66-65-2d-30-30-39-v-30-connections-mask" maskUnits="userSpaceOnUse" x="36" y="192" width="648" height="650" style="mask-type:luminance"><rect x="36" y="192" width="648" height="650" fill="#ffffff"/><rect x="169.2" y="590.4" width="90" height="90" fill="#000000"/><rect x="169.2" y="349.6" width="90" height="90" fill="#000000"/><rect x="466.2" y="470" width="90" height="90" fill="#000000"/><rect x="185.2" y="515.4" width="58" height="58" fill="#000000"/><rect x="185.2" y="274.6" width="58" height="58" fill="#000000"/><rect x="482.2" y="395" width="58" height="58" fill="#000000"/></mask></defs><rect width="720" height="1509" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="186" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Spatial diagram</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="459" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">A shelf that shows the trigger</text><text x="35" y="167.88" font-size="22" font-weight="400" f