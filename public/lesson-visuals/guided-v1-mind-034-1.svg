<svg xmlns="http://www.w3.org/2000/svg" width="720" height="622" viewBox="0 0 720 622" role="img" aria-labelledby="teaching-6d-69-6e-64-2d-30-33-34-v-30-title" aria-describedby="teaching-6d-69-6e-64-2d-30-33-34-v-30-desc" font-family="Arial, sans-serif" data-format="timeline" data-visual-id="mind-034" data-visual-index="0"><title id="teaching-6d-69-6e-64-2d-30-33-34-v-30-title">The Lisbon card is correct, then checked later</title><desc id="teaching-6d-69-6e-64-2d-30-33-34-v-30-desc">A first Lisbon answer is correct, the card remains eligible, and a later closed-answer attempt informs future review.
1. First success. Portugal&apos;s capital is recalled as Lisbon.
2. Keep eligible. Set aside for a later question, not permanent retirement.
3. Later retrieval. Attempt before revealing; use the result to adjust review.</desc><defs><marker id="teaching-6d-69-6e-64-2d-30-33-34-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6d-69-6e-64-2d-30-33-34-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6d-69-6e-64-2d-30-33-34-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="622" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="101" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Timeline</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="640" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">The Lisbon card is correct, then checked</text><text x="35" y="150.28" font-size="32" font-weight="700" fill="#231f20" textLength="70" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">later</text><text x="35" y="212.88" font-size="22" font-weight="400" fill="#231f20" textLength="531" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Event order only; spacing is not proportional to time.</text><g data-time-spacing="ordinal"><path d="M 262 264 L 262 456" fill="none" stroke="#69635f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g data-item-index="0"><text x="35" y="274.04" font-size="26" font-weight="700" fill="#231f20" textLength="169" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">First success</text><text x="299" y="269.88" font-size="22" font-weight="400" fill="#231f20" textLength="316" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Portugal&apos;s capital is recalled as</text><text x="299" y="300.88" font-size="22" font-weight="400" fill="#231f20" textLength="75" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Lisbon.</text><path d="M 262 255 L 271 264 L 262 273 L 253 264 Z" fill="#f7f4ed" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g data-item-index="1"><text x="35" y="370.04" font-size="26" font-weight="700" fill="#231f20" textLength="166" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Keep eligible</text><text x="299" y="365.88" font-size="22" font-weight="400" fill="#231f20" textLength="338" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Set aside for a later question, not</text><text x="299" y="396.88" font-size="22" font-weight="400" fill="#231f20" textLength="227" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">permanent retirement.</text><path d="M 262 351 L 271 360 L 262 369 L 253 360 Z" fill="#bc2031" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g data-item-index="2"><text x="35" y="466.04" font-size="26" font-weight="700" fill="#231f20" textLength="177" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Later retrieval</text><text x="299" y="461.88" font-size="22" font-weight="400" fill="#231f20" textLength="339" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Attempt before revealing; use the</text><text x="299" y="492.88" font-size="22" font-weight="400" fill="#231f20" textLength="229" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">result to adjust review.</text><path d="M 262 447 L 271 456 L 262 465 L 253 456 Z" fill="#f7f4ed" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>