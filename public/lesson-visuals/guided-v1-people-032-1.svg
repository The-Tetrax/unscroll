<svg xmlns="http://www.w3.org/2000/svg" width="720" height="907" viewBox="0 0 720 907" role="img" aria-labelledby="teaching-70-65-6f-70-6c-65-2d-30-33-32-v-30-title" aria-describedby="teaching-70-65-6f-70-6c-65-2d-30-33-32-v-30-desc" font-family="Arial, sans-serif" data-format="dialogue" data-visual-id="people-032" data-visual-index="0"><title id="teaching-70-65-6f-70-6c-65-2d-30-33-32-v-30-title">The answer time misses the booking deadline</title><desc id="teaching-70-65-6f-70-6c-65-2d-30-33-32-v-30-desc">A guest can confirm Friday, the organizer needs a Thursday headcount, and the guest declines the reserved place.
1. Guest. Interested, but I can only confirm Friday. When is your deadline?
2. Organizer. Thursday evening. The headcount must be final.
3. Guest. Please leave me out of this booking. I cannot confirm in time.</desc><defs><marker id="teaching-70-65-6f-70-6c-65-2d-30-33-32-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-70-65-6f-70-6c-65-2d-30-33-32-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-70-65-6f-70-6c-65-2d-30-33-32-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="907" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="106" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Dialogue</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="577" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">The answer time misses the booking</text><text x="35" y="150.28" font-size="32" font-weight="700" fill="#231f20" textLength="135" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">deadline</text><circle cx="79" cy="213" r="22" fill="#231f20" stroke="#231f20" stroke-width="3"/><text x="71.5" y="220.96" font-size="24" font-weight="700" fill="#f7f4ed" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">1</text><text x="119" y="217.04" font-size="26" font-weight="700" fill="#231f20" textLength="77" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Guest</text><g data-turn-index="0" data-side="left"><path d="M 78 248 