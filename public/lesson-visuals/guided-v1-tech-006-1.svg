<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1509" viewBox="0 0 720 1509" role="img" aria-labelledby="teaching-74-65-63-68-2d-30-30-36-v-30-title" aria-describedby="teaching-74-65-63-68-2d-30-30-36-v-30-desc" font-family="Arial, sans-serif" data-format="spatial" data-visual-id="tech-006" data-visual-index="0"><title id="teaching-74-65-63-68-2d-30-30-36-v-30-title">Reaching a remote allocation server</title><desc id="teaching-74-65-63-68-2d-30-30-36-v-30-desc">Printer connects through a DHCP relay to a remote DHCP server.
1. Printer client. Requests offered 192.0.2.40
2. Router with relay. Forwards between client network and server
3. DHCP server. Owns the lease allocation decision
1 to 2: local.
