<svg xmlns="http://www.w3.org/2000/svg" width="720" height="657" viewBox="0 0 720 657" role="img" aria-labelledby="teaching-74-65-63-68-2d-30-30-33-v-30-title" aria-describedby="teaching-74-65-63-68-2d-30-30-33-v-30-desc" font-family="Arial, sans-serif" data-format="flow" data-visual-id="tech-003" data-visual-index="0"><title id="teaching-74-65-63-68-2d-30-30-33-v-30-title">A specified voice classification path</title><desc id="teaching-74-65-63-68-2d-30-30-33-v-30-desc">DSCP 46 maps to Wi-Fi user priority 6 and then to the voice access category.
1. IP marking. DSCP 46: Expedited Forwarding
2. Wireless mapping. Selected user priority: 6
3. Voice category. AC_VO: favorable contention parameters, still shared airtime
1 to 2: policy.
2 to 3: category.</desc><defs><marker id="teaching-74-65-63-68-2d-30-30-33-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-65-63-68-2d-30-30-33-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-65-63-68-2d-30-30-33-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="657" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="57" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Flow</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="557" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">A specified voice classification path</text><g data-edge-index="0" data-from="0" data-to="1"><path d="M 60 197 L 60 273" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teaching-74-65-63-68-2d-30-30-33-v-30-link)"/></g><text x="117" y="257.88" font-size="22" font-weight="400" fill="#69635f" textLength="59" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">policy</text><g data-edge-index="1" data-from="1" data-to="2"><path d="M 60 332 L 60 408" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teaching-74-65-63-68-2d-30-30-33-v-30-link)"/></g><text x="117" y="392.88" font-size="22" font-weight="4