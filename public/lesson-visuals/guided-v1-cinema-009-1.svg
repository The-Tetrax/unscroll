<svg xmlns="http://www.w3.org/2000/svg" width="720" height="810" viewBox="0 0 720 810" role="img" aria-labelledby="camera-009-title camera-009-description" font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><title id="camera-009-title">Raise the view above the blocking wall</title><desc id="camera-009-description">A low view of a shallow box hides its folded message behind the front wall. A higher view reveals the same message inside. In a side elevation the lower sightline hits the wall, while the higher sightline clears it.</desc><defs><clipPath id="camera-009-frame-0" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="314" height="237" rx="0" fill="#ffffff" stroke="none" stroke-width="2.5"></rect></clipPath><clipPath id="camera-009-frame-1" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="314" height="237" rx="0" fill="#ffffff" stroke="none" stroke-width="2.5"></rect></clipPath></defs><rect x="0" y="0" width="720" height="810" rx="0" fill="#f7f4ed" stroke="none" stroke-width="2.5"></rect><text x="32" y="34" font-size="22" font-weight="700" fill="#bc2031" text-anchor="start" data-drawn-text="true">CAMERA 009</text><text x="32" y="73" font-size="26" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="true">Raise the view above the blocking wall</text><line x1="32" y1="92" x2="688" y2="92" stroke="#231f20" stroke-width="2.5" stroke-dasharray=""></line><text x="32" y="125" font-size="24" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="true">Low / wall hides message</text><text x="374" y="125" font-size="24" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="true">Higher / message revealed</text><g transform="translate(32 144) rotate(0) scale(1)"><rect x="0" y="0" width="314" height="237" rx="0" fill="#dfc9a9" stroke="none" stroke-width="2.5"></rect><g clip-path="url(#camera-009-frame-0)"><path d="M 36 111 L 77 91 L 277 91 L 251 111 Z" fill="#b98b60" stroke="#231f20" stroke-width="2.5"></path><rect x="152" y="121" width="80" height="42" rx="0" fill="#fffdf5" stroke="#231f20" stroke-width="2.5"></rect><path d="M 152 121 L 192 143.26 L 232 121" fill="none" stroke="#231f20" stroke-width="2.5"></path><line x1="152" y1="163" x2="177.6" y2="141.58" stroke="#69635f" stroke-width="2.5" stroke-dasharray=""></line><rect x="36" y="111" width="215" height="96" rx="0" fill="#dfc9a9" stroke="#231f20" stroke-width="2.5"></rect><path d="M 251 111 L 277 91 L 277 185 L 251 207 Z" fill="#b98b60" stroke="#231f20" stroke-width="2.5"></path><line x1="49" y1="198" x2="231" y2="198" stroke="#b98b60" stroke-width="2.5" stroke-dasharray=""></line></g><rect x="0" y="0" width="314" height="237" rx="0" fill="none" stroke="#231f20" stroke-width="2.5"></rect></g><g transform="translate(374 144) rotate(0) scale(1)"><rect x="0" y="0" width="314" height="237" rx="0" fill="#dfc9a9" stroke="none" stroke-width="2.5"></rect><g clip-path="url(#camera-009-frame-1)"><path d="M 36 126 L 78 41 L 276 41 L 248 126 Z" fill="#b98b60" stroke="#231f20" stroke-width="2.5"></path><path d="M 54 116 L 91 55 L 258 55 L 235 116 Z" fill="#dfc9a9" stroke="#231f20" stroke-width="2.5"></path><path d="M 124 76 L 205 72 L 185 111 L 108 113 Z" fill="#fffdf5" stroke="#231f20" stroke-width="2.5"></path><path d="M 124 76 L 154 101 L 205 72" fill="none" stroke="#231f20" stroke-width="2.5"></path><rect x="36" y="126" width="212" height="81" rx="0" fill="#dfc9a9" stroke="#231f20" stroke-width="2.5"></rect><path d="M 248 126 L 276 41 L 276 173 L 248 207 Z" fill="#b98b60" stroke="#231f20" stroke-width="2.5"></path><line x1="49" y1="198" x2="231" y2="198" stroke="#b98b60" stroke-width="2.5" stroke-dasharray=""></line></g><rect x="0" y="0" width="314" height="237" rx="0" fill="none" stroke="#231f20" stroke-width="2.5"></rect></g><text x="32" y="423" font-size="24" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="true">Side elevation / why tilt alone cannot clear the wall</text><line x1="37" y1="679" x2="682" y2="679" stroke="#b98b60" stroke-width="2.5" stroke-dasharray=""></line><rect x="342" y="576" width="15" height="103" rx="0" fill="#b98b60" stroke="#231f20" stroke-width="2.5"></rect><rect x="550" y="649" width="86" height="15" rx="0" fill="#fffdf5" stroke="#231f20" stroke-width="2.5"></rect><line x1="550" y1="649" x2="592" y2="657" stroke="#231f20" stroke-width="2.5" stroke-dasharray=""></line><line x1="592" y1="657" x2="636" y2="649" stroke="#231f20" stroke-width="2.5" stroke-dasharray=""></line><g transform="translate(78 484) rotate(108) scale(1)"><rect x="-23" y="0" width="46" height="30" rx="4" fill="#354d59" stroke="#231f20" stroke-width="2.5"></rect><rect x="-10" y="-9" width="20" height="9" rx="0" fill="#231f20" stroke="#231f20" stroke-width="2.5"></rect><rect x="-16" y="6" width="24" height="17" rx="2" fill="#e6dfd3" stroke="none" stroke-width="2.5"></rect><circle cx="15" cy="15" r="3" fill="#bc2031" stroke="none" stroke-width="2.5"></circle></g><g transform="translate(78 650) rotate(90) scale(1)"><rect x="-23" y="0" width="46" height="30" rx="4" fill="#354d59" stroke="#231f20" stroke-width="2.5"></rect><rect x="-10" y="-9" width="20" height="9" rx="0" fill="#231f20" stroke="#231f20" stroke-width="2.5"></rect><rect x="-16" y="6" width="24" height="17" rx="2" fill="#e6dfd3" stroke="none" stroke-width="2.5"></rect><circle cx="15" cy="15" r="3" fill="#bc2031" stroke="none" stroke-width="2.5"></circle></g><line x1="92" y1="484" x2="590" y2="649" stroke="#557986" stroke-width="2.5" stroke-dasharray=""></line><path d="M 578.2741 651.55 L 590 649 L 582.1164 639.9529" fill="none" stroke="#557986" stroke-width="3.5"></path><line x1="92" y1="650" x2="342" y2="650" stroke="#bc2031" stroke-width="2.5" stroke-dasharray=""></line><line x1="332" y1="640" x2="352" y2="660" stroke="#bc2031" stroke-width="2.5" stroke-dasharray=""></line><line x1="332" y1="660" x2="352" y2="640" stroke="#bc2031" stroke-width="2.5" stroke-dasharray=""></line><text x="35" y="461" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Higher lens</text><text x="35" y="621" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Lower lens</text><text x="367" y="597" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Front wall</text><text x="537" y="626" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Message</text><line x1="32" y1="696" x2="688" y2="696" stroke="#e6dfd3" stroke-width="2.5" stroke-dasharray=""></line><text x="32" y="723" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">The upper ray clears the wall; the lower ray hits it.</text><text x="32" y="752" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Schematic visibility, not a measured camera-height setup.</text><text x="32" y="781" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Raise comfortably and note any tilt; do not climb furniture.</text></svg>