<svg xmlns="http://www.w3.org/2000/svg" width="720" height="976" viewBox="0 0 720 976" role="img" aria-labelledby="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-35-v-30-title" aria-describedby="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-35-v-30-desc" font-family="Arial, sans-serif" data-format="bars" data-visual-id="thinking-035" data-visual-index="0"><title id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-35-v-30-title">Same traffic, different processor demand</title><desc id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-35-v-30-desc">Old workload needs 200 CPU milliseconds per second, new workload 2,000, against a single-core budget of 1,000.
1. Cached lookups. 100 x 2 = 200 CPU ms needed each second. Value: 200 CPU milliseconds per second.
2. Custom routes. 100 x 20 = 2,000 CPU ms needed each second. Value: 2000 CPU milliseconds per second.
3. One-core budget. 1,000 CPU ms available per second in the toy model. Value: 1000 CPU milliseconds per second.</desc><defs><marker id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-35-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-35-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-35-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="976" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="92" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Bar plot</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="642" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Same traffic, different processor demand</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="519" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Zero baseline; bar lengths use the supplied values.</text><text x="35" y="212.96" font-size="24" font-weight="700" fill="#231f20" textLength="411" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Unit: CPU milliseconds per second</text><text x="42.5" y="258.96" font-size="24" font-weight="700" fill="#231f20" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">0</text><g dat