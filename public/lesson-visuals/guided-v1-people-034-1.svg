<svg xmlns="http://www.w3.org/2000/svg" width="720" height="523" viewBox="0 0 720 523" role="img" aria-labelledby="teaching-70-65-6f-70-6c-65-2d-30-33-34-v-30-title" aria-describedby="teaching-70-65-6f-70-6c-65-2d-30-33-34-v-30-desc" font-family="Arial, sans-serif" data-format="comparison" data-visual-id="people-034" data-visual-index="0"><title id="teaching-70-65-6f-70-6c-65-2d-30-33-34-v-30-title">Different statuses imply different next steps</title><desc id="teaching-70-65-6f-70-6c-65-2d-30-33-34-v-30-desc">An on-the-way message reports progress, while a returned-and-confirmed message closes the key handover.
1. Progress only. I am heading over with the key. The owner still cannot rely on having it.
2. Return confirmed. Returned as agreed. Owner: I have it now, thank you.</desc><defs><marker id="teaching-70-65-6f-70-6c-65-2d-30-33-34-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-70-65-6f-70-6c-65-2d-30-33-34-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-70-65-6f-70-6c-65-2d-30-33-34-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="523" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="144" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Comparison</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="585" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Different statuses imply different next</text><text x="35" y="150.28" font-size="32" font-weight="700" fill="#231f20" textLength="85" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">steps</text><g data-item-index="0" data-column="0"><circle cx="55" cy="213" r="22" fill="#231f20" stroke="#231f20" stroke-width="3"/><text x="47.5" y="220.96" font-size="24" font-weight="700" fill="#f7f4ed" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">1</text><path d="M 90 213 L 336 213" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="41" y="283.04" font-size="26" font-weight="700" fill="#231f20" textLength="177" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Progress only</text><text x="41" y="323.88" font-size="22" font-weight="400" fill="#231f20" textLength="270" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">I am heading over with the</text><text x="41" y="354.88" font-size="22" font-weight="400" fill="#231f20" textLength="273" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">key. The owner still cannot</text><text x="41" y="385.88" font-size="22" font-weight="400" fill="#231f20" textLength="168" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">rely on having it.</text></g><g data-item-index="1" data-column="1"><circle cx="401" cy="213" r="22" fill="#bc2031" stroke="#bc2031" stroke-width="3"/><text x="393.5" y="220.96" font-size="24" font-weight="700" fill="#f7f4ed" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">2</text><path d="M 436 213 L 682 213" fill="none" stroke="#bc2031" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="387" y="283.04" font-size="26" font-weight="700" fill="#231f20" textLength="222" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Return confirmed</text><text x="387" y="323.88" font-size="22" font-weight="400" fill="#231f20" textLength="291" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Returned as agreed. Owner:</text><text x="387" y="354.88" font-size="22" font-weight="400" fill="#231f20" textLength="248" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">I have it now, thank you.</text></g><path d="M 360 198 L 360 392" fill="none" stroke="#ddd7cc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 32 476 L 98 476" fill="none" stroke="#bc2031" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="119" y="482.88" font-size="22" font-weight="400" fill="#69635f" textLength="211" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Explanatory diagram</text></g>