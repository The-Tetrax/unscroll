<svg xmlns="http://www.w3.org/2000/svg" width="720" height="613" viewBox="0 0 720 613" role="img" aria-labelledby="teaching-6f-62-73-65-72-76-65-72-2d-30-31-39-v-30-title" aria-describedby="teaching-6f-62-73-65-72-76-65-72-2d-30-31-39-v-30-desc" font-family="Arial, sans-serif" data-format="timeline" data-visual-id="observer-019" data-visual-index="0"><title id="teaching-6f-62-73-65-72-76-65-72-2d-30-31-39-v-30-title">Two attempts with different demands</title><desc id="teaching-6f-62-73-65-72-76-65-72-2d-30-31-39-v-30-desc">A quiet folding attempt precedes a narrated attempt with explanation pauses, followed by separate discussion.
1. Attempt 1: quiet. Fold the display with no continuous explanation.
2. Attempt 2: narrated. Fold, name edges, and pause to explain crease alignment.
3. Afterward: clarify. Discuss unclear steps without treating either time as a universal baseline.</desc><defs><marker id="teaching-6f-62-73-65-72-76-65-72-2d-30-31-39-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6f-62-73-65-72-76-65-72-2d-30-31-39-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6f-62-73-65-72-76-65-72-2d-30-31-39-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="613" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="101" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Timeline</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="581" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Two attempts with different demands</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="531" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Event order only; spacing is not proportional to time.</text><g data-time-spacing="ordinal"><path d="M 262 219 L 262 435" fill="none" stroke="#69635f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g data-item-index="0"><text x="35" y="229.04" font-size="26" font-weight="700" fill="#231f20" textLength="132" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Attempt 1:</text><text x="35" y="266.