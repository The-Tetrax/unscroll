<svg xmlns="http://www.w3.org/2000/svg" width="720" height="840" viewBox="0 0 720 840" role="img" aria-labelledby="light-edit-043-title light-edit-043-desc" font-family="Arial" font-size="22"><title id="light-edit-043-title">Match first, then test a shared look</title><desc id="light-edit-043-desc">A six-second check shows the same hand and marked white page as daylight A, warmer B, and corrected B for two seconds each. The corrected card and hand reduce the unwanted amber difference without changing their shapes or creases. Below, an optional restrained warm treatment is applied to both already matched shots. Compare the hand and page together, keeping detail visible. Page colors are illustrative, not calibrated skin-tone targets. All objects are original schematic drawings, not photographed frames. Colors and spacing are illustrative, not measurements.</desc><metadata>Source: original UNSCROLL vector artwork. No external media, film stills, or third-party characters.</metadata><defs></defs><rect x="0" y="0" width="720" height="840" rx="0" fill="#f5efe5" stroke="none" stroke-width="2"/><text x="34" y="44" font-size="22" font-weight="700" fill="#a92c3b" textLength="149.808" lengthAdjust="spacingAndGlyphs">CINEMA / 043</text><text x="34" y="88" font-size="26" font-weight="700" fill="#272322" textLength="444.874" lengthAdjust="spacingAndGlyphs">Match first, then test a shared look</text><path d="M32 112 L688 112" fill="none" stroke="#cfc4b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="164" font-size="24" font-weight="700" fill="#272322" textLength="434.515" lengthAdjust="spacingAndGlyphs">Mismatch check: each view lasts 2 s</text><rect x="48" y="187" width="208" height="252" rx="0" fill="#fffdf7" stroke="#93887a" stroke-width="2"/><rect x="48" y="187" width="208" height="40" rx="0" fill="#295d76" stroke="none" stroke-width="2"/><text x="60" y="215" font-size="22" font-weight="700" fill="#fffdf7" textLength="130.965" lengthAdjust="s