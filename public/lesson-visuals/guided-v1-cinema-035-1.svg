<svg xmlns="http://www.w3.org/2000/svg" width="720" height="840" viewBox="0 0 720 840" role="img" aria-labelledby="light-edit-035-title light-edit-035-desc" font-family="Arial" font-size="22"><title id="light-edit-035-title">Choose the take that reveals the note</title><desc id="light-edit-035-desc">Three takes show an original MEET AFTER CLASS note over a coat pocket. A thumb covers the last word in A. B exposes the whole note. C exposes the note but schematic scraping noise masks required speech. The lower six-second B strip preserves reaching, unfolding, and an open-note pause instead of keeping only the reach. Choose B for the readable reveal and usable words. B times are invented. Keep A and C as alternative takes. All objects are original schematic drawings, not photographed frames. Colors and spacing are illustrative, not measurements.</desc><metadata>Source: original UNSCROLL vector artwork. No external media, film stills, or third-party characters.</metadata><defs></defs><rect x="0" y="0" width="720" height="840" rx="0" fill="#f5efe5" stroke="none" stroke-width="2"/><text x="34" y="44" font-size="22" font-weight="700" fill="#a92c3b" textLength="149.808" lengthAdjust="spacingAndGlyphs">CINEMA / 035</text><text x="34" y="88" font-size="26" font-weight="700" fill="#272322" textLength="475.3" lengthAdjust="spacingAndGlyphs">Choose the take that reveals the note</text><path d="M32 112 L688 112" fill="none" stroke="#cfc4b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="40" y="143" width="208" height="303" rx="0" fill="#fffdf7" stroke="#a99a86" stroke-width="2"/><rect x="40" y="143" width="208" height="41" rx="0" fill="#295d76" stroke="none" stroke-width="2"/><text x="54" y="173" font-size="24" font-weight="700" fill="#fffdf7" textLength="83.647" lengthAdjust="spacingAndGlyphs">Take A</text><svg x="52" y="194" width="184" height="152" viewBox="0 0 200 150" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g stroke="#272322" stroke-