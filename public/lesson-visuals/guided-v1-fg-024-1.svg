<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1654" viewBox="0 0 720 1654" role="img" aria-labelledby="teaching-66-67-2d-30-32-34-v-30-title" aria-describedby="teaching-66-67-2d-30-32-34-v-30-desc" font-family="Arial, sans-serif" data-format="spatial" data-visual-id="fg-024" data-visual-index="0"><title id="teaching-66-67-2d-30-32-34-v-30-title">Reserved loading and loaded states keep Save aligned</title><desc id="teaching-66-67-2d-30-32-34-v-30-desc">Both states reserve a 240 by 180 pixel preview starting at y 80; Save begins at y 272 in each.
1. Loading slot. 240 by 180; top y = 80, bottom y = 260.
2. Loaded preview. Same rectangle: 240 by 180; bottom y = 260.
3. Save while loading. Top y = 260 + 12 = 272.
4. Save after loading. Top y = 260 + 12 = 272.
1 to 2: image arrives.
3 to 4: same position.</desc><defs><marker id="teaching-66-67-2d-30-32-34-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-66-67-2d-30-32-34-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-66-67-2d-30-32-34-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker><mask id="teaching-66-67-2d-30-32-34-v-30-connections-mask" maskUnits="userSpaceOnUse" x="36" y="237" width="648" height="650" style="mask-type:luminance"><rect x="36" y="237" width="648" height="650" fill="#ffffff"/><rect x="174.6" y="407.5" width="90" height="90" fill="#000000"/><rect x="455.4" y="407.5" width="90" height="90" fill="#000000"/><rect x="174.6" y="644" width="90" height="90" fill="#000000"/><rect x="455.4" y="644" width="90" height="90" fill="#000000"/><rect x="190.6" y="332.5" width="58" height="58" fill="#000000"/><rect x="471.4" y="332.5" width="58" height="58" fill="#000000"/><rect x="190.6" y="569" width="58" height="58" fill="#000000"/><rect x="471.4" y="569" width="58" height="58" fill="#000000"/></mask></defs><rect width="720" height="1654" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="186" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Spatial diagram</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="567" lengthAdjust="spacingAndGlyphs" style="line-height