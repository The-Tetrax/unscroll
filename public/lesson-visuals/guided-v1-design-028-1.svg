ail</text><rect x="326" y="782" width="338" height="52" rx="5" fill="#FFFFFF" stroke="#231F20" stroke-width="2"></rect><text x="341" y="816" font-size="24" font-weight="400" fill="#231F20" textLength="200" lengthAdjust="spacingAndGlyphs" text-decoration="none">lee@example.test</text><text x="55" y="882" font-size="22" font-weight="400" fill="#231F20" textLength="304" lengthAdjust="spacingAndGlyphs" text-decoration="none">Review only. No order placed.</text><line x1="32" y1="926" x2="688" y2="926" stroke="#C9C2B6" stroke-width="2" stroke-dasharray=""></line><text x="35" y="962" font-size="22" font-weight="400" fill="#69635F" textLength="546" lengthAdjust="spacingAndGlyphs" text-decoration="none">Fix the known field error without discarding valid work.</text></g></svg>