<svg xmlns="http://www.w3.org/2000/svg" width="720" height="742" viewBox="0 0 720 742" role="img" aria-labelledby="teaching-73-70-65-61-6b-65-72-2d-30-30-38-v-30-title" aria-describedby="teaching-73-70-65-61-6b-65-72-2d-30-30-38-v-30-desc" font-family="Arial, sans-serif" data-format="flow" data-visual-id="speaker-008" data-visual-index="0"><title id="teaching-73-70-65-61-6b-65-72-2d-30-30-38-v-30-title">Where the evidence stops and illustration starts</title><desc id="teaching-73-70-65-61-6b-65-72-2d-30-30-38-v-30-desc">A spoken reference identifies a research overview before the presenter labels an invented picnic example.
1. Audible source. In their Noba educational overview, Laney and Loftus describe memory research.
2. Bounded claim. Later information can affect recollection; this does not mean every memory is false.
3. Original illustration. Here is an invented picnic example about someone mentioning a red blanket.</desc><defs><marker id="teaching-73-70-65-61-6b-65-72-2d-30-30-38-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-73-70-65-61-6b-65-72-2d-30-30-38-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-73-70-65-61-6b-65-72-2d-30-30-38-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="742" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="57" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Flow</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="650" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Where the evidence stops and illustration</text><text x="35" y="150.28" font-size="32" font-weight="700" fill="#231f20" textLength="87" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">starts</text><g data-edge-index="0" data-from="0" data-to="1"><path d="M 60 242 L 60 338" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teaching-73-70-65-61-6b-65-72-2d-30-30-38-v-30-link)"/></g><g data-edge-index="1" data-from="1" data-to="2"><path d="M 60 397 L 60 493" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"