<svg xmlns="http://www.w3.org/2000/svg" width="720" height="601" viewBox="0 0 720 601" role="img" aria-labelledby="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-33-36-v-30-title" aria-describedby="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-33-36-v-30-desc" font-family="Arial, sans-serif" data-format="timeline" data-visual-id="wellbeing-036" data-visual-index="0"><title id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-33-36-v-30-title">Give the unbooked day a purpose</title><desc id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-33-36-v-30-desc">A fictional Monday club session is followed by an unbooked Tuesday and a separate decision about the next invitation.
1. Monday session. A demanding club activity is already planned.
2. Tuesday gap. Not automatically filled by another demanding invitation.
3. Next booking decision. Consider remaining demands and recovery rather than empty boxes.</desc><defs><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-33-36-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-33-36-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-33-36-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="601" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="101" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Timeline</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="534" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Give the unbooked day a purpose</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="531" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Event order only; spacing is not proportional to time.</text><g data-time-spacing="ordinal"><path d="M 262 219 L 262 423" fill="none" stroke="#69635f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g data-item-index="0"><text x="35" y="229.04" font-size="26" font-weight="700" fill="#231f20" textLength="103" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Monday</text><text x="35" y="266.04" fon