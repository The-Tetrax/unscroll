<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1509" viewBox="0 0 720 1509" role="img" aria-labelledby="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-32-32-v-30-title" aria-describedby="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-32-32-v-30-desc" font-family="Arial, sans-serif" data-format="spatial" data-visual-id="wellbeing-022" data-visual-index="0"><title id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-32-32-v-30-title">Change the distance of attention</title><desc id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-32-32-v-30-desc">A viewer looks between nearby document detail and a noticeboard farther across the room, rather than between two close screens.
1. Viewer. Remain comfortably supported; no staring required.
2. Nearby document. Close detail on the working screen.
3. Noticeboard across room. A comfortable farther view, not tiny text to decode.
1 to 2: near task.
1 to 3: farther view.</desc><defs><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-32-32-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-32-32-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-32-32-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker><mask id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-32-32-v-30-connections-mask" maskUnits="userSpaceOnUse" x="36" y="192" width="648" height="650" style="mask-type:luminance"><rect x="36" y="192" width="648" height="650" fill="#ffffff"/><rect x="142.2" y="384" width="90" height="90" fill="#000000"/><rect x="244.8" y="590.4" width="90" height="90" fill="#000000"/><rect x="498.6" y="366.8" width="90" height="90" fill="#000000"/><rect x="158.2" y="309" width="58" height="58" fill="#000000"/><rect x="260.8" y="515.4" width="58" height="58" fill="#000000"/><rect x="514.6" y="291.8" width="58" height="58" fill="#000000"/><rect x="211.2" y="314" width="102" height="48" fill="#000000"/></mask></defs><rect width="720" height="1509" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="186" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Spatial diagram</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="512" lengthAdjust="spacingAndGlyph