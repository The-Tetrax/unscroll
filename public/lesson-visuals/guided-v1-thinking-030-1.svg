<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1172" viewBox="0 0 720 1172" role="img" aria-labelledby="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-30-v-30-title" aria-describedby="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-30-v-30-desc" font-family="Arial, sans-serif" data-format="matrix" data-visual-id="thinking-030" data-visual-index="0"><title id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-30-v-30-title">Purchase action by actual shelf clearance</title><desc id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-30-v-30-desc">Buying works with adequate clearance but fails its purpose with inadequate clearance; keeping the current organizer remains feasible in both states.
1. Buy / adequate gap. Box fits the stated width requirement.
2. Buy / inadequate gap. Purchase cannot serve its intended shelf.
3. Keep / adequate gap. Current organizer remains usable; purchase was possible.
4. Keep / inadequate gap. Current organizer remains usable; avoids a non-fitting purchase.</desc><defs><marker id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-30-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-30-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-30-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="1172" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="73" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Matrix</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="492" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Purchase action by actual shelf</text><text x="35" y="150.28" font-size="32" font-weight="700" fill="#231f20" textLength="154" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">clearance</text><text x="35" y="212.88" font-size="22" font-weight="400" fill="#231f20" textLength="639" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Read the row and column together; numbered cells refer to the</text><text x="35" y="243.88" font-size="22" font-weight="400" fill="#231f20" textLength="43" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">key.</text><rect x="192" y="276" width="496" height="66" rx="0