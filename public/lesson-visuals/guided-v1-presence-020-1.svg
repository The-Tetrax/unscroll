<svg xmlns="http://www.w3.org/2000/svg" width="720" height="936" viewBox="0 0 720 936" role="img" aria-labelledby="teaching-70-72-65-73-65-6e-63-65-2d-30-32-30-v-30-title" aria-describedby="teaching-70-72-65-73-65-6e-63-65-2d-30-32-30-v-30-desc" font-family="Arial, sans-serif" data-format="dialogue" data-visual-id="presence-020" data-visual-index="0"><title id="teaching-70-72-65-73-65-6e-63-65-2d-30-32-30-v-30-title">Find the missing condition</title><desc id="teaching-70-72-65-73-65-6e-63-65-2d-30-32-30-v-30-desc">Jules names the costume task; Amira identifies the unconfirmed key; they assign the follow-up.
1. Jules, spoken. I will bring the costume bag on Thursday.
2. Amira, typed. I can collect the key if the caretaker confirms.
3. Jules. Then the return time is still unconfirmed.
4. Amira. I will ask the caretaker and update you.</desc><defs><marker id="teaching-70-72-65-73-65-6e-63-65-2d-30-32-30-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-70-72-65-73-65-6e-63-65-2d-30-32-30-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-70-72-65-73-65-6e-63-65-2d-30-32-30-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="936" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="106" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Dialogue</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="411" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Find the missing condition</text><circle cx="79" cy="168" r="22" fill="#231f20" stroke="#231f20" stroke-width="3"/><text x="71.5" y="175.96" font-size="24" font-weight="700" fill="#f7f4ed" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">1</text><text x="119" y="172.04" font-size="26" font-weight="700" fill="#231f20" textLength="177" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Jules, spoken</text><g data-turn-index="0" data-side="left"><path d="M 78 203 H 508 Q 530 203 530 225  L 530 263 Q 530 285 508 285 H 78 Q 56 285 56 263 L 56 264 L 38 271 L 56 244 L 56 225 Q 56 203 78 203 Z" fill="#f7f4ed" stroke="#231f20" st