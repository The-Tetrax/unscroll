<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1154" viewBox="0 0 720 1154" role="img" aria-labelledby="teaching-70-65-72-73-70-65-63-74-69-76-65-2d-30-31-34-v-30-title" aria-describedby="teaching-70-65-72-73-70-65-63-74-69-76-65-2d-30-31-34-v-30-desc" font-family="Arial, sans-serif" data-format="matrix" data-visual-id="perspective-014" data-visual-index="0"><title id="teaching-70-65-72-73-70-65-63-74-69-76-65-2d-30-31-34-v-30-title">Booking rule by access position</title><desc id="teaching-70-65-72-73-70-65-63-74-69-76-65-2d-30-31-34-v-30-desc">Two booking rules are compared for residents with different access to their phones.
1. Instant: frequent access. Can compete whenever a useful slot appears.
2. Instant: offline at work. Useful slots may disappear before checking.
3. Window: frequent access. Submits a request; cannot win by constant refreshing.
4. Window: offline at work. Can submit outside work within the agreed window.</desc><defs><marker id="teaching-70-65-72-73-70-65-63-74-69-76-65-2d-30-31-34-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-70-65-72-73-70-65-63-74-69-76-65-2d-30-31-34-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-70-65-72-73-70-65-63-74-69-76-65-2d-30-31-34-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="1154" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="73" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Matrix</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="498" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Booking rule by access position</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="577" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Items in reading order; semantic axes were not supplied.</text><rect x="192" y="200" width="496" height="66" rx="0" fill="#ddd7cc" stroke="none" stroke-width="3"/><text x="207" y="236.96" font-size="24" font-weight="700" fill="#231f20" textLength="114" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Column 1</text><text x="455" y="236.96" font-size="24" font-weight="700" fill="#231f20" textLength="114" lengthA