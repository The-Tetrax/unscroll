1. A: backups. Its upload schedule changes.
2. B: film. Its settings stay unchanged.
3. Router. Both devices use this resource.
4. Internet link. Shared capacity can carry effects.
1 to 3.
2 to 3.
3 to 4.</desc><defs><marker id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-30-36-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-30-36-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-30-36-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker><mask id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-30-36-v-30-connections-mask" maskUnits="userSpaceOnUse" x="36" y="192" width="648" height="650" style="mask-type:luminance"><rect x="36" y="192" width="648" height="650" fill="#ffffff"/><rect x="142.2" y="358.2" width="90" height="90" fill="#000000"/><rect x="142.2" y="581.8" width="90" height="90" fill="#000000"/><rect x="331.2" y="470" width="90" height="90" fill="#000000"/><rect x="498.6" y="470" width="90" height="90" fill="#000000"/><rect x="158.2" y="283.2" width="58" height="58" fill="#000000"/><rect x="158.2" y="506.8" width="58" height="58" fill="#000000"/><rect x="347.2" y="395" width="58" height="58" fill="#000000"/><rect x="514.6" y="395" width="58" height="58" fill="#000000"/><rect x="211.2" y="288.2" width="152" height="48" fill="#000000"/><rect x="211.2" y="511.8" width="95" height="48" fill="#000000"/><rect x="400.2" y="400" width="100" height="48" fill="#000000"/></mask></defs><rect width="720" height="1679" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="70