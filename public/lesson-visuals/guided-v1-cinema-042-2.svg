<svg xmlns="http://www.w3.org/2000/svg" width="720" height="593" viewBox="0 0 720 593" role="img" aria-labelledby="teaching-63-69-6e-65-6d-61-2d-30-34-32-v-31-title" aria-describedby="teaching-63-69-6e-65-6d-61-2d-30-34-32-v-31-desc" font-family="Arial, sans-serif" data-format="timeline" data-visual-id="cinema-042" data-visual-index="1"><title id="teaching-63-69-6e-65-6d-61-2d-30-34-32-v-31-title">Version B: Saturday and luggage</title><desc id="teaching-63-69-6e-65-6d-61-2d-30-34-32-v-31-desc">The same calendar, a packed bag, and the calendar again each occupy two seconds.
1. Saturday circled. 0-2 s: identical calendar view.
2. Packed bag. 2-4 s: replacement neighbor.
3. Same calendar. 4-6 s: identical return.</desc><defs><marker id="teaching-63-69-6e-65-6d-61-2d-30-34-32-v-31-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-63-69-6e-65-6d-61-2d-30-34-32-v-31-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-63-69-6e-65-6d-61-2d-30-34-32-v-31-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="593" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="101" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Timeline</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="522" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Version B: Saturday and luggage</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="531" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Event order only; spacing is not proportional to time.</text><g data-time-spacing="ordinal"><path d="M 262 219 L 262 415" fill="none" stroke="#69635f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g data-item-index="0"><text x="35" y="229.04" font-size="26" font-weight="700" fill="#231f20" textLength="116" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Saturday</text><text x="35" y="266.04" font-size="26" font-weight="700" fill="#231f20" textLength="84" lengthAdjust