<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1749" viewBox="0 0 720 1749" role="img" aria-labelledby="teaching-63-69-6e-65-6d-61-2d-30-34-35-v-30-title" aria-describedby="teaching-63-69-6e-65-6d-61-2d-30-34-35-v-30-desc" font-family="Arial, sans-serif" data-format="spatial" data-visual-id="cinema-045" data-visual-index="0"><title id="teaching-63-69-6e-65-6d-61-2d-30-34-35-v-30-title">Two positions for the same phone</title><desc id="teaching-63-69-6e-65-6d-61-2d-30-34-35-v-30-desc">A speaker faces a nearby phone position and a farther alternative, with a wall beside the sound path.
1. Speaker. Same spoon line; ordinary voice.
2. Near position. About half a metre; outside direct breath.
3. Far position. About two metres; same phone later.
4. Kitchen wall. Reflects some voice energy.
1 to 2.
1 to 3.
1 to 4.
4 to 3.</desc><defs><marker id="teaching-63-69-6e-65-6d-61-2d-30-34-35-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-63-69-6e-65-6d-61-2d-30-34-35-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-63-69-6e-65-6d-61-2d-30-34-35-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker><mask id="teaching-63-69-6e-65-6d-61-2d-30-34-35-v-30-connections-mask" maskUnits="userSpaceOnUse" x="36" y="192" width="648" height="650" style="mask-type:luminance"><rect x="36" y="192" width="648" height="650" fill="#ffffff"/><rect x="153" y="384" width="90" height="90" fill="#000000"/><rect x="342" y="384" width="90" height="90" fill="#000000"/><rect x="477" y="564.6" width="90" height="90" fill="#000000"/><rect x="153" y="577.5" width="90" height="90" fill="#000000"/><rect x="169" y="309" width="58" height="58" fill="#000000"/><rect x="358" y="309" width="58" height="58" fill="#000000"/><rect x="493" y="489.6" width="58" height="58" fill="#000000"/><rect x="169" y="502.5" width="58" height="58" fill="#000000"/><rect x="222" y="314" width="120" height="48" fill="#000000"/><rect x="338" y="494.6" width="160" height="48" fill="#000000"/></mask></defs><rect width="720" height="1749" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="186" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Spatial diagram</t