<svg xmlns="http://www.w3.org/2000/svg" width="720" height="677" viewBox="0 0 720 677" role="img" aria-labelledby="teaching-66-67-2d-30-31-36-v-30-title" aria-describedby="teaching-66-67-2d-30-31-36-v-30-desc" font-family="Arial, sans-serif" data-format="timeline" data-visual-id="fg-016" data-visual-index="0"><title id="teaching-66-67-2d-30-31-36-v-30-title">Audio information in the parcel scene</title><desc id="teaching-66-67-2d-30-31-36-v-30-desc">No necessary caption at 0 to 2 seconds; speech at 2 to 4; knock at 7 to 8; visual movement afterward.
1. 0 to 2 seconds. No meaningful audio to caption in this opening.
2. 2 to 4 seconds. Offscreen voice: The parcel is ready.
3. 7 to 8 seconds. [Knock at door] appears with the sound, not earlier.
4. 8 to 15 seconds. Parcel moves: visual information, not a sound caption.</desc><defs><marker id="teaching-66-67-2d-30-31-36-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-66-67-2d-30-31-36-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-66-67-2d-30-31-36-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="677" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="101" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Timeline</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="585" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Audio information in the parcel scene</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="531" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Event order only; spacing is not proportional to time.</text><g data-time-spacing="ordinal"><path d="M 262 219 L 262 499" fill="none" stroke="#69635f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g data-item-index="0"><text x="35" y="229.04" font-size="26" font-weight="700" fill="#231f20" textLength="188" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">0 to 2 seconds</text><text x="299" y="224.88" font-size="22" font-weight="400" fill="#231f20" textLength="384" le