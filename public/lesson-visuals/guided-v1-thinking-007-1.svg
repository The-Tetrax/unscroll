<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1179" viewBox="0 0 720 1179" role="img" aria-labelledby="teaching-74-68-69-6e-6b-69-6e-67-2d-30-30-37-v-30-title" aria-describedby="teaching-74-68-69-6e-6b-69-6e-67-2d-30-30-37-v-30-desc" font-family="Arial, sans-serif" data-format="bars" data-visual-id="thinking-007" data-visual-index="0"><title id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-30-37-v-30-title">Late returns before and after the pilot</title><desc id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-30-37-v-30-desc">East decreases from 30 to 18 late returns per 100 loans; West decreases from 20 to 16.
