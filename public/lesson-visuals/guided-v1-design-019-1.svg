<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="design-type-019-title" aria-describedby="design-type-019-desc" focusable="false">
<title id="design-type-019-title">Give the flyer shared edges</title>
<desc id="design-type-019-desc">A 600 px wide screening flyer uses 30 SVG px per squared-paper unit. From left to right its widths are 60,210,60,210,60 px: margins 2 units each, columns 7 units each and a 2-unit gutter, totaling 20. The title spans both columns. An original roof-and-window drawing and its caption start at x = 120; Saturday, 19:15, Library room and Book at desk start at x = 390. The shared edges are shown as vertical guides.</desc>
<rect x="0" y="0" width="720" height="720" rx="0" fill="#F7F4ED" stroke="none" stroke-width="2"/>
<g aria-hidden="true">
<text x="32" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#231F20">Give the flyer shared edges</text>
<line x1="32" y1="80" x2="688" y2="80" stroke="#AAA398" stroke-width="2"/>
<text x="40" y="106" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">20 units = 600 px. One unit = 30 px.</text><rect x="60" y="122" width="60" height="32" rx="0" fill="#DDD7CC" stroke="#AAA398" stroke-width="2"/><text x="90" y="147" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#231F20">2</text><rect x="120" y="122" width="210" height="32" rx="0" fill="#FFFFFF" stroke="#AAA398" stroke-width="2"/><text x="225" y="147" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#231F20">7</text><rect x="330" y="122" width="60" height="32" rx="0" fill="#DDD7CC" stroke="#AAA398" stroke-width="2"/><text x="360" y="147" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#231F20">2</text><rect x="390" y="122" width="210" height="32" rx="0" fill="#FFFFFF" stroke="#AAA398" stroke-width="2"/><text x="495" y="147" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#231F20">7</text><rect x="600" y="122" width="60" height="32" rx="0" fill="#DDD7CC" stroke="#AAA398" stroke-width="2"/><text x="630" y="147" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#231F20">2</text><rect x="60" y="168" width="600" height="422" rx="0" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><rect x="330" y="168" width="60" height="422" rx="0" fill="#F1E5E3" stroke="none" stroke-width="2"/><line x1="120" y1="172" x2="120" y2="580" stroke="#AAA398" stroke-width="1" stroke-dasharray="6 6"/><line x1="330" y1="172" x2="330" y2="580" stroke="#AAA398" stroke-width="1" stroke-dasharray="6 6"/><line x1="390" y1="172" x2="390" y2="580" stroke="#AAA398" stroke-width="1" stroke-dasharray="6 6"/><line x1="600" y1="172" x2="600" y2="580" stroke="#AAA398" stroke-width="1" stroke-dasharray="6 6"/><text x="120" y="221" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#231F20">NEIGHBORHOOD</text><text x="120" y="278" font-family="Arial, sans-serif" font-size="48" font-weight="700" text-anchor="start" fill="#231F20">SCREENING</text><rect x="120" y="318" width="210" height="136" rx="0" fill="#E3E5DF" stroke="none" stroke-width="2"/><path d="M 131 419 V 370 L 180 338 L 232 370 V 419 Z" fill="#596C70" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="163" y="373" width="34" height="45" rx="0" fill="#F0D5A5" stroke="none" stroke-width="2"/><line x1="180" y1="374" x2="180" y2="418" stroke="#596C70" stroke-width="3"/><path d="M 234 440 L 273 400 L 317 434 M 127 444 H 324" fill="none" stroke="#231F20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="120" y="493" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">An original</text><text x="120" y="527" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">drawing</text><text x="390" y="351" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#231F20">Saturday</text><text x="390" y="399" font-family="Arial, sans-serif" font-size="40" font-weight="700" text-anchor="start" fill="#231F20">19:15</text><text x="390" y="446" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#231F20">Library room</text><text x="390" y="534" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#231F20">Book at desk</text><text x="40" y="639" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Outer margins: 2 each. Columns: 7 each.</text><text x="40" y="680" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Gutter: 2. The title spans both columns.</text>
</g></svg>