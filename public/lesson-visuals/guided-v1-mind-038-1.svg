<svg xmlns="http://www.w3.org/2000/svg" width="720" height="515" viewBox="0 0 720 515" role="img" aria-labelledby="teaching-6d-69-6e-64-2d-30-33-38-v-30-title" aria-describedby="teaching-6d-69-6e-64-2d-30-33-38-v-30-desc" font-family="Arial, sans-serif" data-format="comparison" data-visual-id="mind-038" data-visual-index="0"><title id="teaching-6d-69-6e-64-2d-30-33-38-v-30-title">The distinction the session must explain</title><desc id="teaching-6d-69-6e-64-2d-30-33-38-v-30-desc">An editable poster project retains separate layers; a flattened sharing image preserves the displayed appearance but not separate editable text layers.
