<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="design-type-006-title" aria-describedby="design-type-006-desc" focusable="false">
<title id="design-type-006-title">Light adds. Pigments absorb.</title>
<desc id="design-type-006-desc">Overlapping red, green and blue discs show full-channel additive combinations on black. Red plus green is #FFFF00; all three intersect at #FFFFFF. The key includes #FF0000, #00FF00, #0000FF, #FFFF00, #FFFFFF and zero-channel #000000. Below, irregular paint dabs show red #B44132 plus green #43694A and a possible muted #6A5542 outcome, not a paint recipe.</desc>
<rect x="0" y="0" width="720" height="720" rx="0" fill="#F7F4ED" stroke="none" stroke-width="2"/>
<g aria-hidden="true">
<text x="32" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#231F20">Light adds. Pigments absorb.</text>
<line x1="32" y1="80" x2="688" y2="80" stroke="#AAA398" stroke-width="2"/>
<text x="40" y="120" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Emitted light: full-channel RGB</text><rect x="40" y="144" width="368" height="292" rx="0" fill="#000000" stroke="none" stroke-width="2"/><defs>
<clipPath id="dt-006-r"><circle cx="166" cy="238" r="80" fill="#FFFFFF" stroke="none" stroke-width="2"/></clipPath>
<clipPath id="dt-006-g"><circle cx="278" cy="238" r="80" fill="#FFFFFF" stroke="none" stroke-width="2"/></clipPath>
<clipPath id="dt-006-b"><circle cx="222" cy="332" r="80" fill="#FFFFFF" stroke="none" stroke-width="2"/></clipPath>
</defs><circle cx="166" cy="238" r="80" fill="#FF0000" stroke="none" stroke-width="2"/><circle cx="278" cy="238" r="80" fill="#00FF00" stroke="none" stroke-width="2"/><circle cx="222" cy="332" r="80" fill="#0000FF" stroke="none" stroke-width="2"/>
<g clip-path="url(#dt-006-r)"><circle cx="278" cy="238" r="80" fill="#FFFF00" stroke="none" stroke-width="2"/><circle cx="222" cy="332" r="80" fill="#FF00FF" stroke="none" stroke-width="2"/></g>
<g clip-path="url(#dt-006-g)"><circle cx="222" cy="332" r="80" fill="#00FFFF" stroke="none" stroke-width="2"/></g>
