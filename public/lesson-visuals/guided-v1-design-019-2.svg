<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1382" viewBox="0 0 720 1382" role="img" aria-labelledby="teaching-64-65-73-69-67-6e-2d-30-31-39-v-31-title" aria-describedby="teaching-64-65-73-69-67-6e-2d-30-31-39-v-31-desc" font-family="Arial, sans-serif" data-format="bars" data-visual-id="design-019" data-visual-index="1"><title id="teaching-64-65-73-69-67-6e-2d-30-31-39-v-31-title">Account for the whole page width</title><desc id="teaching-64-65-73-69-67-6e-2d-30-31-39-v-31-desc">The page has a two-unit left margin, seven-unit column, two-unit gutter, seven-unit column, and two-unit right margin.
1. Left margin. Outer space. Value: 2 squared-paper units.
2. Left column. Drawing and caption. Value: 7 squared-paper units.
3. Gutter. Between columns. Value: 2 squared-paper units.
4. Right column. Event details. Value: 7 squared-paper units.
5. Right margin. Outer space. Value: 2 squared-paper units.</desc><defs><marker id="teaching-64-65-73-69-67-6e-2d-30-31-39-v-31-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-64-65-73-69-67-6e-2d-30-31-39-v-31-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-64-65-73-69-67-6e-2d-30-31-39-v-31-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="1382" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="92" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Bar plot</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="524" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Account for the whole page width</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="519" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Zero baseline; bar lengths use the supplied values.</text><text x="35" y="212.96" font-size="24" font-weight="700" fill="#231f20" textLength="300" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Unit: squared-paper units</text><text x="42.5" y="258.96" font-size="24" font-weight="700" fill="#231f20" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">0</text><g data-item-index="0" data-zero-x="50"><text x="35" y="307.04" font-size="26" font-weight="