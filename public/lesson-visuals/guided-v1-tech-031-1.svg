<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="teaching-74-65-63-68-2d-30-33-31-v-30-title" aria-describedby="teaching-74-65-63-68-2d-30-33-31-v-30-desc" font-family="Arial, sans-serif" data-format="comparison" data-visual-id="tech-031" data-visual-index="0"><title id="teaching-74-65-63-68-2d-30-33-31-v-30-title">Two possible policies for a schedule response</title><desc id="teaching-74-65-63-68-2d-30-33-31-v-30-desc">No-cache allows a stored schedule with validation; no-store prohibits storing the new response in HTTP caches.
