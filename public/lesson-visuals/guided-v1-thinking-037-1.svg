<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1063" viewBox="0 0 720 1063" role="img" aria-labelledby="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-37-v-30-title" aria-describedby="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-37-v-30-desc" font-family="Arial, sans-serif" data-format="flow" data-visual-id="thinking-037" data-visual-index="0"><title id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-37-v-30-title">The slowdown feeds back into itself</title><desc id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-37-v-30-desc">Slow saving causes late acknowledgments, retries add work, and increased load feeds back to slower saving.
1. Saving slows. The service cannot respond as quickly.
2. Acknowledgments arrive late. Clients reach their waiting limit.
3. Clients retry. More attempts reach the same service.
4. Load increases. Extra work can make saving slower again.
1 to 2.
2 to 3.
3 to 4.
4 to 1.</desc><defs><marker id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-37-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-37-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-37-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="1063" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="57" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Flow</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="559" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">The slowdown feeds back into itself</text><g data-edge-index="0" data-from="0" data-to="1"><path d="M 96 168 H 48 Q 38 168 38 178 V 282 Q 38 292 48 292 H 96" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-37-v-30-link)"/></g><g data-edge-index="1" data-from="1" data-to="2"><path d="M 96 292 H 59 Q 49 292 49 302 V 406 Q 49 416 59 416 H 96" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-37-v-30-link)"/></g><g data-edge-index="2" data-from="2" data-to="3"><path d="M 96 416 H 70 Q 60 416 60 4