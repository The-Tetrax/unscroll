<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="design-type-017-title" aria-describedby="design-type-017-desc" focusable="false">
<title id="design-type-017-title">Move the baselines, not the font size</title>
<desc id="design-type-017-desc">Images: Héloise Ng, Sound: Hugo Gill, and Thanks: Jo occupy baselines 206, 266 and 326 SVG px. At the declared schematic scale of 5 SVG px per point, offsets are 0, 12 and 24 pt. A 10 pt body plus 2 pt added leading explains a 12 pt interval. Below, two real 32 px Arial credit blocks have 28 px and 48 px baseline spacing. Accents and g descenders remain present.</desc>
<rect x="0" y="0" width="720" height="720" rx="0" fill="#F7F4ED" stroke="none" stroke-width="2"/>
<g aria-hidden="true">
<text x="32" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#231F20">Move the baselines, not the font size</text>
<line x1="32" y1="80" x2="688" y2="80" stroke="#AAA398" stroke-width="2"/>
<text x="40" y="122" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">10 pt body + 2 pt added leading = 12 pt</text><line x1="48" y1="206" x2="528" y2="206" stroke="#AAA398" stroke-width="1" stroke-dasharray="6 6"/><text x="64" y="206" font-family="Arial, sans-serif" font-size="50" font-weight="400" text-anchor="start" fill="#231F20">Images: Héloise Ng</text><text x="575" y="213" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">0 pt</text><line x1="48" y1="266" x2="528" y2="266" stroke="#AAA398" stroke-width="1" stroke-dasharray="6 6"/><text x="64" y="266" font-family="Arial, sans-serif" font-size="50" font-weight="400" text-anchor="start" fill="#231F20">Sound: Hugo Gill</text><text x="575" y="273" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">12 pt</text><line x1="48" y1="326" x2="528" y2="326" stroke="#AAA398" stroke-width="1" stroke-dasharray="6 6"/><text x="64" y="326" font-family="Arial, sans-serif" font-size="50" font-weight="400" text-anchor="start" fill="#231F20">Thanks: Jo</text><text x="575" y="333" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">24 pt</text><line x1="548" y1="206" x2="548" y2="326" stroke="#231F20" stroke-width="2"/><line x1="540" y1="206" x2="556" y2="206" stroke="#231F20" stroke-width="2"/><line x1="540" y1="266" x2="556" y2="266" stroke="#231F20" stroke-width="2"/><line x1="540" y1="326" x2="556" y2="326" stroke="#231F20" stroke-width="2"/><text x="48" y="383" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Two equal 12 pt baseline intervals</text><text x="48" y="424" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Schematic scale: 1 pt = 5 SVG px</text><line x1="40" y1="451" x2="680" y2="451" stroke="#AAA398" stroke-width="2"/><text x="40" y="486" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#231F20">Same 32 px type; different baseline spacing</text><text x="40" y="529" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Tighter: 28 px</text><text x="392" y="529" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Looser: 48 px</text><line x1="40" y1="569" x2="328" y2="569" stroke="#AAA398" stroke-width="1" stroke-dasharray="6 6"/><text x="40" y="569" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#231F20">Images: Héloise Ng</text><line x1="40" y1="597" x2="328" y2="597" stroke="#AAA398" stroke-width="1" stroke-dasharray="6 6"/><text x="40" y="597" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#231F20">Sound: Hugo Gill</text><line x1="40" y1="625" x2="328" y2="625" stroke="#AAA398" stroke-width="1" stroke-dasharray="6 6"/><text x="40" y="625" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#231F20">Thanks: Jo</text><line x1="392" y1="569" x2="680" y2="569" stroke="#AAA398" stroke-width="1" stroke-dasharray="6 6"/><text x="392" y="569" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#231F20">Images: Héloise Ng</text><line x1="392" y1="617" x2="680" y2="617" stroke="#AAA398" stroke-width="1" stroke-dasharray="6 6"/><text x="392" y="617" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#231F20">Sound: Hugo Gill</text><line x1="392" y1="665" x2="680" y2="665" stroke="#AAA398" stroke-width="1" stroke-dasharray="6 6"/><text x="392" y="665" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#231F20">Thanks: Jo</text>
</g></svg>