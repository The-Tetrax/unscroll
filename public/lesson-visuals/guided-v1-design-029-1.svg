<svg xmlns="http://www.w3.org/2000/svg" width="720" height="970" viewBox="0 0 720 970" role="img" focusable="false" aria-labelledby="design-ux-029-title" aria-describedby="design-ux-029-desc" font-family="Arial, sans-serif" font-size="22" data-layout-guard="estimated-arial-line-boxes"><title id="design-ux-029-title">Two menus, the same eight commands</title><desc id="design-ux-029-desc">The flat alphabetical menu and the expanded File and Edit groups contain exactly the same eight commands, with Resize highlighted in both. File and Edit are shown open to expose their contents; the drawings predict no speed advantage and supply no measured search result.</desc><defs></defs><rect x="0" y="0" width="720" height="970" rx="0" fill="#F7F4ED" stroke="none" stroke-width="2"></rect><g aria-hidden="true"><text x="35" y="52" font-size="28" font-weight="700" fill="#231F20" textLength="533" lengthAdjust="spacingAndGlyphs" text-decoration="none">Two menus, the same eight commands</text><text x="35" y="94" font-size="22" font-weight="400" fill="#69635F" textLength="495" lengthAdjust="spacingAndGlyphs" text-decoration="none">Illustrative menus; grouped contents shown open</text><line x1="32" y1="114" x2="688" y2="114" stroke="#231F20" stroke-width="2" stroke-dasharray=""></line><text x="35" y="154" font-size="22" font-weight="400" fill="#231F20" textLength="524" lengthAdjust="spacingAndGlyphs" text-decoration="none">Goal: smaller pixel width, without cutting the picture.</text><text x="51" y="209" font-size="24" font-weight="700" fill="#231F20" textLength="182" lengthAdjust="spacingAndGlyphs" text-decoration="none">Alphabetical list</text><text x="391" y="209" font-size="24" font-weight="700" fill="#231F20" textLength="188" lengthAdjust="spacingAndGlyphs" text-decoration="none">Grouped menus</text><rect x="32" y="228" width="316" height="542" rx="8" fill="#FFFFFF" stroke="#231F20" stroke-width="2"></rect><rect x="372" y="228" width="316" height="542" rx="8" fill="#FFFFFF" stroke="#231F20" stroke-width="2"></rect><text x="67" y="275" font-size="24" font-weight="400" fill="#231F20" textLength="54" lengthAdjust="spacingAndGlyphs" text-decoration="none">Crop</text><text x="67" y="337" font-size="24" font-weight="400" fill="#231F20" textLength="72" lengthAdjust="spacingAndGlyphs" text-decoration="none">Export</text><text x="67" y="399" font-size="24" font-weight="400" fill="#231F20" textLength="41" lengthAdjust="spacingAndGlyphs" text-decoration="none">Flip</text><text x="67" y="461" font-size="24" font-weight="400" fill="#231F20" textLength="71" lengthAdjust="spacingAndGlyphs" text-decoration="none">Import</text><text x="67" y="523" font-size="24" font-weight="400" fill="#231F20" textLength="52" lengthAdjust="spacingAndGlyphs" text-decoration="none">Print</text><text x="67" y="585" font-size="24" font-weight="400" fill="#231F20" textLength="94" lengthAdjust="spacingAndGlyphs" text-decoration="none">Rename</text><rect x="48" y="614" width="284" height="50" rx="4" fill="#FBEDEF" stroke="#BC2031" stroke-width="2"></rect><text x="67" y="647" font-size="24" font-weight="700" fill="#231F20" textLength="80" lengthAdjust="spacingAndGlyphs" text-decoration="none">Resize</text><text x="67" y="709" font-size="24" font-weight="400" fill="#231F20" textLength="74" lengthAdjust="spacingAndGlyphs" text-decoration="none">Rotate</text><path d="M 392 252 L 410 252 L 401 263 Z" fill="#231F20" stroke="none" stroke-width="2" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round"></path><text x="427" y="266" font-size="24" font-weight="700" fill="#231F20" textLength="43" lengthAdjust="spacingAndGlyphs" text-decoration="none">File</text><line x1="388" y1="280" x2="672" y2="280" stroke="#C9C2B6" stroke-width="2" stroke-dasharray=""></line><text x="423" y="316" font-size="24" font-weight="400" fill="#231F20" textLength="72" lengthAdjust="spacingAndGlyphs" text-decoration="none">Export</text><text x="423" y="364" font-size="24" font-weight="400" fill="#231F20" textLength="71" lengthAdjust="spacingAndGlyphs" text-decoration="none">Import</text><text x="423" y="412" font-size="24" font-weight="400" fill="#231F20" textLength="52" lengthAdjust="spacingAndGlyphs" text-decoration="none">Print</text><text x="423" y="460" font-size="24" font-weight="400" fill="#231F20" textLength="94" lengthAdjust="spacingAndGlyphs" text-decoration="none">Rename</text><path d="M 392 503 L 410 503 L 401 514 Z" fill="#231F20" stroke="none" stroke-width="2" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round"></path><text x="427" y="517" font-size="24" font-weight="700" fill="#231F20" textLength="46" lengthAdjust="spacingAndGlyphs" text-decoration="none">Edit</text><line x1="388" y1="531" x2="672" y2="531" stroke="#C9C2B6" stroke-width="2" stroke-dasharray=""></line><text x="423" y="567" font-size="24" font-weight="400" fill="#231F20" textLength="54" lengthAdjust="spacingAndGlyphs" text-decoration="none">Crop</text><text x="423" y="615" font-size="24" font-weight="400" fill="#231F20" textLength="41" lengthAdjust="spacingAndGlyphs" text-decoration="none">Flip</text><rect x="388" y="633" width="284" height="44" rx="4" fill="#FBEDEF" stroke="#BC2031" stroke-width="2"></rect><text x="423" y="663" font-size="24" font-weight="700" fill="#231F20" textLength="80" lengthAdjust="spacingAndGlyphs" text-decoration="none">Resize</text><text x="423" y="711" font-size="24" font-weight="400" fill="#231F20" textLength="74" lengthAdjust="spacingAndGlyphs" text-decoration="none">Rotate</text><text x="51" y="828" font-size="22" font-weight="400" fill="#231F20" textLength="316" lengthAdjust="spacingAndGlyphs" text-decoration="none">Resize keeps the whole image.</text><text x="51" y="868" font-size="22" font-weight="400" fill="#231F20" textLength="333" lengthAdjust="spacingAndGlyphs" text-decoration="none">Crop removes part of the picture.</text><line x1="32" y1="900" x2="688" y2="900" stroke="#C9C2B6" stroke-width="2" stroke-dasharray=""></line><text x="35" y="936" font-size="22" font-weight="400" fill="#69635F" textLength="556" lengthAdjust="spacingAndGlyphs" text-decoration="none">Fewer first-level labels do not predict the whole search.</text></g></svg>