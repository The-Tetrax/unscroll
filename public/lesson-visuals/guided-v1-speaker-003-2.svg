<svg xmlns="http://www.w3.org/2000/svg" width="720" height="635" viewBox="0 0 720 635" role="img" aria-labelledby="teaching-73-70-65-61-6b-65-72-2d-30-30-33-v-31-title" aria-describedby="teaching-73-70-65-61-6b-65-72-2d-30-30-33-v-31-desc" font-family="Arial, sans-serif" data-format="dialogue" data-visual-id="speaker-003" data-visual-index="1"><title id="teaching-73-70-65-61-6b-65-72-2d-30-30-33-v-31-title">A limit kept inside the pitch</title><desc id="teaching-73-70-65-61-6b-65-72-2d-30-30-33-v-31-desc">A member asks about late returns; the presenter distinguishes a record from a guarantee.
1. Member. Does the sheet prevent late returns?
2. Presenter. No. It records plans; we still need to agree changes and update them.</desc><defs><marker id="teaching-73-70-65-61-6b-65-72-2d-30-30-33-v-31-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-73-70-65-61-6b-65-72-2d-30-30-33-v-31-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-73-70-65-61-6b-65-72-2d-30-30-33-v-31-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="635" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="106" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Dialogue</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="421" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">A limit kept inside the pitch</text><circle cx="79" cy="168" r="22" fill="#231f20" stroke="#231f20" stroke-width="3"/><text x="71.5" y="175.96" font-size="24" font-weight="700" fill="#f7f4ed" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">1</text><text x="119" y="172.04" font-size="26" font-weight="700" fill="#231f20" textLength="106" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Member</text><g data-turn-index="0" data-side="left"><path d="M 78 203 H 460 Q 482 203 482 225  L 482 263 Q 482 285 460 285 H 78 Q 56 285 56 263 L 56 264 L 38 271 L 56 244 L 56 225 Q 56 203 78 203 Z" fill="#f7f4ed"