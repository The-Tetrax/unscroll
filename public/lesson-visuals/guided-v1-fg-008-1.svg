<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1215" viewBox="0 0 720 1215" role="img" aria-labelledby="teaching-66-67-2d-30-30-38-v-30-title" aria-describedby="teaching-66-67-2d-30-30-38-v-30-desc" font-family="Arial, sans-serif" data-format="matrix" data-visual-id="fg-008" data-visual-index="0"><title id="teaching-66-67-2d-30-30-38-v-30-title">Resource type by availability problem</title><desc id="teaching-66-67-2d-30-30-38-v-30-desc">Four cells compare paper and scissors during normal use and when availability needs restoring.
1. Paper / ordinary use. 14 sheets minus 6 used leaves 8; record the remaining stock.
2. Paper / restore stock. Below 10 triggers a request; 8 plus 20 delivered becomes 28.
3. Scissors / ordinary use. Borrow from the marked tray; return at the end of the session.
4. Scissors / unavailable. Mark the missing pair and use the agreed return or review route.</desc><defs><marker id="teaching-66-67-2d-30-30-38-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-66-67-2d-30-30-38-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-66-67-2d-30-30-38-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="1215" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="73" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Matrix</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="589" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Resource type by availability problem</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="639" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Read the row and column together; numbered cells refer to the</text><text x="35" y="198.88" font-size="22" font-weight="400" fill="#231f20" textLength="43" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">key.</text><rect x="192" y="231" width="496" height="92" rx="0" fill="#ddd7cc" stroke="none" stroke-width="3"/><text x="207" y="267.96" font-size="24" font-weight="700" fill="#231f20" textLength="97" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">ordinary</text