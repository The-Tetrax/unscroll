<svg xmlns="http://www.w3.org/2000/svg" width="720" height="589" viewBox="0 0 720 589" role="img" aria-labelledby="teaching-63-69-6e-65-6d-61-2d-30-34-36-v-30-title" aria-describedby="teaching-63-69-6e-65-6d-61-2d-30-34-36-v-30-desc" font-family="Arial, sans-serif" data-format="timeline" data-visual-id="cinema-046" data-visual-index="0"><title id="teaching-63-69-6e-65-6d-61-2d-30-34-36-v-30-title">Keep the hum through the pause</title><desc id="teaching-63-69-6e-65-6d-61-2d-30-34-36-v-30-desc">Two parcel instructions surround a one-second pause filled with matching corridor hum.
1. Parcel line. Leave the parcel here. Keep its breath and hum.
2. One-second pause. Matching corridor tone replaces the removed hesitation.
3. Label line. I will label it. The background continues.</desc><defs><marker id="teaching-63-69-6e-65-6d-61-2d-30-34-36-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-63-69-6e-65-6d-61-2d-30-34-36-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-63-69-6e-65-6d-61-2d-30-34-36-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="589" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="101" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Timeline</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="518" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Keep the hum through the pause</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="531" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Event order only; spacing is not proportional to time.</text><g data-time-spacing="ordinal"><path d="M 262 219 L 262 423" fill="none" stroke="#69635f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g data-item-index="0"><text x="35" y="229.04" font-size="26" font-weight="700" fill="#231f20" textLength="135" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Parcel line</text><text x="299" y="224.88" font-size="22" font-weight="400" fill="#231f20" textLength="319" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Leave the parcel here. Keep its</text><text x="299" y="255.88" font-size="22" font-weight="400" fill="#231f20" textLength="168" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">breath and hum.</text><path d="M 262 210 L 271 219 L 262 228 L 253 219 Z" fill="#f7f4ed" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g data-item-index="1"><text x="35" y="325.04" font-size="26" font-weight="700" fill="#231f20" textLength="158" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">One-second</text><text x="35" y="362.04" font-size="26" font-weight="700" fill="#231f20" textLength="79" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">pause</text><text x="299" y="320.88" font-size="22" font-weight="400" fill="#231f20" textLength="361" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Matching corridor tone replaces the</text><text x="299" y="351.88" font-size="22" font-weight="400" fill="#231f20" textLength="201" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">removed hesitation.</text><path d="M 262 306 L 271 315 L 262 324 L 253 315 Z" fill="#bc2031" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g data-item-index="2"><text x="35" y="433.04" font-size="26" font-weight="700" fill="#231f20" textLength="124" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Label line</text><text x="299" y="428.88" font-size="22" font-weight="400" fill="#231f20" textLength="297" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">I will label it. The background</text><text x="299" y="459.88" font-size="22" font-weight="400" fill="#231f20" textLength="105" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">continues.</text><path d="M 262 414 L 271 423 L 262 432 L 253 423 Z" fill="#f7f4ed" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><path d="M 32 542 L 98 542" fill="n