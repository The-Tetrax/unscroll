<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1109" viewBox="0 0 720 1109" role="img" aria-labelledby="teaching-6f-62-73-65-72-76-65-72-2d-30-31-31-v-30-title" aria-describedby="teaching-6f-62-73-65-72-76-65-72-2d-30-31-31-v-30-desc" font-family="Arial, sans-serif" data-format="dialogue" data-visual-id="observer-011" data-visual-index="0"><title id="teaching-6f-62-73-65-72-76-65-72-2d-30-31-31-v-30-title">Keep the recipe task within its scope</title><desc id="teaching-6f-62-73-65-72-76-65-72-2d-30-31-31-v-30-desc">A friend agrees to folder-category notes, then chooses to pause when a private message appears.
1. You. May I note only the folder categories? No recording; I will delete my note today.
2. Friend. Yes, categories only. I can stop the demonstration at any point.
3. You. A message appeared. I have paused. Would you prefer to skip this screen?
4. Friend. Let us continue verbally without showing the tablet.</desc><defs><marker id="teaching-6f-62-73-65-72-76-65-72-2d-30-31-31-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6f-62-73-65-72-76-65-72-2d-30-31-31-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6f-62-73-65-72-76-65-72-2d-30-31-31-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="1109" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="106" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Dialogue</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="575" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Keep the recipe task within its scope</text><circle cx="79" cy="168" r="22" fill="#231f20" stroke="#231f20" stroke-width="3"/><text x="71.5" y="175.96" font-size="24" font-weight="700" fill="#f7f4ed" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">1</text><text x="119" y="172.04" font-size="26" font-weight="700" fill="#231f20" textLength="52" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">You</text><g data-turn-index="0" data-side="left"><path d="M 78 203 H 488 Q 510 203 510 225  L 510 314 Q 510 336 488 336 H 78 Q 56 336 56 314 L 56 315 L 38 322 L 56 295 L 56 225 Q 56 203 78 203 Z" fill="#f7f4ed" strok