<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="design-type-016-title" aria-describedby="design-type-016-desc" focusable="false">
<title id="design-type-016-title">Watch where the sentence wraps</title>
<desc id="design-type-016-desc">The same two sentences use 32 px Arial and 48 px baseline spacing in both trials: Walk past the old mill. Follow the path. In the 416 px column, each sentence occupies one line. In the 176 px column, the lines are Walk past; the old mill.; Follow the; path. Red return paths show movement back to the next left margin. Widths are construction dimensions, not recommendations.</desc>
<rect x="0" y="0" width="720" height="720" rx="0" fill="#F7F4ED" stroke="none" stroke-width="2"/>
<g aria-hidden="true">
<text x="32" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#231F20">Watch where the sentence wraps</text>
<line x1="32" y1="80" x2="688" y2="80" stroke="#AAA398" stroke-width="2"/>
<text x="40" y="120" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Same words and 32 px Arial; two column widths.</text><line x1="64" y1="162" x2="64" y2="282" stroke="#AAA398" stroke-width="1" stroke-dasharray="6 6"/><line x1="480" y1="162" x2="480" y2="282" stroke="#AAA398" stroke-width="1" stroke-dasharray="6 6"/><text x="64" y="210" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#231F20">Walk past the old mill.</text><text x="64" y="258" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#231F20">Follow the path.</text><path d="M 382 211 C 462 231 458 236 54 236 V 253" fill="none" stroke="#BC2031" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 48 246 L 54 254 L 60 246" fill="none" stroke="#BC2031" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="545" y="206" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Longer</text><text x="545" y="241" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">return</text><line x1="64" y1="300" x2="480" y2="300" stroke="#231F20" stroke-width="2"/><line x1="64" y1="293" x2="64" y2="307" stroke="#231F20" stroke-width="2"/><line x1="480" y1="293" x2="480" y2="307" stroke="#231F20" stroke-width="2"/><text x="272" y="334" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#231F20">416 px</text><text x="40" y="385" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#231F20">Narrower column, unchanged letter size</text><line x1="64" y1="408" x2="64" y2="588" stroke="#AAA398" stroke-width="1" stroke-dasharray="6 6"/><line x1="240" y1="408" x2="240" y2="588" stroke="#AAA398" stroke-width="1" stroke-dasharray="6 6"/><text x="64" y="438" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#231F20">Walk past</text><text x="64" y="486" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#231F20">the old mill.</text><text x="64" y="534" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#231F20">Follow the</text><text x="64" y="582" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#231F20">path.</text><path d="M 212 438 C 287 457 284 464 54 464 V 481" fill="none" stroke="#BC2031" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 48 474 L 54 482 L 60 474" fill="none" stroke="#BC2031" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="345" y="478" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">More returns,</text><text x="345" y="516" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">shorter trips.</text><line x1="64" y1="610" x2="240" y2="610" stroke="#231F20" stroke-width="2"/><line x1="64" y1="603" x2="64" y2="617" stroke="#231F20" stroke-width="2"/><line x1="240" y1="603" x2="240" y2="617" stroke="#231F20" stroke-width="2"/><text x="152" y="644" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#231F20">176 px</text><text x="40" y="686" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Compare wraps without reducing the letter size.</text>
</g></svg>