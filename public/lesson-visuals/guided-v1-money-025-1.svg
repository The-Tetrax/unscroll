s</text><text x="299" y="490.88" font-size="22" font-weight="400" fill="#231f20" textLength="130" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">assessment.</text><path d="M 262 414 L 271 423 L 262 432 L 253 423 Z" fill="#f7f4ed" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><path d="M 32 573 L 98 573" fill="none" stroke="#bc2031" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="119" y="579.88" font-size="22" font-weight="400" fill="#69635f" textLength="211" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Explanatory diagram</text></g></svg>