<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1571" viewBox="0 0 720 1571" role="img" aria-labelledby="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-39-v-30-title" aria-describedby="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-39-v-30-desc" font-family="Arial, sans-serif" data-format="spatial" data-visual-id="thinking-039" data-visual-index="0"><title id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-39-v-30-title">A shared hub sits above both copies</title><desc id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-39-v-30-desc">One powered hub connects to drive A and drive B, creating a shared retrieval dependency.
1. Shared powered hub. Its failure blocks this retrieval path to both drives.
2. Drive A. Independent 10% failure only conditional on a working hub.
3. Drive B. Independent 10% failure only conditional on a working hub.
1 to 2.
