<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1679" viewBox="0 0 720 1679" role="img" aria-labelledby="teaching-6c-69-66-65-2d-30-32-38-v-30-title" aria-describedby="teaching-6c-69-66-65-2d-30-32-38-v-30-desc" font-family="Arial, sans-serif" data-format="spatial" data-visual-id="life-028" data-visual-index="0"><title id="teaching-6c-69-66-65-2d-30-32-38-v-30-title">Look at the slider entrance</title><desc id="teaching-6c-69-66-65-2d-30-32-38-v-30-desc">Two rows of zip teeth approach a central slider while a lining edge lies near its entrance.
1. Left teeth. One guided row.
2. Right teeth. The other guided row.
3. Slider. Narrow channels guide the rows.
4. Lining edge. Look for fabric at the entrance; do not force.
1 to 3: Guided row.
2 to 3: Guided row.
4 to 3: Possible obstruction.</desc><defs><marker id="teaching-6c-69-66-65-2d-30-32-38-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6c-69-66-65-2d-30-32-38-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6c-69-66-65-2d-30-32-38-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker><mask id="teaching-6c-69-66-65-2d-30-32-38-v-30-connections-mask" maskUnits="userSpaceOnUse" x="36" y="192" width="648" height="650" style="mask-type:luminance"><rect x="36" y="192" width="648" height="650" fill="#ffffff"/><rect x="142.2" y="349.6" width="90" height="90" fill="#000000"/><rect x="487.8" y="349.6" width="90" height="90" fill="#000000"/><rect x="315" y="491.5" width="90" height="90" fill="#000000"/><rect x="153" y="607.6" width="90" height="90" fill="#000000"/><rect x="158.2" y="274.6" width="58" height="58" fill="#000000"/><rect x="503.8" y="274.6" width="58" height="58" fill="#000000"/><rect x="331" y="416.5" width="58" height="58" fill="#000000"/><rect x="169" y="532.6" width="58" height="58" fill="#000000"/><rect x="211.2" y="279.6" width="132" height="48" fill="#000000"/><rect x="359.8" y="279.6" width="149" height="48" fill="#000000"/><rect x="384" y="421.5" width="89" height="48" fill="#000000"/></mask></defs><rect width="720" height="1679" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLeng