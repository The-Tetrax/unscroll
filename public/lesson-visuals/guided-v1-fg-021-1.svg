<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="teaching-66-67-2d-30-32-31-v-30-title" aria-describedby="teaching-66-67-2d-30-32-31-v-30-desc" font-family="Arial, sans-serif" data-format="comparison" data-visual-id="fg-021" data-visual-index="0"><title id="teaching-66-67-2d-30-32-31-v-30-title">Two proposed names for the visible Save sketch button</title><desc id="teaching-66-67-2d-30-32-31-v-30-desc">Add artwork to collection omits Save sketch; Save sketch to collection retains the visible phrase.
