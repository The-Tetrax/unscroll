<svg xmlns="http://www.w3.org/2000/svg" width="720" height="739" viewBox="0 0 720 739" role="img" aria-labelledby="teaching-74-65-63-68-2d-30-30-36-v-31-title" aria-describedby="teaching-74-65-63-68-2d-30-30-36-v-31-desc" font-family="Arial, sans-serif" data-format="flow" data-visual-id="tech-006" data-visual-index="1"><title id="teaching-74-65-63-68-2d-30-30-36-v-31-title">Initial allocation roles</title><desc id="teaching-74-65-63-68-2d-30-30-36-v-31-desc">Discover, Offer, Request, then ACK complete the illustrated message sequence.
1. Discover. Client seeks configuration
2. Offer. Server proposes 192.0.2.40
3. Request. Client selects that offer
4. ACK. Server acknowledges allocation; absent here
1 to 2.
2 to 3.
3 to 4: unproven.</desc><defs><marker id="teaching-74-65-63-68-2d-30-30-36-v-31-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-65-63-68-2d-30-30-36-v-31-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-65-63-68-2d-30-30-36-v-31-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="739" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="57" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Flow</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="330" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Initial allocation roles</text><g data-edge-index="0" data-from="0" data-to="1"><path d="M 60 197 L 60 262" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teaching-74-65-63-68-2d-30-30-36-v-31-link)"/></g><g data-edge-index="1" data-from="1" data-to="2"><path d="M 60 321 L 60 386" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teaching-74-65-63-68-2d-30-30-36-v-31-link)"/></g><g data-edge-index="2" data-from="2" data-to="3"><path d="M 60 445 L 60 521" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teaching-74-65-63-68-2d-30-30-36-v-31-