<svg xmlns="http://www.w3.org/2000/svg" width="720" height="773" viewBox="0 0 720 773" role="img" aria-labelledby="teaching-64-65-73-69-67-6e-2d-30-30-39-v-31-title" aria-describedby="teaching-64-65-73-69-67-6e-2d-30-30-39-v-31-desc" font-family="Arial, sans-serif" data-format="bars" data-visual-id="design-009" data-visual-index="1"><title id="teaching-64-65-73-69-67-6e-2d-30-30-39-v-31-title">The histogram keeps these counts</title><desc id="teaching-64-65-73-69-67-6e-2d-30-30-39-v-31-desc">Six equal-area blocks are dark and two are bright, regardless of where those blocks sit in the frame.
1. Dark bin. 6 of 8 blocks: 75 percent. Value: 6 equal-area image blocks.
2. Bright bin. 2 of 8 blocks: 25 percent. Value: 2 equal-area image blocks.</desc><defs><marker id="teaching-64-65-73-69-67-6e-2d-30-30-39-v-31-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-64-65-73-69-67-6e-2d-30-30-39-v-31-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-64-65-73-69-67-6e-2d-30-30-39-v-31-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="773" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="92" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Bar plot</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="543" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">The histogram keeps these counts</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="519" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Zero baseline; bar lengths use the supplied values.</text><text x="35" y="212.96" font-size="24" font-weight="700" fill="#231f20" textLength="353" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Unit: equal-area image blocks</text><text x="42.5" y="258.96" font-size="24" font-weight="700" fill="#231f20" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">0</text><g data-item-index="0" data-zero-x="50"><text x="35" y="307.04" font-size