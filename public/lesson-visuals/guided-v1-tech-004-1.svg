<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1679" viewBox="0 0 720 1679" role="img" aria-labelledby="teaching-74-65-63-68-2d-30-30-34-v-30-title" aria-describedby="teaching-74-65-63-68-2d-30-30-34-v-30-desc" font-family="Arial, sans-serif" data-format="spatial" data-visual-id="tech-004" data-visual-index="0"><title id="teaching-74-65-63-68-2d-30-30-34-v-30-title">What the wired observer misses</title><desc id="teaching-74-65-63-68-2d-30-30-34-v-30-desc">Two laptop radio attempts produce one packet beyond the AP, visible to a wired observer.
1. Upload laptop. Attempt 1: no acknowledgment; attempt 2: acknowledged
2. Access point. Forwards the packet at t = 3 ms
3. Wired observer. Sees one forwarded copy, not two radio attempts
4. Log server. TCP receives bytes; no TCP retry needed in this case
1 to 2: radio.
2 to 3: one copy.
3 to 4: onward.</desc><defs><marker id="teaching-74-65-63-68-2d-30-30-34-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-65-63-68-2d-30-30-34-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-65-63-68-2d-30-30-34-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker><mask id="teaching-74-65-63-68-2d-30-30-34-v-30-connections-mask" maskUnits="userSpaceOnUse" x="36" y="192" width="648" height="650" style="mask-type:luminance"><rect x="36" y="192" width="648" height="650" fill="#ffffff"/><rect x="126" y="384" width="90" height="90" fill="#000000"/><rect x="304.2" y="384" width="90" height="90" fill="#000000"/><rect x="487.8" y="384" width="90" height="90" fill="#000000"/><rect x="487.8" y="599" width="90" height="90" fill="#000000"/><rect x="142" y="309" width="58" height="58" fill="#000000"/><rect x="320.2" y="309" width="58" height="58" fill="#000000"/><rect x="503.8" y="309" width="58" height="58" fill="#000000"/><rect x="503.8" y="524" width="58" height="58" fill="#000000"/><rect x="362.8" y="529" width="146" height="48" fill="#000000"/></mask></defs><rect width="720" height="1679" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="186" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Spatial diagram</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20