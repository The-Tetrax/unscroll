<svg xmlns="http://www.w3.org/2000/svg" width="720" height="830" viewBox="0 0 720 830" role="img" aria-labelledby="camera-022-title camera-022-description" font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><title id="camera-022-title">Hear the rustle before revealing its source</title><desc id="camera-022-description">A top-view table plan places an empty drawn square left and a paper parcel right. A phone turns in place from left to right. Three lower frames first show only the square, keep the same square during an offscreen rustle, then reveal the parcel. The sound cue is notation, not embedded audio.</desc><defs><clipPath id="camera-022-frame-0" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="656" height="266" rx="0" fill="#ffffff" stroke="none" stroke-width="2.5"></rect></clipPath><clipPath id="camera-022-frame-1" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="208" height="180" rx="0" fill="#ffffff" stroke="none" stroke-width="2.5"></rect></clipPath><clipPath id="camera-022-frame-2" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="208" height="180" rx="0" fill="#ffffff" stroke="none" stroke-width="2.5"></rect></clipPath><clipPath id="camera-022-frame-3" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="208" height="180" rx="0" fill="#ffffff" stroke="none" stroke-width="2.5"></rect></clipPath></defs><rect x="0" y="0" width="720" height="830" rx="0" fill="#f7f4ed" stroke="none" stroke-width="2.5"></rect><text x="32" y="34" font-size="22" font-weight="700" fill="#bc2031" text-anchor="start" data-drawn-text="true">CAMERA 022</text><text x="32" y="73" font-size="26" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="true">Hear the rustle before revealing its source</text><line x1="32" y1="92" x2="688" y2="92" stroke="#231f20" stroke-width="2.5" stroke-dasharray=""></line><text x="32" y="126" font-size="24" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="tru