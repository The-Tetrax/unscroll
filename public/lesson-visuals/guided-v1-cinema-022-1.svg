/line><path d="M 392.6711 184.1085 L 403 178 L 392.6711 171.8915" fill="none" stroke="#bc2031" stroke-width="3.5"></path><text x="30" y="182" font-size="22" font-weight="700" fill="#557986" text-anchor="start" data-drawn-text="true">Start left</text><text x="475" y="182" font-size="22" font-weight="700" fill="#bc2031" text-anchor="start" data-drawn-text="true">Reveal right</text></g><rect x="0" y="0" width="656" height="266" rx="0" fill="none" stroke="#231f20" stroke-width="2.5"></rect></g><text x="32" y="451" font-size="24" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="true">Recorded view: the parcel is absent until the reveal</text><text x="32" y="497" font-size="24" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="true">1 / Hold · 2 s</text><g transform="translate(32 516) rotate(0) scale(1)"><rect x="0" y="0" width="208" height="180" rx="0" fill="#dfc9a9" stroke="none" stroke-width="2.5"></rect><g clip-path="url(#camera-022-frame-1)"><rect x="16" y="29" width="177" height="126" rx="0" fill="#fffdf5" stroke="#231f20" stroke-width="2.5"></rect><rect x="53" y="51" width="100" height="80" rx="0" fill="none" stroke="#231f20" stroke-width="2.5"></rect></g><rect x="0" y="0" width="208" height="180" rx="0" fill="none" stroke="#231f20" stroke-width="2.5"></rect></g><text x="32" y="726" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Only the square</text><text x="32" y="755" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">is visible.</text><text x="256" y="497" font-size="24" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="true">2 / Rustle · 1 s</text><g transform="translate(256 516) rotate(0) scale(1)"><rect x="0" y="0" width="208" height="180" rx="0" fill="#dfc9a9" stroke="none" stroke-width="2.5"></rect><g clip-path="url(#camera-022-frame-2)"><rect x="16" y="29" width="177" height="126" rx="0" fill="#fffdf5" stroke="#231f20" stroke-width="2.5"></rect><rect x="53" y="51" width="100" height="80" rx="0" fill="none" stroke="#231f20" stroke-width="2.5"></rect></g><rect x="0" y="0" width="208" height="180" rx="0" fill="none" stroke="#231f20" stroke-width="2.5"></rect></g><text x="256" y="726" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Source heard</text><text x="256" y="755" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">offscreen.</text><text x="480" y="497" font-size="24" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="true">3 / Reveal · 3 s</text><g transform="translate(480 516) rotate(0) scale(1)"><rect x="0" y="0" width="208" height="180" rx="0" fill="#dfc9a9" stroke="none" stroke-width="2.5"></rect><g clip-path="url(#camera-022-frame-3)"><g transform="translate(29 27) rotate(0) scale(1.18)"><path d="M 8 29 L 104 18 L 125 42 L 119 111 L 5 119 L 0 54 Z" fill="#b98b60" stroke="#231f20" stroke-width="2.5"></path><path d="M 8 29 L 56 54 L 104 18 M 56 54 L 61 115 M 0 54 L 37 81 L 5 119 M 125 42 L 94 79 L 119 111" fill="none" stroke="#231f20" stroke-width="2.5"></path><path d="M 27 43 L 82 32 M 78 96 L 108 91" fill="none" stroke="#e6dfd3" stroke-width="3"></path><line x1="29" y1="110" x2="39" y2="96" stroke="#231f20" stroke-width="2.5" stroke-dasharray=""></line></g></g><rect x="0" y="0" width="208" height="180" rx="0" fill="none" stroke="#231f20" stroke-width="2.5"></rect></g><text x="480" y="726" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Pan right, then</text><text x="480" y="755" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">settle on parcel.</text><line x1="32" y1="774" x2="688" y2="774" stroke="#e6dfd3" stroke-width="2.5" stroke-dasharray=""></line><text x="32" y="801" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Original 6 s sketch. Sound is a cue here, not actual audio.</text></svg>