<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1849" viewBox="0 0 720 1849" role="img" aria-labelledby="teaching-74-65-63-68-2d-30-30-35-v-30-title" aria-describedby="teaching-74-65-63-68-2d-30-30-35-v-30-desc" font-family="Arial, sans-serif" data-format="spatial" data-visual-id="tech-005" data-visual-index="0"><title id="teaching-74-65-63-68-2d-30-30-35-v-30-title">The intended portal path</title><desc id="teaching-74-65-63-68-2d-30-30-35-v-30-desc">Tablet, AP, router, DNS resolver, and portal have separate connectivity roles.
1. Tablet. 10:01: no usable leased IPv4 configuration
2. Access point. 10:00: association and wireless authorization complete
3. Router. Forwards between networks after usable configuration
4. DNS resolver. Answers the portal-name query
5. Portal server. Must return the requested training page
1 to 2: wireless.
2 to 3: onward.
3 to 4: name query.
3 to 5: portal request.</desc><defs><marker id="teaching-74-65-63-68-2d-30-30-35-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-65-63-68-2d-30-30-35-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-65-63-68-2d-30-30-35-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker><mask id="teaching-74-65-63-68-2d-30-30-35-v-30-connections-mask" maskUnits="userSpaceOnUse" x="36" y="192" width="648" height="650" style="mask-type:luminance"><rect x="36" y="192" width="648" height="650" fill="#ffffff"/><rect x="131.4" y="375.4" width="90" height="90" fill="#000000"/><rect x="309.6" y="375.4" width="90" height="90" fill="#000000"/><rect x="487.8" y="375.4" width="90" height="90" fill="#000000"/><rect x="309.6" y="599" width="90" height="90" fill="#000000"/><rect x="487.8" y="599" width="90" height="90" fill="#000000"/><rect x="147.4" y="300.4" width="58" height="58" fill="#000000"/><rect x="325.6" y="300.4" width="58" height="58" fill="#000000"/><rect x="503.8" y="300.4" width="58" height="58" fill="#000000"/><rect x="325.6" y="524" width="58" height="58" fill="#000000"/><rect x="503.8" y="524" width="58" height="58" fill="#000000"/><rect x="200.4" y="305.4" width="95" height="48" fill="#000000"/><rect x="556.8" y="305.4" width="100" height="48" fill="#000000"/></mask></defs><rect width="720" height="1849" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.