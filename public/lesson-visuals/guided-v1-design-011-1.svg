<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="design-type-011-title" aria-describedby="design-type-011-desc" focusable="false">
<title id="design-type-011-title">A darker blank is still blank</title>
<desc id="design-type-011-desc">Two featureless rectangular source patches have identical geometry: #FFFFFF before and #BBBBBB after lowering the tone. Neither contains a fold. Below, two folded-program drawings keep identical crisp polygon boundaries. The soft pair is #666666 and #AAAAAA; the harder pair is #222222 and #DDDDDD. Tonal separation changes without changing edge sharpness.</desc>
<rect x="0" y="0" width="720" height="720" rx="0" fill="#F7F4ED" stroke="none" stroke-width="2"/>
<g aria-hidden="true">
<text x="32" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#231F20">A darker blank is still blank</text>
<line x1="32" y1="80" x2="688" y2="80" stroke="#AAA398" stroke-width="2"/>
<text x="56" y="129" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Blank source patch</text><text x="400" y="129" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Lowered blank patch</text><rect x="56" y="156" width="256" height="160" rx="0" fill="#FFFFFF" stroke="#AAA398" stroke-width="2"/><rect x="400" y="156" width="256" height="160" rx="0" fill="#BBBBBB" stroke="#AAA398" stroke-width="2"/><line x1="334" y1="236" x2="376" y2="236" stroke="#BC2031" stroke-width="2"/><path d="M 367.34 231 L 376 236 L 367.34 241" fill="none" stroke="#BC2031" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="184" y="356" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#231F20">#FFFFFF</text><text x="528" y="356" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#231F20">#BBBBBB</text><text x="56" y="413" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Soft tonal separation</text><text x="400" y="413" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Hard tonal separation</text><path d="M 56 472 L 178 442 V 580 L 56 598 Z" fill="#666666" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 178 442 L 300 472 V 598 L 178 580 Z" fill="#AAAAAA" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 400 472 L 522 442 V 580 L 400 598 Z" fill="#222222" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 522 442 L 644 472 V 598 L 522 580 Z" fill="#DDDDDD" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="178" y="642" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#231F20">#666666 / #AAAAAA</text><text x="522" y="642" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#231F20">#222222 / #DDDDDD</text><text x="40" y="686" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Same sharp edge; different tonal separation.</text>
</g></svg>