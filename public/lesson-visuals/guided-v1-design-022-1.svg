<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="design-type-022-title" aria-describedby="design-type-022-desc" focusable="false">
<title id="design-type-022-title">Give display, body and folio distinct jobs</title>
<desc id="design-type-022-desc">A chapbook page uses Georgia 64 px for Small Rain, Arial 32 px for The roof holds yesterday&apos;s rain., and Arial 24 px for folio 12. Callouts identify actual title, body and page number. Below, the same title appears in Arial bold and Georgia regular at 44 px, labeled sans serif and serif. These are real system-font specimens; only the title family changes in the proposed alternative.</desc>
<rect x="0" y="0" width="720" height="720" rx="0" fill="#F7F4ED" stroke="none" stroke-width="2"/>
<g aria-hidden="true">
<text x="32" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#231F20">Give display, body and folio distinct jobs</text>
<line x1="32" y1="80" x2="688" y2="80" stroke="#AAA398" stroke-width="2"/>
<rect x="48" y="137" width="624" height="371" rx="0" fill="#FFFFFF" stroke="#AAA398" stroke-width="2"/><text x="88" y="238" font-family="Georgia, serif" font-size="64" font-weight="400" text-anchor="start" fill="#231F20">Small Rain</text><text x="88" y="321" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#231F20">The roof holds</text><text x="88" y="365" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#231F20">yesterday&apos;s rain.</text><text x="624" y="478" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="end" fill="#231F20">12</text><text x="511" y="190" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Display</text><path d="M 500 196 L 442 209" fill="none" stroke="#BC2031" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="528" y="325" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Body</text><path d="M 514 320 H 399" fill="none" stroke="#BC2031" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="495" y="477" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Folio</text><line x1="553" y1="469" x2="590" y2="469" stroke="#BC2031" stroke-width="2"/><path d="M 581.34 464 L 590 469 L 581.34 474" fill="none" stroke="#BC2031" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="40" y="553" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Title-only alternative; keep the body unchanged.</text><text x="48" y="598" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Arial: sans serif</text><text x="384" y="598" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Georgia: serif</text><text x="48" y="660" font-family="Arial, sans-serif" font-size="44" font-weight="700" text-anchor="start" fill="#231F20">Small Rain</text><text x="384" y="660" font-family="Georgia, serif" font-size="44" font-weight="400" text-anchor="start" fill="#231F20">Small Rain</text>
</g></svg>