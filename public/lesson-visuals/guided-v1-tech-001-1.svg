<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1679" viewBox="0 0 720 1679" role="img" aria-labelledby="teaching-74-65-63-68-2d-30-30-31-v-30-title" aria-describedby="teaching-74-65-63-68-2d-30-30-31-v-30-desc" font-family="Arial, sans-serif" data-format="spatial" data-visual-id="tech-001" data-visual-index="0"><title id="teaching-74-65-63-68-2d-30-30-31-v-30-title">Two laptops, one shared channel</title><desc id="teaching-74-65-63-68-2d-30-30-31-v-30-desc">Call and backup laptops share an AP connected to a router.
1. Call laptop. Backoff: 4 slots, then 2; freezes while busy
2. Backup laptop. Occupies this channel for 3 ms
3. Access point. Shares radio airtime with both laptops
4. Router. Wired onward path, not a radio reservation
1 to 3: waiting.
2 to 3: sending.
3 to 4: wired.</desc><defs><marker id="teaching-74-65-63-68-2d-30-30-31-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-65-63-68-2d-30-30-31-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-65-63-68-2d-30-30-31-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker><mask id="teaching-74-65-63-68-2d-30-30-31-v-30-connections-mask" maskUnits="userSpaceOnUse" x="36" y="192" width="648" height="650" style="mask-type:luminance"><rect x="36" y="192" width="648" height="650" fill="#ffffff"/><rect x="142.2" y="362.5" width="90" height="90" fill="#000000"/><rect x="142.2" y="590.4" width="90" height="90" fill="#000000"/><rect x="325.8" y="470" width="90" height="90" fill="#000000"/><rect x="504" y="470" width="90" height="90" fill="#000000"/><rect x="158.2" y="287.5" width="58" height="58" fill="#000000"/><rect x="158.2" y="515.4" width="58" height="58" fill="#000000"/><rect x="341.8" y="395" width="58" height="58" fill="#000000"/><rect x="520" y="395" width="58" height="58" fill="#000000"/><rect x="211.2" y="292.5" width="146" height="48" fill="#000000"/><rect x="573" y="400" width="100" height="48" fill="#000000"/></mask></defs><rect width="720" height="1679" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="186" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Spatial diagram</text