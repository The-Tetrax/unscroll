<svg xmlns="http://www.w3.org/2000/svg" width="720" height="821" viewBox="0 0 720 821" role="img" aria-labelledby="teaching-77-6f-72-6b-2d-30-33-31-v-30-title" aria-describedby="teaching-77-6f-72-6b-2d-30-33-31-v-30-desc" font-family="Arial, sans-serif" data-format="flow" data-visual-id="work-031" data-visual-index="0"><title id="teaching-77-6f-72-6b-2d-30-33-31-v-30-title">Read the highlight change by behavior</title><desc id="teaching-77-6f-72-6b-2d-30-33-31-v-30-desc">Follow art matching Cartography through rendering, fixture tests, and the accessible-name check.
1. Match range. Query art locates the matching letters inside Cartography.
2. Title rendering. Marks the range while preserving the title as literal text.
3. Fixture tests. Normal match, empty query, and punctuation have explicit expected outputs.
4. Specialist question. Does the new markup preserve the accessible name and interaction?</desc><defs><marker id="teaching-77-6f-72-6b-2d-30-33-31-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-6f-72-6b-2d-30-33-31-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-6f-72-6b-2d-30-33-31-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="821" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="57" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Flow</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="607" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Read the highlight change by behavior</text><g data-edge-index="0" data-from="0" data-to="1"><path d="M 60 197 L 60 293" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teaching-77-6f-72-6b-2d-30-33-31-v-30-link)"/></g><g data-edge-index="1" data-from="1" data-to="2"><path d="M 60 352 L 60 417" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teaching-77-6f-72-6b-2d-30-33-31-v-30-link)"/></g><g data-edge-index="2" data-from="2" data-to="3"><path d="M 60 476 L 60 572" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="r