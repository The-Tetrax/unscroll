<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1021" viewBox="0 0 720 1021" role="img" aria-labelledby="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-38-v-30-title" aria-describedby="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-38-v-30-desc" font-family="Arial, sans-serif" data-format="bars" data-visual-id="thinking-038" data-visual-index="0"><title id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-38-v-30-title">Total export duration, not encoder speed alone</title><desc id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-38-v-30-desc">Original export ten minutes, three-times-faster encoding six minutes, and instantaneous encoding floor four minutes.
1. Original export. 2 reading + 6 encoding + 2 writing. Value: 10 minutes per fixed export.
2. Encoding three times faster. 2 reading + 2 encoding + 2 writing. Value: 6 minutes per fixed export.
3. Instant encoding limit. 2 reading + 0 encoding + 2 writing. Value: 4 minutes per fixed export.</desc><defs><marker id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-38-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-38-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-38-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="1021" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="92" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Bar plot</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="640" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Total export duration, not encoder speed</text><text x="35" y="150.28" font-size="32" font-weight="700" fill="#231f20" textLength="87" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">alone</text><text x="35" y="212.88" font-size="22" font-weight="400" fill="#231f20" textLength="519" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Zero baseline; bar lengths use the supplied values.</text><text x="35" y="257.96" font-size="24" font-weight="700" fill="#231f20" textLength="347" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Unit: minutes per fixed export</text><text x="42.5" y="303