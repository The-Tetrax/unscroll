<svg xmlns="http://www.w3.org/2000/svg" width="720" height="831" viewBox="0 0 720 831" role="img" aria-labelledby="teaching-6f-62-73-65-72-76-65-72-2d-30-30-37-v-30-title" aria-describedby="teaching-6f-62-73-65-72-76-65-72-2d-30-30-37-v-30-desc" font-family="Arial, sans-serif" data-format="dialogue" data-visual-id="observer-007" data-visual-index="0"><title id="teaching-6f-62-73-65-72-76-65-72-2d-30-30-37-v-30-title">From acknowledgment to confirmation</title><desc id="teaching-6f-62-73-65-72-76-65-72-2d-30-30-37-v-30-desc">The sketch-walk organizer checks agreement; a participant first needs to check a bus, then confirms.
1. Organizer. For Saturday at eight, please reply yes, no, or still checking. Writing is fine.
2. Participant. I heard the plan. I am still checking my bus.
3. Later written reply. The bus works. Yes, I can meet at eight on Saturday.</desc><defs><marker id="teaching-6f-62-73-65-72-76-65-72-2d-30-30-37-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6f-62-73-65-72-76-65-72-2d-30-30-37-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6f-62-73-65-72-76-65-72-2d-30-30-37-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="831" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="106" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Dialogue</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="603" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">From acknowledgment to confirmation</text><circle cx="79" cy="168" r="22" fill="#231f20" stroke="#231f20" stroke-width="3"/><text x="71.5" y="175.96" font-size="24" font-weight="700" fill="#f7f4ed" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">1</text><text x="119" y="172.04" font-size="26" font-weight="700" fill="#231f20" textLength="127" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Organizer</text><g data-turn-index="0" data-side="left"><path d="M 78 203 H 465 Q 487 203 487 225  L 487 314 Q 487 336 465 336 H 78 Q 56 336 56 314 L 56 315 L 38 322 L 56 295 L 56 225 Q 56 203 78 203 Z" fil