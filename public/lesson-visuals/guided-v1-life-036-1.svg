<svg xmlns="http://www.w3.org/2000/svg" width="720" height="742" viewBox="0 0 720 742" role="img" aria-labelledby="teaching-6c-69-66-65-2d-30-33-36-v-30-title" aria-describedby="teaching-6c-69-66-65-2d-30-33-36-v-30-desc" font-family="Arial, sans-serif" data-format="timeline" data-visual-id="life-036" data-visual-index="0"><title id="teaching-6c-69-66-65-2d-30-33-36-v-30-title">The itinerary supplies the packing questions</title><desc id="teaching-6c-69-66-65-2d-30-33-36-v-30-desc">Friday train travel and hostel sleep are followed by a Saturday sketch walk and indoor workshop.
1. Friday: train. Required ticket in an accessible format.
2. Friday: hostel. Sleep and washing items; confirm towel provision.
3. Saturday: sketch walk. Sketchbook, pencil, and suitable clothing.
4. Saturday: workshop. Check instructions; reuse drawing materials where suitable.</desc><defs><marker id="teaching-6c-69-66-65-2d-30-33-36-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6c-69-66-65-2d-30-33-36-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6c-69-66-65-2d-30-33-36-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="742" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="101" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Timeline</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="530" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">The itinerary supplies the packing</text><text x="35" y="150.28" font-size="32" font-weight="700" fill="#231f20" textLength="153" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">questions</text><text x="35" y="212.88" font-size="22" font-weight="400" fill="#231f20" textLength="531" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Event order only; spacing is not proportional to time.</text><g data-time-spacing="ordinal"><path d="M 262 264 L 262 564" fill="none" stroke="#69635f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g data-item-index="0"><text x="35" y="274.04" font-size="26" font-weight="700" fill="#231f20" te