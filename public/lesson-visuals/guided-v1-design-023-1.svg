<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="design-type-023-title" aria-describedby="design-type-023-desc" focusable="false">
<title id="design-type-023-title">Read the date, not just the heading</title>
<desc id="design-type-023-desc">Two original repair-workshop samples use the exact same opaque #FFFFFF background. Both headings stay dark; the date Saturday 14 November and venue Library room change from #777777 to #595959 at the same enlarged display size. Their calculated opaque sRGB contrast ratios are approximately 4.478:1 and 7.005:1. The first is below the ordinary-text 4.5:1 threshold using the unrounded calculation. Sample enlargement does not redefine the large-text threshold or establish overall accessibility.</desc>
<rect x="0" y="0" width="720" height="720" rx="0" fill="#F7F4ED" stroke="none" stroke-width="2"/>
<g aria-hidden="true">
<text x="32" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#231F20">Read the date, not just the heading</text>
<line x1="32" y1="80" x2="688" y2="80" stroke="#AAA398" stroke-width="2"/>
<text x="40" y="119" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Both detail samples are on #FFFFFF.</text><rect x="40" y="142" width="640" height="184" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="64" y="188" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#231F20">Repair workshop</text><text x="64" y="238" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#777777">Saturday 14 November</text><text x="64" y="282" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#777777">Library room</text><text x="48" y="362" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#231F20">#777777: 4.478:1 (below 4.5:1)</text><rect x="40" y="380" width="640" height="184" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"/><text x="64" y="426" font-family="Arial, sans-serif" font-size="32" font-weight="700" text-anchor="start" fill="#231F20">Repair workshop</text><text x="64" y="476" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#595959">Saturday 14 November</text><text x="64" y="520" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#595959">Library room</text><text x="48" y="600" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#231F20">#595959: 7.005:1 (above 4.5:1)</text><text x="40" y="651" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Enlarged samples. Ratios use opaque sRGB.</text><text x="40" y="684" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Judge the ordinary-text threshold before rounding.</text>
</g></svg>