<svg xmlns="http://www.w3.org/2000/svg" width="720" height="509" viewBox="0 0 720 509" role="img" aria-labelledby="teaching-70-65-6f-70-6c-65-2d-30-33-38-v-30-title" aria-describedby="teaching-70-65-6f-70-6c-65-2d-30-33-38-v-30-desc" font-family="Arial, sans-serif" data-format="comparison" data-visual-id="people-038" data-visual-index="0"><title id="teaching-70-65-6f-70-6c-65-2d-30-33-38-v-30-title">Two proposed splits of the same total</title><desc id="teaching-70-65-6f-70-6c-65-2d-30-33-38-v-30-desc">An equal split is 90 dollars each; a negotiated room premium makes the shares 100 dollars and 80 dollars, both totaling 180.
1. Equal shares. $90 + $90 = $180. Treat both people as sharing the rental equally.
