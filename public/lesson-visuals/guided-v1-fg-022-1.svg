<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1864" viewBox="0 0 720 1864" role="img" aria-labelledby="teaching-66-67-2d-30-32-32-v-30-title" aria-describedby="teaching-66-67-2d-30-32-32-v-30-desc" font-family="Arial, sans-serif" data-format="spatial" data-visual-id="fg-022" data-visual-index="0"><title id="teaching-66-67-2d-30-32-32-v-30-title">The title field, Save, and Cancel form the active loop</title><desc id="teaching-66-67-2d-30-32-32-v-30-desc">Rename clip opens into the title field. Tab cycles through title, Save, and Cancel; Cancel closes and returns to the opener.
1. Rename clip opener. Outside modal; usual return destination.
2. Title field. Initial focus for this short form.
3. Save. Second Tab stop in this plan.
4. Cancel. Last Tab stop; also closes the dialog.
1 to 2: open.
2 to 3: Tab.
3 to 4: Tab.
4 to 2: Tab wraps.
4 to 1: close and return.</desc><defs><marker id="teaching-66-67-2d-30-32-32-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-66-67-2d-30-32-32-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-66-67-2d-30-32-32-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker><mask id="teaching-66-67-2d-30-32-32-v-30-connections-mask" maskUnits="userSpaceOnUse" x="36" y="237" width="648" height="650" style="mask-type:luminance"><rect x="36" y="237" width="648" height="650" fill="#ffffff"/><rect x="142.2" y="515" width="90" height="90" fill="#000000"/><rect x="315" y="377.4" width="90" height="90" fill="#000000"/><rect x="487.8" y="515" width="90" height="90" fill="#000000"/><rect x="315" y="652.6" width="90" height="90" fill="#000000"/><rect x="158.2" y="440" width="58" height="58" fill="#000000"/><rect x="331" y="302.4" width="58" height="58" fill="#000000"/><rect x="503.8" y="440" width="58" height="58" fill="#000000"/><rect x="331" y="577.6" width="58" height="58" fill="#000000"/><rect x="384" y="307.4" width="127" height="48" fill="#000000"/><rect x="556.8" y="445" width="81" height="48" fill="#000000"/><rect x="384" y="582.6" width="103" height="48" fill="#000000"/></mask></defs><rect width="720" height="1864" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="186" lengthAdjust="spacingAndGlyphs"