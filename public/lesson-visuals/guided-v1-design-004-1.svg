<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="design-type-004-title" aria-describedby="design-type-004-desc" focusable="false">
<title id="design-type-004-title">Which blue is warmer than which?</title>
<desc id="design-type-004-desc">An original railway-platform drawing uses violet-blue #5869A8 for its roof, green-blue #297E91 for the puddle, and amber #D79A45 for the hanging shelter lamp. Three adjacent chips repeat these exact colors. The roof blue is redder relative to the puddle blue; both are cool relative to the lamp.</desc>
<rect x="0" y="0" width="720" height="720" rx="0" fill="#F7F4ED" stroke="none" stroke-width="2"/>
<g aria-hidden="true">
<text x="32" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#231F20">Which blue is warmer than which?</text>
<line x1="32" y1="80" x2="688" y2="80" stroke="#AAA398" stroke-width="2"/>
<text x="40" y="120" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Compare the roof, the puddle and the lamp.</text><path d="M 76 274 L 172 182 H 558 L 654 274 Z" fill="#5869A8" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="136" y1="274" x2="136" y2="402" stroke="#5869A8" stroke-width="12"/><line x1="598" y1="274" x2="598" y2="402" stroke="#5869A8" stroke-width="12"/><line x1="64" y1="405" x2="664" y2="405" stroke="#231F20" stroke-width="3"/><line x1="474" y1="274" x2="474" y2="296" stroke="#231F20" stroke-width="3"/><circle cx="474" cy="319" r="23" fill="#D79A45" stroke="none" stroke-width="2"/><line x1="228" y1="352" x2="396" y2="352" stroke="#231F20" stroke-width="6"/><line x1="228" y1="365" x2="396" y2="365" stroke="#231F20" stroke-width="6"/><line x1="248" y1="369" x2="248" y2="402" stroke="#231F20" stroke-width="4"/><line x1="376" y1="369" x2="376" y2="402" stroke="#231F20" stroke-width="4"/><path d="M 102 434 C 162 417 224 421 268 434 C 326 427 388 438 417 453 C 347 474 229 463 184 468 C 113 463 77 451 102 434 Z" fill="#297E91" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="76" y1="306" x2="60" y2="341" stroke="#297E91" stroke-width="2"/><line x1="104" y1="306" x2="88" y2="341" stroke="#297E91" stroke-width="2"/><line x1="634" y1="306" x2="618" y2="341" stroke="#297E91" stroke-width="2"/><line x1="662" y1="306" x2="646" y2="341" stroke="#297E91" stroke-width="2"/><text x="152" y="514" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#231F20">Roof</text><text x="360" y="514" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#231F20">Puddle</text><text x="568" y="514" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#231F20">Lamp</text><rect x="48" y="534" width="208" height="64" rx="0" fill="#5869A8" stroke="none" stroke-width="2"/><text x="152" y="635" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#231F20">#5869A8</text><rect x="256" y="534" width="208" height="64" rx="0" fill="#297E91" stroke="none" stroke-width="2"/><text x="360" y="635" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#231F20">#297E91</text><rect x="464" y="534" width="208" height="64" rx="0" fill="#D79A45" stroke="none" stroke-width="2"/><text x="568" y="635" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#231F20">#D79A45</text><text x="40" y="682" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Relative hue, not a fixed emotional code.</text>
</g></svg>