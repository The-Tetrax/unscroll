1. Known background. Last year: 1,500 rupees for the room alone. Equipment excluded.
2. Missing answer. This year’s room-and-equipment quote has not been received.
3. Feasible follow-up. Ask the venue; update Friday’s shared note even if the quote remains unconfirmed.</desc><defs><marker id="teaching-73-70-65-61-6b-65-72-2d-30-31-35-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-73-70-65-61-6b-65-72-2d-30-31-35-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-73-70-65-61-6b-65-72-2d-30-31-35-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="697" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="57" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Flow</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="482" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Keep the quote’s status visible</text><g data-edge-index="0" data-from="0" data-to="1"><path d="M 60 197 L 60 293" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teaching-73-70-65-61-6b-65-72-2d-30-31-35-v-30-link)"/></g><g data-edge-index="1" data-from="1" data-to="2"><path d="M 60 352 L 60 448" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teaching-73-70-65-61-6b-65-72-2d-30-31-35-v-30-link)"/></g><g data-node-index="0"><circle cx="60" cy="168" r="22" fill="#231f20" stroke="#231f20"