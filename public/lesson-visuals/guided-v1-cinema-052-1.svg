<svg xmlns="http://www.w3.org/2000/svg" width="720" height="847" viewBox="0 0 720 847" role="img" aria-labelledby="teaching-63-69-6e-65-6d-61-2d-30-35-32-v-30-title" aria-describedby="teaching-63-69-6e-65-6d-61-2d-30-35-32-v-30-desc" font-family="Arial, sans-serif" data-format="layers" data-visual-id="cinema-052" data-visual-index="0"><title id="teaching-63-69-6e-65-6d-61-2d-30-35-32-v-30-title">Priority during the blue-parcel instruction</title><desc id="teaching-63-69-6e-65-6d-61-2d-30-35-32-v-30-desc">The essential spoken instruction sits above wrapping paper and room background, with a check on their combined output.
1. Instruction. The blue parcel stays here. Preserve the identifying words.
2. Wrapping paper. Lower during speech or perform between phrases.
3. Room background. Maintain the space without demanding attention.
4. Combined output. Check clarity and peaks together at comfortable volume.</desc><defs><marker id="teaching-63-69-6e-65-6d-61-2d-30-35-32-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-63-69-6e-65-6d-61-2d-30-35-32-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-63-69-6e-65-6d-61-2d-30-35-32-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="847" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="80" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Layers</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="636" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Priority during the blue-parcel instruction</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="556" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Stacked schematic; spacing is not a time or size scale.</text><path d="M 46 233 L 46 653" fill="none" stroke="#69635f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 7"/><g data-layer-index="0"><path d="M 46 233 L 66 233" fill="none" stroke="#69635f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 66 203 H 221 L 247 225 H 92 Z" fill="#f7f4ed" stroke="#231f20" stroke-width="3" stroke-lineca