<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1624" viewBox="0 0 720 1624" role="img" aria-labelledby="teaching-74-65-63-68-2d-30-33-34-v-30-title" aria-describedby="teaching-74-65-63-68-2d-30-33-34-v-30-desc" font-family="Arial, sans-serif" data-format="spatial" data-visual-id="tech-034" data-visual-index="0"><title id="teaching-74-65-63-68-2d-30-33-34-v-30-title">A read reaches the replica before its update</title><desc id="teaching-74-65-63-68-2d-30-33-34-v-30-desc">The client writes Tuesday to the primary but reads Monday from the lagging replica.
1. Rota client. Write acknowledged at 100 ms; replica read at 140 ms
2. Primary write path. Version 13: Tuesday
3. Read replica. Version 12 Monday until update applied at 220 ms
1 to 2: write.
1 to 3: read at 140 ms.
2 to 3: async update.</desc><defs><marker id="teaching-74-65-63-68-2d-30-33-34-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-65-63-68-2d-30-33-34-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-65-63-68-2d-30-33-34-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker><mask id="teaching-74-65-63-68-2d-30-33-34-v-30-connections-mask" maskUnits="userSpaceOnUse" x="36" y="237" width="648" height="650" style="mask-type:luminance"><rect x="36" y="237" width="648" height="650" fill="#ffffff"/><rect x="142.2" y="420.4" width="90" height="90" fill="#000000"/><rect x="477" y="420.4" width="90" height="90" fill="#000000"/><rect x="477" y="644" width="90" height="90" fill="#000000"/><rect x="158.2" y="345.4" width="58" height="58" fill="#000000"/><rect x="493" y="345.4" width="58" height="58" fill="#000000"/><rect x="493" y="569" width="58" height="58" fill="#000000"/><rect x="211.2" y="350.4" width="146" height="48" fill="#000000"/></mask></defs><rect width="720" height="1624" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="186" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Spatial diagram</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="571" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">A read reaches the replica before its</