<svg xmlns="http://www.w3.org/2000/svg" width="720" height="840" viewBox="0 0 720 840" role="img" aria-labelledby="light-edit-034-title light-edit-034-desc" font-family="Arial" font-size="22"><title id="light-edit-034-title">Redesign the shot, not the wiring</title><desc id="light-edit-034-desc">A top-view desk plan shows an intact lamp and an existing socket along the rear wall. Its cord stays behind the desk. The supported phone and notebook are on the desk, while a wide walking route to the exit stays clear. A separate daylight drawing is the alternative when equipment suitability is uncertain. The plan is not a clearance or electrical specification. If suitability is uncertain, stop and choose daylight. All objects are original schematic drawings, not photographed frames. Colors and spacing are illustrative, not measurements.</desc><metadata>Source: original UNSCROLL vector artwork. No external media, film stills, or third-party characters.</metadata><defs></defs><rect x="0" y="0" width="720" height="840" rx="0" fill="#f5efe5" stroke="none" stroke-width="2"/><text x="34" y="44" font-size="22" font-weight="700" fill="#a92c3b" textLength="149.808" lengthAdjust="spacingAndGlyphs">CINEMA / 034</text><text x="34" y="88" font-size="26" font-weight="700" fill="#272322" textLength="418.692" lengthAdjust="spacingAndGlyphs">Redesign the shot, not the wiring</text><path d="M32 112 L688 112" fill="none" stroke="#cfc4b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="164" font-size="24" font-weight="700" fill="#272322" textLength="481.834" lengthAdjust="spacingAndGlyphs">Existing arrangement: keep the exit clear</text><rect x="40" y="185" width="640" height="260" rx="3" fill="#e6ded0" stroke="#a79780" stroke-width="2"/><path d="M54 204 L662 204" fill="none" stroke="#817565" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M183 249V219H609V250" fill="none" stroke="#272322" stroke-width="4" stroke-linecap="round" strok