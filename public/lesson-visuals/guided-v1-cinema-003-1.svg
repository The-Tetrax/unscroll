><rect x="0" y="0" width="314" height="256" rx="0" fill="none" stroke="#231f20" stroke-width="2.5"></rect></g><text x="32" y="432" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Bag beside the doorway.</text><text x="374" y="432" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Hand opens the red pocket.</text><text x="32" y="477" font-size="24" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="true">3 / What is missing?  2 s</text><g transform="translate(32 495) rotate(0) scale(1)"><rect x="0" y="0" width="656" height="221" rx="0" fill="#e6dfd3" stroke="none" stroke-width="2.5"></rect><g clip-path="url(#camera-003-frame-2)"><rect x="0" y="157" width="656" height="90" rx="0" fill="#557986" stroke="none" stroke-width="2.5"></rect><rect x="139" y="173" width="251" height="67" rx="0" fill="#bc2031" stroke="#231f20" stroke-width="2.5"></rect><g transform="translate(197 17) rotate(0) scale(1.55)"><path d="M 0 6 L 102 6 L 102 120 L 0 120 Z" fill="#fffdf5" stroke="#231f20" stroke-width="2.5"></path><path d="M 0 6 Q 51 28 102 6 L 102 26 Q 51 45 0 26 Z" fill="#e6dfd3" stroke="#231f20" stroke-width="2.5"></path><path d="M 0 6 Q 51 -8 102 6 Q 51 28 0 6 Z" fill="#354d59" stroke="#231f20" stroke-width="2.5"></path><line x1="8" y1="39" x2="8" y2="110" stroke="#69635f" stroke-width="2.5" stroke-dasharray=""></line><text x="51" y="80" font-size="25" font-weight="700" fill="#231f20" text-anchor="middle" data-drawn-text="true">PASS</text></g><line x1="493" y1="60" x2="357" y2="33" stroke="#bc2031" stroke-width="2.5" stroke-dasharray=""></line><path d="M 368.3207 29.0198 L 357 33 L 365.9417 41.0029" fill="none" stroke="#bc2031" stroke-width="3.5"></path><text x="424" y="98" font-size="24" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Open mouth.</text><text x="424" y="127" font-size="24" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">No pass inside.</text></g><rect x="0" y="0" width="656" height="221" rx="0" fill="none" stroke="#231f20" stroke-width="2.5"></rect></g><line x1="32" y1="726" x2="688" y2="726" stroke="#e6dfd3" stroke-width="2.5" stroke-dasharray=""></line><text x="32" y="753" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">The teal bag, red pocket and PASS sleeve stay identifiable.</text><text x="32" y="782" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Original 7 s storyboard, not a compulsory three-shot formula.</text><text x="32" y="811" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Add a closer view only when it supplies needed information.</text></svg>