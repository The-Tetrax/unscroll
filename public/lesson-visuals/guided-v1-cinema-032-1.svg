<svg xmlns="http://www.w3.org/2000/svg" width="720" height="840" viewBox="0 0 720 840" role="img" aria-labelledby="light-edit-032-title light-edit-032-desc" font-family="Arial" font-size="22"><title id="light-edit-032-title">Check moving bands in saved playback</title><desc id="light-edit-032-desc">Three successive schematic views of the same instruction card under a room lamp show a dark horizontal band at different heights. A second row, recorded in daylight with optional lamps off, has three stable cards. A single still cannot diagnose flicker; compare saved clips over time. These are schematic playback samples, not measured frames. Use supported timing tests or the daylight alternative. All objects are original schematic drawings, not photographed frames. Colors and spacing are illustrative, not measurements.</desc><metadata>Source: original UNSCROLL vector artwork. No external media, film stills, or third-party characters.</metadata><defs><linearGradient id="light-edit-032-band-edge" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#fffdf7"/><stop offset="40%" stop-color="#9c978f"/><stop offset="60%" stop-color="#9c978f"/><stop offset="100%" stop-color="#fffdf7"/></linearGradient></defs><rect x="0" y="0" width="720" height="840" rx="0" fill="#f5efe5" stroke="none" stroke-width="2"/><text x="34" y="44" font-size="22" font-weight="700" fill="#a92c3b" textLength="149.808" lengthAdjust="spacingAndGlyphs">CINEMA / 032</text><text x="34" y="88" font-size="26" font-weight="700" fill="#272322" textLength="497.844" lengthAdjust="spacingAndGlyphs">Check moving bands in saved playback</text><path d="M32 112 L688 112" fill="none" stroke="#cfc4b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="164" font-size="24" font-weight="700" fill="#272322" textLength="299.022" lengthAdjust="spacingAndGlyphs">A: room lamp, then replay</text><path d="M480 159 L664 159" fill="none" stroke="#625b54" stroke-width="3" stroke-linecap="round" s