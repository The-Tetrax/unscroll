<svg xmlns="http://www.w3.org/2000/svg" width="720" height="773" viewBox="0 0 720 773" role="img" aria-labelledby="teaching-6c-69-66-65-2d-30-32-34-v-30-title" aria-describedby="teaching-6c-69-66-65-2d-30-32-34-v-30-desc" font-family="Arial, sans-serif" data-format="bars" data-visual-id="life-024" data-visual-index="0"><title id="teaching-6c-69-66-65-2d-30-32-34-v-30-title">Energy over the same five hours</title><desc id="teaching-6c-69-66-65-2d-30-32-34-v-30-desc">Monitor A uses 0.5 kilowatt-hours and Monitor B uses 0.3 under the stated constant-power assumptions.
