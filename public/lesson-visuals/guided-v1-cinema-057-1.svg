<svg xmlns="http://www.w3.org/2000/svg" width="720" height="523" viewBox="0 0 720 523" role="img" aria-labelledby="teaching-63-69-6e-65-6d-61-2d-30-35-37-v-30-title" aria-describedby="teaching-63-69-6e-65-6d-61-2d-30-35-37-v-30-desc" font-family="Arial, sans-serif" data-format="comparison" data-visual-id="cinema-057" data-visual-index="0"><title id="teaching-63-69-6e-65-6d-61-2d-30-35-37-v-30-title">The same source-reveal question in two plans</title><desc id="teaching-63-69-6e-65-6d-61-2d-30-35-37-v-30-desc">The zipper precedes its bag reveal in one plan and follows it in the other.
1. Zipper before reveal. Doorway view, unseen zipper, then cut to the bag.
2. Bag before zipper. Bag visible first; its source is known when the zipper sounds.</desc><defs><marker id="teaching-63-69-6e-65-6d-61-2d-30-35-37-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-63-69-6e-65-6d-61-2d-30-35-37-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-63-69-6e-65-6d-61-2d-30-35-37-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="523" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="144" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Comparison</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="630" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">The same source-reveal question in two</text><text x="35" y="150.28" font-size="32" font-weight="700" fill="#231f20" textLength="85" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">plans</text><g data-item-index="0" data-column="0"><circle cx="55" cy="213" r="22" fill="#231f20" stroke="#231f20" stroke-width="3"/><text x="47.5" y="220.96" font-size="24" font-weight="700" fill="#f7f4ed" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">1</text><path d="M 90 213 L 336 213" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="41" y="283.04" font-size="26" 