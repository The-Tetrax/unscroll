<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="design-type-005-title" aria-describedby="design-type-005-desc" focusable="false">
<title id="design-type-005-title">Give each invitation color a job</title>
<desc id="design-type-005-desc">A seed-swap invitation has a #F5EBDD cream field. SEED SWAP, Saturday at 11, and Community room are all dark green #243F35. Three small terracotta #C55A30 seeds supply an optional accent. Covering those seeds does not remove any event information. Adjacent chips repeat the three role colors.</desc>
<rect x="0" y="0" width="720" height="720" rx="0" fill="#F7F4ED" stroke="none" stroke-width="2"/>
<g aria-hidden="true">
<text x="32" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#231F20">Give each invitation color a job</text>
<line x1="32" y1="80" x2="688" y2="80" stroke="#AAA398" stroke-width="2"/>
<rect x="64" y="128" width="592" height="372" rx="0" fill="#F5EBDD" stroke="#243F35" stroke-width="2"/><text x="100" y="213" font-family="Arial, sans-serif" font-size="54" font-weight="700" text-anchor="start" fill="#243F35">SEED SWAP</text><line x1="104" y1="243" x2="610" y2="243" stroke="#243F35" stroke-width="2"/><text x="104" y="300" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#243F35">Saturday at 11</text><text x="104" y="346" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#243F35">Community room</text><path d="M 522 425 C 494 416 495 376 532 364 C 546 396 541 418 522 425 Z" fill="#C55A30" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 554 446 C 535 427 550 396 586 400 C 584 433 573 448 554 446 Z" fill="#C55A30" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 589 381 C 568 368 577 339 609 338 C 614 365 605 382 589 381 Z" fill="#C55A30" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="152" y="544" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#231F20">Field</text><text x="360" y="544" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#231F20">Essential words</text><text x="568" y="544" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#231F20">Seed motif</text><rect x="48" y="564" width="208" height="56" rx="0" fill="#F5EBDD" stroke="none" stroke-width="2"/><text x="152" y="654" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#231F20">#F5EBDD</text><rect x="256" y="564" width="208" height="56" rx="0" fill="#243F35" stroke="none" stroke-width="2"/><text x="360" y="654" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#231F20">#243F35</text><rect x="464" y="564" width="208" height="56" rx="0" fill="#C55A30" stroke="none" stroke-width="2"/><text x="568" y="654" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#231F20">#C55A30</text><text x="40" y="690" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Cover the seeds. Event, time and place remain.</text>
</g></svg>