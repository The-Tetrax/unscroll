<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1069" viewBox="0 0 720 1069" role="img" aria-labelledby="teaching-74-68-69-6e-6b-69-6e-67-2d-30-32-33-v-30-title" aria-describedby="teaching-74-68-69-6e-6b-69-6e-67-2d-30-32-33-v-30-desc" font-family="Arial, sans-serif" data-format="matrix" data-visual-id="thinking-023" data-visual-index="0"><title id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-32-33-v-30-title">Scope by delivery outcome</title><desc id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-32-33-v-30-desc">In-scope and out-of-scope parcels crossed with next-day and late delivery outcomes.
1. In scope / next day. Consistent case; not proof of every case.
2. In scope / late. A verified example refutes the universal promise.
3. Out of scope / next day. Does not extend the stated guarantee.
4. Out of scope / late. Not a counterexample to this bounded claim.</desc><defs><marker id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-32-33-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-32-33-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-32-33-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="1069" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="73" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Matrix</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="427" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Scope by delivery outcome</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="639" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Read the row and column together; numbered cells refer to the</text><text x="35" y="198.88" font-size="22" font-weight="400" fill="#231f20" textLength="43" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">key.</text><rect x="192" y="231" width="496" height="66" rx="0" fill="#ddd7cc" stroke="none" stroke-width="3"/><text x="207" y="267.96" font-size="24" font-weight="700" fill="#231f20" textLength="101" lengthAdjust="spacingAndGlyphs" style="line-height: