<svg xmlns="http://www.w3.org/2000/svg" width="720" height="758" viewBox="0 0 720 758" role="img" aria-labelledby="teaching-74-65-63-68-2d-30-33-36-v-30-title" aria-describedby="teaching-74-65-63-68-2d-30-33-36-v-30-desc" font-family="Arial, sans-serif" data-format="timeline" data-visual-id="tech-036" data-visual-index="0"><title id="teaching-74-65-63-68-2d-30-33-36-v-30-title">demo-42: a timed failure path</title><desc id="teaching-74-65-63-68-2d-30-33-36-v-30-desc">A 30-to-180 ms storage call lies inside the 0-to-200 ms request.
1. 0 ms: request starts. Parent request span begins
2. 30 ms: storage starts. Child storage span begins
3. 180 ms: storage timeout. 150 ms child duration; matching log event
4. 200 ms: error returned. 200 ms parent duration; contributes one failed request</desc><defs><marker id="teaching-74-65-63-68-2d-30-33-36-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-65-63-68-2d-30-33-36-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-65-63-68-2d-30-33-36-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="758" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="101" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Timeline</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="462" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">demo-42: a timed failure path</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="531" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Event order only; spacing is not proportional to time.</text><g data-time-spacing="ordinal"><path d="M 262 219 L 262 580" fill="none" stroke="#69635f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g data-item-index="0"><text x="35" y="229.04" font-size="26" font-weight="700" fill="#231f20" textLength="175" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">0 ms: request</text><text x="35" y="266.04" font-size="26" font-weight="700" fill="#231f20" text