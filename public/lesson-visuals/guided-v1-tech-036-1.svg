stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g data-item-index="3"><text x="35" y="590.04" font-size="26" font-weight="700" fill="#231f20" textLength="172" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">200 ms: error</text><text x="35" y="627.04" font-size="26" font-weight="700" fill="#231f20" textLength="108" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">returned</text><text x="299" y="585.88" font-size="22" font-weight="400" fill="#231f20" textLength="362" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">200 ms parent duration; contributes</text><text x="299" y="616.88" font-size="22" font-weight="400" fill="#231f20" textLength="183" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">one failed request</text><path d="M 262 571 L 271 580 L 262 589 L 253 580 Z" fill="#bc2031" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><path d="M 32 711 L 98 711" fill="none" stroke="#bc2031" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="119" y="717.88" font-size="22" font-weight="400" fill="#69635f" textLength="211" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Explanatory diagram</text></g></svg>