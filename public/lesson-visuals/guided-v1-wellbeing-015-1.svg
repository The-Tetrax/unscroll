<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1539" viewBox="0 0 720 1539" role="img" aria-labelledby="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-31-35-v-30-title" aria-describedby="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-31-35-v-30-desc" font-family="Arial, sans-serif" data-format="spatial" data-visual-id="wellbeing-015" data-visual-index="0"><title id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-31-35-v-30-title">Reserve space for the pointing device</title><desc id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-31-35-v-30-desc">A top-view layout places a mouse beside the keyboard and a drink outside the active input area.
1. Keyboard. Its width affects the available mouse position.
2. Mouse. Beside the keyboard with usable surface space.
3. Drink storage. Outside the active input and cable area.
4. User. Test with the upper arm comfortably near the body.
4 to 2: clear input reach.</desc><defs><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-31-35-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-31-35-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-31-35-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker><mask id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-31-35-v-30-connections-mask" maskUnits="userSpaceOnUse" x="36" y="192" width="648" height="650" style="mask-type:luminance"><rect x="36" y="192" width="648" height="650" fill="#ffffff"/><rect x="261" y="341" width="90" height="90" fill="#000000"/><rect x="477" y="461.4" width="90" height="90" fill="#000000"/><rect x="120.6" y="482.9" width="90" height="90" fill="#000000"/><rect x="304.2" y="616.2" width="90" height="90" fill="#000000"/><rect x="277" y="266" width="58" height="58" fill="#000000"/><rect x="493" y="386.4" width="58" height="58" fill="#000000"/><rect x="136.6" y="407.9" width="58" height="58" fill="#000000"/><rect x="320.2" y="541.2" width="58" height="58" fill="#000000"/><rect x="330" y="271" width="135" height="48" fill="#000000"/><rect x="546" y="391.4" width="100" height="48" fill="#000000"/><rect x="373.2" y="546.2" width="77" height="48" fill="#000000"/></mask></defs><rect width="720" height="1539" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-si