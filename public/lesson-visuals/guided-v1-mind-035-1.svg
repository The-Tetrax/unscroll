<svg xmlns="http://www.w3.org/2000/svg" width="720" height="958" viewBox="0 0 720 958" role="img" aria-labelledby="teaching-6d-69-6e-64-2d-30-33-35-v-30-title" aria-describedby="teaching-6d-69-6e-64-2d-30-33-35-v-30-desc" font-family="Arial, sans-serif" data-format="dialogue" data-visual-id="mind-035" data-visual-index="0"><title id="teaching-6d-69-6e-64-2d-30-33-35-v-30-title">Negotiate the example, not the required skill</title><desc id="teaching-6d-69-6e-64-2d-30-33-35-v-30-desc">A learner asks to use a fictional art-supply table; the tutor allows it while keeping the required sorting checks.
1. Learner. May I practice sorting with an invented art-supply table?
2. Tutor. Yes. Show that each item stays attached to its information.
3. Learner. Then I will test the sort I need for planning materials.</desc><defs><marker id="teaching-6d-69-6e-64-2d-30-33-35-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6d-69-6e-64-2d-30-33-35-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6d-69-6e-64-2d-30-33-35-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="958" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="106" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Dialogue</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="624" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Negotiate the example, not the required</text><text x="35" y="150.28" font-size="32" font-weight="700" fill="#231f20" textLength="60" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">skill</text><circle cx="79" cy="213" r="22" fill="#231f20" stroke="#231f20" stroke-width="3"/><text x="71.5" y="220.96" font-size="24" font-weight="700" fill="#f7f4ed" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">1</text><text x="119" y="217.04" font-size="26" font-weight="700" fill="#231f20" textLength="100" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Learner</text><g data-turn-index="0" data-side="left"><path d="M 78 248 H 369 Q 391 248 39