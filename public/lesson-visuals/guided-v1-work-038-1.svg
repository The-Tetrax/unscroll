<svg xmlns="http://www.w3.org/2000/svg" width="720" height="709" viewBox="0 0 720 709" role="img" aria-labelledby="teaching-77-6f-72-6b-2d-30-33-38-v-30-title" aria-describedby="teaching-77-6f-72-6b-2d-30-33-38-v-30-desc" font-family="Arial, sans-serif" data-format="timeline" data-visual-id="work-038" data-visual-index="0"><title id="teaching-77-6f-72-6b-2d-30-33-38-v-30-title">Four times, three distinct intervals</title><desc id="teaching-77-6f-72-6b-2d-30-33-38-v-30-desc">09:00 failure, 09:06 detection, 09:14 mitigation, and 09:26 recovery leave intervals of 6, 8, and 12 minutes.
1. 09:00 Failure. Job processing fails; the problem is not yet recognized.
2. 09:06 Detection. Alert recognized, 6 minutes after the failure.
3. 09:14 Mitigation. New jobs resume, 8 minutes later; 12 older jobs remain pending.
4. 09:26 Recovery. Older jobs complete and outputs are checked, 12 minutes after mitigation.</desc><defs><marker id="teaching-77-6f-72-6b-2d-30-33-38-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-6f-72-6b-2d-30-33-38-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-6f-72-6b-2d-30-33-38-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="709" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="101" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Timeline</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="531" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Four times, three distinct intervals</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="531" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Event order only; spacing is not proportional to time.</text><g data-time-spacing="ordinal"><path d="M 262 219 L 262 531" fill="none" stroke="#69635f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g data-item-index="0"><text x="35" y="229.04" font-size="26" font-weight="700" fill="#231f20" textLength="169" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">09:00 Failure</text><text x="299" y="224.88" font-size="22" font-weight="400" 