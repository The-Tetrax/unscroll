.</text><path d="M 262 414 L 271 423 L 262 432 L 253 423 Z" fill="#f7f4ed" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g data-item-index="3"><text x="35" y="541.04" font-size="26" font-weight="700" fill="#231f20" textLength="73" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">09:26</text><text x="35" y="578.04" font-size="26" font-weight="700" fill="#231f20" textLength="122" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Recovery</text><text x="299" y="536.88" font-size="22" font-weight="400" fill="#231f20" textLength="371" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Older jobs complete and outputs are</text><text x="299" y="567.88" font-size="22" font-weight="400" fill="#231f20" textLength="375" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">checked, 12 minutes after mitigation.</text><path d="M 262 522 L 271 531 L 262 540 L 253 531 Z" fill="#bc2031" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><path d="M 32 662 L 98 662" fill="none" stroke="#bc2031" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="119" y="668.88" font-size="22" font-weight="400" fill="#69635f" textLength="211" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Explanatory diagram</text></g></svg>