1. Bed frame. The original phone contact made this rattle.
2. Phone. Moved clear of the frame on a stable surface.
3. Sleeping position. Check the result from the usual position.
4. Hallway alarm. Necessary alert remains audible and unchanged.</desc><defs><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-30-33-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-30-33-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-30-33-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker><mask id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-30-33-v-30-connections-mask" maskUnits="userSpaceOnUse" x="36" y="192" width="648" height="650" style="mask-type:luminance"><rect x="36" y="192" width="648" height="650" fill="#ffffff"/><rect x="163.8" y="362.5" width="90" height="90" fill="#000000"/><rect x="433.8" y="362.5" width="90" height="90" fill="#000000"/><rect x="163.8" y="590.4" width="90" height="90" fill="#000000"/><rect x="466.2" y="590.4" width="90" height="90" fill="#000000"/><rect x="179.8" y="287.5" width="58" height="58" fill="#000000"/><rect x="449.8" y="287.5" width="58" height="58" fill="#000000"/><rect x="179.8" y="515.4" width="58" height="58" fill="#000000"/><rect x="482.2" y="515.4" width="58" height="58" fill="#000000"/><rect x="232.8" y="292.5" width="143" height="48" fill="#000000"/><rect x="502.8" y="292.5" width="98" height="48" fill="#000000"/></mask></defs><rect width="720" height="1414" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" fo