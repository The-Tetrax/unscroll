<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1032" viewBox="0 0 720 1032" role="img" aria-labelledby="teaching-66-67-2d-30-30-37-v-30-title" aria-describedby="teaching-66-67-2d-30-30-37-v-30-desc" font-family="Arial, sans-serif" data-format="dialogue" data-visual-id="fg-007" data-visual-index="0"><title id="teaching-66-67-2d-30-30-37-v-30-title">One omitted answer creates another contact</title><desc id="teaching-66-67-2d-30-30-37-v-30-desc">A borrower asks to book and asks where to collect; the desk confirms only the booking, then supplies directions after a repeat.
1. Borrower. Please reserve a camera for Friday. Where do I collect it?
2. Desk. Your Friday booking is confirmed.
3. Borrower. Thanks. Where should I go to collect it?
4. Desk. The rear desk, open Friday from 16:00 to 18:00.</desc><defs><marker id="teaching-66-67-2d-30-30-37-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-66-67-2d-30-30-37-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-66-67-2d-30-30-37-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="1032" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="106" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Dialogue</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="575" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">One omitted answer creates another</text><text x="35" y="150.28" font-size="32" font-weight="700" fill="#231f20" textLength="115" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">contact</text><circle cx="79" cy="213" r="22" fill="#231f20" stroke="#231f20" stroke-width="3"/><text x="71.5" y="220.96" font-size="24" font-weight="700" fill="#f7f4ed" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">1</text><text x="119" y="217.04" font-size="26" font-weight="700" fill="#231f20" textLength="118" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Borrower</text><g data-turn-index="0" data-side="left"><path d="M 78 248 H 379 Q 401 248 401 270  L 401 359 Q 401 381 379