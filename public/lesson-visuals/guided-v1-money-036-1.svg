<svg xmlns="http://www.w3.org/2000/svg" width="720" height="773" viewBox="0 0 720 773" role="img" aria-labelledby="teaching-6d-6f-6e-65-79-2d-30-33-36-v-30-title" aria-describedby="teaching-6d-6f-6e-65-79-2d-30-33-36-v-30-desc" font-family="Arial, sans-serif" data-format="bars" data-visual-id="money-036" data-visual-index="0"><title id="teaching-6d-6f-6e-65-79-2d-30-33-36-v-30-title">Inside the first 50-unit payment</title><desc id="teaching-6d-6f-6e-65-79-2d-30-33-36-v-30-desc">Ten units pay interest and forty reduce principal, together making the fifty-unit payment.
