<svg xmlns="http://www.w3.org/2000/svg" width="720" height="662" viewBox="0 0 720 662" role="img" aria-labelledby="teaching-77-6f-72-6b-2d-30-32-33-v-30-title" aria-describedby="teaching-77-6f-72-6b-2d-30-32-33-v-30-desc" font-family="Arial, sans-serif" data-format="comparison" data-visual-id="work-023" data-visual-index="0"><title id="teaching-77-6f-72-6b-2d-30-32-33-v-30-title">Four recorded test conditions</title><desc id="teaching-77-6f-72-6b-2d-30-32-33-v-30-desc">Baseline times out, raising only its limit permits completion, and restoring the limit restores the timeout.
1. Baseline. Build A; 20 bytes; 100 ms limit: timeout.
2. Changed combination. Build B; 10 bytes; 200 ms limit: completion.
3. Limit-only change. Build A; 20 bytes; 200 ms limit: completion at 150 ms.
4. Baseline restored. Build A; 20 bytes; 100 ms limit: timeout again.</desc><defs><marker id="teaching-77-6f-72-6b-2d-30-32-33-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-6f-72-6b-2d-30-32-33-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-6f-72-6b-2d-30-32-33-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="662" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="144" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Comparison</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="460" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Four recorded test conditions</text><g data-item-index="0" data-column="0"><circle cx="55" cy="168" r="22" fill="#231f20" stroke="#231f20" stroke-width="3"/><text x="47.5" y="175.96" font-size="24" font-weight="700" fill="#f7f4ed" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">1</text><path d="M 90 168 L 336 168" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="41" y="238.04" font-size="26" font-weight="700" fill="#231f20" textLength="111" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Baseline</text><text x="41" y="278.88" font-size="22" font-weight="400" fill="#231f20" textL