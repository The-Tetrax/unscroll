<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1069" viewBox="0 0 720 1069" role="img" aria-labelledby="teaching-74-65-63-68-2d-30-32-32-v-30-title" aria-describedby="teaching-74-65-63-68-2d-30-32-32-v-30-desc" font-family="Arial, sans-serif" data-format="flow" data-visual-id="tech-022" data-visual-index="0"><title id="teaching-74-65-63-68-2d-30-32-32-v-30-title">One accepted job, two possible final outcomes</title><desc id="teaching-74-65-63-68-2d-30-32-32-v-30-desc">J7 runs, then either completes or fails.
1. Accepted. 0 s: HTTP 202 identifies J7
2. Running. 2 s: status GET can return 200 with running
3. Completed. 12 s: result available under the job contract
4. Failed. 12 s: processing ends without the requested result
1 to 2.
2 to 3: success.
2 to 4: failure.</desc><defs><marker id="teaching-74-65-63-68-2d-30-32-32-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-65-63-68-2d-30-32-32-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-65-63-68-2d-30-32-32-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="1069" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="57" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Flow</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="569" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">One accepted job, two possible final</text><text x="35" y="150.28" font-size="32" font-weight="700" fill="#231f20" textLength="154" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">outcomes</text><g data-edge-index="0" data-from="0" data-to="1"><path d="M 96 213 H 48 Q 38 213 38 223 V 327 Q 38 337 48 337 H 96" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teaching-74-65-63-68-2d-30-32-32-v-30-link)"/></g><g data-edge-index="1" data-from="1" data-to="2"><path d="M 96 337 H 59 Q 49 337 49 347 V 451 Q 49 461 59 461 H 96" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teaching-74-65-63-68-2d-3