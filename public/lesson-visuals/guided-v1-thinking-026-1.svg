<svg xmlns="http://www.w3.org/2000/svg" width="720" height="509" viewBox="0 0 720 509" role="img" aria-labelledby="teaching-74-68-69-6e-6b-69-6e-67-2d-30-32-36-v-30-title" aria-describedby="teaching-74-68-69-6e-6b-69-6e-67-2d-30-32-36-v-30-desc" font-family="Arial, sans-serif" data-format="comparison" data-visual-id="thinking-026" data-visual-index="0"><title id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-32-36-v-30-title">Different claims need different support</title><desc id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-32-36-v-30-desc">Popularity is insufficient proof of losslessness; verified restored-data differences would be evidence against exact restoration in a case.
1. Argument not established. Professional use alone does not show exact restoration.
