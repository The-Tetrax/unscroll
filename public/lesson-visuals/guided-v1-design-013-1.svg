<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="design-type-013-title" aria-describedby="design-type-013-desc" focusable="false">
<title id="design-type-013-title">Name the feature in the actual letter</title>
<desc id="design-type-013-desc">Large Arial h, e, o and g share a baseline at y = 338. A second dashed guide marks the approximate top of the Arial lowercase body. Callouts point to the h ascender, the open right side of e, the interior counter of o and the descender of g below the baseline. Hedge guide appears below at 56 and 28 px for a real-word inspection. Guides describe the system-font specimen, not every Latin typeface.</desc>
<rect x="0" y="0" width="720" height="720" rx="0" fill="#F7F4ED" stroke="none" stroke-width="2"/>
<g aria-hidden="true">
<text x="32" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#231F20">Name the feature in the actual letter</text>
<line x1="32" y1="80" x2="688" y2="80" stroke="#AAA398" stroke-width="2"/>
<text x="48" y="141" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Ascender</text><text x="224" y="181" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Aperture</text><text x="431" y="141" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Counter</text><line x1="48" y1="257" x2="672" y2="257" stroke="#AAA398" stroke-width="1" stroke-dasharray="6 6"/><line x1="48" y1="338" x2="672" y2="338" stroke="#BC2031" stroke-width="2"/><text x="108" y="338" font-family="Arial, sans-serif" font-size="156" font-weight="400" text-anchor="middle" fill="#231F20">h</text><text x="272" y="338" font-family="Arial, sans-serif" font-size="156" font-weight="400" text-anchor="middle" fill="#231F20">e</text><text x="436" y="338" font-family="Arial, sans-serif" font-size="156" font-weight="400" text-anchor="middle" fill="#231F20">o</text><text x="600" y="338" font-family="Arial, sans-serif" font-size="156" font-weight="400" text-anchor="middle" fill="#231F20">g</text><path d="M 107 152 L 84 197 V 224" fill="none" stroke="#BC2031" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 279 192 L 328 231 L 308 301" fill="none" stroke="#BC2031" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="303" cy="306" r="7" fill="none" stroke="#BC2031" stroke-width="2"/><path d="M 477 151 L 479 214 L 444 280" fill="none" stroke="#BC2031" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="436" cy="296" r="16" fill="none" stroke="#BC2031" stroke-width="2"/><text x="48" y="407" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#231F20">Baseline</text><line x1="154" y1="393" x2="171" y2="339" stroke="#BC2031" stroke-width="2"/><text x="672" y="421" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="end" fill="#231F20">Descender</text><path d="M 601 397 L 585 371" fill="none" stroke="#BC2031" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="585" cy="367" r="8" fill="none" stroke="#BC2031" stroke-width="2"/><line x1="48" y1="257" x2="48" y2="338" stroke="#231F20" stroke-width="2"/><text x="48" y="463" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Lowercase body: between the two guides</text><line x1="40" y1="496" x2="680" y2="496" stroke="#AAA398" stroke-width="2"/><text x="48" y="574" font-family="Arial, sans-serif" font-size="56" font-weight="400" text-anchor="start" fill="#231F20">Hedge guide</text><text x="48" y="627" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#231F20">Hedge guide</text><text x="441" y="564" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Same words</text><text x="441" y="604" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Two sizes</text><text x="48" y="682" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Inspect the e at the final reading size.</text>
</g></svg>