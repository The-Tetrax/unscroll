<svg xmlns="http://www.w3.org/2000/svg" width="720" height="701" viewBox="0 0 720 701" role="img" aria-labelledby="teaching-74-65-63-68-2d-30-32-30-v-30-title" aria-describedby="teaching-74-65-63-68-2d-30-32-30-v-30-desc" font-family="Arial, sans-serif" data-format="timeline" data-visual-id="tech-020" data-visual-index="0"><title id="teaching-74-65-63-68-2d-30-32-30-v-30-title">Completed remotely, uncertain locally</title><desc id="teaching-74-65-63-68-2d-30-32-30-v-30-desc">Commit at 400 ms and response loss at 450 precede the caller timeout at 500.
1. 0 ms: send. Caller requests a new report
2. 400 ms: commit. Report record exists at the service
3. 450 ms: response lost. Caller receives no completion evidence
4. 500 ms: timeout. Waiting ends; remote outcome remains uncertain to caller</desc><defs><marker id="teaching-74-65-63-68-2d-30-32-30-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-65-63-68-2d-30-32-30-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-65-63-68-2d-30-32-30-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="701" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="101" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Timeline</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="593" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Completed remotely, uncertain locally</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="531" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Event order only; spacing is not proportional to time.</text><g data-time-spacing="ordinal"><path d="M 262 219 L 262 523" fill="none" stroke="#69635f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g data-item-index="0"><text x="35" y="229.04" font-size="26" font-weight="700" fill="#231f20" textLength="142" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">0 ms: send</text><text x="299" y="224.88" font-size="22" font-weight="400" fill="#231f20" textLength="289" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Caller requests a new report</text><path d="M 262 210 L 271 219 L 262 228 L 253 219 Z" fill="#f7f4ed" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g data-item-index="1"><text x="35" y="317.04" font-size="26" font-weight="700" fill="#231f20" textLength="103" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">400 ms:</text><text x="35" y="354.04" font-size="26" font-weight="700" fill="#231f20" textLength="93" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">commit</text><text x="299" y="312.88" font-size="22" font-weight="400" fill="#231f20" textLength="349" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Report record exists at the service</text><path d="M 262 298 L 271 307 L 262 316 L 253 307 Z" fill="#bc2031" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g data-item-index="2"><text x="35" y="425.04" font-size="26" font-weight="700" fill="#231f20" textLength="103" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">450 ms:</text><text x="35" y="462.04" font-size="26" font-weight="700" fill="#231f20" textLength="172" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">response lost</text><text x="299" y="420.88" font-size="22" font-weight="400" fill="#231f20" textLength="302" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Caller receives no completion</text><text x="299" y="451.88" font-size="22" font-weight="400" fill="#231f20" textLength="93" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">evidence</text><path d="M 262 406 L 271 415 L 262 424 L 253 415 Z" fill="#f7f4ed" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g data-item-index="3"><text x="35" y="533.04" font-size="26" font-weight="700" fill="#231f20" textLength="103" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">500 ms:</text><text x="35" y="570.04" font-size="26" font-weight="700" fill="#231f20" textLength="95" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">timeout</text><text x="299" y="528.88" font-size="22" font-weight="400" fill="#231f20" textLength="312" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Waiting ends; remote outcome</text><text x="299" y="559.88" font-size="22" font-weight="400" fill="#231f20" textLength="270" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">remains uncertain to caller</text><path d="M 262 514 L 271 523 L 262 532 L 253 523 Z" fill="#bc2031" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><path d="M 32 654 L 98 654" fill="none" stroke="#bc2031" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="119" y="660.88" font-size="22" font-weight="400" fill="#69635f" textLength="211" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Explanatory diagram</text></g></svg>