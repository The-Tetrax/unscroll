<svg xmlns="http://www.w3.org/2000/svg" width="720" height="680" viewBox="0 0 720 680" role="img" aria-labelledby="design-type-001-title" aria-describedby="design-type-001-desc" focusable="false">
<title id="design-type-001-title">Keep the pear. Change the field.</title>
<desc id="design-type-001-desc">Two identical, unoutlined pear silhouettes are #35654D. The left field is dark green #486754; the right field is pale ivory #F3EBDD. Neither the pear shape nor its color changes. The larger light-dark difference comes from the replacement field.</desc>
<rect x="0" y="0" width="720" height="680" rx="0" fill="#F7F4ED" stroke="none" stroke-width="2"/>
<g aria-hidden="true">
<text x="32" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#231F20">Keep the pear. Change the field.</text>
<line x1="32" y1="80" x2="688" y2="80" stroke="#AAA398" stroke-width="2"/>
<text x="40" y="120" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Same silhouette, different neighboring value.</text><rect x="40" y="152" width="296" height="296" rx="0" fill="#486754" stroke="none" stroke-width="2"/><rect x="384" y="152" width="296" height="296" rx="0" fill="#F3EBDD" stroke="none" stroke-width="2"/><path d="M 188 218 C 158 208 157 252 146 271 C 125 302 97 326 113 369 C 131 414 245 414 263 369 C 279 326 251 302 230 271 C 219 252 218 208 188 218 Z" fill="#35654D" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 188 222 Q 185 200 198 189" fill="none" stroke="#35654D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 532 218 C 502 208 501 252 490 271 C 469 302 441 326 457 369 C 475 414 589 414 607 369 C 623 326 595 302 574 271 C 563 252 562 208 532 218 Z" fill="#35654D" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M 532 222 Q 529 200 542 189" fill="none" stroke="#35654D" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="188" y="489" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#231F20">Before: #486754</text><text x="532" y="489" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#231F20">After: #F3EBDD</text><rect x="48" y="531" width="128" height="64" rx="0" fill="#35654D" stroke="none" stroke-width="2"/><text x="204" y="554" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#231F20">Pear stays #35654D</text><text x="204" y="589" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Only the field changes.</text><text x="40" y="644" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Fix the boundary before adding speckles.</text>
</g></svg>