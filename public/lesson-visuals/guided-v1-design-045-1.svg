<svg xmlns="http://www.w3.org/2000/svg" width="720" height="806" viewBox="0 0 720 806" role="img" aria-labelledby="draw-design-045-title draw-design-045-desc">
  <title id="draw-design-045-title">Observe, recall, redesign the pouch</title>
  <desc id="draw-design-045-desc">An original zip pouch appears in three labeled studies. Observation shows a top opening on the top plane, a side plane, and an attached loop. The memory trial intentionally loses the thickness and misplaces the opening on the front. An invented version restores the volume and adds an upward-opening pocket attached to the right face. The pocket has its own top and side planes; red marks identify the structural change rather than decorative stitching.</desc>
