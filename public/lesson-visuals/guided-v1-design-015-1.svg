<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="design-type-015-title" aria-describedby="design-type-015-desc" focusable="false">
<title id="design-type-015-title">Read the recipe as a sequence</title>
<desc id="design-type-015-desc">The same exact directions appear twice in 30 px Arial: Rinse the beans. Drain them well. Add the tomato. The first is one running block wrapping after well. The second gives each complete action its own line with more space between actions. Wording and glyph size remain unchanged.</desc>
<rect x="0" y="0" width="720" height="720" rx="0" fill="#F7F4ED" stroke="none" stroke-width="2"/>
<g aria-hidden="true">
<text x="32" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#231F20">Read the recipe as a sequence</text>
<line x1="32" y1="80" x2="688" y2="80" stroke="#AAA398" stroke-width="2"/>
<text x="48" y="133" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#231F20">One running block</text><text x="64" y="196" font-family="Arial, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#231F20">Rinse the beans. Drain them well.</text><text x="64" y="238" font-family="Arial, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#231F20">Add the tomato.</text><line x1="48" y1="299" x2="672" y2="299" stroke="#AAA398" stroke-width="2"/><text x="48" y="347" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#231F20">Three action lines</text><text x="64" y="415" font-family="Arial, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#231F20">Rinse the beans.</text><text x="64" y="493" font-family="Arial, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#231F20">Drain them well.</text><text x="64" y="571" font-family="Arial, sans-serif" font-size="30" font-weight="400" text-anchor="start" fill="#231F20">Add the tomato.</text><text x="48" y="637" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Same words and 30 px type.</text><text x="48" y="677" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">The action boundaries now match the line breaks.</text>
</g></svg>