1. Chair image appears. Label: imagined possibility, not verified recollection.
2. Check the chair. It is empty in this example.
3. Check the tote. The book is found here now.
4. Keep the history open. Earlier placement and movement remain unestablished.</desc><defs><marker id="teaching-6f-62-73-65-72-76-65-72-2d-30-32-36-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6f-62-73-65-72-76-65-72-2d-30-32-36-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6f-62-73-65-72-76-65-72-2d-30-32-36-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="804" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="57" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Flow</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="551" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">A search possibility is checked, not</text><text x="35" y="150.28" font-size="32" font-weight="700" fill="#231f20" textLength="151" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">promoted</text><g data-edge-index="0" data-from="0" data-to="1"><path d="M 60 242 L 60 307" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teaching-6f-62-73-65-72-76-65-72-2d-30-32-36-v-30-link)"/></g><g data-edge-index="1" data-from="1" data-to="2"><path d="M 60 366 L 60 431" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end=