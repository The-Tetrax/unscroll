<svg xmlns="http://www.w3.org/2000/svg" width="720" height="830" viewBox="0 0 720 830" role="img" aria-labelledby="camera-007-title camera-007-description" font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><title id="camera-007-title">White folds need distinct recorded tones</title><desc id="camera-007-description">The same towel outline contains a flat clipped white patch in one view and distinct ridges, creases and weave lines in another. A dimmed copy of the clipped patch remains featureless. A top view locates window, towel and alternative camera positions.</desc><defs><clipPath id="camera-007-frame-0" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="314" height="260" rx="0" fill="#ffffff" stroke="none" stroke-width="2.5"></rect></clipPath><clipPath id="camera-007-frame-1" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="314" height="260" rx="0" fill="#ffffff" stroke="none" stroke-width="2.5"></rect></clipPath></defs><rect x="0" y="0" width="720" height="830" rx="0" fill="#f7f4ed" stroke="none" stroke-width="2.5"></rect><text x="32" y="34" font-size="22" font-weight="700" fill="#bc2031" text-anchor="start" data-drawn-text="true">CAMERA 007</text><text x="32" y="73" font-size="26" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="true">White folds need distinct recorded tones</text><line x1="32" y1="92" x2="688" y2="92" stroke="#231f20" stroke-width="2.5" stroke-dasharray=""></line><text x="32" y="124" font-size="24" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="true">Clipped fold patch</text><text x="374" y="124" font-size="24" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="true">Retained fold detail</text><g transform="translate(32 143) rotate(0) scale(1)"><rect x="0" y="0" width="314" height="260" rx="0" fill="#e6dfd3" stroke="none" stroke-width="2.5"></rect><g clip-path="url(#camera-007-frame-0)"><rect x="169" y="0" width="145" height="209" rx="0" fill="#ffffff" stroke="#e6dfd3" stroke-width="2.5"></rect><line x1="238" y1="0" x2="238" y2="209" stroke="#e6dfd3" stroke-width="2.5" stroke-dasharray=""></line><g transform="translate(59 40) rotate(0) scale(1)"><rect x="5" y="54" width="174" height="145" rx="0" fill="#b98b60" stroke="#231f20" stroke-width="2.5"></rect><path d="M 9 24 Q 80 -9 174 20 L 187 180 Q 145 202 109 184 Q 60 207 0 182 Z" fill="#ffffff" stroke="#231f20" stroke-width="2.5"></path></g></g><rect x="0" y="0" width="314" height="260" rx="0" fill="none" stroke="#231f20" stroke-width="2.5"></rect></g><g transform="translate(374 143) rotate(0) scale(1)"><rect x="0" y="0" width="314" height="260" rx="0" fill="#d6cebf" stroke="none" stroke-width="2.5"></rect><g clip-path="url(#camera-007-frame-1)"><g transform="translate(59 40) rotate(0) scale(1)"><rect x="5" y="54" width="174" height="145" rx="0" fill="#b98b60" stroke="#231f20" stroke-width="2.5"></rect><path d="M 9 24 Q 80 -9 174 20 L 187 180 Q 145 202 109 184 Q 60 207 0 182 Z" fill="#ffffff" stroke="#231f20" stroke-width="2.5"></path><path d="M 9 24 Q 41 42 63 25 L 59 188 Q 37 179 18 187 Z" fill="#eee5d6" stroke="none" stroke-width="2.5"></path><path d="M 95 19 Q 114 32 126 20 L 136 190 L 109 184 Z" fill="#bdb6a5" stroke="none" stroke-width="2.5"></path><path d="M 156 22 L 167 192 L 180 184 L 174 20 Z" fill="#d7d1c4" stroke="none" stroke-width="2.5"></path><path d="M 62 29 L 59 178 M 111 37 L 109 173 M 160 30 L 167 175" fill="none" stroke="#69635f" stroke-width="2"></path><path d="M 14 163 Q 43 172 62 165" fill="none" stroke="#bdb6a5" stroke-width="2"></path><path d="M 14 170 Q 43 177 62 170" fill="none" stroke="#bdb6a5" stroke-width="2"></path><path d="M 14 177 Q 43 182 62 175" fill="none" stroke="#bdb6a5" stroke-width="2"></path></g></g><rect x="0" y="0" width="314" height="260" rx="0" fill="none" stroke="#231f20" stroke-width="2.5"></rect></g><text x="32" y="435" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Fold differences are gone.</text><text x="374" y="435" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Ridges and creases differ.</text><text x="32" y="478" font-size="24" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="true">Try the window side</text><rect x="112" y="506" width="175" height="12" rx="0" fill="#fffdf5" stroke="#557986" stroke-width="2.5"></rect><text x="129" y="549" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Window</text><rect x="209" y="579" width="62" height="53" rx="0" fill="#fffdf5" stroke="#231f20" stroke-width="2.5"></rect><path d="M 222 583 L 219 624 M 247 583 L 252 624" fill="none" stroke="#69635f" stroke-width="2.5"></path><g transform="translate(239 684) rotate(0) scale(1)"><rect x="-23" y="0" width="46" height="30" rx="4" fill="#354d59" stroke="#231f20" stroke-width="2.5"></rect><rect x="-10" y="-9" width="20" height="9" rx="0" fill="#231f20" stroke="#231f20" stroke-width="2.5"></rect><rect x="-16" y="6" width="24" height="17" rx="2" fill="#e6dfd3" stroke="none" stroke-width="2.5"></rect><circle cx="15" cy="15" r="3" fill="#bc2031" stroke="none" stroke-width="2.5"></circle></g><g transform="translate(73 536) rotate(124) scale(1)"><rect x="-23" y="0" width="46" height="30" rx="4" fill="#354d59" stroke="#231f20" stroke-width="2.5"></rect><rect x="-10" y="-9" width="20" height="9" rx="0" fill="#231f20" stroke="#231f20" stroke-width="2.5"></rect><rect x="-16" y="6" width="24" height="17" rx="2" fill="#e6dfd3" stroke="none" stroke-width="2.5"></rect><circle cx="15" cy="15" r="3" fill="#bc2031" stroke="none" stroke-width="2.5"></circle></g><line x1="99" y1="552" x2="202" y2="598" stroke="#557986" stroke-width="2.5" stroke-dasharray=""></line><path d="M 190.078 599.3656 L 202 598 L 195.0598 588.2105" fill="none" stroke="#557986" stroke-width="3.5"></path><line x1="239" y1="551" x2="239" y2="575" stroke="#bc2031" stroke-width="2.5" stroke-dasharray=""></line><path d="M 232.8915 564.6711 L 239 575 L 245.1085 564.6711" fill="none" stroke="#bc2031" stroke-width="3.5"></path><text x="36" y="648" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Light-side</text><text x="287" y="685" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Backlit</text><text x="424" y="500" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Darken the clipped file:</text><text x="424" y="529" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">still one flat patch.</text><g transform="translate(453 554) rotate(0) scale(0.75)"><g transform="translate(0 0) rotate(0) scale(1)"><rect x="5" y="54" width="174" height="145" rx="0" fill="#b98b60" stroke="#231f20" stroke-width="2.5"></rect><path d="M 9 24 Q 80 -9 174 20 L 187 180 Q 145 202 109 184 Q 60 207 0 182 Z" fill="#b9b6b0" stroke="#231f20" stroke-width="2.5"></path></g></g><line x1="32" y1="716" x2="688" y2="716" stroke="#e6dfd3" stroke-width="2.5" stroke-dasharray=""></line><text x="32" y="743" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Illustrative tones, not measured exposure or HDR recovery.</text><text x="32" y="772" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">The light-side camera aims at the towel, into the room.</text><text x="32" y="801" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">A dimmer flat patch cannot reconstruct the lost fold lines.</text></svg>