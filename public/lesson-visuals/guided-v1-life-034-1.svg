<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1484" viewBox="0 0 720 1484" role="img" aria-labelledby="teaching-6c-69-66-65-2d-30-33-34-v-30-title" aria-describedby="teaching-6c-69-66-65-2d-30-33-34-v-30-desc" font-family="Arial, sans-serif" data-format="spatial" data-visual-id="life-034" data-visual-index="0"><title id="teaching-6c-69-66-65-2d-30-33-34-v-30-title">Cold surroundings and a leak-catching container</title><desc id="teaching-6c-69-66-65-2d-30-33-34-v-30-desc">Refrigerated ready-to-eat food is above a package placed in a leak-catching container.
1. Ready-to-eat food. Keep protected above potential raw-food leaks.
2. Frozen chicken package. Thaw in the refrigerator, not on the counter.
3. Leak-catching container. Package sits inside it during thawing.
2 to 3: Place package inside.</desc><defs><marker id="teaching-6c-69-66-65-2d-30-33-34-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6c-69-66-65-2d-30-33-34-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6c-69-66-65-2d-30-33-34-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker><mask id="teaching-6c-69-66-65-2d-30-33-34-v-30-connections-mask" maskUnits="userSpaceOnUse" x="36" y="237" width="648" height="650" style="mask-type:luminance"><rect x="36" y="237" width="648" height="650" fill="#ffffff"/><rect x="315" y="373.1" width="90" height="90" fill="#000000"/><rect x="169.2" y="609.6" width="90" height="90" fill="#000000"/><rect x="466.2" y="609.6" width="90" height="90" fill="#000000"/><rect x="331" y="298.1" width="58" height="58" fill="#000000"/><rect x="185.2" y="534.6" width="58" height="58" fill="#000000"/><rect x="482.2" y="534.6" width="58" height="58" fill="#000000"/></mask></defs><rect width="720" height="1484" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="186" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Spatial diagram</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="607" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Cold surroundings and a leak-catching</text><text x="35" y="150.28" font-size="32" font-w