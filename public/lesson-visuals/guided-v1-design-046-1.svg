<svg xmlns="http://www.w3.org/2000/svg" width="720" height="783" viewBox="0 0 720 783" role="img" aria-labelledby="draw-design-046-title draw-design-046-desc">
  <title id="draw-design-046-title">Compare three boat arrangements</title>
  <desc id="draw-design-046-desc">Three original composition thumbnails contain a folded paper boat, a stone, and a broad cloth fold. The first places the boat low left and the stone high right along a diagonal fold. The second moves the boat centrally and crops the stone near the upper-right edge. The third leaves a larger quiet region by keeping the boat left, reducing the fold, and cropping most of the stone. These test placement and crop, not progressively more finished drawings or a universally best composition.</desc>
