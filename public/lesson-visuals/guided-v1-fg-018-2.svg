<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1654" viewBox="0 0 720 1654" role="img" aria-labelledby="teaching-66-67-2d-30-31-38-v-31-title" aria-describedby="teaching-66-67-2d-30-31-38-v-31-desc" font-family="Arial, sans-serif" data-format="spatial" data-visual-id="fg-018" data-visual-index="1"><title id="teaching-66-67-2d-30-31-38-v-31-title">Two crossing stroke directions on a flat patch</title><desc id="teaching-66-67-2d-30-31-38-v-31-desc">One stroke runs from lower left to upper right, and another from upper left to lower right.
1. First start. Lower left of the patch.
2. First end. Upper right of the patch.
3. Crossing start. Upper left of the patch.
4. Crossing end. Lower right of the patch.
1 to 2: first family.
