<svg xmlns="http://www.w3.org/2000/svg" width="720" height="845" viewBox="0 0 720 845" role="img" aria-labelledby="draw-design-042-title draw-design-042-desc">
  <title id="draw-design-042-title">Group light before texture</title>
  <desc id="draw-design-042-desc">Side light reaches a folded white napkin and brown cardboard. The facing napkin plane is light, the lit cardboard is middle value, and a continuous sheltered white fold is dark. The three colors follow the lesson&apos;s illustrative value plan, not material names or measured brightness. Below, the same little fold is drawn with uniform hatch texture and with a connected shadow group. Texture alone leaves the inward plane poorly separated.</desc>
