<svg xmlns="http://www.w3.org/2000/svg" width="720" height="680" viewBox="0 0 720 680" role="img" aria-labelledby="teaching-70-65-6f-70-6c-65-2d-30-32-31-v-30-title" aria-describedby="teaching-70-65-6f-70-6c-65-2d-30-32-31-v-30-desc" font-family="Arial, sans-serif" data-format="flow" data-visual-id="people-021" data-visual-index="0"><title id="teaching-70-65-6f-70-6c-65-2d-30-32-31-v-30-title">An answerable complaint about the slides</title><desc id="teaching-70-65-6f-70-6c-65-2d-30-32-31-v-30-desc">A statement moves from the changed slides to mismatched notes and a request to flag changes before presenting.
1. Event. The opening slides changed after our rehearsal.
2. Effect. My notes no longer matched, and I was thrown off.
3. Request. Could we flag opening changes before either of us presents?</desc><defs><marker id="teaching-70-65-6f-70-6c-65-2d-30-32-31-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-70-65-6f-70-6c-65-2d-30-32-31-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-70-65-6f-70-6c-65-2d-30-32-31-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="680" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="57" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Flow</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="555" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">An answerable complaint about the</text><text x="35" y="150.28" font-size="32" font-weight="700" fill="#231f20" textLength="91" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">slides</text><g data-edge-index="0" data-from="0" data-to="1"><path d="M 60 242 L 60 307" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teaching-70-65-6f-70-6c-65-2d-30-32-31-v-30-link)"/></g><g data-edge-index="1" data-from="1" data-to="2"><path d="M 60 366 L 60 431" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teaching-70-65-6f-70-6c-65-2d-3