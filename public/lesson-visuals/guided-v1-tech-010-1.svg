<svg xmlns="http://www.w3.org/2000/svg" width="720" height="693" viewBox="0 0 720 693" role="img" aria-labelledby="teaching-74-65-63-68-2d-30-31-30-v-30-title" aria-describedby="teaching-74-65-63-68-2d-30-31-30-v-30-desc" font-family="Arial, sans-serif" data-format="comparison" data-visual-id="tech-010" data-visual-index="0"><title id="teaching-74-65-63-68-2d-30-31-30-v-30-title">Four different lookup observations</title><desc id="teaching-74-65-63-68-2d-30-31-30-v-30-desc">NXDOMAIN, NODATA, timeout, and SERVFAIL support different conclusions.
1. NXDOMAIN. lab.example A: name absent; example negative lifetime 120 s
2. NODATA. host.example AAAA: existing name, no requested IPv6 address record
3. Timeout. No reply within the chosen 2 s wait
