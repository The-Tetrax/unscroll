<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="design-type-014-title" aria-describedby="design-type-014-desc" focusable="false">
<title id="design-type-014-title">Equal sizes, unequal lowercase bodies</title>
<desc id="design-type-014-desc">Two invented 16-unit design spaces are drawn at 12 SVG px per unit, hence 192 px high. Their baselines sit three units above the bottom. Original x glyphs have exact visible heights 84 and 108 px, representing 7 and 9 units. Below, Arial and Georgia render the same seed sentence at 36 px, without stretching. The named fonts are separate examples, not the sources of the invented metrics.</desc>
<rect x="0" y="0" width="720" height="720" rx="0" fill="#F7F4ED" stroke="none" stroke-width="2"/>
<g aria-hidden="true">
<text x="32" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#231F20">Equal sizes, unequal lowercase bodies</text>
<line x1="32" y1="80" x2="688" y2="80" stroke="#AAA398" stroke-width="2"/>
<rect x="84" y="154" width="208" height="192" rx="0" fill="#FFFFFF" stroke="#AAA398" stroke-width="2"/><line x1="84" y1="226" x2="292" y2="226" stroke="#BC2031" stroke-width="1" stroke-dasharray="6 6"/><line x1="84" y1="310" x2="292" y2="310" stroke="#BC2031" stroke-width="2"/><path d="M 152 226 H 167.84 L 188 256.24 L 208.16 226 H 224 L 196.64 268 L 224 310 H 208.16 L 188 279.76 L 167.84 310 H 152 L 179.36 268 Z" fill="#231F20" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="310" y1="226" x2="310" y2="310" stroke="#231F20" stroke-width="2"/><line x1="304" y1="226" x2="316" y2="226" stroke="#231F20" stroke-width="2"/><line x1="304" y1="310" x2="316" y2="310" stroke="#231F20" stroke-width="2"/><text x="323" y="276" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">7</text><text x="188" y="128" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#231F20">Study A: 16 units</text><text x="188" y="386" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#231F20">x-height: 7 units</text><rect x="400" y="154" width="208" height="192" rx="0" fill="#FFFFFF" stroke="#AAA398" stroke-width="2"/><line x1="400" y1="202" x2="608" y2="202" stroke="#BC2031" stroke-width="1" stroke-dasharray="6 6"/><line x1="400" y1="310" x2="608" y2="310" stroke="#BC2031" stroke-width="2"/><path d="M 468 202 H 483.84 L 504 240.88 L 524.16 202 H 540 L 512.64 256 L 540 310 H 524.16 L 504 271.12 L 483.84 310 H 468 L 495.36 256 Z" fill="#231F20" stroke="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="626" y1="202" x2="626" y2="310" stroke="#231F20" stroke-width="2"/><line x1="620" y1="202" x2="632" y2="202" stroke="#231F20" stroke-width="2"/><line x1="620" y1="310" x2="632" y2="310" stroke="#231F20" stroke-width="2"/><text x="639" y="264" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">9</text><text x="504" y="128" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#231F20">Study B: 16 units</text><text x="504" y="386" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#231F20">x-height: 9 units</text><text x="40" y="427" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">1 unit = 12 SVG px. The x studies are invented.</text><line x1="40" y1="451" x2="680" y2="451" stroke="#AAA398" stroke-width="2"/><text x="40" y="491" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#231F20">Same 36 px size, real system text</text><text x="48" y="533" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Arial</text><text x="384" y="533" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Georgia</text><text x="48" y="579" font-family="Arial, sans-serif" font-size="36" font-weight="400" text-anchor="start" fill="#231F20">Mix six seeds</text><text x="48" y="624" font-family="Arial, sans-serif" font-size="36" font-weight="400" text-anchor="start" fill="#231F20">in loose soil.</text><text x="384" y="579" font-family="Georgia, serif" font-size="36" font-weight="400" text-anchor="start" fill="#231F20">Mix six seeds</text><text x="384" y="624" font-family="Georgia, serif" font-size="36" font-weight="400" text-anchor="start" fill="#231F20">in loose soil.</text><text x="40" y="684" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Named fonts are not the 7 / 9-unit studies.</text>
</g></svg>