<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1058" viewBox="0 0 720 1058" role="img" aria-labelledby="teaching-63-69-6e-65-6d-61-2d-30-36-33-v-30-title" aria-describedby="teaching-63-69-6e-65-6d-61-2d-30-36-33-v-30-desc" font-family="Arial, sans-serif" data-format="dialogue" data-visual-id="cinema-063" data-visual-index="0"><title id="teaching-63-69-6e-65-6d-61-2d-30-36-33-v-30-title">Feedback locates the hidden fit test</title><desc id="teaching-63-69-6e-65-6d-61-2d-30-36-33-v-30-desc">A viewer misses the reason for turning paper because a hand hides the opening.
1. Maker. What changed, and which moment showed you that?
2. Viewer. The paper turned and went in the bag. I did not see why it needed turning.
3. Maker. What could you see during the first attempt to put it in?
4. Viewer. Mostly your hand. The bag opening was covered.</desc><defs><marker id="teaching-63-69-6e-65-6d-61-2d-30-36-33-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-63-69-6e-65-6d-61-2d-30-36-33-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-63-69-6e-65-6d-61-2d-30-36-33-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="1058" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="106" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Dialogue</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="559" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Feedback locates the hidden fit test</text><circle cx="79" cy="168" r="22" fill="#231f20" stroke="#231f20" stroke-width="3"/><text x="71.5" y="175.96" font-size="24" font-weight="700" fill="#f7f4ed" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">1</text><text x="119" y="172.04" font-size="26" font-weight="700" fill="#231f20" textLength="81" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Maker</text><g data-turn-index="0" data-side="left"><path d="M 78 203 H 364 Q 386 203 386 225  L 386 283 Q 386 305 364 305 H 78 Q 56 305 56 283 L 56 284 L 38 291 L 56 264 L 56 225 Q 56 203 78 203 Z" fill="#f7f4ed" stroke="#231f20" stroke-widt