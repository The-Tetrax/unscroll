<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1216" viewBox="0 0 720 1216" role="img" aria-labelledby="teaching-70-65-72-73-70-65-63-74-69-76-65-2d-30-31-30-v-30-title" aria-describedby="teaching-70-65-72-73-70-65-63-74-69-76-65-2d-30-31-30-v-30-desc" font-family="Arial, sans-serif" data-format="matrix" data-visual-id="perspective-010" data-visual-index="0"><title id="teaching-70-65-72-73-70-65-63-74-69-76-65-2d-30-31-30-v-30-title">Two conditions for Rosa&apos;s class</title><desc id="teaching-70-65-72-73-70-65-63-74-69-76-65-2d-30-31-30-v-30-desc">Four cells cross available captions with usable timing; Rosa needs both.
1. Captions, usable time. Both identified barriers removed; attendance remains a choice.
2. Captions, clashing time. Rosa can access the content but cannot attend then.
3. No captions, usable time. Time works; the demonstration remains inaccessible to Rosa.
