<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1609" viewBox="0 0 720 1609" role="img" aria-labelledby="teaching-63-69-6e-65-6d-61-2d-30-31-34-v-31-title" aria-describedby="teaching-63-69-6e-65-6d-61-2d-30-31-34-v-31-desc" font-family="Arial, sans-serif" data-format="spatial" data-visual-id="cinema-014" data-visual-index="1"><title id="teaching-63-69-6e-65-6d-61-2d-30-31-34-v-31-title">A gap for the handoff</title><desc id="teaching-63-69-6e-65-6d-61-2d-30-31-34-v-31-desc">The camera stays fixed while giver and receiver separate around a visible note.
1. Camera. Position unchanged.
2. Giver. Starts at the left.
3. Receiver. Waits at the right.
4. Note. Crosses the visible shared space.
2 to 4: give.
4 to 3: receive.</desc><defs><marker id="teaching-63-69-6e-65-6d-61-2d-30-31-34-v-31-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-63-69-6e-65-6d-61-2d-30-31-34-v-31-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-63-69-6e-65-6d-61-2d-30-31-34-v-31-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker><mask id="teaching-63-69-6e-65-6d-61-2d-30-31-34-v-31-connections-mask" maskUnits="userSpaceOnUse" x="36" y="192" width="648" height="650" style="mask-type:luminance"><rect x="36" y="192" width="648" height="650" fill="#ffffff"/><rect x="315" y="620.5" width="90" height="90" fill="#000000"/><rect x="163.8" y="362.5" width="90" height="90" fill="#000000"/><rect x="466.2" y="362.5" width="90" height="90" fill="#000000"/><rect x="315" y="470" width="90" height="90" fill="#000000"/><rect x="331" y="727.5" width="58" height="58" fill="#000000"/><rect x="179.8" y="287.5" width="58" height="58" fill="#000000"/><rect x="482.2" y="287.5" width="58" height="58" fill="#000000"/><rect x="331" y="395" width="58" height="58" fill="#000000"/><rect x="384" y="732.5" width="115" height="48" fill="#000000"/><rect x="232.8" y="292.5" width="84" height="48" fill="#000000"/><rect x="535.2" y="292.5" width="126" height="48" fill="#000000"/><rect x="384" y="400" width="77" height="48" fill="#000000"/></mask></defs><rect width="720" height="1609" fill="#f7f4ed"/><g aria-hidden="true"><text x="35