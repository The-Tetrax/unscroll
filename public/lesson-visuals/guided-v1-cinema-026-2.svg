<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1386" viewBox="0 0 720 1386" role="img" aria-labelledby="teaching-63-69-6e-65-6d-61-2d-30-32-36-v-31-title" aria-describedby="teaching-63-69-6e-65-6d-61-2d-30-32-36-v-31-desc" font-family="Arial, sans-serif" data-format="swatches" data-visual-id="cinema-026" data-visual-index="1"><title id="teaching-63-69-6e-65-6d-61-2d-30-32-36-v-31-title">Abrupt versus gradual change</title><desc id="teaching-63-69-6e-65-6d-61-2d-30-32-36-v-31-desc">Two chips jump from light to dark; four chips pass through intermediate gray values.
1. Hard: lit. Before the edge. Hex #e8e2d5.
2. Hard: dark. Abrupt change. Hex #585754.
3. Soft: lit. Before the edge. Hex #e8e2d5.
4. Soft: edge 1. Partly shaded. Hex #b8b4ab.
5. Soft: edge 2. More shaded. Hex #87837b.
