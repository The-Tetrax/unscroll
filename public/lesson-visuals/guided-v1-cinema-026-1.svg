<svg xmlns="http://www.w3.org/2000/svg" width="720" height="840" viewBox="0 0 720 840" role="img" aria-labelledby="light-edit-026-title light-edit-026-desc" font-family="Arial" font-size="22"><title id="light-edit-026-title">Look at the shadow on the paper</title><desc id="light-edit-026-desc">Two finger tests keep a similar finger-to-paper gap. A small apparent lamp produces an abrupt finger-shadow edge in this example. A broad indirect window produces a continuously graded boundary on the actual white receiving sheet. Both shadows have a dark core; softness is not global dimming. Keep the finger gap similar. Compare the edge width. Illustrative outcomes; not every lamp gives a hard edge. All objects are original schematic drawings, not photographed frames. Colors and spacing are illustrative, not measurements.</desc><metadata>Source: original UNSCROLL vector artwork. No external media, film stills, or third-party characters.</metadata><defs><radialGradient id="light-edit-026-penumbra" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#5b554e"/><stop offset="43%" stop-color="#5b554e"/><stop offset="60%" stop-color="#80796f"/><stop offset="76%" stop-color="#b5ada0"/><stop offset="90%" stop-color="#e1dbd0"/><stop offset="100%" stop-color="#fffdf7"/></radialGradient></defs><rect x="0" y="0" width="720" height="840" rx="0" fill="#f5efe5" stroke="none" stroke-width="2"/><text x="34" y="44" font-size="22" font-weight="700" fill="#a92c3b" textLength="149.808" lengthAdjust="spacingAndGlyphs">CINEMA / 026</text><text x="34" y="88" font-size="26" font-weight="700" fill="#272322" textLength="416.101" lengthAdjust="spacingAndGlyphs">Look at the shadow on the paper</text><path d="M32 112 L688 112" fill="none" stroke="#cfc4b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="32" y="136" width="316" height="548" rx="8" fill="#fffdf7" stroke="#c8bdae" stroke-width="2"/><text x="50" y="174" font-size="24" font-weight="700" fill="#272322" textLength="2