<svg xmlns="http://www.w3.org/2000/svg" width="720" height="478" viewBox="0 0 720 478" role="img" aria-labelledby="teaching-6d-69-6e-64-2d-30-30-36-v-30-title" aria-describedby="teaching-6d-69-6e-64-2d-30-30-36-v-30-desc" font-family="Arial, sans-serif" data-format="comparison" data-visual-id="mind-006" data-visual-index="0"><title id="teaching-6d-69-6e-64-2d-30-30-36-v-30-title">The same route, different support</title><desc id="teaching-6d-69-6e-64-2d-30-30-36-v-30-desc">Library, footbridge, park is rehearsed with a radio discussion playing or with speech paused and a route note visible.
1. Speech playing. Hold library, footbridge, park in order while talk continues.
