="#69635f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="41" y="490.04" font-size="26" font-weight="700" fill="#231f20" textLength="240" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Opened chickpeas</text><text x="41" y="530.88" font-size="22" font-weight="400" fill="#231f20" textLength="202" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Follow food-specific</text><text x="41" y="561.88" font-size="22" font-weight="400" fill="#231f20" textLength="291" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">opened-storage instructions.</text></g><g data-item-index="3" data-column="1"><circle cx="401" cy="420" r="22" fill="#231f20" stroke="#231f20" stroke-width="3"/><text x="393.5" y="427.96" font-size="24" font-weight="700" fill="#f7f4ed" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">4</text><path d="M 436 420 L 682 420" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="387" y="490.04" font-size="26" font-weight="700" fill="#231f20" textLength="289" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Swollen or leaking can</text><text x="387" y="530.88" font-size="22" font-weight="400" fill="#231f20" textLength="280" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Do not open or taste; follow</text><text x="387" y="561.88" font-size="22" font-weight="400" fill="#231f20" textLength="241" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">safe disposal guidance.</text></g><path d="M 360 405 L 360 568" fill="none" stroke="#ddd7cc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 32 652 L 98 652" fill="none" stroke="#bc2031" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="119" y="658.88" font-size="22" font-weight="400" fill="#69635f" textLength="211" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Explanatory diagram</text></g></svg>