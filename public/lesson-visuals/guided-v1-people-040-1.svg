<svg xmlns="http://www.w3.org/2000/svg" width="720" height="821" viewBox="0 0 720 821" role="img" aria-labelledby="teaching-70-65-6f-70-6c-65-2d-30-34-30-v-30-title" aria-describedby="teaching-70-65-6f-70-6c-65-2d-30-34-30-v-30-desc" font-family="Arial, sans-serif" data-format="flow" data-visual-id="people-040" data-visual-index="0"><title id="teaching-70-65-6f-70-6c-65-2d-30-34-30-v-30-title">A dinner trial with a defined end</title><desc id="teaching-70-65-6f-70-6c-65-2d-30-34-30-v-30-desc">Two housemates agree a two-week dinner trial, review the workload, and continue only by mutual agreement.
1. Agree tasks. Jo: Mondays. Lee: Wednesdays. Cook shops; the other clears. Two weeks only.
2. Notice the fit. Record timing, shopping, cleanup, and cost concerns.
3. Review. Sunday after the second Wednesday: what worked, and what needs changing?
4. Choose explicitly. Both agree an extension or revision; otherwise each arranges their own meals.</desc><defs><marker id="teaching-70-65-6f-70-6c-65-2d-30-34-30-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-70-65-6f-70-6c-65-2d-30-34-30-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-70-65-6f-70-6c-65-2d-30-34-30-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="821" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="57" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Flow</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="498" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">A dinner trial with a defined end</text><g data-edge-index="0" data-from="0" data-to="1"><path d="M 60 197 L 60 293" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teaching-70-65-6f-70-6c-65-2d-30-34-30-v-30-link)"/></g><g data-edge-index="1" data-from="1" data-to="2"><path d="M 60 352 L 60 417" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teaching-70-65-6f-70-6c-65-2d-30-34-30-v-30-link)"/></g><g data-edge-index="2" data-from="2" data-to="3"><path d="M 60 476 L 60 572" fill="none" stroke="#231f20