<svg xmlns="http://www.w3.org/2000/svg" width="720" height="638" viewBox="0 0 720 638" role="img" aria-labelledby="teaching-77-6f-72-6b-2d-30-32-39-v-30-title" aria-describedby="teaching-77-6f-72-6b-2d-30-32-39-v-30-desc" font-family="Arial, sans-serif" data-format="timeline" data-visual-id="work-029" data-visual-index="0"><title id="teaching-77-6f-72-6b-2d-30-32-39-v-30-title">Changing the reader does not change the record</title><desc id="teaching-77-6f-72-6b-2d-30-32-39-v-30-desc">Version 2 writes a status object; restoring the older reader leaves that object stored.
1. Version 1. Reader expects status text: open.
2. Version 2 writes. Stored status becomes an object with code open and metadata.
3. Version 1 restored. Old reader returns; the new status object still exists.</desc><defs><marker id="teaching-77-6f-72-6b-2d-30-32-39-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-6f-72-6b-2d-30-32-39-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-6f-72-6b-2d-30-32-39-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="638" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="101" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Timeline</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="597" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Changing the reader does not change</text><text x="35" y="150.28" font-size="32" font-weight="700" fill="#231f20" textLength="160" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">the record</text><text x="35" y="212.88" font-size="22" font-weight="400" fill="#231f20" textLength="531" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Event order only; spacing is not proportional to time.</text><g data-time-spacing="ordinal"><path d="M 262 264 L 262 460" fill="none" stroke="#69635f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g data-item-index="0"><text x="35" y="274.04" font-size="26" font-weight="700" fill="#231f20" textLength="122" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Version 1</text><text x="299" y="269.88" font-size="22" font-weight="400" fill="#231f20" textLength="343" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Reader expects status text: open.</text><path d="M 262 255 L 271 264 L 262 273 L 253 264 Z" fill="#f7f4ed" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g data-item-index="1"><text x="35" y="362.04" font-size="26" font-weight="700" fill="#231f20" textLength="122" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Version 2</text><text x="35" y="399.04" font-size="26" font-weight="700" fill="#231f20" textLength="76" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">writes</text><text x="299" y="357.88" font-size="22" font-weight="400" fill="#231f20" textLength="383" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Stored status becomes an object with</text><text x="299" y="388.88" font-size="22" font-weight="400" fill="#231f20" textLength="261" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">code open and metadata.</text><path d="M 262 343 L 271 352 L 262 361 L 253 352 Z" fill="#bc2031" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g data-item-index="2"><text x="35" y="470.04" font-size="26" font-weight="700" fill="#231f20" textLength="122" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Version 1</text><text x="35" y="507.04" font-size="26" font-weight="700" fill="#231f20" textLength="106" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">restored</text><text x="299" y="465.88" font-size="22" font-weight="400" fill="#231f20" textLength="348" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Old reader returns; the new status</text><text x="299" y="496.88" font-size="22" font-weight="400" fill="#231f20" textLength="173" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">object still exists.</text><path d="M 262 451 L 271 460 L 262 469 L 253 460 Z" fill="#f7f4ed" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><path d="M 32 591 L 98 591" fill="none" stroke="#bc2031" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="119" y="597.88" font-size="22" font-weight="400" fill="#69635f" textLength="211" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Explanatory diagram</text></g></svg>