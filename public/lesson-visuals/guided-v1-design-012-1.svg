<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="design-type-012-title" aria-describedby="design-type-012-desc" focusable="false">
<title id="design-type-012-title">Follow the paper across the cut</title>
<desc id="design-type-012-desc">An original vector wide view of a sewing table shows cream #C8C0AE pattern paper on blue cloth. Two larger views below retain the same pattern shape and cloth color. The close-view paper before is yellower #CFC3A4; the target repeats #C8C0AE. The close crops contain different paper-to-cloth proportions from the wide view. These are explanatory drawings, not sampled footage.</desc>
<rect x="0" y="0" width="720" height="720" rx="0" fill="#F7F4ED" stroke="none" stroke-width="2"/>
<g aria-hidden="true">
<text x="32" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#231F20">Follow the paper across the cut</text>
<line x1="32" y1="80" x2="688" y2="80" stroke="#AAA398" stroke-width="2"/>
