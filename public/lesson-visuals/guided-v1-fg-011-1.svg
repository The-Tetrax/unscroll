<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1964" viewBox="0 0 720 1964" role="img" aria-labelledby="teaching-66-67-2d-30-31-31-v-30-title" aria-describedby="teaching-66-67-2d-30-31-31-v-30-desc" font-family="Arial, sans-serif" data-format="spatial" data-visual-id="fg-011" data-visual-index="0"><title id="teaching-66-67-2d-30-31-31-v-30-title">Where the second club constrains cancellation</title><desc id="teaching-66-67-2d-30-31-31-v-30-desc">A member requests access from a coordinator, published criteria constrain the coordinator, and independent review can restore access.
1. Member. Can request access and contest a refusal.
2. Coordinator. Decides access under stated limits.
3. Rehearsal access. Can be withheld or restored.
4. Published criteria. Require reasons tied to the rules.
5. Independent reviewer. Can reverse an improper cancellation.
1 to 2: request.
2 to 3: decide.
4 to 2: constrain.
1 to 5: appeal.
5 to 3: restore.</desc><defs><marker id="teaching-66-67-2d-30-31-31-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-66-67-2d-30-31-31-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-66-67-2d-30-31-31-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker><mask id="teaching-66-67-2d-30-31-31-v-30-connections-mask" maskUnits="userSpaceOnUse" x="36" y="237" width="648" height="650" style="mask-type:luminance"><rect x="36" y="237" width="648" height="650" fill="#ffffff"/><rect x="142.2" y="386" width="90" height="90" fill="#000000"/><rect x="487.8" y="386" width="90" height="90" fill="#000000"/><rect x="487.8" y="644" width="90" height="90" fill="#000000"/><rect x="315" y="515" width="90" height="90" fill="#000000"/><rect x="142.2" y="644" width="90" height="90" fill="#000000"/><rect x="158.2" y="311" width="58" height="58" fill="#000000"/><rect x="503.8" y="311" width="58" height="58" fill="#000000"/><rect x="503.8" y="569" width="58" height="58" fill="#000000"/><rect x="331" y="440" width="58" height="58" fill="#000000"/><rect x="158.2" y="569" width="58" height="58" fill="#000000"/><rect x="211.2" y="316" width="118" height="48" fill="#000000"/><rect x="348.8" y="316" width="160" height="48" fill="#000000"/></mask></defs><rect width="720" height="1964" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031