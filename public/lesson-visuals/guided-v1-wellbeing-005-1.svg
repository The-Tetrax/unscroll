<svg xmlns="http://www.w3.org/2000/svg" width="720" height="589" viewBox="0 0 720 589" role="img" aria-labelledby="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-30-35-v-30-title" aria-describedby="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-30-35-v-30-desc" font-family="Arial, sans-serif" data-format="timeline" data-visual-id="wellbeing-005" data-visual-index="0"><title id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-30-35-v-30-title">Move the meal, keep food available</title><desc id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-30-35-v-30-desc">The main meal occurs before pottery class; after the 21:30 finish and travel, a snack remains available if wanted.
1. Before class. Leave time for the familiar main meal without rushing.
2. Class and travel. Class ends at 21:30; allow for the journey home.
3. After returning. Food remains available if hungry; then prepare for bed.</desc><defs><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-30-35-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-30-35-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-30-35-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="589" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="101" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Timeline</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="559" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Move the meal, keep food available</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="531" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Event order only; spacing is not proportional to time.</text><g data-time-spacing="ordinal"><path d="M 262 219 L 262 423" fill="none" stroke="#69635f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g data-item-index="0"><text x="35" y="229.04" font-size="26" font-weight="700" fill="#231f20" textLength="159" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Before class</text><text x="299" y="224.88" font-siz