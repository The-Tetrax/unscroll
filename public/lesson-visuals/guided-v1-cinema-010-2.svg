1. Phone B. Second stationary view.
2. Near post. Now beside the plant sightline.
3. Middle plant. No longer hidden by the post.
4. Far hill. Still establishes a farther layer.
1 to 3: clear view.</desc><defs><marker id="teaching-63-69-6e-65-6d-61-2d-30-31-30-v-31-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-63-69-6e-65-6d-61-2d-30-31-30-v-31-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-63-69-6e-65-6d-61-2d-30-31-30-v-31-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker><mask id="teaching-63-69-6e-65-6d-61-2d-30-31-30-v-31-connections-mask" maskUnits="userSpaceOnUse" x="36" y="192" width="648" height="650" style="mask-type:luminance"><rect x="36" y="192" width="648" height="650" fill="#ffffff"/><rect x="142.2" y="470" width="90" height="90" fill="#000000"/><rect x="261" y="513" width="90" height="90" fill="#000000"/><rect x="379.8" y="418.4" width="90" height="90" fill="#000000"/><rect x="498.6" y="323.8" width="90" height="90" fill="#000000"/><rect x="158.2" y="395" width="58" height="58" fill="#000000"/><rect x="277" y="438" width="58" height="58" fill="#000000"/><rect x="395.8" y="343.4" width="58" height="58" fill="#000000"/><rect x="514.6" y="248.8" width="58" height="58" fill="#000000"/><rect x="40.2" y="400" width="123" height="48" fill="#000000"/><rect x="567.6" y="253.8" width="100" height="48" fill="#000000"/></mask></defs><rect width="720" height="1539" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="186" lengthAdjust="spacingAndGlyphs" style="line-hei