<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1654" viewBox="0 0 720 1654" role="img" aria-labelledby="teaching-63-69-6e-65-6d-61-2d-30-35-30-v-30-title" aria-describedby="teaching-63-69-6e-65-6d-61-2d-30-35-30-v-30-desc" font-family="Arial, sans-serif" data-format="spatial" data-visual-id="cinema-050" data-visual-index="0"><title id="teaching-63-69-6e-65-6d-61-2d-30-35-30-v-30-title">The camera misses the packet, not its sound</title><desc id="teaching-63-69-6e-65-6d-61-2d-30-35-30-v-30-desc">The camera faces the reader; the companion and packet remain outside its tight view.
1. Reader. Looks toward the packet rustle.
2. Camera. Tight view of reader only.
3. Companion. Outside the tight view; present in the story.
4. Paper packet. Gently rustled by the companion.
2 to 1: view.
