<svg xmlns="http://www.w3.org/2000/svg" width="720" height="492" viewBox="0 0 720 492" role="img" aria-labelledby="teaching-74-65-63-68-2d-30-31-35-v-30-title" aria-describedby="teaching-74-65-63-68-2d-30-31-35-v-30-desc" font-family="Arial, sans-serif" data-format="comparison" data-visual-id="tech-015" data-visual-index="0"><title id="teaching-74-65-63-68-2d-30-31-35-v-30-title">Two packets within the same 1500-byte limit</title><desc id="teaching-74-65-63-68-2d-30-31-35-v-30-desc">Without options, 1460 TCP data bytes fit; twelve option bytes reduce actual data to 1448.
