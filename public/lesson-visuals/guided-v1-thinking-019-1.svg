<svg xmlns="http://www.w3.org/2000/svg" width="720" height="721" viewBox="0 0 720 721" role="img" aria-labelledby="teaching-74-68-69-6e-6b-69-6e-67-2d-30-31-39-v-30-title" aria-describedby="teaching-74-68-69-6e-6b-69-6e-67-2d-30-31-39-v-30-desc" font-family="Arial, sans-serif" data-format="timeline" data-visual-id="thinking-019" data-visual-index="0"><title id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-31-39-v-30-title">A search becomes a follow-up plan</title><desc id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-31-39-v-30-desc">Inspect 120 comparisons, select a star-window pattern, specify a follow-up, then collect suitable new observations.
1. Search 120 comparisons. 30 stars x 4 night windows.
2. Select one pattern. Chosen after inspecting the results.
3. Specify a follow-up. Fix the star, window, measurement, and comparison.
4. Check suitable new data. Evaluate the stated question without hiding new searches.</desc><defs><marker id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-31-39-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-31-39-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-31-39-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="721" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="101" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Timeline</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="553" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">A search becomes a follow-up plan</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="531" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Event order only; spacing is not proportional to time.</text><g data-time-spacing="ordinal"><path d="M 262 219 L 262 543" fill="none" stroke="#69635f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g data-item-index="0"><text x="35" y="229.04" font-size="26" font-weight="700" fill="#231f20" textLength="148" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Search 120</text><text x="35" y="266.04" font-size="