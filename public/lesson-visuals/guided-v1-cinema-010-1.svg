ke="#231f20" stroke-width="2.5"></path><path d="M 140 69 L 167 243 L 249 243 Z" fill="#89917a" stroke="#231f20" stroke-width="2.5"></path><line x1="140" y1="69" x2="167" y2="243" stroke="#fffdf5" stroke-width="2.5" stroke-dasharray=""></line><g transform="translate(118 259) rotate(0) scale(0.92)"><path d="M -37 -50 L -27 0 L 26 0 L 36 -50 Z" fill="#bd7954" stroke="#231f20" stroke-width="2.5"></path><ellipse cx="0" cy="-50" rx="36" ry="9" fill="#b98b60" stroke="#231f20" stroke-width="2.5"></ellipse><path d="M 0 -51 Q -7 -88 1 -134" fill="none" stroke="#657e51" stroke-width="5"></path><path d="M -2 -81 C -50 -73 -56 -111 -47 -116 C -22 -117 -7 -104 -2 -81 Z" fill="#657e51" stroke="#231f20" stroke-width="2.5"></path><path d="M -3 -101 C 46 -104 54 -138 42 -142 C 19 -140 4 -126 -3 -101 Z" fill="#91a56c" stroke="#231f20" stroke-width="2.5"></path><path d="M 0 -127 C -31 -129 -36 -154 -25 -164 C -6 -164 7 -146 0 -127 Z" fill="#657e51" stroke="#231f20" stroke-width="2.5"></path><line x1="-24" y1="-106" x2="-2" y2="-84" stroke="#f7f4ed" stroke-width="2.5" stroke-dasharray=""></line><line x1="27" y1="-132" x2="0" y2="-104" stroke="#f7f4ed" stroke-width="2.5" stroke-dasharray=""></line><line x1="-25" y1="-36" x2="25" y2="-36" stroke="#fffdf5" stroke-width="2.5" stroke-dasharray=""></line></g><rect x="5" y="31" width="82" height="240" rx="0" fill="#fffdf5" stroke="#231f20" stroke-width="2.5"></rect><path d="M 5 31 L 23 45 L 87 45 M 23 45 L 23 271" fill="none" stroke="#69635f" stroke-width="2.5"></path><line x1="0" y1="275" x2="314" y2="275" stroke="#b98b60" stroke-width="2.5" stroke-dasharray=""></line></g><rect x="0" y="0" width="314" height="290" rx="0" fill="none" stroke="#231f20" stroke-width="2.5"></rect></g><text x="32" y="469" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">The near post hides</text><text x="32" y="498" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">much of the plant.</text><text x="374" y="469" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">The stem and most leaves</text><text x="374" y="498" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">emerge beside the post.</text><text x="32" y="552" font-size="24" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="true">Camera moves right</text><g transform="translate(70 626) rotate(0) scale(1)"><rect x="-23" y="0" width="46" height="30" rx="4" fill="#354d59" stroke="#231f20" stroke-width="2.5"></rect><rect x="-10" y="-9" width="20" height="9" rx="0" fill="#231f20" stroke="#231f20" stroke-width="2.5"></rect><rect x="-16" y="6" width="24" height="17" rx="2" fill="#e6dfd3" stroke="none" stroke-width="2.5"></rect><circle cx="15" cy="15" r="3" fill="#bc2031" stroke="none" stroke-width="2.5"></circle></g><g transform="translate(226 626) rotate(0) scale(1)"><rect x="-23" y="0" width="46" height="30" rx="4" fill="#354d59" stroke="#231f20" stroke-width="2.5"></rect><rect x="-10" y="-9" width="20" height="9" rx="0" fill="#231f20" stroke="#231f20" stroke-width="2.5"></rect><rect x="-16" y="6" width="24" height="17" rx="2" fill="#e6dfd3" stroke="none" stroke-width="2.5"></rect><circle cx="15" cy="15" r="3" fill="#bc2031" stroke="none" stroke-width="2.5"></circle></g><line x1="102" y1="637" x2="192" y2="637" stroke="#bc2031" stroke-width="2.5" stroke-dasharray=""></line><path d="M 181.6711 643.1085 L 192 637 L 181.6711 630.8915" fill="none" stroke="#bc2031" stroke-width="3.5"></path><text x="346" y="573" font-size="24" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Near post shifts most.</text><text x="346" y="602" font-size="24" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Plant shifts half as far.</text><text x="346" y="631" font-size="24" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Far hill shifts least.</text><text x="346" y="660" font-size="24" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">All three remain sharp.</text><line x1="32" y1="676" x2="688" y2="676" stroke="#e6dfd3" stroke-width="2.5" stroke-dasharray=""></line><text x="32" y="703" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Original parallax schematic, not measured screen motion.</text><text x="32" y="732" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">The second stationary view needs no artificial background blur.</text><text x="32" y="761" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Choose overlaps that explain depth without hiding the subject.</text></svg>