<svg xmlns="http://www.w3.org/2000/svg" width="720" height="790" viewBox="0 0 720 790" role="img" aria-labelledby="camera-010-title camera-010-description" font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><title id="camera-010-title">Separate the post, plant and paper hill</title><desc id="camera-010-description">The same sharp foreground paper post, middle plant and folded background hill are initially aligned. A sideways camera change shifts the post most, the plant less and the hill least, revealing the plant outline without a blur effect.</desc><defs><clipPath id="camera-010-frame-0" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="314" height="290" rx="0" fill="#ffffff" stroke="none" stroke-width="2.5"></rect></clipPath><clipPath id="camera-010-frame-1" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="314" height="290" rx="0" fill="#ffffff" stroke="none" stroke-width="2.5"></rect></clipPath></defs><rect x="0" y="0" width="720" height="790" rx="0" fill="#f7f4ed" stroke="none" stroke-width="2.5"></rect><text x="32" y="34" font-size="22" font-weight="700" fill="#bc2031" text-anchor="start" data-drawn-text="true">CAMERA 010</text><text x="32" y="73" font-size="26" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="true">Separate the post, plant and paper hill</text><line x1="32" y1="92" x2="688" y2="92" stroke="#231f20" stroke-width="2.5" stroke-dasharray=""></line><text x="32" y="126" font-size="24" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="true">A / Almost aligned</text><text x="374" y="126" font-size="22" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="true">B / Camera shifted sideways</text><g transform="translate(32 145) rotate(0) scale(1)"><rect x="0" y="0" width="314" height="290" rx="0" fill="#dfc9a9" stroke="none" stroke-width="2.5"></rect><g clip-path="url(#camera-010-frame-0)"><path d="M 82 243 L 176 69 L 285 243 Z" fill="#b3b39a" s