<svg xmlns="http://www.w3.org/2000/svg" width="720" height="831" viewBox="0 0 720 831" role="img" aria-labelledby="teaching-70-72-65-73-65-6e-63-65-2d-30-31-36-v-30-title" aria-describedby="teaching-70-72-65-73-65-6e-63-65-2d-30-31-36-v-30-desc" font-family="Arial, sans-serif" data-format="dialogue" data-visual-id="presence-016" data-visual-index="0"><title id="teaching-70-72-65-73-65-6e-63-65-2d-30-31-36-v-30-title">Keep the serving-space need</title><desc id="teaching-70-72-65-73-65-6e-63-65-2d-30-31-36-v-30-desc">An abrupt tray request is acknowledged, specified, and discussed with a practical alternative.
1. You. That came out abruptly. Could we move the empty tray to make serving space?
2. Cook. The side shelf is full. What about the spare counter?
3. You. That works. The plates can stay here.</desc><defs><marker id="teaching-70-72-65-73-65-6e-63-65-2d-30-31-36-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-70-72-65-73-65-6e-63-65-2d-30-31-36-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-70-72-65-73-65-6e-63-65-2d-30-31-36-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="831" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="106" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Dialogue</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="463" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Keep the serving-space need</text><circle cx="79" cy="168" r="22" fill="#231f20" stroke="#231f20" stroke-width="3"/><text x="71.5" y="175.96" font-size="24" font-weight="700" fill="#f7f4ed" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">1</text><text x="119" y="172.04" font-size="26" font-weight="700" fill="#231f20" textLength="52" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">You</text><g data-turn-index="0" data-side="left"><path d="M 78 203 H 489 Q 511 203 511 225  L 511 314 Q 511 336 489 336 H 78 Q 56 336 56 314 L 56 315 L 38 322 L 56 295 L 56 225 Q 56 203 78 203 Z" fill="#f7f4ed" stroke="#231f20" stroke-width="3" 