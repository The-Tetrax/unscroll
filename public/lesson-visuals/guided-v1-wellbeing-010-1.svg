<svg xmlns="http://www.w3.org/2000/svg" width="720" height="589" viewBox="0 0 720 589" role="img" aria-labelledby="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-31-30-v-30-title" aria-describedby="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-31-30-v-30-desc" font-family="Arial, sans-serif" data-format="timeline" data-visual-id="wellbeing-010" data-visual-index="0"><title id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-31-30-v-30-title">Arrival is not the main effort</title><desc id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-31-30-v-30-desc">A late arrival is followed by a preparation decision before any suitable entry into the dance session.
1. Arrive. The group has already completed its introductory stage.
2. Check preparation. Ask about an appropriate familiar entry option first.
3. Join or sit out. Enter at a suitable later point, or do not participate.</desc><defs><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-31-30-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-31-30-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-31-30-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="589" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="101" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Timeline</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="433" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Arrival is not the main effort</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="531" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Event order only; spacing is not proportional to time.</text><g data-time-spacing="ordinal"><path d="M 262 219 L 262 423" fill="none" stroke="#69635f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g data-item-index="0"><text x="35" y="229.04" font-size="26" font-weight="700" fill="#231f20" textLength="76" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Arrive</text><text x="299" y="224.88" font-size="22" font-weight="400" fill="#231f20" textLength="372" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">The group has already completed its</text><text x="299" y="255.88" font-size="22" font-weight="400" fill="#231f20" textLength="190" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">introductory stage.</text><path d="M 262 210 L 271 219 L 262 228 L 253 219 Z" fill="#f7f4ed" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g data-item-index="1"><text x="35" y="325.04" font-size="26" font-weight="700" fill="#231f20" textLength="82" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Check</text><text x="35" y="362.04" font-size="26" font-weight="700" fill="#231f20" textLength="146" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">preparation</text><text x="299" y="320.88" font-size="22" font-weight="400" fill="#231f20" textLength="338" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Ask about an appropriate familiar</text><text x="299" y="351.88" font-size="22" font-weight="400" fill="#231f20" textLength="170" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">entry option first.</text><path d="M 262 306 L 271 315 L 262 324 L 253 315 Z" fill="#bc2031" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g data-item-index="2"><text x="35" y="433.04" font-size="26" font-weight="700" fill="#231f20" textLength="172" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Join or sit out</text><text x="299" y="428.88" font-size="22" font-weight="400" fill="#231f20" textLength="358" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Enter at a suitable later point, or do</text><text x="299" y="459.88" font-size="22" font-weight="400" fill="#231f20" textLength="151" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">not participate.</text><path d="M 262 414 L 271 423 L 262 432 L 253 423 Z" fill="#f7f4ed" stroke="#231f20" stroke-width="3" stroke-linecap="round" stro