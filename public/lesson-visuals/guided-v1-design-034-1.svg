djust="spacingAndGlyphs" text-decoration="none">JPEG replaces transparency with white.</text><rect x="52" y="730" width="612" height="56" rx="5" fill="#F7F4ED" stroke="#231F20" stroke-width="2"></rect><path d="M 70 749 L 70 767 L 81 758 Z" fill="#231F20" stroke="none" stroke-width="2" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round"></path><text x="97" y="765" font-size="24" font-weight="400" fill="#231F20" textLength="235" lengthAdjust="spacingAndGlyphs" text-decoration="none">Image quality options</text><text x="558" y="765" font-size="22" font-weight="400" fill="#69635F" textLength="85" lengthAdjust="spacingAndGlyphs" text-decoration="none">Optional</text><rect x="52" y="802" width="612" height="80" rx="5" fill="#EAE5DB" stroke="none" stroke-width="2"></rect><text x="71" y="832" font-size="22" font-weight="400" fill="#231F20" textLength="245" lengthAdjust="spacingAndGlyphs" text-decoration="none">Copy to Pictures / Prints</text><text x="71" y="868" font-size="22" font-weight="700" fill="#231F20" textLength="208" lengthAdjust="spacingAndGlyphs" text-decoration="none">Original unchanged</text><rect x="52" y="900" width="264" height="54" rx="7" fill="#231F20" stroke="#231F20" stroke-width="2"></rect><text x="112" y="935" font-size="24" font-weight="700" fill="#FFFFFF" textLength="144" lengthAdjust="spacingAndGlyphs" text-decoration="none">Save a copy</text><text x="347" y="934" font-size="22" font-weight="400" fill="#231F20" textLength="213" lengthAdjust="spacingAndGlyphs" text-decoration="none">Creates a new JPEG</text><line x1="32" y1="976" x2="688" y2="976" stroke="#C9C2B6" stroke-width="2" stroke-dasharray=""></line><text x="35" y="1012" font-size="22" font-weight="400" fill="#69635F" textLength="619" lengthAdjust="spacingAndGlyphs" text-decoration="none">Optional compression does not hide the export consequence.</text></g></svg>