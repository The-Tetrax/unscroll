<svg xmlns="http://www.w3.org/2000/svg" width="720" height="976" viewBox="0 0 720 976" role="img" aria-labelledby="teaching-6f-62-73-65-72-76-65-72-2d-30-32-31-v-30-title" aria-describedby="teaching-6f-62-73-65-72-76-65-72-2d-30-32-31-v-30-desc" font-family="Arial, sans-serif" data-format="bars" data-visual-id="observer-021" data-visual-index="0"><title id="teaching-6f-62-73-65-72-76-65-72-2d-30-32-31-v-30-title">Your die against a fixed paper move</title><desc id="teaching-6f-62-73-65-72-76-65-72-2d-30-32-31-v-30-desc">Two die faces lose to paper, two tie, and two win, giving equal probabilities.
1. Lose: rock. Faces 1 and 2; paper beats rock. Value: 2 die faces out of 6.
2. Tie: paper. Faces 3 and 4; both choose paper. Value: 2 die faces out of 6.
3. Win: scissors. Faces 5 and 6; scissors beat paper. Value: 2 die faces out of 6.</desc><defs><marker id="teaching-6f-62-73-65-72-76-65-72-2d-30-32-31-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6f-62-73-65-72-76-65-72-2d-30-32-31-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6f-62-73-65-72-76-65-72-2d-30-32-31-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="976" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="92" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Bar plot</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="569" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Your die against a fixed paper move</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="519" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Zero baseline; bar lengths use the supplied values.</text><text x="35" y="212.96" font-size="24" font-weight="700" fill="#231f20" textLength="266" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Unit: die faces out of 6</text><text x="42.5" y="258.96" font-size="24" font-weight="700" fill="#231f20" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">0</text><g data-item-index="0" data-zero-x="50"><text x="35" y="307.04" font-size="26" font-weight="700" fill="#231f20" textLength="134" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Lose: rock</text><text x="35" y="350.04" font-size="26" font-weight="700" fill="#231f20" textLength="244" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">2 die faces out of 6</text><path d="M 50 402 L 670 402" fill="none" stroke="#ddd7cc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 50 365 L 50 410" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="50" y="370" width="620" height="32" rx="0" fill="#231f20" stroke="none" stroke-width="3"/><path data-value="2" d="M 670 367 V 405" stroke="#231f20" stroke-width="3"/><text x="35" y="444.88" font-size="22" font-weight="400" fill="#231f20" textLength="337" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Faces 1 and 2; paper beats rock.</text></g><g data-item-index="1" data-zero-x="50"><text x="35" y="510.04" font-size="26" font-weight="700" fill="#231f20" textLength="130" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Tie: paper</text><text x="35" y="553.04" font-size="26" font-weight="700" fill="#bc2031" textLength="244" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">2 die faces out of 6</text><path d="M 50 605 L 670 605" fill="none" stroke="#ddd7cc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 50 568 L 50 613" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="50" y="573" width="620" height="32" rx="0" fill="#bc2031" stroke="none" stroke-width="3"/><path data-value="2" d="M 670 570 V 608" stroke="#bc2031" stroke-width="3"/><text x="35" y="647.88" font-size="22" font-weight="400" fill="#231f20" textLength="356" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Faces 3 and 4; both choose paper.</text></g><g data-item-index="2" data-zero-x="50"><text x="35" y="713.04" font-size="26" font-weight="700" fill="#231f20" textLength="170" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Win: scissors</text><text x="35" y="756.04" font-size="26" font-weight="700" fill="#69635f" textLength="244" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">2 die faces out of 6</text><path d="M 50 808 L 670 808" fill="none" stroke="#ddd7cc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 50 771 L 50 816" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="50" y="776" width="620" height="32" rx="0" fill="#69635f" stroke="none" stroke-width="3"/><path data-value="2" d="M 670 773 V 811" stroke="#69635f" stroke-width="3"/><text x="35" y="850.88" font-size="22" font-weight="400" fill="#231f20" textLength="365" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Faces 5 and 6; scissors beat paper.</text></g><path d="M 32 929 L 98 929" fill="none" stroke="#bc2031" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="119" y="935.88" font-size="22" font-weight="400" fill="#69635f" textLength="211" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Explanatory diagram</text></g></svg>