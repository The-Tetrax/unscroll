1. Sink bowl. Above the cabinet.
2. Visible drain bend. No drip observed in this example.
3. Wet patch. Left cabinet floor.
4. Open cabinet front. Observe without reaching inside.
4 to 3: Photograph location.</desc><defs><marker id="teaching-6c-69-66-65-2d-30-30-32-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6c-69-66-65-2d-30-30-32-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6c-69-66-65-2d-30-30-32-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker><mask id="teaching-6c-69-66-65-2d-30-30-32-v-30-connections-mask" maskUnits="userSpaceOnUse" x="36" y="192" width="648" height="650" style="mask-type:luminance"><rect x="36" y="192" width="648" height="650" fill="#ffffff"/><rect x="315" y="319.5" width="90" height="90" fill="#000000"/><rect x="450" y="461.4" width="90" height="90" fill="#000000"/><rect x="163.8" y="491.5" width="90" height="90" fill="#000000"/><rect x="315" y="620.5" width="90" height="90" fill="#000000"/><rect x="331" y="244.5" width="58" height="58" fill="#000000"/><rect x="466" y="386.4" width="58" height="58" fill="#000000"/><rect x="179.8" y="416.5" width="58" height="58" fill="#000000"/><rect x="331" y="545.5" width="58" height="58" fill="#000000"/><rect x="384" y="249.5" width="134" height="48" fill="#000000"/><rect x="232.8" y="421.5" width="140" height="48" fill="#000000"/></mask></defs><rect width="720" height="1539" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="186" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Spati