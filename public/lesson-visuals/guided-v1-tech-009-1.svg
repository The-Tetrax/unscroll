<svg xmlns="http://www.w3.org/2000/svg" width="720" height="783" viewBox="0 0 720 783" role="img" aria-labelledby="teaching-74-65-63-68-2d-30-30-39-v-30-title" aria-describedby="teaching-74-65-63-68-2d-30-30-39-v-30-desc" font-family="Arial, sans-serif" data-format="timeline" data-visual-id="tech-009" data-visual-index="0"><title id="teaching-74-65-63-68-2d-30-30-39-v-30-title">One old answer across an authoritative edit</title><desc id="teaching-74-65-63-68-2d-30-30-39-v-30-desc">An earlier 600-second cache lifetime survives a later authoritative 60-second TTL edit.
1. 09:00: cached. Old address; TTL 600 s
2. 09:02: authority edited. New answers get 60 s; old copy has 480 s left
3. 09:05: old answer eligible. 300 s remain in the earlier cache
4. 09:10: normal expiry. Old cached freshness ends; connections are separate</desc><defs><marker id="teaching-74-65-63-68-2d-30-30-39-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-65-63-68-2d-30-30-39-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-65-63-68-2d-30-30-39-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="783" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="101" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Timeline</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="616" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">One old answer across an authoritative</text><text x="35" y="150.28" font-size="32" font-weight="700" fill="#231f20" textLength="58" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">edit</text><text x="35" y="212.88" font-size="22" font-weight="400" fill="#231f20" textLength="531" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Event order only; spacing is not proportional to time.</text><g data-time-spacing="ordinal"><path d="M 262 264 L 262 605" fill="none" stroke="#69635f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g data-item-index="0"><text x="35" y="274.04" font-size="26" font-weight="700" fill="#231f20" textLength