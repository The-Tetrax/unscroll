<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1654" viewBox="0 0 720 1654" role="img" aria-labelledby="teaching-6c-69-66-65-2d-30-32-33-v-30-title" aria-describedby="teaching-6c-69-66-65-2d-30-32-33-v-30-desc" font-family="Arial, sans-serif" data-format="spatial" data-visual-id="life-023" data-visual-index="0"><title id="teaching-6c-69-66-65-2d-30-32-33-v-30-title">Closed and open projections occupy the hall</title><desc id="teaching-6c-69-66-65-2d-30-32-33-v-30-desc">A top-view hallway shows the wall-side cabinet, the additional open-bin projection, the remaining passage, and an entry door.
1. Cabinet against wall. Closed projection: 25 cm.
2. Open bin. Adds 30 cm into the hall.
3. Remaining passage. 65 cm in this example; assess real needs.
4. Entry door. Its swing and the delivery route also matter.
1 to 2: Bin opens outward.
4 to 3: Keep route usable.</desc><defs><marker id="teaching-6c-69-66-65-2d-30-32-33-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6c-69-66-65-2d-30-32-33-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6c-69-66-65-2d-30-32-33-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker><mask id="teaching-6c-69-66-65-2d-30-32-33-v-30-connections-mask" maskUnits="userSpaceOnUse" x="36" y="237" width="648" height="650" style="mask-type:luminance"><rect x="36" y="237" width="648" height="650" fill="#ffffff"/><rect x="142.2" y="394.6" width="90" height="90" fill="#000000"/><rect x="315" y="394.6" width="90" height="90" fill="#000000"/><rect x="487.8" y="536.5" width="90" height="90" fill="#000000"/><rect x="153" y="644" width="90" height="90" fill="#000000"/><rect x="158.2" y="319.6" width="58" height="58" fill="#000000"/><rect x="331" y="319.6" width="58" height="58" fill="#000000"/><rect x="503.8" y="461.5" width="58" height="58" fill="#000000"/><rect x="169" y="569" width="58" height="58" fill="#000000"/><rect x="384" y="324.6" width="129" height="48" fill="#000000"/><rect x="222" y="574" width="143" height="48" fill="#000000"/></mask></defs><rect width="720" height="1654" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="186" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Spatial dia