<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="design-type-020-title" aria-describedby="design-type-020-desc" focusable="false">
<title id="design-type-020-title">Keep each label nearer its own field</title>
<desc id="design-type-020-desc">Two fictional forms show Date with Sat 14 Nov and Venue with Library room. On the left, similar visible gaps leave Venue between fields. On the right, Date moves closer to its field and Venue closer to its own field, while the complete pairs are separated. A third sample wraps Venue and room name over two lines and keeps its field below the whole label. These are drawings, not live programmatic labels.</desc>
<rect x="0" y="0" width="720" height="720" rx="0" fill="#F7F4ED" stroke="none" stroke-width="2"/>
<g aria-hidden="true">
<text x="32" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#231F20">Keep each label nearer its own field</text>
<line x1="32" y1="80" x2="688" y2="80" stroke="#AAA398" stroke-width="2"/>
<text x="48" y="126" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#231F20">Similar gaps</text><text x="400" y="126" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#231F20">Grouped gaps</text><text x="48" y="180" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#231F20">Date</text><rect x="48" y="222" width="264" height="66" rx="4" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="64" y="264" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#231F20">Sat 14 Nov</text><text x="48" y="348" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#231F20">Venue</text><rect x="48" y="396" width="264" height="66" rx="4" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="64" y="438" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#231F20">Library room</text><text x="400" y="180" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#231F20">Date</text><rect x="400" y="194" width="272" height="66" rx="4" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="416" y="236" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#231F20">Sat 14 Nov</text><text x="400" y="376" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#231F20">Venue</text><rect x="400" y="396" width="272" height="66" rx="4" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="416" y="438" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#231F20">Library room</text><path d="M 677 156 H 686 V 260 H 677 M 677 351 H 686 V 462 H 677" fill="none" stroke="#BC2031" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="40" y1="501" x2="680" y2="501" stroke="#AAA398" stroke-width="2"/><text x="48" y="542" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#231F20">Wrapped label, same pairing</text><text x="48" y="581" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#231F20">Venue and room</text><text x="48" y="615" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#231F20">name</text><rect x="48" y="632" width="624" height="54" rx="4" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="64" y="669" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#231F20">Library room</text>
