<svg xmlns="http://www.w3.org/2000/svg" width="720" height="907" viewBox="0 0 720 907" role="img" aria-labelledby="teaching-70-65-6f-70-6c-65-2d-30-31-35-v-30-title" aria-describedby="teaching-70-65-6f-70-6c-65-2d-30-31-35-v-30-desc" font-family="Arial, sans-serif" data-format="dialogue" data-visual-id="people-015" data-visual-index="0"><title id="teaching-70-65-6f-70-6c-65-2d-30-31-35-v-30-title">Check the reason before proposing a format</title><desc id="teaching-70-65-6f-70-6c-65-2d-30-31-35-v-30-desc">Ana clarifies that questions during each step matter, and her colleague states a concern about recovering from live failure.
1. Colleague. You want everyone to see it happen live. Is that the main reason?
2. Ana. Mainly I want questions at each step.
3. Colleague. I want to avoid recovery delays. Could we pause a recording for questions?</desc><defs><marker id="teaching-70-65-6f-70-6c-65-2d-30-31-35-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-70-65-6f-70-6c-65-2d-30-31-35-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-70-65-6f-70-6c-65-2d-30-31-35-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="907" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="106" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Dialogue</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="585" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Check the reason before proposing a</text><text x="35" y="150.28" font-size="32" font-weight="700" fill="#231f20" textLength="101" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">format</text><circle cx="79" cy="213" r="22" fill="#231f20" stroke="#231f20" stroke-width="3"/><text x="71.5" y="220.96" font-size="24" font-weight="700" fill="#f7f4ed" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">1</text><text x="119" y="217.04" font-size="26" font-weight="700" fill="#231f20" textLength="130" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Colleague</text><g data-turn-index="0" data-side="left