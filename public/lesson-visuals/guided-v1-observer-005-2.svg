<svg xmlns="http://www.w3.org/2000/svg" width="720" height="635" viewBox="0 0 720 635" role="img" aria-labelledby="teaching-6f-62-73-65-72-76-65-72-2d-30-30-35-v-31-title" aria-describedby="teaching-6f-62-73-65-72-76-65-72-2d-30-30-35-v-31-desc" font-family="Arial, sans-serif" data-format="dialogue" data-visual-id="observer-005" data-visual-index="1"><title id="teaching-6f-62-73-65-72-76-65-72-2d-30-30-35-v-31-title">Check the issue, not the gesture</title><desc id="teaching-6f-62-73-65-72-76-65-72-2d-30-30-35-v-31-desc">A neutral question checks the confirmation, which shows tomorrow&apos;s booking date.
1. You. Which confirmation did you receive? Shall we check the date and branch?
2. Friend. Here it is. The date is tomorrow, not today.</desc><defs><marker id="teaching-6f-62-73-65-72-76-65-72-2d-30-30-35-v-31-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6f-62-73-65-72-76-65-72-2d-30-30-35-v-31-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6f-62-73-65-72-76-65-72-2d-30-30-35-v-31-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="635" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="106" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Dialogue</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="510" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Check the issue, not the gesture</text><circle cx="79" cy="168" r="22" fill="#231f20" stroke="#231f20" stroke-width="3"/><text x="71.5" y="175.96" font-size="24" font-weight="700" fill="#f7f4ed" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">1</text><text x="119" y="172.04" font-size="26" font-weight="700" fill="#231f20" textLength="52" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">You</text><g data-turn-index="0" data-side="left"><path d="M 78 203 H 462 Q 484 203 484 225  L 484 314 Q 484 336 462 336 H 78 Q 56 336 56 314 L 56 315 L 38 322 L 56 295 L 56 225 Q 56 203 78 203 Z" fill="#f7f4ed" stroke="#231f20" st