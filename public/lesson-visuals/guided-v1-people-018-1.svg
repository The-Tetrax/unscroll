<svg xmlns="http://www.w3.org/2000/svg" width="720" height="635" viewBox="0 0 720 635" role="img" aria-labelledby="teaching-70-65-6f-70-6c-65-2d-30-31-38-v-30-title" aria-describedby="teaching-70-65-6f-70-6c-65-2d-30-31-38-v-30-desc" font-family="Arial, sans-serif" data-format="flow" data-visual-id="people-018" data-visual-index="0"><title id="teaching-70-65-6f-70-6c-65-2d-30-31-38-v-30-title">An agreed short call</title><desc id="teaching-70-65-6f-70-6c-65-2d-30-31-38-v-30-desc">At 6:10 the caller hears the 6:25 limit, chooses a short update, and the listener closes at the agreed time.
1. 6:10 / opening. I can talk until 6:25. Does that fit what you wanted?
2. Topic chosen. Yes, just a quick update about the seedlings.
