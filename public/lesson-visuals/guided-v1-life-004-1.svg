<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1609" viewBox="0 0 720 1609" role="img" aria-labelledby="teaching-6c-69-66-65-2d-30-30-34-v-30-title" aria-describedby="teaching-6c-69-66-65-2d-30-30-34-v-30-desc" font-family="Arial, sans-serif" data-format="spatial" data-visual-id="life-004" data-visual-index="0"><title id="teaching-6c-69-66-65-2d-30-30-34-v-30-title">Two routes for bathroom moisture</title><desc id="teaching-6c-69-66-65-2d-30-30-34-v-30-desc">Water vapour from a shower can condense at a cold window or leave through an unobstructed extractor.
1. Shower area. Adds water vapour.
2. Cool window. Vapour can become droplets here.
3. Extractor grille. Keep its normal air path clear.
4. Towel on rail. Not draped over the grille.
1 to 2: Condensation possible.
1 to 3: Moist air out.</desc><defs><marker id="teaching-6c-69-66-65-2d-30-30-34-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6c-69-66-65-2d-30-30-34-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6c-69-66-65-2d-30-30-34-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker><mask id="teaching-6c-69-66-65-2d-30-30-34-v-30-connections-mask" maskUnits="userSpaceOnUse" x="36" y="192" width="648" height="650" style="mask-type:luminance"><rect x="36" y="192" width="648" height="650" fill="#ffffff"/><rect x="153" y="564.6" width="90" height="90" fill="#000000"/><rect x="153" y="349.6" width="90" height="90" fill="#000000"/><rect x="477" y="349.6" width="90" height="90" fill="#000000"/><rect x="477" y="564.6" width="90" height="90" fill="#000000"/><rect x="169" y="489.6" width="58" height="58" fill="#000000"/><rect x="169" y="274.6" width="58" height="58" fill="#000000"/><rect x="493" y="274.6" width="58" height="58" fill="#000000"/><rect x="493" y="489.6" width="58" height="58" fill="#000000"/></mask></defs><rect width="720" height="1609" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="186" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Spatial diagram</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="533" lengthAdjust="spacingAndGlyphs" st