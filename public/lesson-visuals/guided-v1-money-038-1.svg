<svg xmlns="http://www.w3.org/2000/svg" width="720" height="773" viewBox="0 0 720 773" role="img" aria-labelledby="teaching-6d-6f-6e-65-79-2d-30-33-38-v-30-title" aria-describedby="teaching-6d-6f-6e-65-79-2d-30-33-38-v-30-desc" font-family="Arial, sans-serif" data-format="bars" data-visual-id="money-038" data-visual-index="0"><title id="teaching-6d-6f-6e-65-79-2d-30-33-38-v-30-title">One-year interest on constant principal</title><desc id="teaching-6d-6f-6e-65-79-2d-30-33-38-v-30-desc">On an unchanged 1,000 units, a 7% simple annual rate costs 70 and an 8% rate costs 80.
1. Reference 4%, rate 7%. 1,000 x 0.07 = 70. Value: 70 units.
2. Reference 5%, rate 8%. 1,000 x 0.08 = 80. Value: 80 units.</desc><defs><marker id="teaching-6d-6f-6e-65-79-2d-30-33-38-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6d-6f-6e-65-79-2d-30-33-38-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6d-6f-6e-65-79-2d-30-33-38-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="773" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="92" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Bar plot</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="611" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">One-year interest on constant principal</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="519" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Zero baseline; bar lengths use the supplied values.</text><text x="35" y="212.96" font-size="24" font-weight="700" fill="#231f20" textLength="119" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Unit: units</text><text x="42.5" y="258.96" font-size="24" font-weight="700" fill="#231f20" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">0</text><g data-item-index="0" data-zero-x="50"><text x="35" y="307.04" font-size="26" font-weight="700" fill="#231