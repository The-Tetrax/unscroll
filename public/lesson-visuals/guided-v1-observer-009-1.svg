<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1154" viewBox="0 0 720 1154" role="img" aria-labelledby="teaching-6f-62-73-65-72-76-65-72-2d-30-30-39-v-30-title" aria-describedby="teaching-6f-62-73-65-72-76-65-72-2d-30-30-39-v-30-desc" font-family="Arial, sans-serif" data-format="dialogue" data-visual-id="observer-009" data-visual-index="0"><title id="teaching-6f-62-73-65-72-76-65-72-2d-30-30-39-v-30-title">A question without an assumed movement</title><desc id="teaching-6f-62-73-65-72-76-65-72-2d-30-30-39-v-30-desc">A neutral question elicits a memory of seeing the key, with uncertainty about its location.
1. You. What do you remember about the studio key, if anything?
2. Friend. I remember seeing it beside a sketchbook this morning.
3. You. Do you remember which sketchbook or where it was?
4. Friend. The large green one. I am unsure where it was lying.</desc><defs><marker id="teaching-6f-62-73-65-72-76-65-72-2d-30-30-39-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6f-62-73-65-72-76-65-72-2d-30-30-39-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6f-62-73-65-72-76-65-72-2d-30-30-39-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="1154" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="106" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Dialogue</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="494" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">A question without an assumed</text><text x="35" y="150.28" font-size="32" font-weight="700" fill="#231f20" textLength="166" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">movement</text><circle cx="79" cy="213" r="22" fill="#231f20" stroke="#231f20" stroke-width="3"/><text x="71.5" y="220.96" font-size="24" font-weight="700" fill="#f7f4ed" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">1</text><text x="119" y="217.04" font-size="26" font-weight="700" fill="#231f20" textLength="52" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">You</text><g data-turn-index="0" data-side="left"><path d="M 78 2