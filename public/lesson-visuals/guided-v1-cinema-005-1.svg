<svg xmlns="http://www.w3.org/2000/svg" width="720" height="820" viewBox="0 0 720 820" role="img" aria-labelledby="camera-005-title camera-005-description" font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><title id="camera-005-title">Paper brightness is not letter focus</title><desc id="camera-005-description">Four BUS 4 card views separate a brightness change from a focus change. A near dark sleeve enters without covering the card. The out-of-plane card is actually blurred with an SVG filter while the sleeve remains sharp.</desc><defs><clipPath id="camera-005-frame-0" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="314" height="228" rx="0" fill="#ffffff" stroke="none" stroke-width="2.5"></rect></clipPath><clipPath id="camera-005-frame-1" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="314" height="228" rx="0" fill="#ffffff" stroke="none" stroke-width="2.5"></rect></clipPath><filter id="camera-005-blur-2" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="4.2"></feGaussianBlur></filter><clipPath id="camera-005-frame-3" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="314" height="228" rx="0" fill="#ffffff" stroke="none" stroke-width="2.5"></rect></clipPath><clipPath id="camera-005-frame-4" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="314" height="228" rx="0" fill="#ffffff" stroke="none" stroke-width="2.5"></rect></clipPath></defs><rect x="0" y="0" width="720" height="820" rx="0" fill="#f7f4ed" stroke="none" stroke-width="2.5"></rect><text x="32" y="34" font-size="22" font-weight="700" fill="#bc2031" text-anchor="start" data-drawn-text="true">CAMERA 005</text><text x="32" y="73" font-size="26" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="true">Paper brightness is not letter focus</text><line x1="32" y1="92" x2="688" y2="92" stroke="#231f20" stroke-width="2.5" stroke-dasharray=""></line><text x="32" y="125" font-size="24" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="true">1 / Card sharp</text><text x="374" y="125" font-size="24" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="true">2 / Brighter, still sharp</text><g transform="translate(32 143) rotate(0) scale(1)"><rect x="0" y="0" width="314" height="228" rx="0" fill="#dfc9a9" stroke="none" stroke-width="2.5"></rect><g clip-path="url(#camera-005-frame-0)"><line x1="0" y1="174" x2="314" y2="174" stroke="#b98b60" stroke-width="2.5" stroke-dasharray=""></line><rect x="128" y="34" width="161" height="111" rx="0" fill="#e7d9bd" stroke="#231f20" stroke-width="2.5"></rect><text x="208.5" y="103" font-size="31" font-weight="700" fill="#231f20" text-anchor="middle" data-drawn-text="true">BUS 4</text><rect x="117" y="24" width="184" height="133" rx="0" fill="none" stroke="#bc2031" stroke-width="2.5"></rect></g><rect x="0" y="0" width="314" height="228" rx="0" fill="none" stroke="#231f20" stroke-width="2.5"></rect></g><g transform="translate(374 143) rotate(0) scale(1)"><rect x="0" y="0" width="314" height="228" rx="0" fill="#dfc9a9" stroke="none" stroke-width="2.5"></rect><g clip-path="url(#camera-005-frame-1)"><line x1="0" y1="174" x2="314" y2="174" stroke="#b98b60" stroke-width="2.5" stroke-dasharray=""></line><rect x="128" y="34" width="161" height="111" rx="0" fill="#ffffff" stroke="#231f20" stroke-width="2.5"></rect><text x="208.5" y="103" font-size="31" font-weight="700" fill="#231f20" text-anchor="middle" data-drawn-text="true">BUS 4</text><g transform="translate(-5 117) rotate(0) scale(1)"><path d="M 0 0 L 110 8 L 145 67 L 100 135 L 0 135 Z" fill="#354d59" stroke="#231f20" stroke-width="2.5"></path><line x1="15" y1="19" x2="61" y2="113" stroke="#557986" stroke-width="2.5" stroke-dasharray=""></line><line x1="28" y1="19" x2="74" y2="113" stroke="#557986" stroke-width="2.5" stroke-dasharray=""></line><line x1="41" y1="19" x2="87" y2="113" stroke="#557986" stroke-width="2.5" stroke-dasharray=""></line><line x1="54" y1="19" x2="100" y2="113" stroke="#557986" stroke-width="2.5" stroke-dasharray=""></line><line x1="67" y1="19" x2="113" y2="113" stroke="#557986" stroke-width="2.5" stroke-dasharray=""></line><path d="M 111 10 Q 123 49 145 67" fill="none" stroke="#fffdf5" stroke-width="2"></path></g><rect x="117" y="24" width="184" height="133" rx="0" fill="none" stroke="#bc2031" stroke-width="2.5"></rect></g><rect x="0" y="0" width="314" height="228" rx="0" fill="none" stroke="#231f20" stroke-width="2.5"></rect></g><text x="32" y="403" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Inspect the letter edges.</text><text x="374" y="403" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Paper tone changes.</text><text x="32" y="445" font-size="24" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="true">3 / Focus shifts nearer</text><text x="374" y="445" font-size="24" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="true">4 / Card focus restored</text><g transform="translate(32 463) rotate(0) scale(1)"><rect x="0" y="0" width="314" height="228" rx="0" fill="#dfc9a9" stroke="none" stroke-width="2.5"></rect><g clip-path="url(#camera-005-frame-3)"><line x1="0" y1="174" x2="314" y2="174" stroke="#b98b60" stroke-width="2.5" stroke-dasharray=""></line><g filter="url(#camera-005-blur-2)"><rect x="128" y="34" width="161" height="111" rx="0" fill="#e7d9bd" stroke="#231f20" stroke-width="2.5"></rect><text x="208.5" y="103" font-size="31" font-weight="700" fill="#231f20" text-anchor="middle" data-drawn-text="true">BUS 4</text></g><g transform="translate(-5 117) rotate(0) scale(1)"><path d="M 0 0 L 110 8 L 145 67 L 100 135 L 0 135 Z" fill="#354d59" stroke="#231f20" stroke-width="2.5"></path><line x1="15" y1="19" x2="61" y2="113" stroke="#557986" stroke-width="2.5" stroke-dasharray=""></line><line x1="28" y1="19" x2="74" y2="113" stroke="#557986" stroke-width="2.5" stroke-dasharray=""></line><line x1="41" y1="19" x2="87" y2="113" stroke="#557986" stroke-width="2.5" stroke-dasharray=""></line><line x1="54" y1="19" x2="100" y2="113" stroke="#557986" stroke-width="2.5" stroke-dasharray=""></line><line x1="67" y1="19" x2="113" y2="113" stroke="#557986" stroke-width="2.5" stroke-dasharray=""></line><path d="M 111 10 Q 123 49 145 67" fill="none" stroke="#fffdf5" stroke-width="2"></path></g><rect x="20" y="162" width="77" height="58" rx="0" fill="none" stroke="#bc2031" stroke-width="2.5"></rect></g><rect x="0" y="0" width="314" height="228" rx="0" fill="none" stroke="#231f20" stroke-width="2.5"></rect></g><g transform="translate(374 463) rotate(0) scale(1)"><rect x="0" y="0" width="314" height="228" rx="0" fill="#dfc9a9" stroke="none" stroke-width="2.5"></rect><g clip-path="url(#camera-005-frame-4)"><line x1="0" y1="174" x2="314" y2="174" stroke="#b98b60" stroke-width="2.5" stroke-dasharray=""></line><rect x="128" y="34" width="161" height="111" rx="0" fill="#e7d9bd" stroke="#231f20" stroke-width="2.5"></rect><text x="208.5" y="103" font-size="31" font-weight="700" fill="#231f20" text-anchor="middle" data-drawn-text="true">BUS 4</text><g transform="translate(-5 117) rotate(0) scale(1)"><path d="M 0 0 L 110 8 L 145 67 L 100 135 L 0 135 Z" fill="#354d59" stroke="#231f20" stroke-width="2.5"></path><line x1="15" y1="19" x2="61" y2="113" stroke="#557986" stroke-width="2.5" stroke-dasharray=""></line><line x1="28" y1="19" x2="74" y2="113" stroke="#557986" stroke-width="2.5" stroke-dasharray=""></line><line x1="41" y1="19" x2="87" y2="113" stroke="#557986" stroke-width="2.5" stroke-dasharray=""></line><line x1="54" y1="19" x2="100" y2="113" stroke="#557986" stroke-width="2.5" stroke-dasharray=""></line><line x1="67" y1="19" x2="113" y2="113" stroke="#557986" stroke-width="2.5" stroke-dasharray=""></line><path d="M 111 10 Q 123 49 145 67" fill="none" stroke="#fffdf5" stroke-width="2"></path></g><rect x="117" y="24" width="184" height="133" rx="0" fill="none" stroke="#bc2031" stroke-width="2.5"></rect></g><rect x="0" y="0" width="314" height="228" rx="0" fill="none" stroke="#231f20" stroke-width="2.5"></rect></g><line x1="32" y1="706" x2="688" y2="706" stroke="#e6dfd3" stroke-width="2.5" stroke-dasharray=""></line><text x="32" y="733" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">SVG blur is schematic, not measured depth of field.</text><text x="32" y="762" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Red outlines mark the illustrated focus target, not phone UI.</text><text x="32" y="791" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Brightness and focus need separate checks in the saved file.</text></svg>