<svg xmlns="http://www.w3.org/2000/svg" width="720" height="818" viewBox="0 0 720 818" role="img" aria-labelledby="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-33-31-v-30-title" aria-describedby="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-33-31-v-30-desc" font-family="Arial, sans-serif" data-format="bars" data-visual-id="wellbeing-031" data-visual-index="0"><title id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-33-31-v-30-title">Equal soup quantities change the comparison</title><desc id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-33-31-v-30-desc">On a common 100 gram basis, fictional Soup A contains 0.4 grams of salt and Soup B contains 0.32 grams.
1. Soup A. 0.6 g per 150 g becomes 0.4 g per 100 g. Value: 0.4 g salt per 100 g soup.
