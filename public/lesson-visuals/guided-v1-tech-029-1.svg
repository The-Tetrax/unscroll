<svg xmlns="http://www.w3.org/2000/svg" width="720" height="821" viewBox="0 0 720 821" role="img" aria-labelledby="teaching-74-65-63-68-2d-30-32-39-v-30-title" aria-describedby="teaching-74-65-63-68-2d-30-32-39-v-30-desc" font-family="Arial, sans-serif" data-format="flow" data-visual-id="tech-029" data-visual-index="0"><title id="teaching-74-65-63-68-2d-30-32-39-v-30-title">A genuine portal authentication attempt</title><desc id="teaching-74-65-63-68-2d-30-32-39-v-30-desc">Portal challenge, browser relying-party check, authenticator proof, then service verification.
1. Portal challenge. portal.example starts a fresh authentication attempt
2. Browser scope check. Requesting origin must be permitted to use RP ID portal.example
3. Authenticator proof. Scoped private key signs the required authentication data
4. Service verification. Check signature, challenge, origin, and relying-party context
1 to 2.
2 to 3.
