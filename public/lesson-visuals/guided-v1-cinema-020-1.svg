<svg xmlns="http://www.w3.org/2000/svg" width="720" height="820" viewBox="0 0 720 820" role="img" aria-labelledby="camera-020-title camera-020-description" font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><title id="camera-020-title">Change only the open-card hold</title><desc id="camera-020-description">Two rows contain identical unfold, readable MEET AT SIX, and refold drawings. Below, proportional one-second-unit bars show take A lasting one plus one plus one seconds, and take B one plus three plus one seconds. Only the middle hold grows.</desc><defs><clipPath id="camera-020-frame-0" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="208" height="153" rx="0" fill="#ffffff" stroke="none" stroke-width="2.5"></rect></clipPath><clipPath id="camera-020-frame-1" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="208" height="153" rx="0" fill="#ffffff" stroke="none" stroke-width="2.5"></rect></clipPath><clipPath id="camera-020-frame-2" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="208" height="153" rx="0" fill="#ffffff" stroke="none" stroke-width="2.5"></rect></clipPath><clipPath id="camera-020-frame-3" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="208" height="153" rx="0" fill="#ffffff" stroke="none" stroke-width="2.5"></rect></clipPath><clipPath id="camera-020-frame-4" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="208" height="153" rx="0" fill="#ffffff" stroke="none" stroke-width="2.5"></rect></clipPath><clipPath id="camera-020-frame-5" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="208" height="153" rx="0" fill="#ffffff" stroke="none" stroke-width="2.5"></rect></clipPath></defs><rect x="0" y="0" width="720" height="820" rx="0" fill="#f7f4ed" stroke="none" stroke-width="2.5"></rect><text x="32" y="34" font-size="22" font-weight="700" fill="#bc2031" text-anchor="start" data-drawn-text="true">CAMERA 020</text><text x="32" y="73" font-size="26" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="true">Change only the open-card hold</text><line x1="32" y1="92" x2="688" y2="92" stroke="#231f20" stroke-width="2.5" stroke-dasharray=""></line><text x="32" y="128" font-size="24" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="true">Take A / 1 + 1 + 1 = 3 s</text><g transform="translate(32 146) rotate(0) scale(1)"><rect x="0" y="0" width="208" height="153" rx="0" fill="#dfc9a9" stroke="none" stroke-width="2.5"></rect><g clip-path="url(#camera-020-frame-0)"><rect x="19" y="23" width="172" height="104" rx="0" fill="#fffdf5" stroke="#231f20" stroke-width="2.5"></rect><text x="105" y="67" font-size="28" font-weight="700" fill="#231f20" text-anchor="middle" data-drawn-text="true">MEET</text><text x="105" y="104" font-size="28" font-weight="700" fill="#231f20" text-anchor="middle" data-drawn-text="true">AT SIX</text><path d="M 105 23 L 157 9 L 157 112 L 105 127 Z" fill="#e6dfd3" stroke="#231f20" stroke-width="2.5"></path><g transform="translate(167 69) rotate(0) scale(0.47)"><path d="M 146 27 L 107 25 C 87 8 67 6 41 10 L 12 14 Q 2 17 9 26 L 53 25 L 9 32 Q 0 36 7 44 L 54 40 L 18 48 Q 8 53 16 61 L 61 52 L 39 63 Q 33 71 43 77 L 81 63 L 64 85 Q 58 94 68 98 Q 74 101 83 91 L 108 73 L 146 77 Z" fill="#deb18d" stroke="#231f20" stroke-width="2.5"></path><path d="M 83 34 Q 75 48 81 63 M 57 25 L 73 27 M 57 40 L 71 40" fill="none" stroke="#b98b60" stroke-width="2"></path><rect x="126" y="25" width="24" height="53" rx="0" fill="#557986" stroke="#231f20" stroke-width="2.5"></rect></g></g><rect x="0" y="0" width="208" height="153" rx="0" fill="none" stroke="#231f20" stroke-width="2.5"></rect></g><g transform="translate(256 146) rotate(0) scale(1)"><rect x="0" y="0" width="208" height="153" rx="0" fill="#dfc9a9" stroke="none" stroke-width="2.5"></rect><g clip-path="url(#camera-020-frame-1)"><rect x="19" y="23" width="172" height="104" rx="0" fill="#fffdf5" stroke="#231f20" stroke-width="2.5"></rect><text x="105" y="67" font-size="28" font-weight="700" fill="#231f20" text-anchor="middle" data-drawn-text="true">MEET</text><text x="105" y="104" font-size="28" font-weight="700" fill="#231f20" text-anchor="middle" data-drawn-text="true">AT SIX</text><line x1="105" y1="27" x2="105" y2="39" stroke="#e6dfd3" stroke-width="2.5" stroke-dasharray=""></line></g><rect x="0" y="0" width="208" height="153" rx="0" fill="none" stroke="#231f20" stroke-width="2.5"></rect></g><g transform="translate(480 146) rotate(0) scale(1)"><rect x="0" y="0" width="208" height="153" rx="0" fill="#dfc9a9" stroke="none" stroke-width="2.5"></rect><g clip-path="url(#camera-020-frame-2)"><rect x="62" y="23" width="87" height="104" rx="0" fill="#fffdf5" stroke="#231f20" stroke-width="2.5"></rect><line x1="70" y1="27" x2="70" y2="124" stroke="#e6dfd3" stroke-width="2.5" stroke-dasharray=""></line><g transform="translate(136 71) rotate(0) scale(0.47)"><path d="M 146 27 L 107 25 C 87 8 67 6 41 10 L 12 14 Q 2 17 9 26 L 53 25 L 9 32 Q 0 36 7 44 L 54 40 L 18 48 Q 8 53 16 61 L 61 52 L 39 63 Q 33 71 43 77 L 81 63 L 64 85 Q 58 94 68 98 Q 74 101 83 91 L 108 73 L 146 77 Z" fill="#deb18d" stroke="#231f20" stroke-width="2.5"></path><path d="M 83 34 Q 75 48 81 63 M 57 25 L 73 27 M 57 40 L 71 40" fill="none" stroke="#b98b60" stroke-width="2"></path><rect x="126" y="25" width="24" height="53" rx="0" fill="#557986" stroke="#231f20" stroke-width="2.5"></rect></g></g><rect x="0" y="0" width="208" height="153" rx="0" fill="none" stroke="#231f20" stroke-width="2.5"></rect></g><rect x="32" y="318" width="112" height="42" rx="0" fill="#231f20" stroke="#f7f4ed" stroke-width="2.5"></rect><text x="88" y="347" font-size="22" font-weight="700" fill="#fffdf5" text-anchor="middle" data-drawn-text="true">Open 1 s</text><rect x="144" y="318" width="112" height="42" rx="0" fill="#bc2031" stroke="#f7f4ed" stroke-width="2.5"></rect><text x="200" y="347" font-size="22" font-weight="700" fill="#fffdf5" text-anchor="middle" data-drawn-text="true">Hold 1 s</text><rect x="256" y="318" width="112" height="42" rx="0" fill="#231f20" stroke="#f7f4ed" stroke-width="2.5"></rect><text x="312" y="347" font-size="22" font-weight="700" fill="#fffdf5" text-anchor="middle" data-drawn-text="true">Close 1 s</text><text x="32" y="441" font-size="24" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="true">Take B / 1 + 3 + 1 = 5 s</text><g transform="translate(32 459) rotate(0) scale(1)"><rect x="0" y="0" width="208" height="153" rx="0" fill="#dfc9a9" stroke="none" stroke-width="2.5"></rect><g clip-path="url(#camera-020-frame-3)"><rect x="19" y="23" width="172" height="104" rx="0" fill="#fffdf5" stroke="#231f20" stroke-width="2.5"></rect><text x="105" y="67" font-size="28" font-weight="700" fill="#231f20" text-anchor="middle" data-drawn-text="true">MEET</text><text x="105" y="104" font-size="28" font-weight="700" fill="#231f20" text-anchor="middle" data-drawn-text="true">AT SIX</text><path d="M 105 23 L 157 9 L 157 112 L 105 127 Z" fill="#e6dfd3" stroke="#231f20" stroke-width="2.5"></path><g transform="translate(167 69) rotate(0) scale(0.47)"><path d="M 146 27 L 107 25 C 87 8 67 6 41 10 L 12 14 Q 2 17 9 26 L 53 25 L 9 32 Q 0 36 7 44 L 54 40 L 18 48 Q 8 53 16 61 L 61 52 L 39 63 Q 33 71 43 77 L 81 63 L 64 85 Q 58 94 68 98 Q 74 101 83 91 L 108 73 L 146 77 Z" fill="#deb18d" stroke="#231f20" stroke-width="2.5"></path><path d="M 83 34 Q 75 48 81 63 M 57 25 L 73 27 M 57 40 L 71 40" fill="none" stroke="#b98b60" stroke-width="2"></path><rect x="126" y="25" width="24" height="53" rx="0" fill="#557986" stroke="#231f20" stroke-width="2.5"></rect></g></g><rect x="0" y="0" width="208" height="153" rx="0" fill="none" stroke="#231f20" stroke-width="2.5"></rect></g><g transform="translate(256 459) rotate(0) scale(1)"><rect x="0" y="0" width="208" height="153" rx="0" fill="#dfc9a9" stroke="none" stroke-width="2.5"></rect><g clip-path="url(#camera-020-frame-4)"><rect x="19" y="23" width="172" height="104" rx="0" fill="#fffdf5" stroke="#231f20" stroke-width="2.5"></rect><text x="105" y="67" font-size="28" font-weight="700" fill="#231f20" text-anchor="middle" data-drawn-text="true">MEET</text><text x="105" y="104" font-size="28" font-weight="700" fill="#231f20" text-anchor="middle" data-drawn-text="true">AT SIX</text><line x1="105" y1="27" x2="105" y2="39" stroke="#e6dfd3" stroke-width="2.5" stroke-dasharray=""></line></g><rect x="0" y="0" width="208" height="153" rx="0" fill="none" stroke="#231f20" stroke-width="2.5"></rect></g><g transform="translate(480 459) rotate(0) scale(1)"><rect x="0" y="0" width="208" height="153" rx="0" fill="#dfc9a9" stroke="none" stroke-width="2.5"></rect><g clip-path="url(#camera-020-frame-5)"><rect x="62" y="23" width="87" height="104" rx="0" fill="#fffdf5" stroke="#231f20" stroke-width="2.5"></rect><line x1="70" y1="27" x2="70" y2="124" stroke="#e6dfd3" stroke-width="2.5" stroke-dasharray=""></line><g transform="translate(136 71) rotate(0) scale(0.47)"><path d="M 146 27 L 107 25 C 87 8 67 6 41 10 L 12 14 Q 2 17 9 26 L 53 25 L 9 32 Q 0 36 7 44 L 54 40 L 18 48 Q 8 53 16 61 L 61 52 L 39 63 Q 33 71 43 77 L 81 63 L 64 85 Q 58 94 68 98 Q 74 101 83 91 L 108 73 L 146 77 Z" fill="#deb18d" stroke="#231f20" stroke-width="2.5"></path><path d="M 83 34 Q 75 48 81 63 M 57 25 L 73 27 M 57 40 L 71 40" fill="none" stroke="#b98b60" stroke-width="2"></path><rect x="126" y="25" width="24" height="53" rx="0" fill="#557986" stroke="#231f20" stroke-width="2.5"></rect></g></g><rect x="0" y="0" width="208" height="153" rx="0" fill="none" stroke="#231f20" stroke-width="2.5"></rect></g><rect x="32" y="631" width="112" height="42" rx="0" fill="#231f20" stroke="#f7f4ed" stroke-width="2.5"></rect><text x="88" y="660" font-size="22" font-weight="700" fill="#fffdf5" text-anchor="middle" data-drawn-text="true">Open 1 s</text><rect x="144" y="631" width="336" height="42" rx="0" fill="#bc2031" stroke="#f7f4ed" stroke-width="2.5"></rect><text x="312" y="660" font-size="22" font-weight="700" fill="#fffdf5" text-anchor="middle" data-drawn-text="true">Hold 3 s</text><rect x="480" y="631" width="112" height="42" rx="0" fill="#231f20" stroke="#f7f4ed" stroke-width="2.5"></rect><text x="536" y="660" font-size="22" font-weight="700" fill="#fffdf5" text-anchor="middle" data-drawn-text="true">Close 1 s</text><line x1="32" y1="706" x2="688" y2="706" stroke="#e6dfd3" stroke-width="2.5" stroke-dasharray=""></line><text x="32" y="733" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Bars use 1 s units; pictures are selected moments, not duration.</text><text x="32" y="762" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">MEET AT SIX has the same sharpness and placement in both.</text><text x="32" y="791" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">The longer hold is a rehearsal test, not a reading-time rule.</text></svg>