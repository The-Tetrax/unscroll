<svg xmlns="http://www.w3.org/2000/svg" width="720" height="840" viewBox="0 0 720 840" role="img" aria-labelledby="light-edit-028-title light-edit-028-desc" font-family="Arial" font-size="22"><title id="light-edit-028-title">Intercept the wall light, not daylight</title><desc id="light-edit-028-desc">Paired top views show an open white paperback, window at left, and pale wall at right. Without a flag, reflected light reaches the crease. With a matte dark cover between wall and book, the returning arrows stop at the cover. Lower drawings retain the same bright left page but deepen the crease. Top views: the main window-to-book path stays open. The dark cover stops returning light; it emits no darkness. All objects are original schematic drawings, not photographed frames. Colors and spacing are illustrative, not measurements.</desc><metadata>Source: original UNSCROLL vector artwork. No external media, film stills, or third-party characters.</metadata><defs></defs><rect x="0" y="0" width="720" height="840" rx="0" fill="#f5efe5" stroke="none" stroke-width="2"/><text x="34" y="44" font-size="22" font-weight="700" fill="#a92c3b" textLength="149.808" lengthAdjust="spacingAndGlyphs">CINEMA / 028</text><text x="34" y="88" font-size="26" font-weight="700" fill="#272322" textLength="450.441" lengthAdjust="spacingAndGlyphs">Intercept the wall light, not daylight</text><path d="M32 112 L688 112" fill="none" stroke="#cfc4b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="32" y="136" width="316" height="548" rx="8" fill="#fffdf7" stroke="#c8bdae" stroke-width="2"/><text x="48" y="174" font-size="24" font-weight="700" fill="#272322" textLength="219.649" lengthAdjust="spacingAndGlyphs">Without dark cover</text><text x="48" y="222" font-size="22" font-weight="400" fill="#272322" textLength="82.262" lengthAdjust="spacingAndGlyphs">Window</text><text x="217.495" y="222" font-size="22" font-weight="400" fill="#272322" textLength="97.01" lengthAdjust="spacingAn