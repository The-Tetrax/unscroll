<svg xmlns="http://www.w3.org/2000/svg" width="720" height="658" viewBox="0 0 720 658" role="img" aria-labelledby="teaching-6f-62-73-65-72-76-65-72-2d-30-33-32-v-30-title" aria-describedby="teaching-6f-62-73-65-72-76-65-72-2d-30-33-32-v-30-desc" font-family="Arial, sans-serif" data-format="timeline" data-visual-id="observer-032" data-visual-index="0"><title id="teaching-6f-62-73-65-72-76-65-72-2d-30-33-32-v-30-title">Three different kinds of subtitle information</title><desc id="teaching-6f-62-73-65-72-76-65-72-2d-30-33-32-v-30-desc">A remembered summary is checked against an earlier conditional message, then a new current commitment is confirmed.
1. Remembered summary. Thought review was agreed for Friday; exact conditions uncertain.
2. Earlier message. Offer to check timing depended on receiving the final edit first.
