<svg xmlns="http://www.w3.org/2000/svg" width="720" height="840" viewBox="0 0 720 840" role="img" aria-labelledby="camera-008-title camera-008-description" font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><title id="camera-008-title">Match the front house; compare the rear</title><desc id="camera-008-description">Pinhole-projected equal-height paper houses compare an original view, a digital crop and a nearer viewpoint. Actual rear-to-front drawing heights are one half, one half and one third. Camera positions at zero and twenty centimeters face houses at forty and eighty centimeters. A small fixed lateral offset keeps both houses visible.</desc><defs><clipPath id="camera-008-frame-0" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="208" height="244" rx="0" fill="#ffffff" stroke="none" stroke-width="2.5"></rect></clipPath><clipPath id="camera-008-frame-1" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="208" height="244" rx="0" fill="#ffffff" stroke="none" stroke-width="2.5"></rect></clipPath><clipPath id="camera-008-frame-2" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="208" height="244" rx="0" fill="#ffffff" stroke="none" stroke-width="2.5"></rect></clipPath></defs><rect x="0" y="0" width="720" height="840" rx="0" fill="#f7f4ed" stroke="none" stroke-width="2.5"></rect><text x="32" y="34" font-size="22" font-weight="700" fill="#bc2031" text-anchor="start" data-drawn-text="true">CAMERA 008</text><text x="32" y="73" font-size="26" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="true">Match the front house; compare the rear</text><line x1="32" y1="92" x2="688" y2="92" stroke="#231f20" stroke-width="2.5" stroke-dasharray=""></line><text x="32" y="125" font-size="24" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="true">Original view</text><g transform="translate(32 144) rotate(0) scale(1)"><rect x="0" y="0" width="208" height="244" rx="0" fill="#e6dfd3" stroke="