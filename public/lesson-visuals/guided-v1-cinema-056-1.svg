<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1639" viewBox="0 0 720 1639" role="img" aria-labelledby="teaching-63-69-6e-65-6d-61-2d-30-35-36-v-30-title" aria-describedby="teaching-63-69-6e-65-6d-61-2d-30-35-36-v-30-desc" font-family="Arial, sans-serif" data-format="spatial" data-visual-id="cinema-056" data-visual-index="0"><title id="teaching-63-69-6e-65-6d-61-2d-30-35-36-v-30-title">One marker changes hands differently</title><desc id="teaching-63-69-6e-65-6d-61-2d-30-35-36-v-30-desc">Two writers share a card; one marker can sit centrally or beside A.
1. Writer A. Left position stays fixed.
2. Writer B. Needs the marker to finish.
3. Central marker. Version 1: either writer can reach.
4. Side marker. Version 2: beside writer A.
5. Greeting card. Same unfinished card in both versions.
4 to 2: handover.</desc><defs><marker id="teaching-63-69-6e-65-6d-61-2d-30-35-36-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-63-69-6e-65-6d-61-2d-30-35-36-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-63-69-6e-65-6d-61-2d-30-35-36-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker><mask id="teaching-63-69-6e-65-6d-61-2d-30-35-36-v-30-connections-mask" maskUnits="userSpaceOnUse" x="36" y="192" width="648" height="650" style="mask-type:luminance"><rect x="36" y="192" width="648" height="650" fill="#ffffff"/><rect x="142.2" y="362.5" width="90" height="90" fill="#000000"/><rect x="487.8" y="362.5" width="90" height="90" fill="#000000"/><rect x="315" y="362.5" width="90" height="90" fill="#000000"/><rect x="142.2" y="581.8" width="90" height="90" fill="#000000"/><rect x="417.6" y="581.8" width="90" height="90" fill="#000000"/><rect x="158.2" y="287.5" width="58" height="58" fill="#000000"/><rect x="503.8" y="287.5" width="58" height="58" fill="#000000"/><rect x="331" y="287.5" width="58" height="58" fill="#000000"/><rect x="158.2" y="506.8" width="58" height="58" fill="#000000"/><rect x="433.6" y="506.8" width="58" height="58" fill="#000000"/><rect x="211.2" y="292.5" width="117" height="48" fill="#000000"/><rect x="556.8" y="292.5" width="117" height="48" fill="#000000"/></mask></defs><rect width="720" height="1639" fill="#f7f4ed"/><g aria-hidden="tr