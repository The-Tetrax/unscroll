<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1083" viewBox="0 0 720 1083" role="img" aria-labelledby="teaching-77-6f-72-6b-2d-30-33-30-v-30-title" aria-describedby="teaching-77-6f-72-6b-2d-30-33-30-v-30-desc" font-family="Arial, sans-serif" data-format="dialogue" data-visual-id="work-030" data-visual-index="0"><title id="teaching-77-6f-72-6b-2d-30-33-30-v-30-title">A question becomes a missing prerequisite</title><desc id="teaching-77-6f-72-6b-2d-30-33-30-v-30-desc">A newcomer asks for the report identity and expected output; the author supplies missing prerequisites.
1. New reader. Which report does correct refer to?
2. Author. Synthetic R3, edition 2. That prerequisite is missing from the checklist.
3. New reader. What proves the output is right?
