    <text x="238" y="275" text-anchor="start" font-size="24" font-weight="400" fill="#231f20">Opening</text>
    <text x="280" y="369" text-anchor="middle" font-size="24" font-weight="400" fill="#bc2031">Gap</text>
    <text x="240" y="574" text-anchor="start" font-size="24" font-weight="400" fill="#231f20">Crossing</text>
    <path d="M282 548 V478" fill="none" stroke="#69635f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M534 300 L560 462 L586 300" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill-opacity="0.10"/>
