<svg xmlns="http://www.w3.org/2000/svg" width="720" height="635" viewBox="0 0 720 635" role="img" aria-labelledby="teaching-74-68-69-6e-6b-69-6e-67-2d-30-31-37-v-30-title" aria-describedby="teaching-74-68-69-6e-6b-69-6e-67-2d-30-31-37-v-30-desc" font-family="Arial, sans-serif" data-format="flow" data-visual-id="thinking-017" data-visual-index="0"><title id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-31-37-v-30-title">The direction of the p-value calculation</title><desc id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-31-37-v-30-desc">Assume the null model, calculate the test statistic, and compare it with the model distribution.
1. Assume the null model. No mean difference, plus the specified test assumptions.
2. Calculate the statistic. Summarize the observed contrast with the chosen test.
3. Compare under the model. p = 0.03 for statistics at least as extreme by that rule.
1 to 2.
