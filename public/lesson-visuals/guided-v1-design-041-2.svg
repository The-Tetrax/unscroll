<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1849" viewBox="0 0 720 1849" role="img" aria-labelledby="teaching-64-65-73-69-67-6e-2d-30-34-31-v-31-title" aria-describedby="teaching-64-65-73-69-67-6e-2d-30-34-31-v-31-desc" font-family="Arial, sans-serif" data-format="spatial" data-visual-id="design-041" data-visual-index="1"><title id="teaching-64-65-73-69-67-6e-2d-30-34-31-v-31-title">A corner introduces two directions</title><desc id="teaching-64-65-73-69-67-6e-2d-30-34-31-v-31-desc">Two edges leave a near corner, passing through separate far corners toward left and right vanishing points.
1. Left vanishing point. Same horizon.
2. Near corner. Two directions meet.
3. Right vanishing point. Same horizon.
4. Left far corner. Left family.
5. Right far corner. Right family.
2 to 4.
4 to 1.
2 to 5.
5 to 3.</desc><defs><marker id="teaching-64-65-73-69-67-6e-2d-30-34-31-v-31-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-64-65-73-69-67-6e-2d-30-34-31-v-31-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-64-65-73-69-67-6e-2d-30-34-31-v-31-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker><mask id="teaching-64-65-73-69-67-6e-2d-30-34-31-v-31-connections-mask" maskUnits="userSpaceOnUse" x="36" y="192" width="648" height="650" style="mask-type:luminance"><rect x="36" y="192" width="648" height="650" fill="#ffffff"/><rect x="99" y="323.8" width="90" height="90" fill="#000000"/><rect x="315" y="590.4" width="90" height="90" fill="#000000"/><rect x="531" y="323.8" width="90" height="90" fill="#000000"/><rect x="207" y="457.1" width="90" height="90" fill="#000000"/><rect x="423" y="457.1" width="90" height="90" fill="#000000"/><rect x="115" y="248.8" width="58" height="58" fill="#000000"/><rect x="331" y="515.4" width="58" height="58" fill="#000000"/><rect x="547" y="248.8" width="58" height="58" fill="#000000"/><rect x="223" y="382.1" width="58" height="58" fill="#000000"/><rect x="439" y="382.1" width="58" height="58" fill="#000000"/></mask></defs><rect width="720" height="1849" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="186" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Spatial dia