ht="400" text-anchor="middle" fill="#231F20">A</text><text x="324" y="422" font-family="Georgia, serif" font-size="112" font-weight="400" text-anchor="middle" fill="#231F20">V</text><text x="504" y="422" font-family="Georgia, serif" font-size="112" font-weight="400" text-anchor="middle" fill="#231F20">A</text><line x1="180" y1="431" x2="180" y2="441" stroke="#AAA398" stroke-width="1"/><line x1="324" y1="431" x2="324" y2="441" stroke="#AAA398" stroke-width="1"/><line x1="504" y1="431" x2="504" y2="441" stroke="#AAA398" stroke-width="1"/><line x1="180" y1="449" x2="324" y2="449" stroke="#231F20" stroke-width="2"/><line x1="180" y1="442" x2="180" y2="456" stroke="#231F20" stroke-width="2"/><line x1="324" y1="442" x2="324" y2="456" stroke="#231F20" stroke-width="2"/><text x="252" y="483" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#231F20">24 units</text><line x1="324" y1="449" x2="504" y2="449" stroke="#231F20" stroke-width="2"/><line x1="324" y1="442" x2="324" y2="456" stroke="#231F20" stroke-width="2"/><line x1="504" y1="442" x2="504" y2="456" stroke="#231F20" stroke-width="2"/><text x="414" y="483" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#231F20">30 units</text><text x="40" y="512" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#231F20">Track run: 14 / 50 / 86</text><text x="144" y="622" font-family="Georgia, serif" font-size="112" font-weight="400" text-anchor="middle" fill="#231F20">A</text><text x="360" y="622" font-family="Georgia, serif" font-size="112" font-weight="400" text-anchor="middle" fill="#231F20">V</text><text x="576" y="622" font-family="Georgia, serif" font-size="112" font-weight="400" text-anchor="middle" fill="#231F20">A</text><line x1="144" y1="631" x2="144" y2="641" stroke="#AAA398" stroke-width="1"/><line x1="360" y1="631" x2="360" y2="641" stroke="#AAA398" stroke-width="1"/><line x1="576" y1="631" x2="