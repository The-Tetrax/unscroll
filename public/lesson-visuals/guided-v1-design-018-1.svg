<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="design-type-018-title" aria-describedby="design-type-018-desc" focusable="false">
<title id="design-type-018-title">Kerning changes a pair; tracking a run</title>
<desc id="design-type-018-desc">Three rows use the same individual 112 px Georgia A, V and A glyphs with explicitly centered positions. A coordinate unit equals 6 SVG px, with a fixed 60 px origin. Initial centers 20,50,80 give 30/30 separations. Pair-adjusted centers 20,44,74 give 24/30: both trailing letters move left 36 px. Tracking centers 14,50,86 give 36/36. These are center placements, not ink-gap or automatic kerning measurements.</desc>
<rect x="0" y="0" width="720" height="720" rx="0" fill="#F7F4ED" stroke="none" stroke-width="2"/>
<g aria-hidden="true">
<text x="32" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#231F20">Kerning changes a pair; tracking a run</text>
<line x1="32" y1="80" x2="688" y2="80" stroke="#AAA398" stroke-width="2"/>
