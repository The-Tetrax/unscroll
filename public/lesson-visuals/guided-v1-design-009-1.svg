<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="design-type-009-title" aria-describedby="design-type-009-desc" focusable="false">
<title id="design-type-009-title">A waveform keeps horizontal position</title>
<desc id="design-type-009-desc">Eight equal 80 px wide image blocks contain six dark #333333 blocks at the left and two bright #CCCCCC blocks at the right. Beneath, a schematic waveform stays low over the first six blocks and high over the last two. A separate horizontal histogram has bar lengths 336 and 112 px: six and two blocks, or 75 and 25 percent. Waveform heights are schematic, not an IRE or luminance conversion.</desc>
<rect x="0" y="0" width="720" height="720" rx="0" fill="#F7F4ED" stroke="none" stroke-width="2"/>
<g aria-hidden="true">
<text x="32" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#231F20">A waveform keeps horizontal position</text>
<line x1="32" y1="80" x2="688" y2="80" stroke="#AAA398" stroke-width="2"/>
<text x="40" y="120" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Eight equal-area blocks: 6 dark + 2 bright.</text><rect x="40" y="152" width="80" height="116" rx="0" fill="#333333" stroke="none" stroke-width="2"/><rect x="120" y="152" width="80" height="116" rx="0" fill="#333333" stroke="none" stroke-width="2"/><rect x="200" y="152" width="80" height="116" rx="0" fill="#333333" stroke="none" stroke-width="2"/><rect x="280" y="152" width="80" height="116" rx="0" fill="#333333" stroke="none" stroke-width="2"/><rect x="360" y="152" width="80" height="116" rx="0" fill="#333333" stroke="none" stroke-width="2"/><rect x="440" y="152" width="80" height="116" rx="0" fill="#333333" stroke="none" stroke-width="2"/><rect x="520" y="152" width="80" height="116" rx="0" fill="#CCCCCC" stroke="none" stroke-width="2"/><rect x="600" y="152" width="80" height="116" rx="0" fill="#CCCCCC" stroke="none" stroke-width="2"/><line x1="120" y1="152" x2="120" y2="268" stroke="#F7F4ED" stroke-width="1"/><line x1="200" y1="152" x2="200" y2="268" stroke="#F7F4ED" stroke-width="1"/><line x1="280" y1="152" x2="280" y2="268" stroke="#F7F4ED" stroke-width="1"/><line x1="360" y1="152" x2="360" y2="268" stroke="#F7F4ED" stroke-width="1"/><line x1="440" y1="152" x2="440" y2="268" stroke="#F7F4ED" stroke-width="1"/><line x1="520" y1="152" x2="520" y2="268" stroke="#F7F4ED" stroke-width="1"/><line x1="600" y1="152" x2="600" y2="268" stroke="#F7F4ED" stroke-width="1"/><text x="68" y="221" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#FFFFFF">DARK WALL</text><text x="600" y="220" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#231F20">WINDOW</text><text x="280" y="304" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#231F20">#333333</text><text x="600" y="304" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#231F20">#CCCCCC</text><text x="40" y="348" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#231F20">Signal level</text><line x1="40" y1="369" x2="40" y2="512" stroke="#231F20" stroke-width="2"/><line x1="40" y1="512" x2="680" y2="512" stroke="#231F20" stroke-width="2"/><line x1="520" y1="324" x2="520" y2="512" stroke="#AAA398" stroke-width="1" stroke-dasharray="6 6"/><path d="M 40 478 H 520 V 389 H 680" fill="none" stroke="#BC2031" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="463" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Low</text><text x="589" y="375" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">High</text><text x="360" y="553" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="middle" fill="#231F20">Left-to-right image position</text><text x="40" y="596" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#231F20">Histogram: counts, not location</text><text x="40" y="636" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Dark</text><rect x="208" y="613" width="336" height="26" rx="0" fill="#333333" stroke="none" stroke-width="2"/><text x="568" y="636" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">6 / 75%</text><text x="40" y="681" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Bright</text><rect x="208" y="658" width="112" height="26" rx="0" fill="#CCCCCC" stroke="#231F20" stroke-width="2"/><text x="568" y="681" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">2 / 25%</text>
</g></svg>