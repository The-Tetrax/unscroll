<svg xmlns="http://www.w3.org/2000/svg" width="720" height="728" viewBox="0 0 720 728" role="img" aria-labelledby="teaching-6d-69-6e-64-2d-30-32-37-v-30-title" aria-describedby="teaching-6d-69-6e-64-2d-30-32-37-v-30-desc" font-family="Arial, sans-serif" data-format="flow" data-visual-id="mind-027" data-visual-index="0"><title id="teaching-6d-69-6e-64-2d-30-32-37-v-30-title">The invented turn to reconstruct</title><desc id="teaching-6d-69-6e-64-2d-30-32-37-v-30-desc">The sequence is draw a card, discard one face up, move the marker one space, and pass the draw pile left.
1. Draw. Take a card from the draw pile.
2. Discard. Place one card face up.
3. Move. Move your marker one space.
4. Pass. Give the draw pile to the player on your left.</desc><defs><marker id="teaching-6d-69-6e-64-2d-30-32-37-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6d-69-6e-64-2d-30-32-37-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6d-69-6e-64-2d-30-32-37-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="728" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="57" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Flow</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="502" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">The invented turn to reconstruct</text><g data-edge-index="0" data-from="0" data-to="1"><path d="M 60 197 L 60 262" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teaching-6d-69-6e-64-2d-30-32-37-v-30-link)"/></g><g data-edge-index="1" data-from="1" data-to="2"><path d="M 60 321 L 60 386" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teaching-6d-69-6e-64-2d-30-32-37-v-30-link)"/></g><g data-edge-index="2" data-from="2" data-to="3"><path d="M 60 445 L 60 510" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-en