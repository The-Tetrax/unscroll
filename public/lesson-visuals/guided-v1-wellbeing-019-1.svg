<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1539" viewBox="0 0 720 1539" role="img" aria-labelledby="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-31-39-v-30-title" aria-describedby="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-31-39-v-30-desc" font-family="Arial, sans-serif" data-format="spatial" data-visual-id="wellbeing-019" data-visual-index="0"><title id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-31-39-v-30-title">Direct the lamp toward the page</title><desc id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-31-39-v-30-desc">A lamp to the side aims at a central paper task, with the monitor elsewhere and the user checking both from below.
1. Task lamp. Stable, aimed at paper, out of direct view.
2. Shot list. Check the line beneath the working hand.
3. Monitor. Recheck for reflections after moving the lamp.
4. User. Inspect both tasks from the ordinary seat.
1 to 2: light toward task.</desc><defs><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-31-39-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-31-39-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-31-39-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker><mask id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-31-39-v-30-connections-mask" maskUnits="userSpaceOnUse" x="36" y="192" width="648" height="650" style="mask-type:luminance"><rect x="36" y="192" width="648" height="650" fill="#ffffff"/><rect x="126" y="341" width="90" height="90" fill="#000000"/><rect x="298.8" y="470" width="90" height="90" fill="#000000"/><rect x="487.8" y="341" width="90" height="90" fill="#000000"/><rect x="315" y="616.2" width="90" height="90" fill="#000000"/><rect x="142" y="266" width="58" height="58" fill="#000000"/><rect x="314.8" y="395" width="58" height="58" fill="#000000"/><rect x="503.8" y="266" width="58" height="58" fill="#000000"/><rect x="331" y="723.2" width="58" height="58" fill="#000000"/><rect x="195" y="271" width="143" height="48" fill="#000000"/><rect x="367.8" y="400" width="115" height="48" fill="#000000"/><rect x="556.8" y="271" width="109" height="48" fill="#000000"/><rect x="384" y="728.2" width="77" height="48" fill="#000000"/></mask></defs><rect width="720" height="1539" fill="#f7f4ed"