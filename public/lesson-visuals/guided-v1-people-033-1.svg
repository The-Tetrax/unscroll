<svg xmlns="http://www.w3.org/2000/svg" width="720" height="759" viewBox="0 0 720 759" role="img" aria-labelledby="teaching-70-65-6f-70-6c-65-2d-30-33-33-v-30-title" aria-describedby="teaching-70-65-6f-70-6c-65-2d-30-33-33-v-30-desc" font-family="Arial, sans-serif" data-format="flow" data-visual-id="people-033" data-visual-index="0"><title id="teaching-70-65-6f-70-6c-65-2d-30-33-33-v-30-title">An update before the meeting is missed</title><desc id="teaching-70-65-6f-70-6c-65-2d-30-33-33-v-30-desc">The traveler reports the stopped train, labels possible lateness, checks ticket transfer, and confirms a new arrangement only after agreement.
1. Known. My train is stopped; no restart estimate has been given.
2. Uncertain. I may miss our meeting time.
3. Check and offer. Transfer is available. Are you willing to receive the tickets?
4. Confirm. Transfer sent after agreement; please confirm receipt.</desc><defs><marker id="teaching-70-65-6f-70-6c-65-2d-30-33-33-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-70-65-6f-70-6c-65-2d-30-33-33-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-70-65-6f-70-6c-65-2d-30-33-33-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="759" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="57" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Flow</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="626" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">An update before the meeting is missed</text><g data-edge-index="0" data-from="0" data-to="1"><path d="M 60 197 L 60 262" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teaching-70-65-6f-70-6c-65-2d-30-33-33-v-30-link)"/></g><g data-edge-index="1" data-from="1" data-to="2"><path d="M 60 321 L 60 386" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teaching-70-65-6f-70-6c-65-2d-30-33-33-v-30-link)"/></g><g data-edge-index="2" data-from="2" data-to="3"><path d="M 60 445 L 60 541" fill="none" stroke="#231f20" stroke-width="3" stroke-li