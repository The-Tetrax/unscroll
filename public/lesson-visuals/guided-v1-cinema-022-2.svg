<svg xmlns="http://www.w3.org/2000/svg" width="720" height="581" viewBox="0 0 720 581" role="img" aria-labelledby="teaching-63-69-6e-65-6d-61-2d-30-32-32-v-31-title" aria-describedby="teaching-63-69-6e-65-6d-61-2d-30-32-32-v-31-desc" font-family="Arial, sans-serif" data-format="timeline" data-visual-id="cinema-022" data-visual-index="1"><title id="teaching-63-69-6e-65-6d-61-2d-30-32-32-v-31-title">Cue before explanation</title><desc id="teaching-63-69-6e-65-6d-61-2d-30-32-32-v-31-desc">The empty square is shown, a rustle is heard, then the parcel is revealed.
1. Empty place. 2 seconds: hold on the drawn square.
2. Unseen rustle. 1 second: gently move the parcel paper.
3. Reveal and settle. 3 seconds: pan right and finish still.</desc><defs><marker id="teaching-63-69-6e-65-6d-61-2d-30-32-32-v-31-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-63-69-6e-65-6d-61-2d-30-32-32-v-31-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-63-69-6e-65-6d-61-2d-30-32-32-v-31-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="581" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="101" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Timeline</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="368" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Cue before explanation</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="531" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Event order only; spacing is not proportional to time.</text><g data-time-spacing="ordinal"><path d="M 262 219 L 262 403" fill="none" stroke="#69635f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g data-item-index="0"><text x="35" y="229.04" font-size="26" font-weight="700" fill="#231f20" textLength="159" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Empty place</text><text x="299" y="224.88" font-size="22" font-weight="400" fill="#231f20" textLength="384" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">2 seconds: hold on the drawn square.</text><path d="M 262 210 L 271 219 L 262 228 L 253 219 Z" fill="#f7f4ed" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g data-item-index="1"><text x="35" y="317.04" font-size="26" font-weight="700" fill="#231f20" textLength="179" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Unseen rustle</text><text x="299" y="312.88" font-size="22" font-weight="400" fill="#231f20" textLength="338" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">1 second: gently move the parcel</text><text x="299" y="343.88" font-size="22" font-weight="400" fill="#231f20" textLength="66" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">paper.</text><path d="M 262 298 L 271 307 L 262 316 L 253 307 Z" fill="#bc2031" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g data-item-index="2"><text x="35" y="413.04" font-size="26" font-weight="700" fill="#231f20" textLength="146" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Reveal and</text><text x="35" y="450.04" font-size="26" font-weight="700" fill="#231f20" textLength="69" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">settle</text><text x="299" y="408.88" font-size="22" font-weight="400" fill="#231f20" textLength="358" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">3 seconds: pan right and finish still.</text><path d="M 262 394 L 271 403 L 262 412 L 253 403 Z" fill="#f7f4ed" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><path d="M 32 534 L 98 534" fill="none" stroke="#bc2031" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="119" y="540.88" font-size="22" font-weight="400" fill="#69635f" textLength="211" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Explanatory diagram</text></g></svg>