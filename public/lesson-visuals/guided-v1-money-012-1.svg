<svg xmlns="http://www.w3.org/2000/svg" width="720" height="709" viewBox="0 0 720 709" role="img" aria-labelledby="teaching-6d-6f-6e-65-79-2d-30-31-32-v-30-title" aria-describedby="teaching-6d-6f-6e-65-79-2d-30-31-32-v-30-desc" font-family="Arial, sans-serif" data-format="timeline" data-visual-id="money-012" data-visual-index="0"><title id="teaching-6d-6f-6e-65-79-2d-30-31-32-v-30-title">From equipment to usable money</title><desc id="teaching-6d-6f-6e-65-79-2d-30-31-32-v-30-desc">A day-one sale request leads to 588 spendable units on day five, after a day-three bill.
1. Day 1: request. 600-unit estimated value; no buyer yet.
2. Day 2: agreed sale. 590 units; proceeds not yet usable.
3. Day 4: settlement. 590 units inside the service.
4. Day 5: bank arrival. 590 less 2 fee = 588 usable units.</desc><defs><marker id="teaching-6d-6f-6e-65-79-2d-30-31-32-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6d-6f-6e-65-79-2d-30-31-32-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6d-6f-6e-65-79-2d-30-31-32-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="709" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="101" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Timeline</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="530" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">From equipment to usable money</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="531" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Event order only; spacing is not proportional to time.</text><g data-time-spacing="ordinal"><path d="M 262 219 L 262 531" fill="none" stroke="#69635f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g data-item-index="0"><text x="35" y="229.04" font-size="26" font-weight="700" fill="#231f20" textLength="188" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Day 1: request</text><text x="299" y="224.88" font-size="22" font-weight="400" fill="#231f20" textLength="353" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">600-unit estimated value; no buyer</text><text x="299" y="255.88" font-size="22" font-weight="400" fill="#231f20" textLength="38" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">yet.</text><path d="M 262 210 L 271 219 L 262 228 L 253 219 Z" fill="#f7f4ed" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g data-item-index="1"><text x="35" y="325.04" font-size="26" font-weight="700" fill="#231f20" textLength="182" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Day 2: agreed</text><text x="35" y="362.04" font-size="26" font-weight="700" fill="#231f20" textLength="53" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">sale</text><text x="299" y="320.88" font-size="22" font-weight="400" fill="#231f20" textLength="357" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">590 units; proceeds not yet usable.</text><path d="M 262 306 L 271 315 L 262 324 L 253 315 Z" fill="#bc2031" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g data-item-index="2"><text x="35" y="433.04" font-size="26" font-weight="700" fill="#231f20" textLength="84" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Day 4:</text><text x="35" y="470.04" font-size="26" font-weight="700" fill="#231f20" textLength="134" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">settlement</text><text x="299" y="428.88" font-size="22" font-weight="400" fill="#231f20" textLength="284" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">590 units inside the service.</text><path d="M 262 414 L 271 423 L 262 432 L 253 423 Z" fill="#f7f4ed" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g data-item-index="3"><text x="35" y="541.04" font-size="26" font-weight="700" fill="#231f20" textLength="154" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Day 5: bank</text><text x="35" y="578.04" font-size="26" font-weight="700" fill="#231f20" textLength="79" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">arrival</text><text x="299" y="536.88" font-size="22" font-weight="400" fill="#231f20" textLength="344" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">590 less 2 fee = 588 usable units.</text><path d="M 262 522 L 271 531 L 262 540 L 253 531 Z" fill="#bc2031" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><path d="M 32 662 L 98 662" fill="none" stroke="#bc2031" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="119" y="668.88" font-size="22" font-weight="400" fill="#69635f" textLength="211" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Explanatory diagram</text></g></svg>