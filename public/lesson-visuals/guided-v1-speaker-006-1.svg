<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1021" viewBox="0 0 720 1021" role="img" aria-labelledby="teaching-73-70-65-61-6b-65-72-2d-30-30-36-v-30-title" aria-describedby="teaching-73-70-65-61-6b-65-72-2d-30-30-36-v-30-desc" font-family="Arial, sans-serif" data-format="bars" data-visual-id="speaker-006" data-visual-index="0"><title id="teaching-73-70-65-61-6b-65-72-2d-30-30-36-v-30-title">Panel demand depends on the arrangement</title><desc id="teaching-73-70-65-61-6b-65-72-2d-30-30-36-v-30-desc">Separate displays need twelve panels; eight are available; the described sharing arrangement needs eight.
1. Separate displays. Twelve contributors, one panel each, all at once. Value: 12 display panels.
2. Available. Eight panels already available to the fair. Value: 8 display panels.
3. Sharing arrangement. Four paired panels plus four solo panels. Value: 8 display panels.</desc><defs><marker id="teaching-73-70-65-61-6b-65-72-2d-30-30-36-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-73-70-65-61-6b-65-72-2d-30-30-36-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-73-70-65-61-6b-65-72-2d-30-30-36-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="1021" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="92" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Bar plot</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="484" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Panel demand depends on the</text><text x="35" y="150.28" font-size="32" font-weight="700" fill="#231f20" textLength="202" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">arrangement</text><text x="35" y="212.88" font-size="22" font-weight="400" fill="#231f20" textLength="519" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Zero baseline; bar lengths use the supplied values.</text><text x="35" y="257.96" font-size="24" font-weight="700" fill="#231f20" textLength="231" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Unit: display panels</text><text x="42.5" y="303.96" font-size="24" font-weight=