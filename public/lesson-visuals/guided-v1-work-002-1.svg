<svg xmlns="http://www.w3.org/2000/svg" width="720" height="728" viewBox="0 0 720 728" role="img" aria-labelledby="teaching-77-6f-72-6b-2d-30-30-32-v-30-title" aria-describedby="teaching-77-6f-72-6b-2d-30-30-32-v-30-desc" font-family="Arial, sans-serif" data-format="flow" data-visual-id="work-002" data-visual-index="0"><title id="teaching-77-6f-72-6b-2d-30-30-32-v-30-title">The atlas request</title><desc id="teaching-77-6f-72-6b-2d-30-30-32-v-30-desc">Whitespace is removed before atlas reaches a lookup returning B7 and the title Atlas of Rivers.
1. Search box. Query contains a space before and after atlas.
2. Handler. Normalized lookup input: atlas.
3. Catalogue lookup. Returns book identifier B7.
