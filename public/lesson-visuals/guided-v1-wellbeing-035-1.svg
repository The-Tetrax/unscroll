<svg xmlns="http://www.w3.org/2000/svg" width="720" height="604" viewBox="0 0 720 604" role="img" aria-labelledby="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-33-35-v-30-title" aria-describedby="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-33-35-v-30-desc" font-family="Arial, sans-serif" data-format="flow" data-visual-id="wellbeing-035" data-visual-index="0"><title id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-33-35-v-30-title">Make the drink accessible</title><desc id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-33-35-v-30-desc">Check the permitted desk location, place a secure drink away from equipment, and identify a refill opportunity.
1. Check the location. Use a permitted, stable, reachable place.
2. Keep the drink usable. Secure lid; no blocked input area or electrical spill risk.
3. Plan a refill. Know an available source and a practical opportunity.</desc><defs><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-33-35-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-33-35-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-33-35-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="604" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="57" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Flow</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="409" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Make the drink accessible</text><g data-edge-index="0" data-from="0" data-to="1"><path d="M 60 197 L 60 262" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-33-35-v-30-link)"/></g><g data-edge-index="1" data-from="1" data-to="2"><path d="M 60 321 L 60 386" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-33-35-v-30-link)"/></g><g data-node-index="0"><circle cx="60" cy="168" r="22" fill="#231f20" stroke="#231f20" stroke-w