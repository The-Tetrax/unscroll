<svg xmlns="http://www.w3.org/2000/svg" width="720" height="722" viewBox="0 0 720 722" role="img" aria-labelledby="teaching-6f-62-73-65-72-76-65-72-2d-30-32-37-v-30-title" aria-describedby="teaching-6f-62-73-65-72-76-65-72-2d-30-32-37-v-30-desc" font-family="Arial, sans-serif" data-format="timeline" data-visual-id="observer-027" data-visual-index="0"><title id="teaching-6f-62-73-65-72-76-65-72-2d-30-32-37-v-30-title">Confidence changes before the color is checked</title><desc id="teaching-6f-62-73-65-72-76-65-72-2d-30-32-37-v-30-desc">An unsure blue recollection becomes more confident after agreement, then a clear photo supplies a green correction.
1. Initial recall. Perhaps blue; unsure.
2. After friend agrees. Feels more certain; agreement followed the first answer.
3. Photo checked. In this example, a clear authorized image shows green.
4. Final record. Correct the color; preserve the initial uncertainty and feedback order.</desc><defs><marker id="teaching-6f-62-73-65-72-76-65-72-2d-30-32-37-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6f-62-73-65-72-76-65-72-2d-30-32-37-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6f-62-73-65-72-76-65-72-2d-30-32-37-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="722" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="101" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Timeline</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="616" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Confidence changes before the color is</text><text x="35" y="150.28" font-size="32" font-weight="700" fill="#231f20" textLength="133" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">checked</text><text x="35" y="212.88" font-size="22" font-weight="400" fill="#231f20" textLength="531" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Event order only; spacing is not proportional to time.</text><g data-time-spacing="ordinal"><path d="M 262 264 L 262 556" fill="none" stroke="#69635f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g data-item-index="0"><text x="35" y="274.04" font-s