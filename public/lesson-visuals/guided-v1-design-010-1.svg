<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="design-type-010-title" aria-describedby="design-type-010-desc" focusable="false">
<title id="design-type-010-title">Choose the light for your neutral</title>
<desc id="design-type-010-desc">An original room diagram separates a #AFCDE5 window lighting folded #C4C4C4 paper from an #E4B55F desk lamp lighting a #D6B47C amber wall. The folded paper has actual crease lines. Adjacent samples show paper before #B8C8BA, target #C4C4C4 and intentionally amber wall #D6B47C. Correcting the chosen paper sample does not require neutralizing the wall.</desc>
