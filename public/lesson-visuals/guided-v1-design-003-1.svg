<svg xmlns="http://www.w3.org/2000/svg" width="720" height="668" viewBox="0 0 720 668" role="img" aria-labelledby="design-type-003-title" aria-describedby="design-type-003-desc" focusable="false">
<title id="design-type-003-title">Same center, different surround</title>
<desc id="design-type-003-desc">Two 112 by 112 px centers have identical opaque #808080 fill. The left center is surrounded continuously by #202020; the right by #F2F2F2. Both surrounds measure 304 by 304 px. Compare apparent lightness while holding the target values and sizes fixed.</desc>
<rect x="0" y="0" width="720" height="668" rx="0" fill="#F7F4ED" stroke="none" stroke-width="2"/>
<g aria-hidden="true">
<text x="32" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#231F20">Same center, different surround</text>
<line x1="32" y1="80" x2="688" y2="80" stroke="#AAA398" stroke-width="2"/>
<text x="32" y="128" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Surround #202020</text><text x="384" y="128" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Surround #F2F2F2</text><rect x="32" y="160" width="304" height="304" rx="0" fill="#202020" stroke="none" stroke-width="2"/><rect x="384" y="160" width="304" height="304" rx="0" fill="#F2F2F2" stroke="none" stroke-width="2"/><rect x="128" y="256" width="112" height="112" rx="0" fill="#808080" stroke="none" stroke-width="2"/><rect x="480" y="256" width="112" height="112" rx="0" fill="#808080" stroke="none" stroke-width="2"/><line x1="184" y1="490" x2="184" y2="520" stroke="#AAA398" stroke-width="2"/><line x1="536" y1="490" x2="536" y2="520" stroke="#AAA398" stroke-width="2"/><line x1="184" y1="520" x2="536" y2="520" stroke="#AAA398" stroke-width="2"/><text x="360" y="568" font-family="Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#231F20">#808080 in both centers</text><text x="40" y="625" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Cover the surrounds; keep the samples fixed.</text>
</g></svg>