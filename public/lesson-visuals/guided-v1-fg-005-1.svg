<svg xmlns="http://www.w3.org/2000/svg" width="720" height="646" viewBox="0 0 720 646" role="img" aria-labelledby="teaching-66-67-2d-30-30-35-v-30-title" aria-describedby="teaching-66-67-2d-30-30-35-v-30-desc" font-family="Arial, sans-serif" data-format="timeline" data-visual-id="fg-005" data-visual-index="0"><title id="teaching-66-67-2d-30-30-35-v-30-title">Pending-aware queue at the end of round four</title><desc id="teaching-66-67-2d-30-30-35-v-30-desc">Position 2 now, plus 1 due in round five, and 0 due in round six.
