<svg xmlns="http://www.w3.org/2000/svg" width="720" height="862" viewBox="0 0 720 862" role="img" aria-labelledby="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-32-35-v-30-title" aria-describedby="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-32-35-v-30-desc" font-family="Arial, sans-serif" data-format="dialogue" data-visual-id="wellbeing-025" data-visual-index="0"><title id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-32-35-v-30-title">Agree on stopping and restarting</title><desc id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-32-35-v-30-desc">Three friends agree to pause between films, allow earlier breaks, and check readiness before restarting.
1. Alex. Can we pause between films and switch off autoplay?
2. Rae. Yes. I may step away earlier, too.
3. Mo. Of course. We&apos;ll check before starting the next film.</desc><defs><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-32-35-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-32-35-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-32-35-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="862" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="106" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Dialogue</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="516" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Agree on stopping and restarting</text><circle cx="79" cy="168" r="22" fill="#231f20" stroke="#231f20" stroke-width="3"/><text x="71.5" y="175.96" font-size="24" font-weight="700" fill="#f7f4ed" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">1</text><text x="119" y="172.04" font-size="26" font-weight="700" fill="#231f20" textLength="57" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Alex</text><g data-turn-index="0" data-side="left"><path d="M 78 203 H 364 Q 386 203 386 225  L 386 314 Q 386 336 364 336 H 78 Q 56 336 56 314 L 56 315 L 38 322 L 56 295 L 56 225 Q 56 203 78 203 Z" fill="#f7f4ed"