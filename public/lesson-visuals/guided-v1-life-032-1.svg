<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1749" viewBox="0 0 720 1749" role="img" aria-labelledby="teaching-6c-69-66-65-2d-30-33-32-v-30-title" aria-describedby="teaching-6c-69-66-65-2d-30-33-32-v-30-desc" font-family="Arial, sans-serif" data-format="spatial" data-visual-id="life-032" data-visual-index="0"><title id="teaching-6c-69-66-65-2d-30-33-32-v-30-title">Divide the stew before storing it</title><desc id="teaching-6c-69-66-65-2d-30-33-32-v-30-desc">A deep pot is divided between shallow containers that move into the refrigerator without a room-temperature waiting stage.
1. Deep stew pot. A large centre cools slowly.
2. Shallow portion A. Suitable covered food container.
3. Shallow portion B. Less depth than the full pot.
4. Refrigerator. 40 F or below; leave circulation space.
1 to 2: Divide.
1 to 3: Divide.
2 to 4: Refrigerate.
3 to 4: Refrigerate.</desc><defs><marker id="teaching-6c-69-66-65-2d-30-33-32-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6c-69-66-65-2d-30-33-32-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6c-69-66-65-2d-30-33-32-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker><mask id="teaching-6c-69-66-65-2d-30-33-32-v-30-connections-mask" maskUnits="userSpaceOnUse" x="36" y="192" width="648" height="650" style="mask-type:luminance"><rect x="36" y="192" width="648" height="650" fill="#ffffff"/><rect x="142.2" y="470" width="90" height="90" fill="#000000"/><rect x="315" y="341" width="90" height="90" fill="#000000"/><rect x="315" y="599" width="90" height="90" fill="#000000"/><rect x="498.6" y="470" width="90" height="90" fill="#000000"/><rect x="158.2" y="395" width="58" height="58" fill="#000000"/><rect x="331" y="266" width="58" height="58" fill="#000000"/><rect x="331" y="524" width="58" height="58" fill="#000000"/><rect x="514.6" y="395" width="58" height="58" fill="#000000"/></mask></defs><rect width="720" height="1749" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="186" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Spatial diagram</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="496" lengthAdjust="spacingAndGlyphs" style="line-