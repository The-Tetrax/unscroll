1. DNS. Fresh name lookup Value: 20 milliseconds.
2. Connection. 40 TCP + 40 TLS Value: 80 milliseconds.
3. Request send. Request transmission Value: 1 milliseconds.
4. First-byte wait. Travel, queues, dependencies, processing Value: 120 milliseconds.
