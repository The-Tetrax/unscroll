<svg xmlns="http://www.w3.org/2000/svg" width="720" height="677" viewBox="0 0 720 677" role="img" aria-labelledby="draw-design-038-title draw-design-038-desc">
  <title id="draw-design-038-title">Connect the kettle&apos;s volumes</title>
  <desc id="draw-design-038-desc">An original tapered kettle is constructed from a rounded body, elliptical lid, loop handle, and tubular spout. The handle is behind the body and has two attachment points; one hidden join is dashed. A central axis passes through the lid and base, and curved cross-contours describe the belly. The spout has an elliptical opening and a direction continuing toward its attachment. Construction lines are scaffolding, not exact product dimensions.</desc>
