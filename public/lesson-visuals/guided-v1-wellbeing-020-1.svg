<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1539" viewBox="0 0 720 1539" role="img" aria-labelledby="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-32-30-v-30-title" aria-describedby="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-32-30-v-30-desc" font-family="Arial, sans-serif" data-format="spatial" data-visual-id="wellbeing-020" data-visual-index="0"><title id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-32-30-v-30-title">Keep the route, reduce the display</title><desc id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-32-30-v-30-desc">A bed and doorway are connected by a clear route; a clock display is dimmed while a low route light remains.
1. Bed. Check unnecessary brightness from the resting position.
2. Doorway. Keep the route to this point usable.
3. Clock display. Use normal dimming; retain necessary alarm function.
4. Low route light. Retained where needed for safe movement.
1 to 2: clear route.</desc><defs><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-32-30-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-32-30-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-32-30-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker><mask id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-32-30-v-30-connections-mask" maskUnits="userSpaceOnUse" x="36" y="192" width="648" height="650" style="mask-type:luminance"><rect x="36" y="192" width="648" height="650" fill="#ffffff"/><rect x="142.2" y="353.9" width="90" height="90" fill="#000000"/><rect x="487.8" y="353.9" width="90" height="90" fill="#000000"/><rect x="142.2" y="590.4" width="90" height="90" fill="#000000"/><rect x="450" y="590.4" width="90" height="90" fill="#000000"/><rect x="158.2" y="278.9" width="58" height="58" fill="#000000"/><rect x="503.8" y="278.9" width="58" height="58" fill="#000000"/><rect x="158.2" y="515.4" width="58" height="58" fill="#000000"/><rect x="466" y="515.4" width="58" height="58" fill="#000000"/><rect x="211.2" y="283.9" width="68" height="48" fill="#000000"/><rect x="556.8" y="283.9" width="126" height="48" fill="#000000"/></mask></defs><rect width="720" height="1539" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="186" 