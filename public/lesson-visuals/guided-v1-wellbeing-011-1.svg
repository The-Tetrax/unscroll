<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1609" viewBox="0 0 720 1609" role="img" aria-labelledby="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-31-31-v-30-title" aria-describedby="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-31-31-v-30-desc" font-family="Arial, sans-serif" data-format="spatial" data-visual-id="wellbeing-011" data-visual-index="0"><title id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-31-31-v-30-title">Keep all three supports in view</title><desc id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-31-31-v-30-desc">A side-view sketch places back support behind a seated user, the desk ahead, and stable foot support below.
1. Back support. Remain able to use it rather than perching forward.
2. Seated user. Check comfort and room to change position.
3. Desk and input. Reach without lifting the shoulders.
4. Stable foot support. Both feet have a secure resting surface.
1 to 2: back contact.
2 to 4: feet rest.</desc><defs><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-31-31-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-31-31-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-31-31-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker><mask id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-31-31-v-30-connections-mask" maskUnits="userSpaceOnUse" x="36" y="192" width="648" height="650" style="mask-type:luminance"><rect x="36" y="192" width="648" height="650" fill="#ffffff"/><rect x="131.4" y="362.5" width="90" height="90" fill="#000000"/><rect x="277.2" y="478.6" width="90" height="90" fill="#000000"/><rect x="477" y="353.9" width="90" height="90" fill="#000000"/><rect x="433.8" y="611.9" width="90" height="90" fill="#000000"/><rect x="147.4" y="287.5" width="58" height="58" fill="#000000"/><rect x="293.2" y="403.6" width="58" height="58" fill="#000000"/><rect x="493" y="278.9" width="58" height="58" fill="#000000"/><rect x="449.8" y="536.9" width="58" height="58" fill="#000000"/></mask></defs><rect width="720" height="1609" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="186" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Spatial diagram</text><text x="35" y="105.28" font-size="32" font-weight="700