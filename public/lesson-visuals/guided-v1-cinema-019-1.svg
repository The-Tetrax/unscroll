<svg xmlns="http://www.w3.org/2000/svg" width="720" height="820" viewBox="0 0 720 820" role="img" aria-labelledby="camera-019-title camera-019-description" font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><title id="camera-019-title">Same words, different playable invitations</title><desc id="camera-019-description">Both tabletop views use the line Have a look at this and the same original unfinished landscape sketch. In the welcome option the page is available; in the delay option a hand and pencil attend to its unfinished corner. A lower drawing shows a no-contact table placement rather than a compulsory handoff.</desc><defs><clipPath id="camera-019-frame-0" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="314" height="273" rx="0" fill="#ffffff" stroke="none" stroke-width="2.5"></rect></clipPath><clipPath id="camera-019-frame-1" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="314" height="273" rx="0" fill="#ffffff" stroke="none" stroke-width="2.5"></rect></clipPath><clipPath id="camera-019-frame-2" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="656" height="135" rx="0" fill="#ffffff" stroke="none" stroke-width="2.5"></rect></clipPath></defs><rect x="0" y="0" width="720" height="820" rx="0" fill="#f7f4ed" stroke="none" stroke-width="2.5"></rect><text x="32" y="34" font-size="22" font-weight="700" fill="#bc2031" text-anchor="start" data-drawn-text="true">CAMERA 019</text><text x="32" y="73" font-size="26" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="true">Same words, different playable invitations</text><line x1="32" y1="92" x2="688" y2="92" stroke="#231f20" stroke-width="2.5" stroke-dasharray=""></line><text x="360" y="123" font-size="26" font-weight="700" fill="#231f20" text-anchor="middle" data-drawn-text="true">“Have a look at this.”</text><text x="32" y="163" font-size="22" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="true">Welcome / make it available</text><text x="374" y="163" font-size="22" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="true">Delay / finish this corner</text><g transform="translate(32 181) rotate(0) scale(1)"><rect x="0" y="0" width="314" height="273" rx="0" fill="#dfc9a9" stroke="none" stroke-width="2.5"></rect><g clip-path="url(#camera-019-frame-0)"><rect x="48" y="35" width="214" height="200" rx="0" fill="#fffdf5" stroke="#231f20" stroke-width="2.5"></rect><path d="M 70 197 L 137.88 123 L 199.94 197" fill="none" stroke="#557986" stroke-width="2.5"></path><circle cx="202.08" cy="87" r="18" fill="none" stroke="#b98b60" stroke-width="2.5"></circle><path d="M 73 210 Q 140.01999999999998 181 191.38 208" fill="none" stroke="#657e51" stroke-width="2.5"></path><line x1="195.66" y1="208" x2="247" y2="211" stroke="#69635f" stroke-width="2.5" stroke-dasharray="4 6"></line><line x1="250" y1="191" x2="250" y2="226" stroke="#e6dfd3" stroke-width="2.5" stroke-dasharray=""></line><g transform="translate(265 201) rotate(25) scale(0.66)"><path d="M 146 27 L 107 25 C 87 8 67 6 41 10 L 12 14 Q 2 17 9 26 L 53 25 L 9 32 Q 0 36 7 44 L 54 40 L 18 48 Q 8 53 16 61 L 61 52 L 39 63 Q 33 71 43 77 L 81 63 L 64 85 Q 58 94 68 98 Q 74 101 83 91 L 108 73 L 146 77 Z" fill="#deb18d" stroke="#231f20" stroke-width="2.5"></path><path d="M 83 34 Q 75 48 81 63 M 57 25 L 73 27 M 57 40 L 71 40" fill="none" stroke="#b98b60" stroke-width="2"></path><rect x="126" y="25" width="24" height="53" rx="0" fill="#557986" stroke="#231f20" stroke-width="2.5"></rect></g></g><rect x="0" y="0" width="314" height="273" rx="0" fill="none" stroke="#231f20" stroke-width="2.5"></rect></g><g transform="translate(374 181) rotate(0) scale(1)"><rect x="0" y="0" width="314" height="273" rx="0" fill="#dfc9a9" stroke="none" stroke-width="2.5"></rect><g clip-path="url(#camera-019-frame-1)"><rect x="48" y="35" width="214" height="200" rx="0" fill="#fffdf5" stroke="#231f20" stroke-width="2.5"></rect><path d="M 70 197 L 137.88 123 L 199.94 197" fill="none" stroke="#557986" stroke-width="2.5"></path><circle cx="202.08" cy="87" r="18" fill="none" stroke="#b98b60" stroke-width="2.5"></circle><path d="M 73 210 Q 140.01999999999998 181 191.38 208" fill="none" stroke="#657e51" stroke-width="2.5"></path><line x1="195.66" y1="208" x2="247" y2="211" stroke="#69635f" stroke-width="2.5" stroke-dasharray="4 6"></line><line x1="250" y1="191" x2="250" y2="226" stroke="#e6dfd3" stroke-width="2.5" stroke-dasharray=""></line><path d="M 222 211 L 278 120 L 289 127 L 232 217 Z" fill="#b98b60" stroke="#231f20" stroke-width="2.5"></path><path d="M 222 211 L 216 223 L 232 217 Z" fill="#231f20" stroke="#231f20" stroke-width="2.5"></path><g transform="translate(229 132) rotate(15) scale(0.7)"><path d="M 146 27 L 107 25 C 87 8 67 6 41 10 L 12 14 Q 2 17 9 26 L 53 25 L 9 32 Q 0 36 7 44 L 54 40 L 18 48 Q 8 53 16 61 L 61 52 L 39 63 Q 33 71 43 77 L 81 63 L 64 85 Q 58 94 68 98 Q 74 101 83 91 L 108 73 L 146 77 Z" fill="#deb18d" stroke="#231f20" stroke-width="2.5"></path><path d="M 83 34 Q 75 48 81 63 M 57 25 L 73 27 M 57 40 L 71 40" fill="none" stroke="#b98b60" stroke-width="2"></path><rect x="126" y="25" width="24" height="53" rx="0" fill="#557986" stroke="#231f20" stroke-width="2.5"></rect></g></g><rect x="0" y="0" width="314" height="273" rx="0" fill="none" stroke="#231f20" stroke-width="2.5"></rect></g><text x="32" y="491" font-size="24" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Possible choices, not prescribed gestures.</text><text x="32" y="540" font-size="24" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="true">A no-contact alternative</text><g transform="translate(32 558) rotate(0) scale(1)"><rect x="0" y="0" width="656" height="135" rx="0" fill="#dfc9a9" stroke="none" stroke-width="2.5"></rect><g clip-path="url(#camera-019-frame-2)"><g transform="translate(27 3) rotate(0) scale(0.63)"><rect x="0" y="0" width="205" height="191" rx="0" fill="#fffdf5" stroke="#231f20" stroke-width="2.5"></rect><path d="M 22 153 L 86.1 84.04 L 145.54999999999998 153" fill="none" stroke="#557986" stroke-width="2.5"></path><circle cx="147.6" cy="49.66" r="18" fill="none" stroke="#b98b60" stroke-width="2.5"></circle><path d="M 25 166 Q 88.15 137 137.35 164" fill="none" stroke="#657e51" stroke-width="2.5"></path><line x1="141.45" y1="164" x2="190" y2="167" stroke="#69635f" stroke-width="2.5" stroke-dasharray="4 6"></line><line x1="193" y1="147" x2="193" y2="182" stroke="#e6dfd3" stroke-width="2.5" stroke-dasharray=""></line></g><g transform="translate(164 22) rotate(0) scale(0.83)"><path d="M 146 27 L 107 25 C 87 8 67 6 41 10 L 12 14 Q 2 17 9 26 L 53 25 L 9 32 Q 0 36 7 44 L 54 40 L 18 48 Q 8 53 16 61 L 61 52 L 39 63 Q 33 71 43 77 L 81 63 L 64 85 Q 58 94 68 98 Q 74 101 83 91 L 108 73 L 146 77 Z" fill="#deb18d" stroke="#231f20" stroke-width="2.5"></path><path d="M 83 34 Q 75 48 81 63 M 57 25 L 73 27 M 57 40 L 71 40" fill="none" stroke="#b98b60" stroke-width="2"></path><rect x="126" y="25" width="24" height="53" rx="0" fill="#557986" stroke="#231f20" stroke-width="2.5"></rect></g><text x="362" y="48" font-size="24" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Place it on the table.</text><text x="362" y="77" font-size="24" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Leave room to respond.</text></g><rect x="0" y="0" width="656" height="135" rx="0" fill="none" stroke="#231f20" stroke-width="2.5"></rect></g><line x1="32" y1="706" x2="688" y2="706" stroke="#e6dfd3" stroke-width="2.5" stroke-dasharray=""></line><text x="32" y="733" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Original fictional rehearsal, not an emotion-reading test.</text><text x="32" y="762" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Agree on boundaries; no handoff or physical contact is needed.</text><text x="32" y="791" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Discuss the action and timing, not the performer’s worth.</text></svg>