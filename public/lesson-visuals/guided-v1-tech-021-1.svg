<svg xmlns="http://www.w3.org/2000/svg" width="720" height="724" viewBox="0 0 720 724" role="img" aria-labelledby="teaching-74-65-63-68-2d-30-32-31-v-30-title" aria-describedby="teaching-74-65-63-68-2d-30-32-31-v-30-desc" font-family="Arial, sans-serif" data-format="comparison" data-visual-id="tech-021" data-visual-index="0"><title id="teaching-74-65-63-68-2d-30-32-31-v-30-title">Four board operations, two properties</title><desc id="teaching-74-65-63-68-2d-30-32-31-v-30-desc">GET is safe and idempotent; PUT and DELETE are only idempotent; ordinary create POST is neither.
1. GET board. Safe: yes. Idempotent: yes. Retrieve its representation.
2. PUT title Review. Safe: no. Idempotent: yes. Request the same replacement.
3. DELETE board. Safe: no. Idempotent: yes. Example replies: 204, then 404.
4. POST new board. Safe: no. Not generally idempotent. A repeat can create another.</desc><defs><marker id="teaching-74-65-63-68-2d-30-32-31-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-65-63-68-2d-30-32-31-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-65-63-68-2d-30-32-31-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="724" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="144" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Comparison</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="593" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Four board operations, two properties</text><g data-item-index="0" data-column="0"><circle cx="55" cy="168" r="22" fill="#231f20" stroke="#231f20" stroke-width="3"/><text x="47.5" y="175.96" font-size="24" font-weight="700" fill="#f7f4ed" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">1</text><path d="M 90 168 L 336 168" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="41" y="238.04" font-size="26" font-weight="700" fill="#231f20" textLength="142" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">GET board</text><text x="41" y="278.88" font-size="22" font-weight="400" fill="#231f20" textLength="279" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Safe: yes. Idempotent: yes.</text><text x="41" y="309.88" font-size="22" font-weight="400" fill="#231f20" textLength="275" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Retrieve its representation.</text></g><g data-item-index="1" data-column="1"><circle cx="401" cy="168" r="22" fill="#bc2031" stroke="#bc2031" stroke-width="3"/><text x="393.5" y="175.96" font-size="24" font-weight="700" fill="#f7f4ed" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">2</text><path d="M 436 168 L 682 168" fill="none" stroke="#bc2031" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="387" y="238.04" font-size="26" font-weight="700" fill="#231f20" textLength="214" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">PUT title Review</text><text x="387" y="278.88" font-size="22" font-weight="400" fill="#231f20" textLength="269" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Safe: no. Idempotent: yes.</text><text x="387" y="309.88" font-size="22" font-weight="400" fill="#231f20" textLength="187" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Request the same</text><text x="387" y="340.88" font-size="22" font-weight="400" fill="#231f20" textLength="133" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">replacement.</text></g><path d="M 360 153 L 360 347" fill="none" stroke="#ddd7cc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g data-item-index="2" data-column="0"><circle cx="55" cy="414" r="22" fill="#69635f" stroke="#69635f" stroke-width="3"/><text x="47.5" y="421.96" font-size="24" font-weight="700" fill="#f7f4ed" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">3</text><path d="M 90 414 L 336 414" fill="none" stroke="#69635f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="41" y="484.04" font-size="26" font-weight="700" fill="#231f20" textLength="195" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">DELETE board</text><text x="41" y="524.88" font-size="22" font-weight="400" fill="#231f20" textLength="269" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Safe: no. Idempotent: yes.</text><text x="41" y="555.88" font-size="22" font-weight="400" fill="#231f20" textLength="273" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Example replies: 204, then</text><text x="41" y="586.88" font-size="22" font-weight="400" fill="#231f20" textLength="45" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">404.</text></g><g data-item-index="3" data-column="1"><circle cx="401" cy="414" r="22" fill="#231f20" stroke="#231f20" stroke-width="3"/><text x="393.5" y="421.96" font-size="24" font-weight="700" fill="#f7f4ed" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">4</text><path d="M 436 414 L 682 414" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="387" y="484.04" font-size="26" font-weight="700" fill="#231f20" textLength="222" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">POST new board</text><text x="387" y="524.88" font-size="22" font-weight="400" fill="#231f20" textLength="234" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Safe: no. Not generally</text><text x="387" y="555.88" font-size="22" font-weight="400" fill="#231f20" textLength="257" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">idempotent. A repeat can</text><text x="387" y="586.88" font-size="22" font-weight="400" fill="#231f20" textLength="155" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">create another.</text></g><path d="M 360 399 L 360 593" fill="none" stroke="#ddd7cc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 32 677 L 98 677" fill="none" stroke="#bc2031" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="119" y="683.88" font-size="22" font-weight="400" fill="