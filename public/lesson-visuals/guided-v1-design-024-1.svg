<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="design-type-024-title" aria-describedby="design-type-024-desc" focusable="false">
<title id="design-type-024-title">Make room when the title grows</title>
<desc id="design-type-024-desc">A separate text-resize study shows the full title Saturday sketch walk for first-time visitors in two equally wide signup panels. At 32 px with 44 px line spacing it has three lines; at 40 px with 55 px spacing it has four. The 1.375 line-height ratio stays fixed. The last title baseline moves from 302 to 379, so Saturday at 10, Library steps, Join and the panel bottom all move down exactly 77 px. No word is removed and no later text is covered. This is a static reflow plan, not the distinct WCAG spacing-override test or a working signup control.</desc>
<rect x="0" y="0" width="720" height="720" rx="0" fill="#F7F4ED" stroke="none" stroke-width="2"/>
<g aria-hidden="true">
<text x="32" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" fill="#231F20">Make room when the title grows</text>
<line x1="32" y1="80" x2="688" y2="80" stroke="#AAA398" stroke-width="2"/>
<text x="40" y="124" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Title 32 px; lines 44 px</text><text x="384" y="124" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Title 40 px; lines 55 px</text><rect x="40" y="160" width="296" height="376" rx="6" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="64" y="214" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#231F20">Saturday sketch</text><text x="64" y="258" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#231F20">walk for first-time</text><text x="64" y="302" font-family="Arial, sans-serif" font-size="32" font-weight="400" text-anchor="start" fill="#231F20">visitors</text><text x="64" y="356" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#231F20">Saturday at 10</text><text x="64" y="392" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#231F20">Library steps</text><rect x="64" y="432" width="248" height="60" rx="4" fill="#231F20" stroke="none" stroke-width="2"/><text x="188" y="472" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#FFFFFF">Join</text><rect x="384" y="160" width="296" height="453" rx="6" fill="#FFFFFF" stroke="#231F20" stroke-width="2"/><text x="408" y="214" font-family="Arial, sans-serif" font-size="40" font-weight="400" text-anchor="start" fill="#231F20">Saturday</text><text x="408" y="269" font-family="Arial, sans-serif" font-size="40" font-weight="400" text-anchor="start" fill="#231F20">sketch walk</text><text x="408" y="324" font-family="Arial, sans-serif" font-size="40" font-weight="400" text-anchor="start" fill="#231F20">for first-time</text><text x="408" y="379" font-family="Arial, sans-serif" font-size="40" font-weight="400" text-anchor="start" fill="#231F20">visitors</text><text x="408" y="433" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#231F20">Saturday at 10</text><text x="408" y="469" font-family="Arial, sans-serif" font-size="28" font-weight="400" text-anchor="start" fill="#231F20">Library steps</text><rect x="408" y="509" width="248" height="60" rx="4" fill="#231F20" stroke="none" stroke-width="2"/><text x="532" y="549" font-family="Arial, sans-serif" font-size="28" font-weight="700" text-anchor="middle" fill="#FFFFFF">Join</text><text x="40" y="652" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Same words. Later content moves down 77 px.</text><text x="40" y="685" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#231F20">Text resizing is separate from spacing overrides.</text>
</g></svg>