<svg xmlns="http://www.w3.org/2000/svg" width="720" height="914" viewBox="0 0 720 914" role="img" focusable="false" aria-labelledby="design-ux-032-title" aria-describedby="design-ux-032-desc" font-family="Arial, sans-serif" font-size="22" data-layout-guard="estimated-arial-line-boxes"><title id="design-ux-032-title">Keep the label, not the row height</title><desc id="design-ux-032-desc">Both component drawings contain Email me about changes to this journey at the same enlarged lettering and available width. An actual SVG clip cuts the fixed row; the taller row shows the complete wrapped label and moves Reminder help down, without claiming a live 200 percent resize test.</desc><defs><clipPath id="design-ux-032-text-clip-0" clipPathUnits="userSpaceOnUse"><rect x="128" y="254" width="336" height="62" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"></rect></clipPath></defs><rect x="0" y="0" width="720" height="914" rx="0" fill="#F7F4ED" stroke="none" stroke-width="2"></rect><g aria-hidden="true"><text x="35" y="52" font-size="28" font-weight="700" fill="#231F20" textLength="455" lengthAdjust="spacingAndGlyphs" text-decoration="none">Keep the label, not the row height</text><text x="35" y="94" font-size="22" font-weight="400" fill="#69635F" textLength="517" lengthAdjust="spacingAndGlyphs" text-decoration="none">Component drawing; not a screenshot or zoom test</text><line x1="32" y1="114" x2="688" y2="114" stroke="#231F20" stroke-width="2" stroke-dasharray=""></line><text x="35" y="154" font-size="22" font-weight="400" fill="#231F20" textLength="426" lengthAdjust="spacingAndGlyphs" text-decoration="none">Same words, width and enlarged lettering.</text><text x="51" y="210" font-size="24" font-weight="700" fill="#231F20" textLength="194" lengthAdjust="spacingAndGlyphs" text-decoration="none">Fixed-height row</text><rect x="48" y="226" width="624" height="224" rx="10" fill="#FFFFFF" stroke="#231F20" stroke-width="2"></rect><rect x="72" y="252" width="400" height="66" rx="4" fill="#F7F4ED" stroke="#231F20" stroke-width="2"></rect><rect x="88" y="267" width="28" height="28" rx="3" fill="#FFFFFF" stroke="#231F20" stroke-width="2"></rect><g clip-path="url(#design-ux-032-text-clip-0)" data-intentional-clip="true"><text x="137" y="292" font-size="28" font-weight="400" fill="#231F20" textLength="202" lengthAdjust="spacingAndGlyphs" text-decoration="none">Email me about</text><text x="137" y="328" font-size="28" font-weight="400" fill="#231F20" textLength="299" lengthAdjust="spacingAndGlyphs" text-decoration="none">changes to this journey</text></g><line x1="128" y1="318" x2="464" y2="318" stroke="#BC2031" stroke-width="3" stroke-dasharray=""></line><line x1="496" y1="252" x2="496" y2="318" stroke="#BC2031" stroke-width="2" stroke-dasharray=""></line><line x1="488" y1="252" x2="504" y2="252" stroke="#BC2031" stroke-width="2" stroke-dasharray=""></line><line x1="488" y1="318" x2="504" y2="318" stroke="#BC2031" stroke-width="2" stroke-dasharray=""></line><text x="523" y="275" font-size="22" font-weight="400" fill="#231F20" textLength="56" lengthAdjust="spacingAndGlyphs" text-decoration="none">Fixed</text><text x="523" y="305" font-size="22" font-weight="400" fill="#231F20" textLength="63" lengthAdjust="spacingAndGlyphs" text-decoration="none">height</text><text x="91" y="366" font-size="22" font-weight="400" fill="#231F20" textLength="149" lengthAdjust="spacingAndGlyphs" text-decoration="underline">Reminder help</text><text x="91" y="420" font-size="22" font-weight="400" fill="#231F20" textLength="154" lengthAdjust="spacingAndGlyphs" text-decoration="none">Journey details</text><text x="51" y="510" font-size="24" font-weight="700" fill="#231F20" textLength="147" lengthAdjust="spacingAndGlyphs" text-decoration="none">Growing row</text><rect x="48" y="526" width="624" height="240" rx="10" fill="#FFFFFF" stroke="#231F20" stroke-width="2"></rect><rect x="72" y="556" width="400" height="100" rx="4" fill="#F7F4ED" stroke="#231F20" stroke-width="2"></rect><rect x="88" y="571" width="28" height="28" rx="3" fill="#FFFFFF" stroke="#231F20" stroke-width="2"></rect><line x1="496" y1="556" x2="496" y2="656" stroke="#326448" stroke-width="2" stroke-dasharray=""></line><line x1="488" y1="556" x2="504" y2="556" stroke="#326448" stroke-width="2" stroke-dasharray=""></line><line x1="488" y1="656" x2="504" y2="656" stroke="#326448" stroke-width="2" stroke-dasharray=""></line><text x="137" y="596" font-size="28" font-weight="400" fill="#231F20" textLength="202" lengthAdjust="spacingAndGlyphs" text-decoration="none">Email me about</text><text x="137" y="632" font-size="28" font-weight="400" fill="#231F20" textLength="299" lengthAdjust="spacingAndGlyphs" text-decoration="none">changes to this journey</text><text x="523" y="596" font-size="22" font-weight="400" fill="#231F20" textLength="46" lengthAdjust="spacingAndGlyphs" text-decoration="none">Row</text><text x="523" y="626" font-size="22" font-weight="400" fill="#231F20" textLength="61" lengthAdjust="spacingAndGlyphs" text-decoration="none">grows</text><text x="91" y="704" font-size="22" font-weight="400" fill="#231F20" textLength="149" lengthAdjust="spacingAndGlyphs" text-decoration="underline">Reminder help</text><text x="91" y="752" font-size="22" font-weight="400" fill="#231F20" textLength="154" lengthAdjust="spacingAndGlyphs" text-decoration="none">Journey details</text><text x="35" y="816" font-size="22" font-weight="400" fill="#231F20" textLength="464" lengthAdjust="spacingAndGlyphs" text-decoration="none">The complete label stays beside its checkbox.</text><line x1="32" y1="844" x2="688" y2="844" stroke="#C9C2B6" stroke-width="2" stroke-dasharray=""></line><text x="35" y="880" font-size="22" font-weight="400" fill="#69635F" textLength="608" lengthAdjust="spacingAndGlyphs" text-decoration="none">Following content moves down instead of covering the label.</text></g></svg>