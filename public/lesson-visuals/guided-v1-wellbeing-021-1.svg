deliberately rather than</text><text x="299" y="471.88" font-size="22" font-weight="400" fill="#231f20" textLength="178" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">through autoplay.</text><path d="M 262 426 L 271 435 L 262 444 L 253 435 Z" fill="#f7f4ed" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><path d="M 32 566 L 98 566" fill="none" stroke="#bc2031" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="119" y="572.88" font-size="22" font-weight="400" fill="#69635f" textLength="211" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Explanatory diagram</text></g></svg>