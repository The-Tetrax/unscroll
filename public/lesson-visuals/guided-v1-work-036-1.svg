<svg xmlns="http://www.w3.org/2000/svg" width="720" height="842" viewBox="0 0 720 842" role="img" aria-labelledby="teaching-77-6f-72-6b-2d-30-33-36-v-30-title" aria-describedby="teaching-77-6f-72-6b-2d-30-33-36-v-30-desc" font-family="Arial, sans-serif" data-format="timeline" data-visual-id="work-036" data-visual-index="0"><title id="teaching-77-6f-72-6b-2d-30-33-36-v-30-title">What was known at each point</title><desc id="teaching-77-6f-72-6b-2d-30-33-36-v-30-desc">The 09:04 rejection becomes known at 09:12, after the 09:10 decision based on the 09:08 alert.
1. 09:04 Event. Worker rejection recorded locally; not yet available to the responder.
2. 09:08 Observation. Alert reports failed work, without the worker rejection detail.
3. 09:10 Decision. Responder checks queue progress using the alert information.
4. 09:12 Evidence arrives. Retrieved log reveals the rejection timestamped 09:04.
5. 09:18 Interpretation. Synthetic template reproduction supplies a candidate cause.</desc><defs><marker id="teaching-77-6f-72-6b-2d-30-33-36-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-6f-72-6b-2d-30-33-36-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-6f-72-6b-2d-30-33-36-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="842" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="101" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Timeline</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="482" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">What was known at each point</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="531" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Event order only; spacing is not proportional to time.</text><g data-time-spacing="ordinal"><path d="M 262 219 L 262 664" fill="none" stroke="#69635f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g data-item-index="0"><text x="35" y="229.04" font-size="26" font-weight="700" fill="#231f20" textLength="155" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">09:04 Event</text><text x="299" y="224.88" font-size="22" font-weight="400" fill="#231f20" tex