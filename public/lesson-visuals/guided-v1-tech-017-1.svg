<svg xmlns="http://www.w3.org/2000/svg" width="720" height="689" viewBox="0 0 720 689" role="img" aria-labelledby="teaching-74-65-63-68-2d-30-31-37-v-30-title" aria-describedby="teaching-74-65-63-68-2d-30-31-37-v-30-desc" font-family="Arial, sans-serif" data-format="timeline" data-visual-id="tech-017" data-visual-index="0"><title id="teaching-74-65-63-68-2d-30-31-37-v-30-title">Receipt precedes this example commit</title><desc id="teaching-74-65-63-68-2d-30-31-37-v-30-desc">TCP ACK at 5 milliseconds precedes parsing at 8, commit at 30, and application response at 35.
1. 5 ms: TCP receipt. ACK 1120 for bytes through 1119
2. 8 ms: parsing. Application interprets the submission
3. 30 ms: commit. Storage operation completes under its contract
4. 35 ms: response. Application reports its result to the caller</desc><defs><marker id="teaching-74-65-63-68-2d-30-31-37-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-65-63-68-2d-30-31-37-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-65-63-68-2d-30-31-37-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="689" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="101" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Timeline</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="610" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Receipt precedes this example commit</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="531" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Event order only; spacing is not proportional to time.</text><g data-time-spacing="ordinal"><path d="M 262 219 L 262 511" fill="none" stroke="#69635f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g data-item-index="0"><text x="35" y="229.04" font-size="26" font-weight="700" fill="#231f20" textLength="137" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">5 ms: TCP</text><text x="35" y="266.04" font-size="26" font-weight="700" fill="#231f20" textLength="87" le