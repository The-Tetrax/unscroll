ze="22" font-weight="400" fill="#231f20" textLength="347" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Application reports its result to the</text><text x="299" y="547.88" font-size="22" font-weight="400" fill="#231f20" textLength="55" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">caller</text><path d="M 262 502 L 271 511 L 262 520 L 253 511 Z" fill="#bc2031" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><path d="M 32 642 L 98 642" fill="none" stroke="#bc2031" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="119" y="648.88" font-size="22" font-weight="400" fill="#69635f" textLength="211" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Explanatory diagram</text></g></svg>