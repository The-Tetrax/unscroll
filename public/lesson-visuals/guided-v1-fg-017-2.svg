<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1021" viewBox="0 0 720 1021" role="img" aria-labelledby="teaching-66-67-2d-30-31-37-v-31-title" aria-describedby="teaching-66-67-2d-30-31-37-v-31-desc" font-family="Arial, sans-serif" data-format="bars" data-visual-id="fg-017" data-visual-index="1"><title id="teaching-66-67-2d-30-31-37-v-31-title">Narrow spans when every wide span is 60 mm</title><desc id="teaching-66-67-2d-30-31-37-v-31-desc">Three openings have narrow spans 48, 30, and 12 millimeters with ratios 0.8, 0.5, and 0.2.
1. Open profile. 48 / 60 = 0.8. Value: 48 millimeters of narrow span.
2. Middle profile. 30 / 60 = 0.5. Value: 30 millimeters of narrow span.
3. Closed profile. 12 / 60 = 0.2. Value: 12 millimeters of narrow span.</desc><defs><marker id="teaching-66-67-2d-30-31-37-v-31-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-66-67-2d-30-31-37-v-31-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-66-67-2d-30-31-37-v-31-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="1021" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="92" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Bar plot</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="616" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Narrow spans when every wide span is</text><text x="35" y="150.28" font-size="32" font-weight="700" fill="#231f20" textLength="109" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">60 mm</text><text x="35" y="212.88" font-size="22" font-weight="400" fill="#231f20" textLength="519" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Zero baseline; bar lengths use the supplied values.</text><text x="35" y="257.96" font-size="24" font-weight="700" fill="#231f20" textLength="374" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Unit: millimeters of narrow span</text><text x="42.5" y="303.96" font-size="24" font-weight="700" fill="#231f20" textLength="15" lengthAdjust