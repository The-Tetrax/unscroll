/text></g><g data-item-index="2" data-zero-x="50"><text x="35" y="758.04" font-size="26" font-weight="700" fill="#231f20" textLength="177" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Closed profile</text><text x="35" y="801.04" font-size="26" font-weight="700" fill="#69635f" textLength="377" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">12 millimeters of narrow span</text><path d="M 50 853 L 670 853" fill="none" stroke="#ddd7cc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 50 816 L 50 861" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="50" y="821" width="155" height="32" rx="0" fill="#69635f" stroke="none" stroke-width="3"/><path data-value="12" d="M 205 818 V 856" stroke="#69635f" stroke-width="3"/><text x="35" y="895.88" font-size="22" font-weight="400" fill="#231f20" textLength="135" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">12 / 60 = 0.2.</text></g><path d="M 32 974 L 98 974" fill="none" stroke="#bc2031" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="119" y="980.88" font-size="22" font-weight="400" fill="#69635f" textLength="211" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Explanatory diagram</text></g></svg>