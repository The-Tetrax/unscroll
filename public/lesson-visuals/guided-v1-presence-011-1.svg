<svg xmlns="http://www.w3.org/2000/svg" width="720" height="936" viewBox="0 0 720 936" role="img" aria-labelledby="teaching-70-72-65-73-65-6e-63-65-2d-30-31-31-v-30-title" aria-describedby="teaching-70-72-65-73-65-6e-63-65-2d-30-31-31-v-30-desc" font-family="Arial, sans-serif" data-format="dialogue" data-visual-id="presence-011" data-visual-index="0"><title id="teaching-70-72-65-73-65-6e-63-65-2d-30-31-31-v-30-title">Find the missing action</title><desc id="teaching-70-72-65-73-65-6e-63-65-2d-30-31-31-v-30-desc">An ambiguous fan question is clarified as a request to reduce noise during the conversation.
1. Arun. Is that fan staying on?
2. You. Would you like it off while we talk?
3. Arun. Yes. I cannot hear the instructions over it.
4. You. I will turn it off for this conversation.</desc><defs><marker id="teaching-70-72-65-73-65-6e-63-65-2d-30-31-31-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-70-72-65-73-65-6e-63-65-2d-30-31-31-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-70-72-65-73-65-6e-63-65-2d-30-31-31-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="936" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="106" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Dialogue</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="364" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Find the missing action</text><circle cx="79" cy="168" r="22" fill="#231f20" stroke="#231f20" stroke-width="3"/><text x="71.5" y="175.96" font-size="24" font-weight="700" fill="#f7f4ed" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">1</text><text x="119" y="172.04" font-size="26" font-weight="700" fill="#231f20" textLength="61" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Arun</text><g data-turn-index="0" data-side="left"><path d="M 78 203 H 364 Q 386 203 386 225  L 386 263 Q 386 285 364 285 H 78 Q 56 285 56 263 L 56 264 L 38 271 L 56 244 L 56 225 Q 56 203 78 203 Z" fill="#f7f4ed" stroke="#231f20" stroke-width="3"