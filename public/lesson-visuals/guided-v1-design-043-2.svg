<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1102" viewBox="0 0 720 1102" role="img" aria-labelledby="teaching-64-65-73-69-67-6e-2d-30-34-33-v-31-title" aria-describedby="teaching-64-65-73-69-67-6e-2d-30-34-33-v-31-desc" font-family="Arial, sans-serif" data-format="swatches" data-visual-id="design-043" data-visual-index="1"><title id="teaching-64-65-73-69-67-6e-2d-30-34-33-v-31-title">Different neighbors, different boundaries</title><desc id="teaching-64-65-73-69-67-6e-2d-30-34-33-v-31-desc">A light and dark pair contrasts at the hem; matching gray patches illustrate the lost tail boundary.
1. Hem light. Abrupt pair, first side. Hex #DED8CB.
2. Hem shadow. Abrupt pair, second side. Hex #484741.
3. Tail. Lost pair, first side. Hex #77736A.
