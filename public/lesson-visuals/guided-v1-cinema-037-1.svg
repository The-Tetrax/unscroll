<svg xmlns="http://www.w3.org/2000/svg" width="720" height="840" viewBox="0 0 720 840" role="img" aria-labelledby="light-edit-037-title light-edit-037-desc" font-family="Arial" font-size="22"><title id="light-edit-037-title">The cover should keep rising at the cut</title><desc id="light-edit-037-desc">The first pair joins a halfway-open notebook to a closed notebook, restarting the action. The second pair joins the same halfway-wide pose to a slightly later close pose, both raised with the same hand in the same direction. Its output ranges are 0-2 and 2-4 seconds; the cut is instantaneous at 2 seconds. Compare the outgoing last pose with the incoming first pose. Invented timings. Check direction and speed during playback. All objects are original schematic drawings, not photographed frames. Colors and spacing are illustrative, not measurements.</desc><metadata>Source: original UNSCROLL vector artwork. No external media, film stills, or third-party characters.</metadata><defs></defs><rect x="0" y="0" width="720" height="840" rx="0" fill="#f5efe5" stroke="none" stroke-width="2"/><text x="34" y="44" font-size="22" font-weight="700" fill="#a92c3b" textLength="149.808" lengthAdjust="spacingAndGlyphs">CINEMA / 037</text><text x="34" y="88" font-size="26" font-weight="700" fill="#272322" textLength="493.6" lengthAdjust="spacingAndGlyphs">The cover should keep rising at the cut</text><path d="M32 112 L688 112" fill="none" stroke="#cfc4b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="164" font-size="24" font-weight="700" fill="#a92c3b" textLength="428.46" lengthAdjust="spacingAndGlyphs">Restart: the next view begins closed</text><rect x="48" y="185" width="312" height="210" rx="0" fill="#fffdf7" stroke="#93887a" stroke-width="2"/><rect x="48" y="185" width="312" height="40" rx="0" fill="#295d76" stroke="none" stroke-width="2"/><text x="60" y="213" font-size="22" font-weight="700" fill="#fffdf7" textLength="202.697" lengthAdjust="spacingAnd