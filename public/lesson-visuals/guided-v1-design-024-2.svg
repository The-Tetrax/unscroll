<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1179" viewBox="0 0 720 1179" role="img" aria-labelledby="teaching-64-65-73-69-67-6e-2d-30-32-34-v-31-title" aria-describedby="teaching-64-65-73-69-67-6e-2d-30-32-34-v-31-desc" font-family="Arial, sans-serif" data-format="bars" data-visual-id="design-024" data-visual-index="1"><title id="teaching-64-65-73-69-67-6e-2d-30-32-34-v-31-title">Spacing overrides at 16 px</title><desc id="teaching-64-65-73-69-67-6e-2d-30-32-34-v-31-desc">The example override values are twenty-four pixels for line height, thirty-two for paragraph spacing, 1.92 for letter spacing, and 2.56 for word spacing.
1. Line height. 16 x 1.5 = 24. Value: 24 CSS px at 16 px font size.
2. After paragraph. 16 x 2 = 32. Value: 32 CSS px at 16 px font size.
3. Letter spacing. 16 x 0.12 = 1.92. Value: 1.92 CSS px at 16 px font size.
