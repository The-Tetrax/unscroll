<svg xmlns="http://www.w3.org/2000/svg" width="720" height="976" viewBox="0 0 720 976" role="img" aria-labelledby="teaching-6d-6f-6e-65-79-2d-30-32-38-v-30-title" aria-describedby="teaching-6d-6f-6e-65-79-2d-30-32-38-v-30-desc" font-family="Arial, sans-serif" data-format="bars" data-visual-id="money-028" data-visual-index="0"><title id="teaching-6d-6f-6e-65-79-2d-30-32-38-v-30-title">Price per sheet actually used</title><desc id="teaching-6d-6f-6e-65-79-2d-30-32-38-v-30-desc">Large pack with twenty uses costs 0.60 per use; small pack 0.70; large pack with ten uses 1.20.
1. Large: 20 used. 12 divided by 20. Value: 0.6 units per used sheet.
2. Small: 10 used. 7 divided by 10. Value: 0.7 units per used sheet.
