<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1724" viewBox="0 0 720 1724" role="img" aria-labelledby="teaching-74-65-63-68-2d-30-33-33-v-30-title" aria-describedby="teaching-74-65-63-68-2d-30-33-33-v-30-desc" font-family="Arial, sans-serif" data-format="spatial" data-visual-id="tech-033" data-visual-index="0"><title id="teaching-74-65-63-68-2d-30-33-33-v-30-title">Two public-language variants in a shared cache</title><desc id="teaching-74-65-63-68-2d-30-33-33-v-30-desc">English and Tamil clients request a guide through a shared cache that distinguishes language before contacting the origin.
1. English reader. GET /guide; Accept-Language: en
2. Tamil reader. GET /guide; Accept-Language: ta
3. Shared cache. Match address plus the language variant
4. Guide origin. Vary: Accept-Language
1 to 3: en.
2 to 3: ta.
3 to 4: miss.</desc><defs><marker id="teaching-74-65-63-68-2d-30-33-33-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-65-63-68-2d-30-33-33-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-65-63-68-2d-30-33-33-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker><mask id="teaching-74-65-63-68-2d-30-33-33-v-30-connections-mask" maskUnits="userSpaceOnUse" x="36" y="237" width="648" height="650" style="mask-type:luminance"><rect x="36" y="237" width="648" height="650" fill="#ffffff"/><rect x="136.8" y="407.5" width="90" height="90" fill="#000000"/><rect x="136.8" y="635.4" width="90" height="90" fill="#000000"/><rect x="320.4" y="515" width="90" height="90" fill="#000000"/><rect x="504" y="515" width="90" height="90" fill="#000000"/><rect x="152.8" y="332.5" width="58" height="58" fill="#000000"/><rect x="152.8" y="560.4" width="58" height="58" fill="#000000"/><rect x="336.4" y="440" width="58" height="58" fill="#000000"/><rect x="520" y="440" width="58" height="58" fill="#000000"/></mask></defs><rect width="720" height="1724" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="186" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Spatial diagram</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="648" lengthAdjust="spacingAndGlyphs" style="