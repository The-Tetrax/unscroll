<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1179" viewBox="0 0 720 1179" role="img" aria-labelledby="teaching-6d-6f-6e-65-79-2d-30-32-34-v-30-title" aria-describedby="teaching-6d-6f-6e-65-79-2d-30-32-34-v-30-desc" font-family="Arial, sans-serif" data-format="bars" data-visual-id="money-024" data-visual-index="0"><title id="teaching-6d-6f-6e-65-79-2d-30-32-34-v-30-title">Household outlay in two sample years</title><desc id="teaching-6d-6f-6e-65-79-2d-30-32-34-v-30-desc">No-claim outlays are A 60 and B 40; with one covered 900 loss they are A 260 and B 440.
1. A: no claim. Premium only. Value: 60 units per year.
2. B: no claim. Premium only. Value: 40 units per year.
3. A: one 900-unit loss. 60 premium + 200 deductible. Value: 260 units per year.
