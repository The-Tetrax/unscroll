<svg xmlns="http://www.w3.org/2000/svg" width="720" height="484" viewBox="0 0 720 484" role="img" aria-labelledby="teaching-70-65-72-73-70-65-63-74-69-76-65-2d-30-30-34-v-30-title" aria-describedby="teaching-70-65-72-73-70-65-63-74-69-76-65-2d-30-30-34-v-30-desc" font-family="Arial, sans-serif" data-format="comparison" data-visual-id="perspective-004" data-visual-index="0"><title id="teaching-70-65-72-73-70-65-63-74-69-76-65-2d-30-30-34-v-30-title">Two demands placed on the cards</title><desc id="teaching-70-65-72-73-70-65-63-74-69-76-65-2d-30-30-34-v-30-desc">Waiting for a final life purpose is contrasted with sorting a chosen batch so a cousin can find a recipe.
