<svg xmlns="http://www.w3.org/2000/svg" width="720" height="709" viewBox="0 0 720 709" role="img" aria-labelledby="teaching-74-65-63-68-2d-30-30-37-v-30-title" aria-describedby="teaching-74-65-63-68-2d-30-30-37-v-30-desc" font-family="Arial, sans-serif" data-format="timeline" data-visual-id="tech-007" data-visual-index="0"><title id="teaching-74-65-63-68-2d-30-30-37-v-30-title">Eight hours of address permission</title><desc id="teaching-74-65-63-68-2d-30-30-37-v-30-desc">Lease begins at 09:00, renews at 13:00, rebinds at 16:00, and expires at 17:00.
1. 09:00: lease begins. Eight-hour permission starts
2. 13:00: renewal time. 4 hours elapsed; quietly ask the issuing server
3. 16:00: rebinding time. 7 hours elapsed; broadcast for any server
4. 17:00: expiry. 8 hours elapsed; stop using the leased address</desc><defs><marker id="teaching-74-65-63-68-2d-30-30-37-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-65-63-68-2d-30-30-37-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-65-63-68-2d-30-30-37-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="709" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="101" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Timeline</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="537" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Eight hours of address permission</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="531" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Event order only; spacing is not proportional to time.</text><g data-time-spacing="ordinal"><path d="M 262 219 L 262 543" fill="none" stroke="#69635f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g data-item-index="0"><text x="35" y="229.04" font-size="26" font-weight="700" fill="#231f20" textLength="158" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">09:00: lease</text><text x="35" y="266.04" font-size="26" font-weight="700" fill="#231f20" textLength="86" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">begins</text><text x="299" y="224.88" font-size="22" font-weight="400" fill="#231f20" textLength="287" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Eight-hour permission starts</text><path d="M 262 210 L 271 219 L 262 228 L 253 219 Z" fill="#f7f4ed" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g data-item-index="1"><text x="35" y="337.04" font-size="26" font-weight="700" fill="#231f20" textLength="190" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">13:00: renewal</text><text x="35" y="374.04" font-size="26" font-weight="700" fill="#231f20" textLength="55" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">time</text><text x="299" y="332.88" font-size="22" font-weight="400" fill="#231f20" textLength="324" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">4 hours elapsed; quietly ask the</text><text x="299" y="363.88" font-size="22" font-weight="400" fill="#231f20" textLength="142" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">issuing server</text><path d="M 262 318 L 271 327 L 262 336 L 253 327 Z" fill="#bc2031" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g data-item-index="2"><text x="35" y="445.04" font-size="26" font-weight="700" fill="#231f20" textLength="81" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">16:00:</text><text x="35" y="482.04" font-size="26" font-weight="700" fill="#231f20" textLength="182" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">rebinding time</text><text x="299" y="440.88" font-size="22" font-weight="400" fill="#231f20" textLength="354" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">7 hours elapsed; broadcast for any</text><text x="299" y="471.88" font-size="22" font-weight="400" fill="#231f20" textLength="64" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">server</text><path d="M 262 426 L 271 435 L 262 444 L 253 435 Z" fill="#f7f4ed" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g data-item-index="3"><text x="35" y="553.04" font-size="26" font-weight="700" fill="#231f20" textLength="166" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">17:00: expiry</text><text x="299" y="548.88" font-size="22" font-weight="400" fill="#231f20" textLength="320" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">8 hours elapsed; stop using the</text><text x="299" y="579.88" font-size="22" font-weight="400" fill="#231f20" textLength="156" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">leased address</text><path d="M 262 534 L 271 543 L 262 552 L 253 543 Z" fill="#bc2031" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><path d="M 32 662 L 98 662" fill="none" stroke="#bc2031" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="119" y="668.88" font-size="22" font-weight="400" fill="#69635f" textLength="211" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Explanatory diagram</text></g></svg>