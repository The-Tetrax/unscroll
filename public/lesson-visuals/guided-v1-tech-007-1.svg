<svg xmlns="http://www.w3.org/2000/svg" width="720" height="681" viewBox="0 0 720 681" role="img" aria-labelledby="teaching-74-65-63-68-2d-30-30-37-v-30-title" aria-describedby="teaching-74-65-63-68-2d-30-30-37-v-30-desc" font-family="Arial, sans-serif" data-format="timeline" data-visual-id="tech-007" data-visual-index="0"><title id="teaching-74-65-63-68-2d-30-30-37-v-30-title">Eight hours of address permission</title><desc id="teaching-74-65-63-68-2d-30-30-37-v-30-desc">Lease begins at 09:00, renews at 13:00, rebinds at 16:00, and expires at 17:00.
1. 09:00: lease begins. Eight-hour permission starts
2. 13:00: T1. 4 hours elapsed; try issuing server
3. 16:00: T2. 7 hours elapsed; seek another server
4. 17:00: expiration. 8 hours elapsed; stop using the leased address</desc><defs><marker id="teaching-74-65-63-68-2d-30-30-37-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-65-63-68-2d-30-30-37-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-65-63-68-2d-30-30-37-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="681" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="101" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Timeline</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="537" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Eight hours of address permission</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="531" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Event order only; spacing is not proportional to time.</text><g data-time-spacing="ordinal"><path d="M 262 219 L 262 503" fill="none" stroke="#69635f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g data-item-index="0"><text x="35" y="229.04" font-size="26" font-weight="700" fill="#231f20" textLength="158" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">09:00: lease</text><text x="35" y="266.04" font-size="26" font-weight="700" fill="#231f20" textLength="86