<svg xmlns="http://www.w3.org/2000/svg" width="720" height="952" viewBox="0 0 720 952" role="img" focusable="false" aria-labelledby="design-ux-030-title" aria-describedby="design-ux-030-desc" font-family="Arial, sans-serif" font-size="22" data-layout-guard="estimated-arial-line-boxes"><title id="design-ux-030-title">Contrast at the actual caption</title><desc id="design-ux-030-desc">Identical captions use #777777 and #595959 on opaque #FFFFFF beside the same original leaf print. Their approximate ratios are 4.478:1 and 7.005:1; the unrounded values respectively fail and pass the ordinary-text AA threshold of 4.5:1, without establishing full WCAG conformance.</desc><defs><clipPath id="design-ux-030-art-0" clipPathUnits="userSpaceOnUse"><rect x="68" y="252" width="84" height="86" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"></rect></clipPath><clipPath id="design-ux-030-art-1" clipPathUnits="userSpaceOnUse"><rect x="68" y="558" width="84" height="86" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2"></rect></clipPath></defs><rect x="0" y="0" width="720" height="952" rx="0" fill="#F7F4ED" stroke="none" stroke-width="2"></rect><g aria-hidden="true"><text x="35" y="52" font-size="28" font-weight="700" fill="#231F20" textLength="397" lengthAdjust="spacingAndGlyphs" text-decoration="none">Contrast at the actual caption</text><text x="35" y="94" font-size="22" font-weight="400" fill="#69635F" textLength="502" lengthAdjust="spacingAndGlyphs" text-decoration="none">Illustrative catalog; specified opaque sRGB colors</text><line x1="32" y1="114" x2="688" y2="114" stroke="#231F20" stroke-width="2" stroke-dasharray=""></line><text x="35" y="154" font-size="22" font-weight="400" fill="#231F20" textLength="524" lengthAdjust="spacingAndGlyphs" text-decoration="none">Both captions use the same words, size and weight.</text><rect x="32" y="180" width="656" height="276" rx="10" fill="#FFFFFF" stroke="#231F20" stroke-width="2"></rect><text x="55" y="218" font-size="24" font-weight="700" fill="#231F20" textLength="232" lengthAdjust="spacingAndGlyphs" text-decoration="none">Caption A: #777777</text><rect x="52" y="238" width="340" height="180" rx="4" fill="#FFFFFF" stroke="#C9C2B6" stroke-width="2"></rect><rect x="68" y="252" width="84" height="86" rx="0" fill="#F7F4ED" stroke="none" stroke-width="2"></rect><g clip-path="url(#design-ux-030-art-0)"><g transform="translate(68 269.333) scale(0.233)"><line x1="42" y1="205" x2="316" y2="205" stroke="#C9C2B6" stroke-width="1" stroke-dasharray=""></line><path d="M 91 198 C 105 162 95 89 128 55 Q 139 41 149 49" fill="none" stroke="#326448" stroke-width="5" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round"></path><path d="M 149 49 C 195 24 256 49 278 99 C 295 137 285 170 289 193 C 241 174 205 148 181 113 C 164 88 156 68 149 49 Z" fill="#CCD8C0" stroke="#231F20" stroke-width="2.5" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round"></path><path d="M 149 49 C 197 66 248 121 285 187" fill="none" stroke="#326448" stroke-width="3" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round"></path><path d="M 174 65 L 190 49 M 195 83 L 224 64 M 218 108 L 254 88 M 239 138 L 278 121 M 258 161 L 286 151" fill="none" stroke="#326448" stroke-width="1.5" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round"></path><path d="M 184 74 L 180 99 M 207 96 L 210 140 M 229 123 L 242 163 M 252 153 L 264 180" fill="none" stroke="#326448" stroke-width="1.5" stroke-dasharray="" stroke-linecap="round" stroke-linejoin="round"></path><ellipse cx="90" cy="200" rx="9" ry="3" fill="#B4ACA0" stroke="none" stroke-width="2"></ellipse></g></g><rect x="68" y="252" width="84" height="86" rx="3" fill="none" stroke="#C9C2B6" stroke-width="2"></rect><text x="171" y="290" font-size="24" font-weight="400" fill="#231F20" textLength="115" lengthAdjust="spacingAndGlyphs" text-decoration="none">Leaf study</text><text x="71" y="376" font-size="22" font-weight="400" fill="#777777" textLength="2