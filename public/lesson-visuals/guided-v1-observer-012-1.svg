<svg xmlns="http://www.w3.org/2000/svg" width="720" height="777" viewBox="0 0 720 777" role="img" aria-labelledby="teaching-6f-62-73-65-72-76-65-72-2d-30-31-32-v-30-title" aria-describedby="teaching-6f-62-73-65-72-76-65-72-2d-30-31-32-v-30-desc" font-family="Arial, sans-serif" data-format="timeline" data-visual-id="observer-012" data-visual-index="0"><title id="teaching-6f-62-73-65-72-76-65-72-2d-30-31-32-v-30-title">Observation, interpretation, correction</title><desc id="teaching-6f-62-73-65-72-76-65-72-2d-30-31-32-v-30-desc">At 14:05 a form closes; an abandonment interpretation is later corrected by the volunteer at 14:08.
1. 14:05: observed. Form closed; notebook opened.
2. 14:05: initial interpretation. Observer wrote abandoned; intention was not observed.
3. 14:08: volunteer explains. Paused to find plot number; intended to return.
4. Revised note. Keep observation; attribute explanation; mark abandoned as corrected.</desc><defs><marker id="teaching-6f-62-73-65-72-76-65-72-2d-30-31-32-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6f-62-73-65-72-76-65-72-2d-30-31-32-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6f-62-73-65-72-76-65-72-2d-30-31-32-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="777" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="101" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Timeline</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="595" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Observation, interpretation, correction</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="531" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Event order only; spacing is not proportional to time.</text><g data-time-spacing="ordinal"><path d="M 262 219 L 262 580" fill="none" stroke="#69635f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g data-item-index="0"><text x="35" y="229.04" font-size="26" font-weight="700" fill="#231f20" textLength="81" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">14:05:</text><text x="35" y="266.04" font-size