<svg xmlns="http://www.w3.org/2000/svg" width="720" height="613" viewBox="0 0 720 613" role="img" aria-labelledby="teaching-63-69-6e-65-6d-61-2d-30-31-36-v-31-title" aria-describedby="teaching-63-69-6e-65-6d-61-2d-30-31-36-v-31-desc" font-family="Arial, sans-serif" data-format="timeline" data-visual-id="cinema-016" data-visual-index="1"><title id="teaching-63-69-6e-65-6d-61-2d-30-31-36-v-31-title">Jobs in viewing order</title><desc id="teaching-63-69-6e-65-6d-61-2d-30-31-36-v-31-desc">Wide context, close recipient label, then medium view of the return.
