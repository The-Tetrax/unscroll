<svg xmlns="http://www.w3.org/2000/svg" width="720" height="840" viewBox="0 0 720 840" role="img" aria-labelledby="light-edit-042-title light-edit-042-desc" font-family="Arial" font-size="22"><title id="light-edit-042-title">Change only the neighboring image</title><desc id="light-edit-042-desc">Version A is the same Saturday calendar, a brush tray, then the identical calendar. Version B replaces only the tray with a packed bag. Both have three two-second pictures and no music change. Painting or departure are possible readings, but brushes can mean cleanup and a bag can mean storage. Keep the calendar, 2 s holds, and sound alike in both versions. An association invites a reading; it does not prove an event. All objects are original schematic drawings, not photographed frames. Colors and spacing are illustrative, not measurements.</desc><metadata>Source: original UNSCROLL vector artwork. No external media, film stills, or third-party characters.</metadata><defs></defs><rect x="0" y="0" width="720" height="840" rx="0" fill="#f5efe5" stroke="none" stroke-width="2"/><text x="34" y="44" font-size="22" font-weight="700" fill="#a92c3b" textLength="149.808" lengthAdjust="spacingAndGlyphs">CINEMA / 042</text><text x="34" y="88" font-size="26" font-weight="700" fill="#272322" textLength="441.897" lengthAdjust="spacingAndGlyphs">Change only the neighboring image</text><path d="M32 112 L688 112" fill="none" stroke="#cfc4b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="158" font-size="24" font-weight="700" fill="#272322" textLength="363.996" lengthAdjust="spacingAndGlyphs">A: Saturday, brushes, Saturday</text><rect x="48" y="177" width="208" height="180" rx="0" fill="#fffdf7" stroke="#93887a" stroke-width="2"/><rect x="48" y="177" width="208" height="40" rx="0" fill="#295d76" stroke="none" stroke-width="2"/><text x="60" y="205" font-size="22" font-weight="700" fill="#fffdf7" textLength="159.882" lengthAdjust="spacingAndGlyphs">Same calendar</