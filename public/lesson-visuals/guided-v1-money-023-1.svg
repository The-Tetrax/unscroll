<svg xmlns="http://www.w3.org/2000/svg" width="720" height="484" viewBox="0 0 720 484" role="img" aria-labelledby="teaching-6d-6f-6e-65-79-2d-30-32-33-v-30-title" aria-describedby="teaching-6d-6f-6e-65-79-2d-30-32-33-v-30-desc" font-family="Arial, sans-serif" data-format="comparison" data-visual-id="money-023" data-visual-index="0"><title id="teaching-6d-6f-6e-65-79-2d-30-32-33-v-30-title">One sublimit, two valuations</title><desc id="teaching-6d-6f-6e-65-79-2d-30-32-33-v-30-desc">An 800-unit replacement valuation pays 500; a 480-unit depreciated valuation pays 380 under sample rules.
1. Replacement valuation. 800 valued; capped at 600; less 100 = 500 units.
2. Depreciated valuation. 480 valued; below 600 cap; less 100 = 380 units.</desc><defs><marker id="teaching-6d-6f-6e-65-79-2d-30-32-33-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6d-6f-6e-65-79-2d-30-32-33-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6d-6f-6e-65-79-2d-30-32-33-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="484" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="144" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Comparison</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="443" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">One sublimit, two valuations</text><g data-item-index="0" data-column="0"><circle cx="55" cy="168" r="22" fill="#231f20" stroke="#231f20" stroke-width="3"/><text x="47.5" y="175.96" font-size="24" font-weight="700" fill="#f7f4ed" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">1</text><path d="M 90 168 L 336 168" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="41" y="238.04" font-size="26" font-weight="700" fill="#231f20" textLength="171" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Replacement</text><text x="41" y="275.04" font-size="26" font-weight="700" fill