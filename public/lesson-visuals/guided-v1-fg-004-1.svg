<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1185" viewBox="0 0 720 1185" role="img" aria-labelledby="teaching-66-67-2d-30-30-34-v-30-title" aria-describedby="teaching-66-67-2d-30-30-34-v-30-desc" font-family="Arial, sans-serif" data-format="dialogue" data-visual-id="fg-004" data-visual-index="0"><title id="teaching-66-67-2d-30-30-34-v-30-title">A question about one person&apos;s preference</title><desc id="teaching-66-67-2d-30-30-34-v-30-desc">Isha offers an optional format question; Rowan asks whose preference matters, then reports a personal preference.
1. Isha. Optional question: would live check-ins, written updates, or another format suit you?
2. Rowan. Are you asking what I want, or what I think the club wants?
3. Isha. Your own preference. No preference is also an answer; you can skip this.
4. Rowan. I prefer written updates. I had assumed the others wanted live ones.</desc><defs><marker id="teaching-66-67-2d-30-30-34-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-66-67-2d-30-30-34-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-66-67-2d-30-30-34-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="1185" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="106" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Dialogue</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="480" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">A question about one person&apos;s</text><text x="35" y="150.28" font-size="32" font-weight="700" fill="#231f20" textLength="170" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">preference</text><circle cx="79" cy="213" r="22" fill="#231f20" stroke="#231f20" stroke-width="3"/><text x="71.5" y="220.96" font-size="24" font-weight="700" fill="#f7f4ed" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">1</text><text x="119" y="217.04" font-size="26" font-weight="700" fill="#231f20" textLength="55" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Isha</text><g data-turn-index="0" data-side="left"><path d="M 78 248 H 512 Q 534 248 534 270  L 5