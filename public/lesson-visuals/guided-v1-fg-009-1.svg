<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1154" viewBox="0 0 720 1154" role="img" aria-labelledby="teaching-66-67-2d-30-30-39-v-30-title" aria-describedby="teaching-66-67-2d-30-30-39-v-30-desc" font-family="Arial, sans-serif" data-format="dialogue" data-visual-id="fg-009" data-visual-index="0"><title id="teaching-66-67-2d-30-30-39-v-30-title">Negotiating the whole bread responsibility</title><desc id="teaching-66-67-2d-30-30-39-v-30-desc">Nila proposes responsibility from headcount to arrival; Sam asks for information and authority, then accepts defined work.
1. Nila. Could you own bread from checking numbers through confirming arrival, rather than just collecting?
2. Sam. I can if I have the headcount, budget limit, and authority to choose an available option.
3. Nila. Agreed. Check the count Friday and tell me if the budget or collection time cannot work.
4. Sam. I accept that. I will choose, collect, and confirm it is at the picnic before we start.</desc><defs><marker id="teaching-66-67-2d-30-30-39-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-66-67-2d-30-30-39-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-66-67-2d-30-30-39-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="1154" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="106" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Dialogue</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="443" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Negotiating the whole bread</text><text x="35" y="150.28" font-size="32" font-weight="700" fill="#231f20" textLength="206" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">responsibility</text><circle cx="79" cy="213" r="22" fill="#231f20" stroke="#231f20" stroke-width="3"/><text x="71.5" y="220.96" font-size="24" font-weight="700" fill="#f7f4ed" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">1</text><text x="119" y="217.04" font-size="26" font-weight="700" fill="#231f20" textLength="50" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Nila</text><g data-turn-index="0" data-side="left"><path d="M 78 248 H 590 Q 612 24