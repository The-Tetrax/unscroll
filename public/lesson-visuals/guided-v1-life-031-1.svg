1. Ready-to-eat food. Protected from raw-food drips.
2. Appliance thermometer. 40 F or below, about 4 C.
3. Contained raw food. Leak-catching container below ready-to-eat items.
4. Intended air path. Do not tightly block circulation.</desc><defs><marker id="teaching-6c-69-66-65-2d-30-33-31-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6c-69-66-65-2d-30-33-31-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6c-69-66-65-2d-30-33-31-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker><mask id="teaching-6c-69-66-65-2d-30-33-31-v-30-connections-mask" maskUnits="userSpaceOnUse" x="36" y="237" width="648" height="650" style="mask-type:luminance"><rect x="36" y="237" width="648" height="650" fill="#ffffff"/><rect x="163.8" y="394.6" width="90" height="90" fill="#000000"/><rect x="466.2" y="394.6" width="90" height="90" fill="#000000"/><rect x="163.8" y="635.4" width="90" height="90" fill="#000000"/><rect x="466.2" y="635.4" width="90" height="90" fill="#000000"/><rect x="179.8" y="319.6" width="58" height="58" fill="#000000"/><rect x="482.2" y="319.6" width="58" height="58" fill="#000000"/><rect x="179.8" y="560.4" width="58" height="58" fill="#000000"/><rect x="482.2" y="560.4" width="58" height="58" fill="#000000"/></mask></defs><rect width="720" height="1459" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="186" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Spatial diagram</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" te