<title id="design-type-008-title">Keep a baseline before choosing a look</title>
<desc id="design-type-008-desc">Three copies of an original waiting-room timetable and bench retain the same drawing. The timetable patch changes from unwanted greenish #B6C8B7 to neutral baseline #C4C4C4, then to deliberate warm #D1C4AF. Neutral correction and creative warmth are separate decisions, with the baseline retained.</desc>
