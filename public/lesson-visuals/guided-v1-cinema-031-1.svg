<svg xmlns="http://www.w3.org/2000/svg" width="720" height="840" viewBox="0 0 720 840" role="img" aria-labelledby="light-edit-031-title light-edit-031-desc" font-family="Arial" font-size="22"><title id="light-edit-031-title">One card under two different lights</title><desc id="light-edit-031-desc">In A, a window and a warm lamp illuminate opposite sides of an actual drawn hand and white card. Both card and hand have a blue-to-amber cast. In B the optional lamp is off and daylight dominates both sides. An overall white-balance change cannot independently adjust the two regions. For B, switch the optional lamp off using its normal control. Compare both sides together; these are not calibrated colors. All objects are original schematic drawings, not photographed frames. Colors and spacing are illustrative, not measurements.</desc><metadata>Source: original UNSCROLL vector artwork. No external media, film stills, or third-party characters.</metadata><defs><linearGradient id="light-edit-031-mixed-page" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#c6dce6"/><stop offset="42%" stop-color="#dde0d5"/><stop offset="62%" stop-color="#e8d0ac"/><stop offset="100%" stop-color="#e7b879"/></linearGradient><linearGradient id="light-edit-031-mixed-hand" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#716f68"/><stop offset="45%" stop-color="#896047"/><stop offset="100%" stop-color="#b47f4b"/></linearGradient></defs><rect x="0" y="0" width="720" height="840" rx="0" fill="#f5efe5" stroke="none" stroke-width="2"/><text x="34" y="44" font-size="22" font-weight="700" fill="#a92c3b" textLength="149.808" lengthAdjust="spacingAndGlyphs">CINEMA / 031</text><text x="34" y="88" font-size="26" font-weight="700" fill="#272322" textLength="440.795" lengthAdjust="spacingAndGlyphs">One card under two different lights</text><path d="M32 112 L688 112" fill="none" stroke="#cfc4b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="32" y="136" wi