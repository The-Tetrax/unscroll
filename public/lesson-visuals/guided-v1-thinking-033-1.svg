<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1179" viewBox="0 0 720 1179" role="img" aria-labelledby="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-33-v-30-title" aria-describedby="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-33-v-30-desc" font-family="Arial, sans-serif" data-format="bars" data-visual-id="thinking-033" data-visual-index="0"><title id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-33-v-30-title">Costs on both sides of fifteen rides</title><desc id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-33-v-30-desc">At twelve rides individual fares cost 480 rupees versus a 600-rupee pass; at eighteen they cost 720 versus 600.
1. 12 rides: individual. 12 x 40 = 480. Value: 480 rupees per month.
2. 12 rides: pass. Fixed monthly price. Value: 600 rupees per month.
3. 18 rides: individual. 18 x 40 = 720. Value: 720 rupees per month.
4. 18 rides: pass. Same fixed monthly price. Value: 600 rupees per month.</desc><defs><marker id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-33-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-33-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-33-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="1179" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="92" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Bar plot</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="545" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Costs on both sides of fifteen rides</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="519" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Zero baseline; bar lengths use the supplied values.</text><text x="35" y="212.96" font-size="24" font-weight="700" fill="#231f20" textLength="271" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Unit: rupees per month</text><text x="42.5" y="258.96" font-size="24" font-weight="700" fill="#231f20" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">0</text><g data-item-index="0" data-zero-x="50"><text x="35" y="307