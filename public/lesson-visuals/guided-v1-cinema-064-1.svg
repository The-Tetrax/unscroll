nding</text><text x="299" y="512.88" font-size="22" font-weight="400" fill="#231f20" textLength="346" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">15 seconds: place it inside; hold a</text><text x="299" y="543.88" font-size="22" font-weight="400" fill="#231f20" textLength="159" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">readable result.</text><path d="M 262 498 L 271 507 L 262 516 L 253 507 Z" fill="#bc2031" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><path d="M 32 626 L 98 626" fill="none" stroke="#bc2031" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="119" y="632.88" font-size="22" font-weight="400" fill="#69635f" textLength="211" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Explanatory diagram</text></g></svg>