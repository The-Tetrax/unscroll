<svg xmlns="http://www.w3.org/2000/svg" width="720" height="673" viewBox="0 0 720 673" role="img" aria-labelledby="teaching-63-69-6e-65-6d-61-2d-30-36-34-v-30-title" aria-describedby="teaching-63-69-6e-65-6d-61-2d-30-36-34-v-30-desc" font-family="Arial, sans-serif" data-format="timeline" data-visual-id="cinema-064" data-visual-index="0"><title id="teaching-63-69-6e-65-6d-61-2d-30-36-34-v-30-title">One proposed minute for the paper roll</title><desc id="teaching-63-69-6e-65-6d-61-2d-30-36-34-v-30-desc">Fit problem: ten seconds; turn: fifteen; reroll: twenty; fitted ending: fifteen.
1. Fit problem. 10 seconds: show the long roll beside the opening.
2. Unroll and turn. 15 seconds: reveal the change of paper direction.
3. Reroll. 20 seconds: make the shorter roll legibly.
4. Fit and ending. 15 seconds: place it inside; hold a readable result.</desc><defs><marker id="teaching-63-69-6e-65-6d-61-2d-30-36-34-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-63-69-6e-65-6d-61-2d-30-36-34-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-63-69-6e-65-6d-61-2d-30-36-34-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="673" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="101" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Timeline</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="611" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">One proposed minute for the paper roll</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="531" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Event order only; spacing is not proportional to time.</text><g data-time-spacing="ordinal"><path d="M 262 219 L 262 507" fill="none" stroke="#69635f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g data-item-index="0"><text x="35" y="229.04" font-size="26" font-weight="700" fill="#231f20" textLength="145" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Fit problem</text><text x="299" y="224.88" font-size="22" font-weight="400" fil