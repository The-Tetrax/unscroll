<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1414" viewBox="0 0 720 1414" role="img" aria-labelledby="teaching-6c-69-66-65-2d-30-33-39-v-30-title" aria-describedby="teaching-6c-69-66-65-2d-30-33-39-v-30-desc" font-family="Arial, sans-serif" data-format="spatial" data-visual-id="life-039" data-visual-index="0"><title id="teaching-6c-69-66-65-2d-30-33-39-v-30-title">Include the parts outside the fabric panel</title><desc id="teaching-6c-69-66-65-2d-30-33-39-v-30-desc">A schematic bag identifies its handle, main body, wheels, and bulging side pocket as measurement features.
1. Handle. Include as required by the carrier.
2. Main bag body. Measure packed, not just its empty panel.
3. Full outer pocket. Adds to the occupied depth.
4. Wheels. Check the full height including protrusions.</desc><defs><marker id="teaching-6c-69-66-65-2d-30-33-39-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6c-69-66-65-2d-30-33-39-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6c-69-66-65-2d-30-33-39-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker><mask id="teaching-6c-69-66-65-2d-30-33-39-v-30-connections-mask" maskUnits="userSpaceOnUse" x="36" y="192" width="648" height="650" style="mask-type:luminance"><rect x="36" y="192" width="648" height="650" fill="#ffffff"/><rect x="315" y="319.5" width="90" height="90" fill="#000000"/><rect x="174.6" y="470" width="90" height="90" fill="#000000"/><rect x="477" y="470" width="90" height="90" fill="#000000"/><rect x="315" y="620.5" width="90" height="90" fill="#000000"/><rect x="331" y="244.5" width="58" height="58" fill="#000000"/><rect x="190.6" y="395" width="58" height="58" fill="#000000"/><rect x="493" y="395" width="58" height="58" fill="#000000"/><rect x="331" y="545.5" width="58" height="58" fill="#000000"/><rect x="384" y="249.5" width="105" height="48" fill="#000000"/></mask></defs><rect width="720" height="1414" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="186" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Spatial diagram</text><text x="35" y="105.28" font-s