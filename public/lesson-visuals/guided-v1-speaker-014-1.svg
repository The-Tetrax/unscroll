<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1083" viewBox="0 0 720 1083" role="img" aria-labelledby="teaching-73-70-65-61-6b-65-72-2d-30-31-34-v-30-title" aria-describedby="teaching-73-70-65-61-6b-65-72-2d-30-31-34-v-30-desc" font-family="Arial, sans-serif" data-format="dialogue" data-visual-id="speaker-014" data-visual-index="0"><title id="teaching-73-70-65-61-6b-65-72-2d-30-31-34-v-30-title">The timetable premise and the access concern</title><desc id="teaching-73-70-65-61-6b-65-72-2d-30-31-34-v-30-desc">The presenter corrects the claim about every class but acknowledges the loss of Thursday evening.
1. Participant. Why did you cancel every evening class?
2. Presenter. Tuesday remains. Thursday moved because its room is unavailable that evening.
3. Presenter. That still removes Thursday for people working days. Are you asking for another evening?
4. Participant. Yes. Tuesday clashes with my shift.</desc><defs><marker id="teaching-73-70-65-61-6b-65-72-2d-30-31-34-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-73-70-65-61-6b-65-72-2d-30-31-34-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-73-70-65-61-6b-65-72-2d-30-31-34-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="1083" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="106" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Dialogue</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="601" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">The timetable premise and the access</text><text x="35" y="150.28" font-size="32" font-weight="700" fill="#231f20" textLength="127" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">concern</text><circle cx="79" cy="213" r="22" fill="#231f20" stroke="#231f20" stroke-width="3"/><text x="71.5" y="220.96" font-size="24" font-weight="700" fill="#f7f4ed" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">1</text><text x="119" y="217.04" font-size="26" font-weight="700" fill="#231f20" textLength="137" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Participant</text><g data-turn-index="0" data-side="left"><path d="M 78 248 H 5