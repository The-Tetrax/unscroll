<svg xmlns="http://www.w3.org/2000/svg" width="720" height="657" viewBox="0 0 720 657" role="img" aria-labelledby="teaching-77-6f-72-6b-2d-30-30-38-v-30-title" aria-describedby="teaching-77-6f-72-6b-2d-30-30-38-v-30-desc" font-family="Arial, sans-serif" data-format="timeline" data-visual-id="work-008" data-visual-index="0"><title id="teaching-77-6f-72-6b-2d-30-30-38-v-30-title">Which interval measures execution?</title><desc id="teaching-77-6f-72-6b-2d-30-30-38-v-30-desc">Creation is 10:00, execution 10:10 to 10:15, and editing 10:30; only execution lasts 5 minutes.
1. 10:00 Created. Job enters the queue; execution has not begun.
2. 10:10 Started. Execution begins.
3. 10:15 Finished. Execution ends after 5 minutes.
4. 10:30 Edited. updatedAt changes; 30 minutes since creation is not execution time.</desc><defs><marker id="teaching-77-6f-72-6b-2d-30-30-38-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-6f-72-6b-2d-30-30-38-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-6f-72-6b-2d-30-30-38-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="657" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="101" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Timeline</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="571" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Which interval measures execution?</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="531" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Event order only; spacing is not proportional to time.</text><g data-time-spacing="ordinal"><path d="M 262 219 L 262 491" fill="none" stroke="#69635f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g data-item-index="0"><text x="35" y="229.04" font-size="26" font-weight="700" fill="#231f20" textLength="183" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">10:00 Created</text><text x="299" y="224.88" font-size="22" font-weight="400" fill="#231f20" textLength="371" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Job enters the queue; execution has</text><text x="299" y="255.88" font-size="22" font-weight="400" fill="#231f20" textLength="109" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">not begun.</text><path d="M 262 210 L 271 219 L 262 228 L 253 219 Z" fill="#f7f4ed" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g data-item-index="1"><text x="35" y="325.04" font-size="26" font-weight="700" fill="#231f20" textLength="174" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">10:10 Started</text><text x="299" y="320.88" font-size="22" font-weight="400" fill="#231f20" textLength="182" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Execution begins.</text><path d="M 262 306 L 271 315 L 262 324 L 253 315 Z" fill="#bc2031" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g data-item-index="2"><text x="35" y="413.04" font-size="26" font-weight="700" fill="#231f20" textLength="190" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">10:15 Finished</text><text x="299" y="408.88" font-size="22" font-weight="400" fill="#231f20" textLength="323" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Execution ends after 5 minutes.</text><path d="M 262 394 L 271 403 L 262 412 L 253 403 Z" fill="#f7f4ed" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g data-item-index="3"><text x="35" y="501.04" font-size="26" font-weight="700" fill="#231f20" textLength="163" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">10:30 Edited</text><text x="299" y="496.88" font-size="22" font-weight="400" fill="#231f20" textLength="384" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">updatedAt changes; 30 minutes since</text><text x="299" y="527.88" font-size="22" font-weight="400" fill="#231f20" textLength="305" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">creation is not execution time.</text><path d="M 262 482 L 271 491 L 262 500 L 253 491 Z" fill="#bc2031" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><path d="M 32 610 L 98 610" fill="none" stroke="#bc2031" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="119" y="616.88" font-size="22" font-weight="400" fill="#69635f" textLength="211" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Explanatory diagram</text></g></svg>