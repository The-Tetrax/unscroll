<svg xmlns="http://www.w3.org/2000/svg" width="720" height="478" viewBox="0 0 720 478" role="img" aria-labelledby="teaching-74-65-63-68-2d-30-32-35-v-30-title" aria-describedby="teaching-74-65-63-68-2d-30-32-35-v-30-desc" font-family="Arial, sans-serif" data-format="comparison" data-visual-id="tech-025" data-visual-index="0"><title id="teaching-74-65-63-68-2d-30-32-35-v-30-title">Two ways a CORS error can occur</title><desc id="teaching-74-65-63-68-2d-30-32-35-v-30-desc">An ordinary GET reaches the API but its response is hidden; a rejected preflight prevents the actual PATCH.
1. GET without preflight. Actual GET sent; missing sharing permission blocks script access to response
2. PATCH with preflight. OPTIONS sent; denied permission means actual PATCH is not sent</desc><defs><marker id="teaching-74-65-63-68-2d-30-32-35-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-65-63-68-2d-30-32-35-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-65-63-68-2d-30-32-35-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="478" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="144" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Comparison</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="549" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Two ways a CORS error can occur</text><g data-item-index="0" data-column="0"><circle cx="55" cy="168" r="22" fill="#231f20" stroke="#231f20" stroke-width="3"/><text x="47.5" y="175.96" font-size="24" font-weight="700" fill="#f7f4ed" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">1</text><path d="M 90 168 L 336 168" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="41" y="238.04" font-size="26" font-weight="700" fill="#231f20" textLength="270" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">GET without preflight</text><text x="41" y="278.88" font-size="22" font-weight="400" fill="#231f20" textLength="259" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Actual GET sent; missing</text><text x="41" y="309.88" font-size="22" font-weight="400" fill="#231f20" textLength="265" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">sharing permission blocks</text><text x="41" y="340.88" font-size="22" font-weight="400" fill="#231f20" textLength="260" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">script access to response</text></g><g data-item-index="1" data-column="1"><circle cx="401" cy="168" r="22" fill="#bc2031" stroke="#bc2031" stroke-width="3"/><text x="393.5" y="175.96" font-size="24" font-weight="700" fill="#f7f4ed" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">2</text><path d="M 436 168 L 682 168" fill="none" stroke="#bc2031" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="387" y="238.04" font-size="26" font-weight="700" fill="#231f20" textLength="268" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">PATCH with preflight</text><text x="387" y="278.88" font-size="22" font-weight="400" fill="#231f20" textLength="236" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">OPTIONS sent; denied</text><text x="387" y="309.88" font-size="22" font-weight="400" fill="#231f20" textLength="255" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">permission means actual</text><text x="387" y="340.88" font-size="22" font-weight="400" fill="#231f20" textLength="190" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">PATCH is not sent</text></g><path d="M 360 153 L 360 347" fill="none" stroke="#ddd7cc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 32 431 L 98 431" fill="none" stroke="#bc2031" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="119" y="437.88" font-size="22" font-weight="400" fill="#69635f" textLength="211" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Explanatory diagram</