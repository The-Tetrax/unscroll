roke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g data-item-index="3"><text x="35" y="553.04" font-size="26" font-weight="700" fill="#231f20" textLength="182" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">November 19:</text><text x="35" y="590.04" font-size="26" font-weight="700" fill="#231f20" textLength="69" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">plans</text><text x="299" y="548.88" font-size="22" font-weight="400" fill="#231f20" textLength="266" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Another 3 x 40 = 120 due.</text><path d="M 262 534 L 271 543 L 262 552 L 253 543 Z" fill="#bc2031" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><path d="M 32 674 L 98 674" fill="none" stroke="#bc2031" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="119" y="680.88" font-size="22" font-weight="400" fill="#69635f" textLength="211" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Explanatory diagram</text></g></svg>