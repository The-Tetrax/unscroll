<svg xmlns="http://www.w3.org/2000/svg" width="720" height="721" viewBox="0 0 720 721" role="img" aria-labelledby="teaching-6d-6f-6e-65-79-2d-30-34-30-v-30-title" aria-describedby="teaching-6d-6f-6e-65-79-2d-30-34-30-v-30-desc" font-family="Arial, sans-serif" data-format="timeline" data-visual-id="money-040" data-visual-index="0"><title id="teaching-6d-6f-6e-65-79-2d-30-34-30-v-30-title">One calendar for all three plans</title><desc id="teaching-6d-6f-6e-65-79-2d-30-34-30-v-30-desc">150 is available before November 5, when instalments need 120 and a household bill needs 50; another 120 is due November 19.
1. Before November 5. 150 units available; no earlier new income.
2. November 5: plans. Shoes 40 + lamp 40 + travel 40 = 120.
3. November 5: other bill. 50 more due; total 170; shortfall 20.
4. November 19: plans. Another 3 x 40 = 120 due.</desc><defs><marker id="teaching-6d-6f-6e-65-79-2d-30-34-30-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6d-6f-6e-65-79-2d-30-34-30-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6d-6f-6e-65-79-2d-30-34-30-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="721" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="101" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Timeline</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="496" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">One calendar for all three plans</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="531" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Event order only; spacing is not proportional to time.</text><g data-time-spacing="ordinal"><path d="M 262 219 L 262 543" fill="none" stroke="#69635f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g data-item-index="0"><text x="35" y="229.04" font-size="26" font-weight="700" fill="#231f20" textLength="86" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Before</text><text x="35" y="266.04" font-size="26" font-weight="700" fill="#231f20" textLength="158" lengthAdjust="sp