<svg xmlns="http://www.w3.org/2000/svg" width="720" height="792" viewBox="0 0 720 792" role="img" aria-labelledby="teaching-77-6f-72-6b-2d-30-33-39-v-30-title" aria-describedby="teaching-77-6f-72-6b-2d-30-33-39-v-30-desc" font-family="Arial, sans-serif" data-format="comparison" data-visual-id="work-039" data-visual-index="0"><title id="teaching-77-6f-72-6b-2d-30-33-39-v-30-title">Evidence for the proposed progress alert</title><desc id="teaching-77-6f-72-6b-2d-30-33-39-v-30-desc">Stalled pending work triggers; empty and progressing queues do not; missing telemetry is unknown.
1. Pending and stalled. 8 queued jobs, 0 completions in 5 minutes: alert under the proposed rule.
2. Empty and idle. 0 queued jobs, 0 completions: no progress alert.
3. Pending and progressing. Queued jobs plus a completion in the window: no alert from this rule.
4. Telemetry missing. Queue or completion data unavailable: unknown; define separate handling.</desc><defs><marker id="teaching-77-6f-72-6b-2d-30-33-39-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-6f-72-6b-2d-30-33-39-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-6f-72-6b-2d-30-33-39-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="792" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="144" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Comparison</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="642" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Evidence for the proposed progress alert</text><g data-item-index="0" data-column="0"><circle cx="55" cy="168" r="22" fill="#231f20" stroke="#231f20" stroke-width="3"/><text x="47.5" y="175.96" font-size="24" font-weight="700" fill="#f7f4ed" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">1</text><path d="M 90 168 L 336 168" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="41" y="238.04" font-size="26" font-weight="700" fill="#231f20" textLength="254" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Pending and stalled</text><text x="41" y="278.88" font-s