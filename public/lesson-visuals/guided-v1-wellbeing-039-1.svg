<svg xmlns="http://www.w3.org/2000/svg" width="720" height="730" viewBox="0 0 720 730" role="img" aria-labelledby="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-33-39-v-30-title" aria-describedby="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-33-39-v-30-desc" font-family="Arial, sans-serif" data-format="comparison" data-visual-id="wellbeing-039" data-visual-index="0"><title id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-33-39-v-30-title">The environment belongs in the plan</title><desc id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-33-39-v-30-desc">The same outdoor route differs between mild weather and an extreme-heat forecast; a checked indoor alternative or postponement changes the plan.
1. Previous mild outing. Past experience under different conditions.
2. Unchanged route in heat. Same distance, different environmental demand.
3. Indoor exhibition. An alternative only after checking access and travel.
4. Postponed outing. A valid option when a suitable alternative is unavailable.</desc><defs><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-33-39-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-33-39-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-33-39-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="730" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="144" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Comparison</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="575" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">The environment belongs in the plan</text><g data-item-index="0" data-column="0"><circle cx="55" cy="168" r="22" fill="#231f20" stroke="#231f20" stroke-width="3"/><text x="47.5" y="175.96" font-size="24" font-weight="700" fill="#f7f4ed" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">1</text><path d="M 90 168 L 336 168" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="41" y="238.04" font-size="26" font-weight="700" fill="#231f20" textLength="260" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Previous mild outing</text><tex