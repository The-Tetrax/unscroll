<svg xmlns="http://www.w3.org/2000/svg" width="720" height="773" viewBox="0 0 720 773" role="img" aria-labelledby="teaching-74-65-63-68-2d-30-30-32-v-30-title" aria-describedby="teaching-74-65-63-68-2d-30-30-32-v-30-desc" font-family="Arial, sans-serif" data-format="bars" data-visual-id="tech-002" data-visual-index="0"><title id="teaching-74-65-63-68-2d-30-30-32-v-30-title">Time to serialize the same 12000 bits</title><desc id="teaching-74-65-63-68-2d-30-30-32-v-30-desc">At 600 megabits per second, 12000 bits take 20 microseconds; at 150, they take 80 microseconds.
1. 600 Mbit/s. 12000 / 600000000 seconds Value: 20 microseconds.
2. 150 Mbit/s. 12000 / 150000000 seconds Value: 80 microseconds.</desc><defs><marker id="teaching-74-65-63-68-2d-30-30-32-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-65-63-68-2d-30-30-32-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-65-63-68-2d-30-30-32-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="773" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="92" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Bar plot</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="589" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Time to serialize the same 12000 bits</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="519" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Zero baseline; bar lengths use the supplied values.</text><text x="35" y="212.96" font-size="24" font-weight="700" fill="#231f20" textLength="227" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Unit: microseconds</text><text x="42.5" y="258.96" font-size="24" font-weight="700" fill="#231f20" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">0</text><g data-item-index="0" data-zero-x="50"><text x="35" y="307.04" font-size="26" font-weight="700" fill="#231f