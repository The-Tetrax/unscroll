<svg xmlns="http://www.w3.org/2000/svg" width="720" height="750" viewBox="0 0 720 750" role="img" aria-labelledby="camera-006-title camera-006-description" font-family="Arial, Helvetica, sans-serif" stroke-linecap="round" stroke-linejoin="round"><title id="camera-006-title">A larger BASIL label can be softer</title><desc id="camera-006-description">Far, middle and near trials show the same handwritten BASIL label increasing in size. Far and middle lettering is sharp; the largest near label is blurred with an SVG filter. A separate distance sketch shows the fixed phone and trial positions.</desc><defs><clipPath id="camera-006-frame-0" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="208" height="282" rx="0" fill="#ffffff" stroke="none" stroke-width="2.5"></rect></clipPath><clipPath id="camera-006-frame-1" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="208" height="282" rx="0" fill="#ffffff" stroke="none" stroke-width="2.5"></rect></clipPath><filter id="camera-006-blur-2" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="4.7"></feGaussianBlur></filter><clipPath id="camera-006-frame-3" clipPathUnits="userSpaceOnUse"><rect x="0" y="0" width="208" height="282" rx="0" fill="#ffffff" stroke="none" stroke-width="2.5"></rect></clipPath></defs><rect x="0" y="0" width="720" height="750" rx="0" fill="#f7f4ed" stroke="none" stroke-width="2.5"></rect><text x="32" y="34" font-size="22" font-weight="700" fill="#bc2031" text-anchor="start" data-drawn-text="true">CAMERA 006</text><text x="32" y="73" font-size="26" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="true">A larger BASIL label can be softer</text><line x1="32" y1="92" x2="688" y2="92" stroke="#231f20" stroke-width="2.5" stroke-dasharray=""></line><text x="32" y="127" font-size="24" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="true">1 / Far</text><g transform="translate(32 145) rotate(0) scale(1)"><rect x="0" y="0" width="208" height="282" rx="0" fill="#dfc9a9" stroke="none" stroke-width="2.5"></rect><g clip-path="url(#camera-006-frame-0)"><rect x="41" y="127.5" width="126" height="81" rx="0" fill="#fffdf5" stroke="#231f20" stroke-width="2.5"></rect><line x1="50" y1="191.5" x2="158" y2="191.5" stroke="#657e51" stroke-width="2.5" stroke-dasharray=""></line><text x="104" y="173.67" font-size="25" font-weight="700" fill="#231f20" text-anchor="middle" data-drawn-text="true">BASIL</text></g><rect x="0" y="0" width="208" height="282" rx="0" fill="none" stroke="#231f20" stroke-width="2.5"></rect></g><text x="136" y="461" font-size="22" font-weight="400" fill="#231f20" text-anchor="middle" data-drawn-text="true">Clear</text><text x="256" y="127" font-size="24" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="true">2 / Middle</text><g transform="translate(256 145) rotate(0) scale(1)"><rect x="0" y="0" width="208" height="282" rx="0" fill="#dfc9a9" stroke="none" stroke-width="2.5"></rect><g clip-path="url(#camera-006-frame-1)"><rect x="22" y="112" width="164" height="112" rx="0" fill="#fffdf5" stroke="#231f20" stroke-width="2.5"></rect><line x1="31" y1="207" x2="177" y2="207" stroke="#657e51" stroke-width="2.5" stroke-dasharray=""></line><text x="104" y="175.84" font-size="32" font-weight="700" fill="#231f20" text-anchor="middle" data-drawn-text="true">BASIL</text></g><rect x="0" y="0" width="208" height="282" rx="0" fill="none" stroke="#231f20" stroke-width="2.5"></rect></g><text x="360" y="461" font-size="22" font-weight="400" fill="#231f20" text-anchor="middle" data-drawn-text="true">Clear again</text><text x="480" y="127" font-size="24" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="true">3 / Near</text><g transform="translate(480 145) rotate(0) scale(1)"><rect x="0" y="0" width="208" height="282" rx="0" fill="#dfc9a9" stroke="none" stroke-width="2.5"></rect><g clip-path="url(#camera-006-frame-3)"><g filter="url(#camera-006-blur-2)"><rect x="4.5" y="89.5" width="199" height="157" rx="0" fill="#fffdf5" stroke="#231f20" stroke-width="2.5"></rect><line x1="13.5" y1="229.5" x2="194.5" y2="229.5" stroke="#657e51" stroke-width="2.5" stroke-dasharray=""></line><text x="104" y="178.99" font-size="39" font-weight="700" fill="#231f20" text-anchor="middle" data-drawn-text="true">BASIL</text></g></g><rect x="0" y="0" width="208" height="282" rx="0" fill="none" stroke="#231f20" stroke-width="2.5"></rect></g><text x="584" y="461" font-size="22" font-weight="400" fill="#231f20" text-anchor="middle" data-drawn-text="true">Too close: soft</text><text x="32" y="511" font-size="24" font-weight="700" fill="#231f20" text-anchor="start" data-drawn-text="true">Fixed phone; move only the label</text><g transform="translate(68 573) rotate(90) scale(1)"><rect x="-23" y="0" width="46" height="30" rx="4" fill="#354d59" stroke="#231f20" stroke-width="2.5"></rect><rect x="-10" y="-9" width="20" height="9" rx="0" fill="#231f20" stroke="#231f20" stroke-width="2.5"></rect><rect x="-16" y="6" width="24" height="17" rx="2" fill="#e6dfd3" stroke="none" stroke-width="2.5"></rect><circle cx="15" cy="15" r="3" fill="#bc2031" stroke="none" stroke-width="2.5"></circle></g><line x1="104" y1="573" x2="663" y2="573" stroke="#69635f" stroke-width="2.5" stroke-dasharray="5 8"></line><rect x="214" y="552" width="32" height="42" rx="0" fill="#fffdf5" stroke="#231f20" stroke-width="2.5"></rect><text x="230" y="627" font-size="22" font-weight="400" fill="#231f20" text-anchor="middle" data-drawn-text="true">Near</text><rect x="402" y="552" width="32" height="42" rx="0" fill="#fffdf5" stroke="#231f20" stroke-width="2.5"></rect><text x="418" y="627" font-size="22" font-weight="400" fill="#231f20" text-anchor="middle" data-drawn-text="true">Middle</text><rect x="608" y="552" width="32" height="42" rx="0" fill="#fffdf5" stroke="#231f20" stroke-width="2.5"></rect><text x="624" y="627" font-size="22" font-weight="400" fill="#231f20" text-anchor="middle" data-drawn-text="true">Far</text><line x1="599" y1="533" x2="249" y2="533" stroke="#bc2031" stroke-width="2.5" stroke-dasharray=""></line><path d="M 259.3289 526.8915 L 249 533 L 259.3289 539.1085" fill="none" stroke="#bc2031" stroke-width="3.5"></path><line x1="32" y1="636" x2="688" y2="636" stroke="#e6dfd3" stroke-width="2.5" stroke-dasharray=""></line><text x="32" y="663" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">SVG blur illustrates a failed close trial, not a lens model.</text><text x="32" y="692" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">Middle is the nearest successful test, not an exact limit.</text><text x="32" y="721" font-size="22" font-weight="400" fill="#231f20" text-anchor="start" data-drawn-text="true">No centimeter recommendation or macro mode is assumed.</text></svg>