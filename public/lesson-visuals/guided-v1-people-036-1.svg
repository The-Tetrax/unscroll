<svg xmlns="http://www.w3.org/2000/svg" width="720" height="862" viewBox="0 0 720 862" role="img" aria-labelledby="teaching-70-65-6f-70-6c-65-2d-30-33-36-v-30-title" aria-describedby="teaching-70-65-6f-70-6c-65-2d-30-33-36-v-30-desc" font-family="Arial, sans-serif" data-format="dialogue" data-visual-id="people-036" data-visual-index="0"><title id="teaching-70-65-6f-70-6c-65-2d-30-33-36-v-30-title">From venue positions to named interests</title><desc id="teaching-70-65-6f-70-6c-65-2d-30-33-36-v-30-desc">One friend wants shelter, the other wants easier conversation, and they consider a quieter sheltered venue.
1. Friend. I prefer a cafe because I want shelter if it rains.
2. You. I suggested a picnic because the last cafe was too noisy to talk.
