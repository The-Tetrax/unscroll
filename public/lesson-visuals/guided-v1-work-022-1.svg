<svg xmlns="http://www.w3.org/2000/svg" width="720" height="790" viewBox="0 0 720 790" role="img" aria-labelledby="teaching-77-6f-72-6b-2d-30-32-32-v-30-title" aria-describedby="teaching-77-6f-72-6b-2d-30-32-32-v-30-desc" font-family="Arial, sans-serif" data-format="flow" data-visual-id="work-022" data-visual-index="0"><title id="teaching-77-6f-72-6b-2d-30-32-32-v-30-title">Keep the inversion, restore what matters</title><desc id="teaching-77-6f-72-6b-2d-30-32-32-v-30-desc">Decoration and 3 can be removed; removing 10 eliminates the inversion, so it is restored.
1. Remove decoration. Output 10, 2, 3 still violates numeric order. Keep reduction.
2. Remove label 3. Output 10, 2 still differs from expected 2, 10. Keep reduction.
3. Remove label 10. Output 2 has no inversion. Restore 10.
4. Retained reproduction. Labels 10 and 2 preserve the original target symptom.</desc><defs><marker id="teaching-77-6f-72-6b-2d-30-32-32-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-6f-72-6b-2d-30-32-32-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-6f-72-6b-2d-30-32-32-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="790" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="57" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Flow</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="638" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Keep the inversion, restore what matters</text><g data-edge-index="0" data-from="0" data-to="1"><path d="M 60 197 L 60 293" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teaching-77-6f-72-6b-2d-30-32-32-v-30-link)"/></g><g data-edge-index="1" data-from="1" data-to="2"><path d="M 60 352 L 60 448" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#teaching-77-6f-72-6b-2d-30-32-32-v-30-link)"/></g><g data-edge-index="2" data-from="2" data-to="3"><path d="M 60 507 L 60 572" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" s