<svg xmlns="http://www.w3.org/2000/svg" width="720" height="976" viewBox="0 0 720 976" role="img" aria-labelledby="teaching-6d-6f-6e-65-79-2d-30-31-35-v-30-title" aria-describedby="teaching-6d-6f-6e-65-79-2d-30-31-35-v-30-desc" font-family="Arial, sans-serif" data-format="bars" data-visual-id="money-015" data-visual-index="0"><title id="teaching-6d-6f-6e-65-79-2d-30-31-35-v-30-title">A fall followed by an equal rate gain</title><desc id="teaching-6d-6f-6e-65-79-2d-30-31-35-v-30-desc">A 100-unit balance falls to 80, then a 20% gain brings it only to 96.
1. Start. Original balance. Value: 100 units.
2. After 20% loss. 100 less 20 = 80. Value: 80 units.
3. After 20% gain. 80 plus 16 = 96. Value: 96 units.</desc><defs><marker id="teaching-6d-6f-6e-65-79-2d-30-31-35-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6d-6f-6e-65-79-2d-30-31-35-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6d-6f-6e-65-79-2d-30-31-35-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="976" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="92" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Bar plot</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="561" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">A fall followed by an equal rate gain</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="519" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Zero baseline; bar lengths use the supplied values.</text><text x="35" y="212.96" font-size="24" font-weight="700" fill="#231f20" textLength="119" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Unit: units</text><text x="42.5" y="258.96" font-size="24" font-weight="700" fill="#231f20" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">0</text><g data-item-index="0" data-zero-x="50"><text x="35" y="307.04" font-size="26" font-weight="700" fill="#231f20" textLength="61" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Start</text><text x="35" y="350.04" font-size="26" font-weight="700" fill="#231f20" textLength="118" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">100 units</text><path d="M 50 402 L 670 402" fill="none" stroke="#ddd7cc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 50 365 L 50 410" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="50" y="370" width="620" height="32" rx="0" fill="#231f20" stroke="none" stroke-width="3"/><path data-value="100" d="M 670 367 V 405" stroke="#231f20" stroke-width="3"/><text x="35" y="444.88" font-size="22" font-weight="400" fill="#231f20" textLength="173" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Original balance.</text></g><g data-item-index="1" data-zero-x="50"><text x="35" y="510.04" font-size="26" font-weight="700" fill="#231f20" textLength="187" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">After 20% loss</text><text x="35" y="553.04" font-size="26" font-weight="700" fill="#bc2031" textLength="102" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">80 units</text><path d="M 50 605 L 670 605" fill="none" stroke="#ddd7cc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 50 568 L 50 613" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="50" y="573" width="496" height="32" rx="0" fill="#bc2031" stroke="none" stroke-width="3"/><path data-value="80" d="M 546 570 V 608" stroke="#bc2031" stroke-width="3"/><text x="35" y="647.88" font-size="22" font-weight="400" fill="#231f20" textLength="176" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">100 less 20 = 80.</text></g><g data-item-index="2" data-zero-x="50"><text x="35" y="713.04" font-size="26" font-weight="700" fill="#231f20" textLength="190" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">After 20% gain</text><text x="35" y="756.04" font-size="26" font-weight="700" fill="#69635f" textLength="102" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">96 units</text><path d="M 50 808 L 670 808" fill="none" stroke="#ddd7cc" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M 50 771 L 50 816" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="50" y="776" width="595.2" height="32" rx="0" fill="#69635f" stroke="none" stroke-width="3"/><path data-value="96" d="M 645.2 773 V 811" stroke="#69635f" stroke-width="3"/><text x="35" y="850.88" font-size="22" font-weight="400" fill="#231f20" textLength="165" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">80 plus 16 = 96.</text></g><path d="M 32 929 L 98 929" fill="none" stroke="#bc2031" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="119" y="935.88" font-size="22" font-weight="400" fill="#69635f" textLength="211" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Explanatory diagram</text></g></svg>