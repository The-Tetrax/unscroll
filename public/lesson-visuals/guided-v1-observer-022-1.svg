<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1140" viewBox="0 0 720 1140" role="img" aria-labelledby="teaching-6f-62-73-65-72-76-65-72-2d-30-32-32-v-30-title" aria-describedby="teaching-6f-62-73-65-72-76-65-72-2d-30-32-32-v-30-desc" font-family="Arial, sans-serif" data-format="dialogue" data-visual-id="observer-022" data-visual-index="0"><title id="teaching-6f-62-73-65-72-76-65-72-2d-30-32-32-v-30-title">A museum plan both people can repeat</title><desc id="teaching-6f-62-73-65-72-76-65-72-2d-30-32-32-v-30-desc">Two friends confirm the street-entrance bench at three and the information desk if the bench area is unavailable.
1. You. Can we meet at the bench inside the street entrance at three?
2. Friend. Yes, that location works for me. Same bench if phone reception fails.
3. You. If that area is unavailable, use the staffed information desk instead?
4. Friend. Agreed. I have the place, time, and fallback in our note.</desc><defs><marker id="teaching-6f-62-73-65-72-76-65-72-2d-30-32-32-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6f-62-73-65-72-76-65-72-2d-30-32-32-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6f-62-73-65-72-76-65-72-2d-30-32-32-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="1140" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="106" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Dialogue</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="620" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">A museum plan both people can repeat</text><circle cx="79" cy="168" r="22" fill="#231f20" stroke="#231f20" stroke-width="3"/><text x="71.5" y="175.96" font-size="24" font-weight="700" fill="#f7f4ed" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">1</text><text x="119" y="172.04" font-size="26" font-weight="700" fill="#231f20" textLength="52" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">You</text><g data-turn-index="0" data-side="left"><path d="M 78 203 H 401 Q 423 203 423 225  L 423 314 Q 423 336 401 336 H 78 Q 56 336 56 314 L 56 315 L 38 322 L 56 295 L 56 225 Q 56 203 78 203 Z" fill="#f7f4ed" s