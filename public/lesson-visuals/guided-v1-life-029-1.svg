<svg xmlns="http://www.w3.org/2000/svg" width="720" height="958" viewBox="0 0 720 958" role="img" aria-labelledby="teaching-6c-69-66-65-2d-30-32-39-v-30-title" aria-describedby="teaching-6c-69-66-65-2d-30-32-39-v-30-desc" font-family="Arial, sans-serif" data-format="dialogue" data-visual-id="life-029" data-visual-index="0"><title id="teaching-6c-69-66-65-2d-30-32-39-v-30-title">Clarify permission before leaving the bicycle</title><desc id="teaching-6c-69-66-65-2d-30-32-39-v-30-desc">A customer asks what the inspection fee covers, the shop explains the separate fee, and the customer limits authorisation to diagnosis.
1. Customer. What does the 15-unit inspection cover, and is it credited against repair?
2. Shop. Diagnosis only. It remains payable and is separate from any repair quote.
3. Customer. Please inspect only, then send an itemised quote for approval before repair.</desc><defs><marker id="teaching-6c-69-66-65-2d-30-32-39-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6c-69-66-65-2d-30-32-39-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6c-69-66-65-2d-30-32-39-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="958" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="106" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Dialogue</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="575" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Clarify permission before leaving the</text><text x="35" y="150.28" font-size="32" font-weight="700" fill="#231f20" textLength="109" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">bicycle</text><circle cx="79" cy="213" r="22" fill="#231f20" stroke="#231f20" stroke-width="3"/><text x="71.5" y="220.96" font-size="24" font-weight="700" fill="#f7f4ed" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">1</text><text x="119" y="217.04" font-size="26" font-weight="700" fill="#231f20" textLength="126" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Customer</text><g data-turn-index="0" data-side="left"><path d="M 78