<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1539" viewBox="0 0 720 1539" role="img" aria-labelledby="teaching-63-69-6e-65-6d-61-2d-30-36-32-v-30-title" aria-describedby="teaching-63-69-6e-65-6d-61-2d-30-36-32-v-30-desc" font-family="Arial, sans-serif" data-format="spatial" data-visual-id="cinema-062" data-visual-index="0"><title id="teaching-63-69-6e-65-6d-61-2d-30-36-32-v-30-title">Keep the opening and roll visible</title><desc id="teaching-63-69-6e-65-6d-61-2d-30-36-32-v-30-desc">A supported phone faces the paper and bag beside existing daylight.
1. Paper work area. Unroll, turn, and reroll here.
2. Bag opening. Show both the failed and successful fit.
3. Supported phone. Wide view contains the complete action.
4. Existing daylight. Observe changes; no improvised rig.
1 to 2: fit test.</desc><defs><marker id="teaching-63-69-6e-65-6d-61-2d-30-36-32-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-63-69-6e-65-6d-61-2d-30-36-32-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-63-69-6e-65-6d-61-2d-30-36-32-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker><mask id="teaching-63-69-6e-65-6d-61-2d-30-36-32-v-30-connections-mask" maskUnits="userSpaceOnUse" x="36" y="192" width="648" height="650" style="mask-type:luminance"><rect x="36" y="192" width="648" height="650" fill="#ffffff"/><rect x="163.8" y="371.1" width="90" height="90" fill="#000000"/><rect x="450" y="371.1" width="90" height="90" fill="#000000"/><rect x="163.8" y="581.8" width="90" height="90" fill="#000000"/><rect x="450" y="581.8" width="90" height="90" fill="#000000"/><rect x="179.8" y="296.1" width="58" height="58" fill="#000000"/><rect x="466" y="296.1" width="58" height="58" fill="#000000"/><rect x="179.8" y="506.8" width="58" height="58" fill="#000000"/><rect x="466" y="506.8" width="58" height="58" fill="#000000"/></mask></defs><rect width="720" height="1539" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="186" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Spatial diagram</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="514" lengthA