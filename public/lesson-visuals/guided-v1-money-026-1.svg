<svg xmlns="http://www.w3.org/2000/svg" width="720" height="773" viewBox="0 0 720 773" role="img" aria-labelledby="teaching-6d-6f-6e-65-79-2d-30-32-36-v-30-title" aria-describedby="teaching-6d-6f-6e-65-79-2d-30-32-36-v-30-desc" font-family="Arial, sans-serif" data-format="bars" data-visual-id="money-026" data-visual-index="0"><title id="teaching-6d-6f-6e-65-79-2d-30-32-36-v-30-title">Two years, 2,000 pages</title><desc id="teaching-6d-6f-6e-65-79-2d-30-32-36-v-30-desc">Printer A has 200 units of known purchase and ink costs; B has 180.
