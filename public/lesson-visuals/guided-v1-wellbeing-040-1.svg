<svg xmlns="http://www.w3.org/2000/svg" width="720" height="613" viewBox="0 0 720 613" role="img" aria-labelledby="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-34-30-v-30-title" aria-describedby="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-34-30-v-30-desc" font-family="Arial, sans-serif" data-format="timeline" data-visual-id="wellbeing-040" data-visual-index="0"><title id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-34-30-v-30-title">Resume without attaching a backlog</title><desc id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-34-30-v-30-desc">Wednesday&apos;s pool visit is marked cancelled, Friday is considered as its own plan, and weekend commitments and recovery remain visible.
1. Wednesday closure. Record a cancelled opportunity, not a physical debt.
2. Friday decision. Review the next plan without automatically combining sessions.
