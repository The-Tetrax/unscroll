<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1021" viewBox="0 0 720 1021" role="img" aria-labelledby="teaching-6d-69-6e-64-2d-30-31-34-v-30-title" aria-describedby="teaching-6d-69-6e-64-2d-30-31-34-v-30-desc" font-family="Arial, sans-serif" data-format="bars" data-visual-id="mind-014" data-visual-index="0"><title id="teaching-6d-69-6e-64-2d-30-31-34-v-30-title">What happened on five planned evenings?</title><desc id="teaching-6d-69-6e-64-2d-30-31-34-v-30-desc">Three evenings included practice, one included the cue but blocked access, and one had no home-dinner cue.
1. Practiced. Monday, Wednesday, Friday. Value: 3 planned evenings.
2. Cue, no practice. Thursday: guitar blocked by storage boxes. Value: 1 planned evenings.
3. No cue. Tuesday: dinner elsewhere. Value: 1 planned evenings.</desc><defs><marker id="teaching-6d-69-6e-64-2d-30-31-34-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6d-69-6e-64-2d-30-31-34-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6d-69-6e-64-2d-30-31-34-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="1021" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="92" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Bar plot</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="502" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">What happened on five planned</text><text x="35" y="150.28" font-size="32" font-weight="700" fill="#231f20" textLength="162" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">evenings?</text><text x="35" y="212.88" font-size="22" font-weight="400" fill="#231f20" textLength="519" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Zero baseline; bar lengths use the supplied values.</text><text x="35" y="257.96" font-size="24" font-weight="700" fill="#231f20" textLength="271" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Unit: planned evenings</text><text x="42.5" y="303.96" font-size="24" font-weight="700" fill="#231f20" textLength="15" lengthAdjust="