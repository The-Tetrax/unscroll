<svg xmlns="http://www.w3.org/2000/svg" width="720" height="626" viewBox="0 0 720 626" role="img" aria-labelledby="teaching-6d-69-6e-64-2d-30-32-30-v-30-title" aria-describedby="teaching-6d-69-6e-64-2d-30-32-30-v-30-desc" font-family="Arial, sans-serif" data-format="timeline" data-visual-id="mind-020" data-visual-index="0"><title id="teaching-6d-69-6e-64-2d-30-32-30-v-30-title">Let new information change the next action</title><desc id="teaching-6d-69-6e-64-2d-30-32-30-v-30-desc">Ask about an unclear rehearsal room, work on a score while the reply is pending, then adjust travel after confirmation.
1. Room unclear. Ask for the room and entrance.
2. Reply pending. Keep a return point; work on the available score.
3. Location confirmed. Check the entrance and revise the arrival route.</desc><defs><marker id="teaching-6d-69-6e-64-2d-30-32-30-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6d-69-6e-64-2d-30-32-30-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6d-69-6e-64-2d-30-32-30-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="626" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="101" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Timeline</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="573" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Let new information change the next</text><text x="35" y="150.28" font-size="32" font-weight="700" fill="#231f20" textLength="95" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">action</text><text x="35" y="212.88" font-size="22" font-weight="400" fill="#231f20" textLength="531" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Event order only; spacing is not proportional to time.</text><g data-time-spacing="ordinal"><path d="M 262 264 L 262 448" fill="none" stroke="#69635f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g data-item-index="0"><text x="35" y="274.04" font-size="26" font-weight="700" fill="#231f20" textLength="180" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Room unclear</text><text x="299" y="269.88" font-size="22" font-weight="400" fill="#231f20" textLength="316" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Ask for the room and entrance.</text><path d="M 262 255 L 271 264 L 262 273 L 253 264 Z" fill="#f7f4ed" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g data-item-index="1"><text x="35" y="362.04" font-size="26" font-weight="700" fill="#231f20" textLength="185" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Reply pending</text><text x="299" y="357.88" font-size="22" font-weight="400" fill="#231f20" textLength="328" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Keep a return point; work on the</text><text x="299" y="388.88" font-size="22" font-weight="400" fill="#231f20" textLength="160" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">available score.</text><path d="M 262 343 L 271 352 L 262 361 L 253 352 Z" fill="#bc2031" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g data-item-index="2"><text x="35" y="458.04" font-size="26" font-weight="700" fill="#231f20" textLength="110" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Location</text><text x="35" y="495.04" font-size="26" font-weight="700" fill="#231f20" textLength="127" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">confirmed</text><text x="299" y="453.88" font-size="22" font-weight="400" fill="#231f20" textLength="351" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Check the entrance and revise the</text><text x="299" y="484.88" font-size="22" font-weight="400" fill="#231f20" textLength="128" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">arrival route.</text><path d="M 262 439 L 271 448 L 262 457 L 253 448 Z" fill="#f7f4ed" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><path d="M 32 579 L 98 579" fill="none"