<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1609" viewBox="0 0 720 1609" role="img" aria-labelledby="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-32-34-v-30-title" aria-describedby="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-32-34-v-30-desc" font-family="Arial, sans-serif" data-format="spatial" data-visual-id="wellbeing-024" data-visual-index="0"><title id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-32-34-v-30-title">A position change affects reach</title><desc id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-32-34-v-30-desc">A side-view relationship sketch links the user with an adjustable backrest, a viewing screen, and a lower input surface.
1. Backrest adjustment. Use normal controls for a supported variation.
2. User. Choose a comfortable position, not maximum movement.
3. Viewing task. Remain readable without leaning to compensate.
4. Input surface. Recheck the reach after changing the chair.
1 to 2: support.
2 to 4: recheck reach.</desc><defs><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-32-34-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-32-34-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-32-34-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker><mask id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-32-34-v-30-connections-mask" maskUnits="userSpaceOnUse" x="36" y="192" width="648" height="650" style="mask-type:luminance"><rect x="36" y="192" width="648" height="650" fill="#ffffff"/><rect x="126" y="349.6" width="90" height="90" fill="#000000"/><rect x="234" y="504.4" width="90" height="90" fill="#000000"/><rect x="477" y="332.4" width="90" height="90" fill="#000000"/><rect x="466.2" y="607.6" width="90" height="90" fill="#000000"/><rect x="142" y="274.6" width="58" height="58" fill="#000000"/><rect x="250" y="429.4" width="58" height="58" fill="#000000"/><rect x="493" y="257.4" width="58" height="58" fill="#000000"/><rect x="482.2" y="532.6" width="58" height="58" fill="#000000"/><rect x="303" y="434.4" width="77" height="48" fill="#000000"/></mask></defs><rect width="720" height="1609" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="186" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Spatial diagram</t