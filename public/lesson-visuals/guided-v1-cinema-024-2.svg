<svg xmlns="http://www.w3.org/2000/svg" width="720" height="593" viewBox="0 0 720 593" role="img" aria-labelledby="teaching-63-69-6e-65-6d-61-2d-30-32-34-v-31-title" aria-describedby="teaching-63-69-6e-65-6d-61-2d-30-32-34-v-31-desc" font-family="Arial, sans-serif" data-format="timeline" data-visual-id="cinema-024" data-visual-index="1"><title id="teaching-63-69-6e-65-6d-61-2d-30-32-34-v-31-title">A visible departure</title><desc id="teaching-63-69-6e-65-6d-61-2d-30-32-34-v-31-desc">The train waits, slides right, and ends separated from the stationary figure.
1. Before departure. 1 second: train and figure share the view.
2. Travel right. 3 seconds: slide only the paper train.
3. After departure. 2 seconds: hold the increased separation.</desc><defs><marker id="teaching-63-69-6e-65-6d-61-2d-30-32-34-v-31-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-63-69-6e-65-6d-61-2d-30-32-34-v-31-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-63-69-6e-65-6d-61-2d-30-32-34-v-31-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="593" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="101" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Timeline</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="295" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">A visible departure</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="531" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Event order only; spacing is not proportional to time.</text><g data-time-spacing="ordinal"><path d="M 262 219 L 262 415" fill="none" stroke="#69635f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g data-item-index="0"><text x="35" y="229.04" font-size="26" font-weight="700" fill="#231f20" textLength="86" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Before</text><text x="35" y="266.04" font-size="26" font-weight="700" fill="#231f20" textLength="124" lengthA