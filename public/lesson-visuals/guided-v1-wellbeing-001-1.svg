<svg xmlns="http://www.w3.org/2000/svg" width="720" height="601" viewBox="0 0 720 601" role="img" aria-labelledby="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-30-31-v-30-title" aria-describedby="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-30-31-v-30-desc" font-family="Arial, sans-serif" data-format="timeline" data-visual-id="wellbeing-001" data-visual-index="0"><title id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-30-31-v-30-title">Where the evening time goes</title><desc id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-30-31-v-30-desc">Film stops at 22:30, preparation occupies 30 minutes, then sleep opportunity runs from 23:00 to 07:00.
1. Stop the film. 22:30: leave the next episode for another day.
2. Prepare for bed. 22:30 to 23:00: a 30 minute transition.
3. Sleep opportunity. 23:00 to 07:00: eight hours available, not measured sleep.</desc><defs><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-30-31-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-30-31-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-77-65-6c-6c-62-65-69-6e-67-2d-30-30-31-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="601" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="101" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Timeline</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="462" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Where the evening time goes</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="531" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Event order only; spacing is not proportional to time.</text><g data-time-spacing="ordinal"><path d="M 262 219 L 262 423" fill="none" stroke="#69635f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g data-item-index="0"><text x="35" y="229.04" font-size="26" font-weight="700" fill="#231f20" textLength="161" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Stop the film</text><text x="299" y="224.88" font-size