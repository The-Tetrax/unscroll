<svg xmlns="http://www.w3.org/2000/svg" width="720" height="708" viewBox="0 0 720 708" role="img" aria-labelledby="design-type-021-title" aria-describedby="design-type-021-desc" focusable="false">
<title id="design-type-021-title">Let the entrance question come first</title>
<desc id="design-type-021-desc">An original Museum Night ticket gives GATE C the strongest type at 82 px and places it high on the ticket. Admission and 19:15 follow; Museum Night is smaller below. A numbered rail proposes gate, time, then event identity. The rail is an intended scanning order, not eye-tracking evidence.</desc>
