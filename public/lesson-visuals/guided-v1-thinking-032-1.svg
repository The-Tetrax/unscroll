/text><text x="299" y="548.88" font-size="22" font-weight="400" fill="#231f20" textLength="367" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Paper, ink, and elapsed time cannot</text><text x="299" y="579.88" font-size="22" font-weight="400" fill="#231f20" textLength="211" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">be restored by undo.</text><path d="M 262 534 L 271 543 L 262 552 L 253 543 Z" fill="#bc2031" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><path d="M 32 662 L 98 662" fill="none" stroke="#bc2031" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="119" y="668.88" font-size="22" font-weight="400" fill="#69635f" textLength="211" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Explanatory diagram</text></g></svg>