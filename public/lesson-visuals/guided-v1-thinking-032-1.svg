<svg xmlns="http://www.w3.org/2000/svg" width="720" height="709" viewBox="0 0 720 709" role="img" aria-labelledby="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-32-v-30-title" aria-describedby="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-32-v-30-desc" font-family="Arial, sans-serif" data-format="timeline" data-visual-id="thinking-032" data-visual-index="0"><title id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-32-v-30-title">Where restoration stops being complete</title><desc id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-32-v-30-desc">Preserve the original, edit a separate copy, review privately, then print a proof with persistent material costs.
1. Preserve original. Keep the state needed to return.
2. Edit a separate copy. The source remains untouched.
3. Review privately. Return if essential linework is lost.
4. Print a proof. Paper, ink, and elapsed time cannot be restored by undo.</desc><defs><marker id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-32-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-32-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-74-68-69-6e-6b-69-6e-67-2d-30-33-32-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="709" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="101" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Timeline</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="628" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Where restoration stops being complete</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="531" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Event order only; spacing is not proportional to time.</text><g data-time-spacing="ordinal"><path d="M 262 219 L 262 543" fill="none" stroke="#69635f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g data-item-index="0"><text x="35" y="229.04" font-size="26" font-weight="700" fill="#231f20" textLength="116" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Preserve</text><text x="35" y="266.04" font-size="26" font