<svg xmlns="http://www.w3.org/2000/svg" width="720" height="803" viewBox="0 0 720 803" role="img" aria-labelledby="draw-design-047-title draw-design-047-desc">
  <title id="draw-design-047-title">Study bands, matte tone, and folds</title>
  <desc id="draw-design-047-desc">Three original surface drawings share a steady light: a polished spoon with curved adjacent bright and dark reflected bands; unprinted matte paper with a broad, low-contrast tonal change; and folded cloth whose larger shadow shapes precede a little woven texture. Below, two bowl details keep the shape fixed while shifting a bright band for a separate viewpoint test. These are example reflection maps, not measured materials or permanent painted spoon markings.</desc>
  <defs>
    <marker id="draw-design-047-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#bc2031"/></marker>

    <clipPath id="draw-design-047-spoon"><path d="M123 193 C70 191 52 235 72 288 C81 324 101 345 123 348 L147 489 Q154 510 174 503 Q184 498 179 480 L145 345 C179 327 198 298 186 254 C178 215 151 191 123 193 Z"/></clipPath>
    <clipPath id="draw-design-047-cloth"><path d="M507 299 C523 265 538 264 552 278 L605 260 Q621 262 630 286 L661 419 Q600 398 506 437 Q493 373 507 299 Z"/></clipPath>
    <clipPath id="draw-design-047-bowl-a"><ellipse cx="170" cy="703" rx="49" ry="64"/></clipPath>
    <clipPath id="draw-design-047-bowl-b"><ellipse cx="389" cy="703" rx="49" ry="64"/></clipPath>
    <linearGradient id="draw-design-047-paper"><stop stop-color="#ded9cd"/><stop offset="1" stop-color="#C8C3B6"/></linearGradient>
    <pattern id="draw-design-047-weave" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M1 0 V12 M0 5 H12" fill="none" stroke="#69635f" stroke-width=".8" opacity=".38"/></pattern>

  </defs>
  <rect width="720" height="803" rx="12" fill="#f7f4ed"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#231f20" font-size="24">
