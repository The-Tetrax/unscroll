    <path d="M244 704 H313" fill="none" stroke="#bc2031" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#draw-design-047-arrow)"/>
    <text x="517" y="687" text-anchor="start" font-size="24" font-weight="400" fill="#231f20">Bands move.</text>
    <text x="517" y="723" text-anchor="start" font-size="24" font-weight="400" fill="#231f20">Not paint.</text>

