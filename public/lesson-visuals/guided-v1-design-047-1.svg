    <path d="M507 299 C523 265 538 264 552 278 L605 260 Q621 262 630 286 L661 419 Q600 398 506 437 Q493 373 507 299 Z" fill="#c8c3b6" stroke="#9b9588" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
