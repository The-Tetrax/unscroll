    <path d="M24 68 H696" fill="none" stroke="#ddd7cc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

    <text x="24" y="108" text-anchor="start" font-size="24" font-weight="400" fill="#231f20">One steady light</text>
    <path d="M256 94 L305 131" fill="none" stroke="#bc2031" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#draw-design-047-arrow)"/>
    <text x="48" y="161" text-anchor="start" font-size="22" font-weight="700" fill="#231f20">Polished spoon</text>
    <text x="285" y="161" text-anchor="start" font-size="22" font-weight="700" fill="#231f20">Matte paper</text>
    <text x="540" y="161" text-anchor="start" font-size="22" font-weight="700" fill="#231f20">Folded cloth</text>
    <path d="M123 193 C70 191 52 235 72 288 C81 324 101 345 123 348 L147 489 Q154 510 174 503 Q184 498 179 480 L145 345 C179 327 198 298 186 254 C178 215 151 191 123 193 Z" fill="#343A3B" stroke="#231f20" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
