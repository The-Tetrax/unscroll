<svg xmlns="http://www.w3.org/2000/svg" width="720" height="960" viewBox="0 0 720 960" role="img" aria-labelledby="teaching-64-65-73-69-67-6e-2d-30-34-34-v-31-title" aria-describedby="teaching-64-65-73-69-67-6e-2d-30-34-34-v-31-desc" font-family="Arial, sans-serif" data-format="swatches" data-visual-id="design-044" data-visual-index="1"><title id="teaching-64-65-73-69-67-6e-2d-30-34-34-v-31-title">Separate the shaded regions</title><desc id="teaching-64-65-73-69-67-6e-2d-30-34-34-v-31-desc">Illustrative gray values distinguish lit orange, its form shadow, and the paper cast shadow.
1. Lit orange. Faces the main light. Hex #E5DBBF.
2. Form shadow. On the turning orange. Hex #8F8470.
3. Cast shadow. On the paper. Hex #4F5147.</desc><defs><marker id="teaching-64-65-73-69-67-6e-2d-30-34-34-v-31-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-64-65-73-69-67-6e-2d-30-34-34-v-31-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-64-65-73-69-67-6e-2d-30-34-34-v-31-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="960" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="183" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Color swatches</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="457" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Separate the shaded regions</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="563" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Match each numbered patch to its hex value in the key.</text><g data-swatch-index="0" data-color="#E5DBBF"><rect x="32" y="198" width="218.667" height="106" rx="0" fill="#E5DBBF" stroke="#231f20" stroke-width="3"/><path d="M 141.333 307 L 141.333 319" fill="none" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="141.333" cy="344" r="22" fill="#231f20" stroke="#231f20" stroke-width="3"/><text x="133.833" y="351.96" font-size="24" font-weight="700" fi