<svg xmlns="http://www.w3.org/2000/svg" width="720" height="976" viewBox="0 0 720 976" role="img" aria-labelledby="teaching-74-65-63-68-2d-30-31-32-v-30-title" aria-describedby="teaching-74-65-63-68-2d-30-31-32-v-30-desc" font-family="Arial, sans-serif" data-format="bars" data-visual-id="tech-012" data-visual-index="0"><title id="teaching-74-65-63-68-2d-30-31-32-v-30-title">One sample, three arrival groups</title><desc id="teaching-74-65-63-68-2d-30-31-32-v-30-desc">Of 100 packets, 94 arrive by 100 milliseconds, four later by 500, and two remain unobserved.
