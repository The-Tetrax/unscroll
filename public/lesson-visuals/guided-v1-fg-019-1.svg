<svg xmlns="http://www.w3.org/2000/svg" width="720" height="783" viewBox="0 0 720 783" role="img" aria-labelledby="draw-fg-019-title draw-fg-019-desc">
  <title id="draw-fg-019-title">Suggest ridges with cast shadows</title>
  <desc id="draw-fg-019-desc">Two original ridged-cardboard studies compare full ridge outlines with selected narrow cast-shadow shapes on the far side of the ridges. The second deliberately omits neighboring shadows. A lower cross-section explains the cause: parallel light arrows travel down and right, one stopping at a raised ridge and another at exposed paper to its left. A dark receiving patch is behind the ridge on the right. No light arrow continues into that blocked patch. Shadow length is illustrative, not measured.</desc>
  <defs>
    <marker id="draw-fg-019-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#bc2031"/></marker>

  </defs>
  <rect width="720" height="783" rx="12" fill="#f7f4ed"/>
