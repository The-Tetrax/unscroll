<svg xmlns="http://www.w3.org/2000/svg" width="720" height="680" viewBox="0 0 720 680" role="img" aria-labelledby="draw-design-048-title draw-design-048-desc">
  <title id="draw-design-048-title">Let the leaf lead the arrangement</title>
  <desc id="draw-design-048-desc">An original fallen leaf sits in front of a darker opening in folded unprinted cardboard. A single upper-left light is indicated. The leaf&apos;s pale blade has a clear boundary against that opening; larger cardboard planes remain middle value. A small lower-right pebble has a quiet edge rather than the strongest outline. Gesture, planes, negative space, value grouping, and selective edges support the stated intention to notice the leaf first, without claiming a guaranteed attention result.</desc>
  <defs>
    <marker id="draw-design-048-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#bc2031"/></marker>

  </defs>
  <rect width="720" height="680" rx="12" fill="#f7f4ed"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#231f20" font-size="24">
