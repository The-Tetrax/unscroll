<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1609" viewBox="0 0 720 1609" role="img" aria-labelledby="teaching-63-69-6e-65-6d-61-2d-30-34-39-v-30-title" aria-describedby="teaching-63-69-6e-65-6d-61-2d-30-34-39-v-30-desc" font-family="Arial, sans-serif" data-format="spatial" data-visual-id="cinema-049" data-visual-index="0"><title id="teaching-63-69-6e-65-6d-61-2d-30-34-39-v-30-title">One shoe, two landing surfaces</title><desc id="teaching-63-69-6e-65-6d-61-2d-30-34-39-v-30-desc">A shoe lands on board or fabric while the phone stays fixed beside it.
1. Hand-held shoe. Clean soft sole; gentle heel-to-toe contact.
2. Landing area. Low stable support; keep contact here.
3. Surface alternatives. Bare board, then folded fabric in the same place.
4. Phone microphone. Same supported position for both versions.
1 to 2.
3 to 2.</desc><defs><marker id="teaching-63-69-6e-65-6d-61-2d-30-34-39-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-63-69-6e-65-6d-61-2d-30-34-39-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-63-69-6e-65-6d-61-2d-30-34-39-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker><mask id="teaching-63-69-6e-65-6d-61-2d-30-34-39-v-30-connections-mask" maskUnits="userSpaceOnUse" x="36" y="192" width="648" height="650" style="mask-type:luminance"><rect x="36" y="192" width="648" height="650" fill="#ffffff"/><rect x="174.6" y="362.5" width="90" height="90" fill="#000000"/><rect x="174.6" y="564.6" width="90" height="90" fill="#000000"/><rect x="439.2" y="564.6" width="90" height="90" fill="#000000"/><rect x="439.2" y="362.5" width="90" height="90" fill="#000000"/><rect x="190.6" y="287.5" width="58" height="58" fill="#000000"/><rect x="190.6" y="489.6" width="58" height="58" fill="#000000"/><rect x="455.2" y="489.6" width="58" height="58" fill="#000000"/><rect x="455.2" y="287.5" width="58" height="58" fill="#000000"/></mask></defs><rect width="720" height="1609" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="186" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Spatial diagram</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="498" lengthAdj