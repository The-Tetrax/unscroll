<svg xmlns="http://www.w3.org/2000/svg" width="720" height="746" viewBox="0 0 720 746" role="img" aria-labelledby="teaching-6f-62-73-65-72-76-65-72-2d-30-32-38-v-30-title" aria-describedby="teaching-6f-62-73-65-72-76-65-72-2d-30-32-38-v-30-desc" font-family="Arial, sans-serif" data-format="timeline" data-visual-id="observer-028" data-visual-index="0"><title id="teaching-6f-62-73-65-72-76-65-72-2d-30-32-38-v-30-title">When the wooden-tool detail entered each account</title><desc id="teaching-6f-62-73-65-72-76-65-72-2d-30-32-38-v-30-desc">Before discussion, A recalls a wooden tool while B recalls a metal loop; after discussion B attributes the wooden detail to A.
1. Before discussion: A. Wooden shaping tool; other details not recorded.
2. Before discussion: B. Metal loop; other tools uncertain.
3. Discussion. A describes the wooden tool to B.
4. After discussion: B. Add wooden tool as learned from A, not as earlier independent recall.</desc><defs><marker id="teaching-6f-62-73-65-72-76-65-72-2d-30-32-38-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6f-62-73-65-72-76-65-72-2d-30-32-38-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6f-62-73-65-72-76-65-72-2d-30-32-38-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="746" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="101" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Timeline</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="581" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">When the wooden-tool detail entered</text><text x="35" y="150.28" font-size="32" font-weight="700" fill="#231f20" textLength="212" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">each account</text><text x="35" y="212.88" font-size="22" font-weight="400" fill="#231f20" textLength="531" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Event order only; spacing is not proportional to time.</text><g data-time-spacing="ordinal"><path d="M 262 264 L 262 568" fill="none" stroke="#69635f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g data-item-index="0"><text x="35" y="274.04"