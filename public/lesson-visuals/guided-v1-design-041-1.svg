    <circle cx="58" cy="556" r="4.5" fill="#bc2031" stroke="#f7f4ed" stroke-width="1.5"/><circle cx="662" cy="556" r="4.5" fill="#bc2031" stroke="#f7f4ed" stroke-width="1.5"/>
