    <marker id="draw-design-040-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#bc2031"/></marker>

  </defs>
  <rect width="720" height="767" rx="12" fill="#f7f4ed"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#231f20" font-size="24">
