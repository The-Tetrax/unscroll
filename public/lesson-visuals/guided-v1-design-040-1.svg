<svg xmlns="http://www.w3.org/2000/svg" width="720" height="767" viewBox="0 0 720 767" role="img" aria-labelledby="draw-design-040-title draw-design-040-desc">
  <title id="draw-design-040-title">Check the shoe&apos;s outer extent</title>
  <desc id="draw-design-040-desc">An original side-view shoe sits inside a five-checkpoint envelope: heel top, high opening, furthest toe, lowest sole, and heel base. A faint trial puts the toe too high; a short red arrow lowers it before lace detail. The lower study deliberately raises the ankle into a boot while retaining a shoe-like foot and sole. These are construction comparisons, not standard shoe proportions.</desc>
