<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1038" viewBox="0 0 720 1038" role="img" aria-labelledby="teaching-70-72-65-73-65-6e-63-65-2d-30-31-30-v-30-title" aria-describedby="teaching-70-72-65-73-65-6e-63-65-2d-30-31-30-v-30-desc" font-family="Arial, sans-serif" data-format="dialogue" data-visual-id="presence-010" data-visual-index="0"><title id="teaching-70-72-65-73-65-6e-63-65-2d-30-31-30-v-30-title">Purpose and return point</title><desc id="teaching-70-72-65-73-65-6e-63-65-2d-30-31-30-v-30-desc">A camera request receives a stated calendar check, an agreed return, and an answer.
1. Imani. Could I borrow the camera on Saturday?
2. You. I need to check another booking. Does an answer this evening work?
3. Imani. Yes, that works.
4. You, later. It is already promised for Saturday, so I cannot lend it then.</desc><defs><marker id="teaching-70-72-65-73-65-6e-63-65-2d-30-31-30-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-70-72-65-73-65-6e-63-65-2d-30-31-30-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-70-72-65-73-65-6e-63-65-2d-30-31-30-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="1038" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="106" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Dialogue</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="391" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Purpose and return point</text><circle cx="79" cy="168" r="22" fill="#231f20" stroke="#231f20" stroke-width="3"/><text x="71.5" y="175.96" font-size="24" font-weight="700" fill="#f7f4ed" textLength="15" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">1</text><text x="119" y="172.04" font-size="26" font-weight="700" fill="#231f20" textLength="71" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Imani</text><g data-turn-index="0" data-side="left"><path d="M 78 203 H 503 Q 525 203 525 225  L 525 263 Q 525 285 503 285 H 78 Q 56 285 56 263 L 56 264 L 38 271 L 56 244 L 56 225 Q 56 203 78 203 Z" fill="#f7f4ed" st