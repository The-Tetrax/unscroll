<svg xmlns="http://www.w3.org/2000/svg" width="720" height="701" viewBox="0 0 720 701" role="img" aria-labelledby="teaching-6d-6f-6e-65-79-2d-30-31-38-v-30-title" aria-describedby="teaching-6d-6f-6e-65-79-2d-30-31-38-v-30-desc" font-family="Arial, sans-serif" data-format="timeline" data-visual-id="money-018" data-visual-index="0"><title id="teaching-6d-6f-6e-65-79-2d-30-31-38-v-30-title">The gap before payday</title><desc id="teaching-6d-6f-6e-65-79-2d-30-31-38-v-30-desc">300 becomes 50 after housing; a 100-unit bill arrives before 600 of income.
1. Day 1: start. 300 units available.
2. Day 2: housing. Pay 250; 50 units remain.
3. Day 10: utilities. 100 due; only 50 available; shortfall 50.
4. Day 11: income. 600 arrives after the problem date.</desc><defs><marker id="teaching-6d-6f-6e-65-79-2d-30-31-38-v-30-link" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#231f20" stroke="#231f20" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6d-6f-6e-65-79-2d-30-31-38-v-30-light" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#bc2031" stroke="#bc2031" stroke-width="3" stroke-linejoin="round"/></marker><marker id="teaching-6d-6f-6e-65-79-2d-30-31-38-v-30-view" viewBox="0 0 14 14" refX="12" refY="7" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto"><path d="M 2 2 L 12 7 L 2 12 Z" fill="#69635f" stroke="#69635f" stroke-width="3" stroke-linejoin="round"/></marker></defs><rect width="720" height="701" fill="#f7f4ed"/><g aria-hidden="true"><text x="35" y="56.96" font-size="24" font-weight="700" fill="#bc2031" textLength="101" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Timeline</text><text x="35" y="105.28" font-size="32" font-weight="700" fill="#231f20" textLength="366" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">The gap before payday</text><text x="35" y="167.88" font-size="22" font-weight="400" fill="#231f20" textLength="531" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Event order only; spacing is not proportional to time.</text><g data-time-spacing="ordinal"><path d="M 262 219 L 262 523" fill="none" stroke="#69635f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g data-item-index="0"><text x="35" y="229.04" font-size="26" font-weight="700" fill="#231f20" textLength="148" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Day 1: start</text><text x="299" y="224.88" font-size="22" font-weight="400" fill="#231f20" textLength="197" lengthAdjust=