<title id="design-type-007-title">Change the view, not the map file</title>
<desc id="design-type-007-desc">The same original walking-map linework appears twice. Stored paper #E8E5DD and pencil #424242 are shown on the left. The right uses explanatory warm-view stand-ins #E8D4AC and #494236. The right-hand colors describe possible appearance, not a saved file edit or a measured display transformation.</desc>
