<svg xmlns="http://www.w3.org/2000/svg" width="720" height="509" viewBox="0 0 720 509" role="img" aria-labelledby="teaching-73-70-65-61-6b-65-72-2d-30-30-33-v-30-title" aria-describedby="teaching-73-70-65-61-6b-65-72-2d-30-30-33-v-30-desc" font-family="Arial, sans-serif" data-format="comparison" data-visual-id="speaker-003" data-visual-index="0"><title id="teaching-73-70-65-61-6b-65-72-2d-30-30-33-v-30-title">Finding the same free evening</title><desc id="teaching-73-70-65-61-6b-65-72-2d-30-30-33-v-30-desc">Chat searches and a proposed sheet offer different ways to find tripod availability.
1. Current chat. Search messages or ask the borrower. Changes can be negotiated in the conversation.
