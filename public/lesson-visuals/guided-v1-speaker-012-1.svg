s: Next I will add a short</text><text x="299" y="471.88" font-size="22" font-weight="400" fill="#231f20" textLength="213" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">label to each picture.</text><path d="M 262 426 L 271 435 L 262 444 L 253 435 Z" fill="#f7f4ed" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g><g data-item-index="3"><text x="35" y="553.04" font-size="26" font-weight="700" fill="#231f20" textLength="105" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">50 to 60</text><text x="35" y="590.04" font-size="26" font-weight="700" fill="#231f20" textLength="108" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">seconds</text><text x="299" y="548.88" font-size="22" font-weight="400" fill="#231f20" textLength="315" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">10 seconds: Preview the page.</text><text x="299" y="579.88" font-size="22" font-weight="400" fill="#231f20" textLength="340" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Nothing is uploaded in this demo.</text><path d="M 262 534 L 271 543 L 262 552 L 253 543 Z" fill="#bc2031" stroke="#231f20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g><path d="M 32 674 L 98 674" fill="none" stroke="#bc2031" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="119" y="680.88" font-size="22" font-weight="400" fill="#69635f" textLength="211" lengthAdjust="spacingAndGlyphs" style="line-height:1.4">Explanatory diagram</text></g></svg>