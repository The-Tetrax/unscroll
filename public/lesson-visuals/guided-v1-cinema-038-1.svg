<svg xmlns="http://www.w3.org/2000/svg" width="720" height="840" viewBox="0 0 720 840" role="img" aria-labelledby="light-edit-038-title light-edit-038-desc" font-family="Arial" font-size="22"><title id="light-edit-038-title">Forty source seconds, eight on screen</title><desc id="light-edit-038-desc">A source ledger retains seconds 0-4 and 36-40 of an invented forty-second towel recording, omitting the middle thirty-two. The output strip joins one folded towel and two unfolded towels directly to a stack of three. With the camera fixed, the stack visibly jumps. Each timeline row has its own scale. 40 s source = 8 s kept + 32 s omitted. Row scales differ. The fixed-view stack jumps; the middle folds are omitted. All objects are original schematic drawings, not photographed frames. Colors and spacing are illustrative, not measurements.</desc><metadata>Source: original UNSCROLL vector artwork. No external media, film stills, or third-party characters.</metadata><defs></defs><rect x="0" y="0" width="720" height="840" rx="0" fill="#f5efe5" stroke="none" stroke-width="2"/><text x="34" y="44" font-size="22" font-weight="700" fill="#a92c3b" textLength="149.808" lengthAdjust="spacingAndGlyphs">CINEMA / 038</text><text x="34" y="88" font-size="26" font-weight="700" fill="#272322" textLength="485.773" lengthAdjust="spacingAndGlyphs">Forty source seconds, eight on screen</text><path d="M32 112 L688 112" fill="none" stroke="#cfc4b6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="44" y="164" font-size="24" font-weight="700" fill="#272322" textLength="285.182" lengthAdjust="spacingAndGlyphs">Source recording: 0-40 s</text><svg x="55" y="189" width="172" height="111" viewBox="0 0 200 150" preserveAspectRatio="xMidYMid meet" overflow="hidden"><g stroke="#272322" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 130H192" fill="none" stroke="#9a8a73"/>
